name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # Detect what files changed to skip expensive jobs for docs-only PRs
  changes:
    runs-on: codeberg-small-lazy
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: filter
        run: |
          # For PRs, compare against base branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            # For push, compare against previous commit
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # Check if any non-doc files changed
          # Docs: *.md, docs/**, LICENSE, .gitignore, etc.
          CODE_PATTERNS='\.py$|\.yaml$|\.yml$|\.json$|\.toml$|pyproject\.toml|scripts/|\.github/workflows/'

          if git diff --name-only "$base" "$head" | grep -qE "$CODE_PATTERNS"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only changes, skipping expensive jobs"
          fi

  # Stop-the-line protocol: Block PRs when full-suite is broken
  # Exception: PRs titled "fix(job-XXXXX):" are allowed through
  stop-the-line:
    runs-on: codeberg-small-lazy
    if: github.event_name == 'pull_request'
    steps:
      - name: Check full-suite status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the most recent full-suite workflow run on dev
          WORKFLOW_RUNS=$(gh api repos/${{ github.repository }}/actions/workflows/full-suite.yml/runs?per_page=1 2>/dev/null || echo '{"workflow_runs":[]}')

          # Extract conclusion from latest run
          CONCLUSION=$(echo "$WORKFLOW_RUNS" | jq -r '.workflow_runs[0].conclusion // "unknown"')
          RUN_ID=$(echo "$WORKFLOW_RUNS" | jq -r '.workflow_runs[0].id // "unknown"')

          echo "Latest full-suite run: $RUN_ID (conclusion: $CONCLUSION)"

          if [[ "$CONCLUSION" == "failure" ]]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            REQUIRED_PREFIX="fix(job-$RUN_ID):"

            echo "⚠️ Full suite is broken (run $RUN_ID failed)"

            if [[ "$PR_TITLE" == "$REQUIRED_PREFIX"* ]] || [[ "$PR_TITLE" == fix\(job-* ]]; then
              echo "✅ PR title indicates this is a fix - allowing through"
              echo "   Title: $PR_TITLE"
            else
              echo "❌ PRs blocked until full suite is fixed"
              echo ""
              echo "To unblock, either:"
              echo "  1. Fix the broken full suite"
              echo "  2. Rename your PR to start with: $REQUIRED_PREFIX"
              echo ""
              echo "Current PR title: $PR_TITLE"
              exit 1
            fi
          elif [[ "$CONCLUSION" == "unknown" ]]; then
            echo "⚠️ No full-suite runs found - allowing PR (first run scenario)"
          else
            echo "✅ Full suite is passing - PR allowed"
          fi

  lint:
    needs: [changes, stop-the-line]
    if: always() && needs.changes.outputs.code == 'true' && needs.stop-the-line.result != 'failure'
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install ruff bandit
      - name: Run Ruff (linting)
        run: ruff check packages/*/src/ packages/*/tests/
      - name: Run Bandit (security)
        run: bandit -r packages/*/src/ -c pyproject.toml


  dco:
    runs-on: codeberg-small-lazy
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DCO sign-off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Skip merge commits (--no-merges) since they're auto-generated by
          # the forge UI and don't need sign-off
          for sha in $(git rev-list --no-merges $base..$head); do
            if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by:'; then
              echo "❌ Commit $sha is missing DCO sign-off"
              echo "   Add with: git commit --amend -s"
              exit 1
            fi
          done
          echo "✅ All commits have DCO sign-off"

  audit:
    needs: [changes, stop-the-line]
    if: always() && needs.changes.outputs.code == 'true' && needs.stop-the-line.result != 'failure'
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install pip-audit
        run: |
          pip install --upgrade pip
          pip install pip-audit
      - name: Run pip-audit (dependency vulnerabilities)
        run: pip-audit --skip-editable

  verify-generated:
    needs: [changes, stop-the-line]
    if: always() && needs.changes.outputs.code == 'true' && needs.stop-the-line.result != 'failure'
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install from packages if available, otherwise legacy
          if [ -d "packages/hypergumbo-core" ]; then
            pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-mainstream -e packages/hypergumbo-lang-common -e packages/hypergumbo-lang-extended1 -e "packages/hypergumbo[dev]"
          else
            pip install -e .[dev]
          fi
      - name: Verify schema.json is up-to-date
        run: ./scripts/generate-schema --check
      - name: Verify ARCHITECTURE.md is up-to-date
        run: ./scripts/generate-architecture --check

  pytest:
    needs: [changes, stop-the-line]
    if: always() && needs.changes.outputs.code == 'true' && needs.stop-the-line.result != 'failure'
    runs-on: codeberg-small-lazy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install from packages if available, otherwise legacy
          if [ -d "packages/hypergumbo-core" ]; then
            pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-mainstream -e packages/hypergumbo-lang-common -e packages/hypergumbo-lang-extended1 -e "packages/hypergumbo[dev]"
          else
            pip install -e .[dev]
          fi
      - name: Build source-only grammars
        run: ./scripts/build-source-grammars
      - name: Check for sentence-transformers
        run: |
          # Don't try to install - just check if it's already available.
          # See CONTRIBUTING.md for details on embedding test requirements.
          if python -c "import sentence_transformers" 2>/dev/null; then
            echo "sentence-transformers available"
            echo "EMBEDDINGS_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "sentence-transformers not installed, embedding tests will be skipped"
            echo "EMBEDDINGS_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
      - name: Validate manifest (if present)
        id: manifest
        run: |
          MANIFEST=".ci/affected-tests.txt"
          if [ -f "$MANIFEST" ]; then
            echo "Manifest found: $MANIFEST"

            # Count tests per module for sanity check
            CORE_TESTS=$(grep -c "hypergumbo-core/tests" "$MANIFEST" 2>/dev/null || echo 0)
            MAINSTREAM_TESTS=$(grep -c "hypergumbo-lang-mainstream/tests" "$MANIFEST" 2>/dev/null || echo 0)
            COMMON_TESTS=$(grep -c "hypergumbo-lang-common/tests" "$MANIFEST" 2>/dev/null || echo 0)
            EXTENDED_TESTS=$(grep -c "hypergumbo-lang-extended1/tests" "$MANIFEST" 2>/dev/null || echo 0)
            TOTAL_TESTS=$((CORE_TESTS + MAINSTREAM_TESTS + COMMON_TESTS + EXTENDED_TESTS))

            echo "Manifest tests: core=$CORE_TESTS mainstream=$MAINSTREAM_TESTS common=$COMMON_TESTS extended=$EXTENDED_TESTS total=$TOTAL_TESTS"

            # Sanity check: if total is suspiciously low, fall back to full suite
            if [ "$TOTAL_TESTS" -lt 10 ]; then
              echo "⚠️ Manifest has only $TOTAL_TESTS tests - falling back to full suite"
              echo "use_manifest=false" >> "$GITHUB_OUTPUT"
            else
              echo "✅ Manifest validated ($TOTAL_TESTS tests)"
              echo "use_manifest=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No manifest found, running full suite"
            echo "use_manifest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests with coverage
        run: |
          COV_PATHS="--cov=packages/hypergumbo-core/src --cov=packages/hypergumbo-lang-mainstream/src --cov=packages/hypergumbo-lang-common/src --cov=packages/hypergumbo-lang-extended1/src"
          MANIFEST=".ci/affected-tests.txt"

          if [ "${{ steps.manifest.outputs.use_manifest }}" = "true" ] && [ -f "$MANIFEST" ]; then
            # Run only manifest-listed tests
            TESTS=$(grep -v '^#' "$MANIFEST" | tr '\n' ' ')
            echo "Running manifest tests: $(echo "$TESTS" | wc -w) files"
            pytest $TESTS -n 2 --tb=short $COV_PATHS --cov-report=term 2>&1 | tee coverage-output.txt
          elif [ -d "packages/hypergumbo-core" ]; then
            # Fall back to full suite
            echo "Running full test suite"
            pytest packages/*/tests/ -n 2 --tb=short $COV_PATHS --cov-report=term 2>&1 | tee coverage-output.txt
          else
            # Legacy structure
            pytest -n 2 --tb=short --cov=src --cov-report=term 2>&1 | tee coverage-output.txt
          fi
      - name: Update coverage badge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        run: |
          # Extract coverage percentage from pytest output
          COV=$(grep "^TOTAL" coverage-output.txt | awk '{print $NF}' | tr -d '%')
          if [ -z "$COV" ]; then
            echo "Could not extract coverage percentage"
            exit 0  # Don't fail the build
          fi

          # Determine badge color based on coverage
          if [ "$COV" -ge 90 ]; then
            COLOR="brightgreen"
          elif [ "$COV" -ge 70 ]; then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          # Create shields.io endpoint JSON in temp location
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COV}%\",\"color\":\"${COLOR}\"}" > /tmp/coverage.json

          # Configure git
          git config user.name "CI Bot"
          git config user.email "ci@iterabloom.com"

          # Fetch badges branch or create orphan
          git fetch origin badges:badges 2>/dev/null || true
          git checkout badges 2>/dev/null || git checkout --orphan badges

          # Clean branch and add only coverage.json
          git rm -rf . 2>/dev/null || true
          cp /tmp/coverage.json coverage.json

          # Commit and push
          git add coverage.json
          git commit -m "Update coverage badge: ${COV}%" || echo "No changes to commit"
          git push origin badges --force || echo "Push failed - may need write permissions"

  # Final gate job - ensures workflow completes even when jobs are skipped
  # This fixes Forgejo Actions bug where skipped jobs leave workflow in "running" state
  ci-complete:
    needs: [changes, stop-the-line, lint, audit, verify-generated, pytest, dco]
    if: always()
    runs-on: codeberg-small-lazy
    steps:
      - name: Check job results
        run: |
          echo "Job results:"
          echo "  changes: ${{ needs.changes.result }}"
          echo "  stop-the-line: ${{ needs.stop-the-line.result }}"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  audit: ${{ needs.audit.result }}"
          echo "  verify-generated: ${{ needs.verify-generated.result }}"
          echo "  pytest: ${{ needs.pytest.result }}"
          echo "  dco: ${{ needs.dco.result }}"

          # Fail if any required job failed (skipped is OK)
          if [[ "${{ needs.changes.result }}" == "failure" ]] || \
             [[ "${{ needs.stop-the-line.result }}" == "failure" ]] || \
             [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.audit.result }}" == "failure" ]] || \
             [[ "${{ needs.verify-generated.result }}" == "failure" ]] || \
             [[ "${{ needs.pytest.result }}" == "failure" ]] || \
             [[ "${{ needs.dco.result }}" == "failure" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi

          echo "✅ All required jobs passed or were skipped"

