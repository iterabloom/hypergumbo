name: Full Test Suite

# Full test suite runs as parallel jobs per package (ADR-0010).
# Each package runs in its own job to fit within Codeberg's time limits.
# When any job fails, the stop-the-line protocol blocks PRs until fixed.

on:
  # Triggered after PR merges to dev
  push:
    branches: [ "dev" ]
  # Manual trigger for debugging
  workflow_dispatch:
  # Nightly validation
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily

# Singleton concurrency - only one full suite runs at a time
# This prevents resource contention and ensures clear pass/fail state
concurrency:
  group: full-suite-singleton
  cancel-in-progress: false

jobs:
  # Detect what files changed to skip expensive jobs for docs-only pushes
  changes:
    runs-on: codeberg-small-lazy
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: filter
        run: |
          # Compare against previous commit
          base="${{ github.event.before }}"
          head="${{ github.sha }}"

          # Handle initial push (no previous commit) or empty/invalid base
          # github.event.before can be:
          # - All zeros: first push to branch
          # - Empty: some merge scenarios
          # - Invalid: ref no longer exists
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Initial push or empty base - running full suite"
            exit 0
          fi

          # Verify base commit exists (handles invalid/missing refs)
          if ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Base commit $base not found - running full suite"
            exit 0
          fi

          # Check if any non-doc files changed
          # Docs: *.md, docs/**, LICENSE, .gitignore, etc.
          CODE_PATTERNS='\.py$|\.yaml$|\.yml$|\.json$|\.toml$|pyproject\.toml|scripts/|\.github/workflows/'

          if git diff --name-only "$base" "$head" | grep -qE "$CODE_PATTERNS"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected - running full suite"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only changes - skipping expensive jobs"
          fi

  # Prep job: build grammars AND install pip deps, cache both
  # This saves ~60s per test job by doing expensive installs once
  prep:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache grammar wheels
      - name: Cache grammar wheels
        id: grammar-cache
        uses: actions/cache@v3
        with:
          path: /tmp/grammar-wheels
          key: grammar-wheels-${{ hashFiles('scripts/build-source-grammars') }}
      - name: Build grammar wheels
        if: steps.grammar-cache.outputs.cache-hit != 'true'
        run: |
          pip install --upgrade pip setuptools wheel
          ./scripts/build-source-grammars --wheels-dir /tmp/grammar-wheels
      - name: Verify wheels exist
        run: ls -la /tmp/grammar-wheels/*.whl || echo "No wheels (will build in test jobs)"

      # Cache pip packages (site-packages) keyed by pyproject.toml files
      - name: Cache pip packages
        id: pip-cache
        uses: actions/cache@v3
        with:
          path: ~/.local/lib/python3.11/site-packages
          key: pip-packages-${{ hashFiles('packages/*/pyproject.toml') }}
      - name: Install pip dependencies
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist jsonschema
          pip install -e packages/hypergumbo-core \
                      -e packages/hypergumbo-lang-mainstream \
                      -e packages/hypergumbo-lang-common \
                      -e packages/hypergumbo-lang-extended1
          ./scripts/build-source-grammars --wheels-dir /tmp/grammar-wheels

  # Run each package's tests in parallel (after prep is done)
  test-core:
    needs: [changes, prep]
    if: needs.changes.outputs.code == 'true'
    runs-on: codeberg-small-lazy
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Restore grammar wheels
      - name: Restore grammar wheels
        uses: actions/cache@v3
        with:
          path: /tmp/grammar-wheels
          key: grammar-wheels-${{ hashFiles('scripts/build-source-grammars') }}

      # Restore pip packages
      - name: Restore pip packages
        uses: actions/cache@v3
        with:
          path: ~/.local/lib/python3.11/site-packages
          key: pip-packages-${{ hashFiles('packages/*/pyproject.toml') }}

      # Quick install (mostly no-ops if cache hit, handles editable installs)
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist jsonschema
          pip install -e packages/hypergumbo-core \
                      -e packages/hypergumbo-lang-mainstream \
                      -e packages/hypergumbo-lang-common \
                      -e packages/hypergumbo-lang-extended1
          ./scripts/build-source-grammars --wheels-dir /tmp/grammar-wheels

      - name: Check for sentence-transformers
        run: |
          if python -c "import sentence_transformers" 2>/dev/null; then
            echo "sentence-transformers available"
            echo "EMBEDDINGS_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "sentence-transformers not installed, using no-embeddings coverage config"
            echo "EMBEDDINGS_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
      - name: Run tests
        id: tests
        run: |
          COV_CONFIG=""
          if [ "$EMBEDDINGS_AVAILABLE" = "false" ]; then
            COV_CONFIG="--cov-config=.coveragerc.no-embeddings"
          fi
          # Detect available CPUs from cgroup limits (Codeberg sets cpu.max
          # to 200000/100000 = 2 cores but nproc reports the host's 32).
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            read quota period < /sys/fs/cgroup/cpu.max
            if [ "$quota" != "max" ]; then
              WORKERS=$((quota / period))
            else
              WORKERS=$(nproc)
            fi
          else
            WORKERS=$(nproc)
          fi

          pytest packages/hypergumbo-core/tests/ -n "$WORKERS" --tb=short \
            --cov=packages/hypergumbo-core/src $COV_CONFIG --cov-report=term | tee coverage-output.txt
          COV=$(grep "^TOTAL" coverage-output.txt | awk '{print $NF}' | tr -d '%')
          echo "coverage=${COV:-0}" >> "$GITHUB_OUTPUT"

  test-mainstream:
    needs: [changes, prep]
    if: needs.changes.outputs.code == 'true'
    runs-on: codeberg-small-lazy
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore grammar wheels
        uses: actions/cache@v3
        with:
          path: /tmp/grammar-wheels
          key: grammar-wheels-${{ hashFiles('scripts/build-source-grammars') }}
      - name: Restore pip packages
        uses: actions/cache@v3
        with:
          path: ~/.local/lib/python3.11/site-packages
          key: pip-packages-${{ hashFiles('packages/*/pyproject.toml') }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist jsonschema
          pip install -e packages/hypergumbo-core \
                      -e packages/hypergumbo-lang-mainstream \
                      -e packages/hypergumbo-lang-common \
                      -e packages/hypergumbo-lang-extended1
          ./scripts/build-source-grammars --wheels-dir /tmp/grammar-wheels
      - name: Check for sentence-transformers
        run: |
          if python -c "import sentence_transformers" 2>/dev/null; then
            echo "sentence-transformers available"
            echo "EMBEDDINGS_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "sentence-transformers not installed, using no-embeddings coverage config"
            echo "EMBEDDINGS_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
      - name: Run tests
        id: tests
        run: |
          COV_CONFIG=""
          if [ "$EMBEDDINGS_AVAILABLE" = "false" ]; then
            COV_CONFIG="--cov-config=.coveragerc.no-embeddings"
          fi
          # Detect available CPUs from cgroup limits (Codeberg sets cpu.max
          # to 200000/100000 = 2 cores but nproc reports the host's 32).
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            read quota period < /sys/fs/cgroup/cpu.max
            if [ "$quota" != "max" ]; then
              WORKERS=$((quota / period))
            else
              WORKERS=$(nproc)
            fi
          else
            WORKERS=$(nproc)
          fi

          pytest packages/hypergumbo-lang-mainstream/tests/ -n "$WORKERS" --tb=short \
            --cov=packages/hypergumbo-lang-mainstream/src $COV_CONFIG --cov-report=term | tee coverage-output.txt
          COV=$(grep "^TOTAL" coverage-output.txt | awk '{print $NF}' | tr -d '%')
          echo "coverage=${COV:-0}" >> "$GITHUB_OUTPUT"

  test-common:
    needs: [changes, prep]
    if: needs.changes.outputs.code == 'true'
    runs-on: codeberg-small-lazy
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore grammar wheels
        uses: actions/cache@v3
        with:
          path: /tmp/grammar-wheels
          key: grammar-wheels-${{ hashFiles('scripts/build-source-grammars') }}
      - name: Restore pip packages
        uses: actions/cache@v3
        with:
          path: ~/.local/lib/python3.11/site-packages
          key: pip-packages-${{ hashFiles('packages/*/pyproject.toml') }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist jsonschema
          pip install -e packages/hypergumbo-core \
                      -e packages/hypergumbo-lang-mainstream \
                      -e packages/hypergumbo-lang-common \
                      -e packages/hypergumbo-lang-extended1
          ./scripts/build-source-grammars --wheels-dir /tmp/grammar-wheels
      - name: Check for sentence-transformers
        run: |
          if python -c "import sentence_transformers" 2>/dev/null; then
            echo "sentence-transformers available"
            echo "EMBEDDINGS_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "sentence-transformers not installed, using no-embeddings coverage config"
            echo "EMBEDDINGS_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
      - name: Run tests
        id: tests
        run: |
          COV_CONFIG=""
          if [ "$EMBEDDINGS_AVAILABLE" = "false" ]; then
            COV_CONFIG="--cov-config=.coveragerc.no-embeddings"
          fi
          # Detect available CPUs from cgroup limits (Codeberg sets cpu.max
          # to 200000/100000 = 2 cores but nproc reports the host's 32).
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            read quota period < /sys/fs/cgroup/cpu.max
            if [ "$quota" != "max" ]; then
              WORKERS=$((quota / period))
            else
              WORKERS=$(nproc)
            fi
          else
            WORKERS=$(nproc)
          fi

          pytest packages/hypergumbo-lang-common/tests/ -n "$WORKERS" --tb=short \
            --cov=packages/hypergumbo-lang-common/src $COV_CONFIG --cov-report=term | tee coverage-output.txt
          COV=$(grep "^TOTAL" coverage-output.txt | awk '{print $NF}' | tr -d '%')
          echo "coverage=${COV:-0}" >> "$GITHUB_OUTPUT"

  test-extended:
    needs: [changes, prep]
    if: needs.changes.outputs.code == 'true'
    runs-on: codeberg-small-lazy
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore grammar wheels
        uses: actions/cache@v3
        with:
          path: /tmp/grammar-wheels
          key: grammar-wheels-${{ hashFiles('scripts/build-source-grammars') }}
      - name: Restore pip packages
        uses: actions/cache@v3
        with:
          path: ~/.local/lib/python3.11/site-packages
          key: pip-packages-${{ hashFiles('packages/*/pyproject.toml') }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist jsonschema
          pip install -e packages/hypergumbo-core \
                      -e packages/hypergumbo-lang-mainstream \
                      -e packages/hypergumbo-lang-common \
                      -e packages/hypergumbo-lang-extended1
          ./scripts/build-source-grammars --wheels-dir /tmp/grammar-wheels
      - name: Check for sentence-transformers
        run: |
          if python -c "import sentence_transformers" 2>/dev/null; then
            echo "sentence-transformers available"
            echo "EMBEDDINGS_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "sentence-transformers not installed, using no-embeddings coverage config"
            echo "EMBEDDINGS_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
      - name: Run tests
        id: tests
        run: |
          COV_CONFIG=""
          if [ "$EMBEDDINGS_AVAILABLE" = "false" ]; then
            COV_CONFIG="--cov-config=.coveragerc.no-embeddings"
          fi
          # Detect available CPUs from cgroup limits (Codeberg sets cpu.max
          # to 200000/100000 = 2 cores but nproc reports the host's 32).
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            read quota period < /sys/fs/cgroup/cpu.max
            if [ "$quota" != "max" ]; then
              WORKERS=$((quota / period))
            else
              WORKERS=$(nproc)
            fi
          else
            WORKERS=$(nproc)
          fi

          pytest packages/hypergumbo-lang-extended1/tests/ -n "$WORKERS" --tb=short \
            --cov=packages/hypergumbo-lang-extended1/src $COV_CONFIG --cov-report=term | tee coverage-output.txt
          COV=$(grep "^TOTAL" coverage-output.txt | awk '{print $NF}' | tr -d '%')
          echo "coverage=${COV:-0}" >> "$GITHUB_OUTPUT"

  # Aggregate results after all test jobs complete
  aggregate:
    needs: [changes, test-core, test-mainstream, test-common, test-extended]
    if: always()
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4

      - name: Handle docs-only push
        if: needs.changes.outputs.code != 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║  DOCS-ONLY PUSH - Test suite skipped                       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "No code changes detected. Only documentation files were modified."
          echo "Full test suite was skipped to save CI resources."

      - name: Check job results
        if: needs.changes.outputs.code == 'true'
        id: results
        run: |
          echo "Job results:"
          echo "  test-core: ${{ needs.test-core.result }} (coverage: ${{ needs.test-core.outputs.coverage }}%)"
          echo "  test-mainstream: ${{ needs.test-mainstream.result }} (coverage: ${{ needs.test-mainstream.outputs.coverage }}%)"
          echo "  test-common: ${{ needs.test-common.result }} (coverage: ${{ needs.test-common.outputs.coverage }}%)"
          echo "  test-extended: ${{ needs.test-extended.result }} (coverage: ${{ needs.test-extended.outputs.coverage }}%)"

          # Determine overall result
          if [[ "${{ needs.test-core.result }}" == "success" ]] && \
             [[ "${{ needs.test-mainstream.result }}" == "success" ]] && \
             [[ "${{ needs.test-common.result }}" == "success" ]] && \
             [[ "${{ needs.test-extended.result }}" == "success" ]]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            echo "✅ All test jobs passed"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "❌ One or more test jobs failed"
          fi

          # Calculate average coverage (simple average of 4 packages)
          COV_CORE="${{ needs.test-core.outputs.coverage }}"
          COV_MAINSTREAM="${{ needs.test-mainstream.outputs.coverage }}"
          COV_COMMON="${{ needs.test-common.outputs.coverage }}"
          COV_EXTENDED="${{ needs.test-extended.outputs.coverage }}"

          # Default to 0 if empty
          COV_CORE="${COV_CORE:-0}"
          COV_MAINSTREAM="${COV_MAINSTREAM:-0}"
          COV_COMMON="${COV_COMMON:-0}"
          COV_EXTENDED="${COV_EXTENDED:-0}"

          # Calculate average (integer math)
          AVG=$(( (COV_CORE + COV_MAINSTREAM + COV_COMMON + COV_EXTENDED) / 4 ))
          echo "coverage=$AVG" >> "$GITHUB_OUTPUT"
          echo "Average coverage: $AVG%"

      - name: Record run result
        if: needs.changes.outputs.code == 'true'
        run: |
          # Log run metadata
          echo "{
            \"run_id\": \"${{ github.run_id }}\",
            \"sha\": \"${{ github.sha }}\",
            \"conclusion\": \"${{ steps.results.outputs.conclusion }}\",
            \"coverage\": \"${{ steps.results.outputs.coverage }}%\",
            \"timestamp\": \"$(date -Iseconds)\",
            \"triggered_by\": \"${{ github.event_name }}\",
            \"jobs\": {
              \"core\": \"${{ needs.test-core.result }}\",
              \"mainstream\": \"${{ needs.test-mainstream.result }}\",
              \"common\": \"${{ needs.test-common.result }}\",
              \"extended\": \"${{ needs.test-extended.result }}\"
            }
          }"

      - name: Update coverage badge and marker
        if: needs.changes.outputs.code == 'true' && steps.results.outputs.conclusion == 'success'
        run: |
          COV="${{ steps.results.outputs.coverage }}"
          COV_CORE="${{ needs.test-core.outputs.coverage }}"
          COV_MAINSTREAM="${{ needs.test-mainstream.outputs.coverage }}"
          COV_COMMON="${{ needs.test-common.outputs.coverage }}"
          COV_EXTENDED="${{ needs.test-extended.outputs.coverage }}"

          # Determine badge color based on coverage
          if [ "$COV" -ge 90 ]; then
            COLOR="brightgreen"
          elif [ "$COV" -ge 70 ]; then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COV}%\",\"color\":\"${COLOR}\"}" > /tmp/coverage.json

          # Check if all packages have 100% coverage
          ALL_100="false"
          if [ "$COV_CORE" = "100" ] && [ "$COV_MAINSTREAM" = "100" ] && \
             [ "$COV_COMMON" = "100" ] && [ "$COV_EXTENDED" = "100" ]; then
            ALL_100="true"
            echo "All packages at 100% coverage - updating last-green-sha marker"
            echo "${{ github.sha }}" > /tmp/last-green-sha.txt
          else
            echo "Not all packages at 100%: core=$COV_CORE, mainstream=$COV_MAINSTREAM, common=$COV_COMMON, extended=$COV_EXTENDED"
          fi

          git config user.name "CI Bot"
          git config user.email "ci@iterabloom.com"

          git fetch origin badges:badges 2>/dev/null || true
          git checkout badges 2>/dev/null || git checkout --orphan badges

          git rm -rf . 2>/dev/null || true
          cp /tmp/coverage.json coverage.json
          if [ "$ALL_100" = "true" ]; then
            cp /tmp/last-green-sha.txt last-green-sha.txt
          fi

          git add coverage.json
          if [ "$ALL_100" = "true" ]; then
            git add last-green-sha.txt
          fi
          git commit -m "Update coverage badge: ${COV}%" || echo "No changes to commit"
          git push origin badges --force || echo "Push failed - may need write permissions"

      - name: Fail if any job failed
        if: needs.changes.outputs.code == 'true' && steps.results.outputs.conclusion != 'success'
        run: |
          echo "❌ Full suite FAILED"
          echo ""
          echo "Stop-the-line protocol is now active."
          echo "New PRs will be blocked until this is fixed."
          echo ""
          echo "To submit a fix, use PR title:"
          echo "  fix(job-${{ github.run_id }}): <description>"
          exit 1
