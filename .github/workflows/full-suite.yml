name: Full Test Suite

# Full test suite runs as parallel jobs per package (ADR-0010).
# Each package runs in its own job to fit within Codeberg's time limits.
# When any job fails, the stop-the-line protocol blocks PRs until fixed.

on:
  # Triggered after PR merges to dev
  push:
    branches: [ "dev" ]
  # Manual trigger for debugging
  workflow_dispatch:
  # Nightly validation
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily

# Singleton concurrency - only one full suite runs at a time
# This prevents resource contention and ensures clear pass/fail state
concurrency:
  group: full-suite-singleton
  cancel-in-progress: false

jobs:
  # Run each package's tests in parallel
  test-core:
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e packages/hypergumbo-core -e "packages/hypergumbo[dev]"
      - name: Build source-only grammars
        run: ./scripts/build-source-grammars
      - name: Run tests
        run: |
          pytest packages/hypergumbo-core/tests/ -n 2 --tb=short \
            --cov=packages/hypergumbo-core/src --cov-report=xml:coverage-core.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: coverage-core.xml

  test-mainstream:
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-mainstream -e "packages/hypergumbo[dev]"
      - name: Build source-only grammars
        run: ./scripts/build-source-grammars
      - name: Run tests
        run: |
          pytest packages/hypergumbo-lang-mainstream/tests/ -n 2 --tb=short \
            --cov=packages/hypergumbo-lang-mainstream/src --cov-report=xml:coverage-mainstream.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mainstream
          path: coverage-mainstream.xml

  test-common:
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-common -e "packages/hypergumbo[dev]"
      - name: Build source-only grammars
        run: ./scripts/build-source-grammars
      - name: Run tests
        run: |
          pytest packages/hypergumbo-lang-common/tests/ -n 2 --tb=short \
            --cov=packages/hypergumbo-lang-common/src --cov-report=xml:coverage-common.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-common
          path: coverage-common.xml

  test-extended:
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-extended1 -e "packages/hypergumbo[dev]"
      - name: Build source-only grammars
        run: ./scripts/build-source-grammars
      - name: Run tests
        run: |
          pytest packages/hypergumbo-lang-extended1/tests/ -n 2 --tb=short \
            --cov=packages/hypergumbo-lang-extended1/src --cov-report=xml:coverage-extended.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-extended
          path: coverage-extended.xml

  # Aggregate results after all test jobs complete
  aggregate:
    needs: [test-core, test-mainstream, test-common, test-extended]
    if: always()
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coverage tool
        run: pip install coverage

      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine coverage reports
        run: |
          # Convert XML reports to a combined report
          # Note: coverage combine works with .coverage files, not XML
          # For simplicity, we'll just check if all jobs passed
          echo "Coverage reports downloaded:"
          ls -la coverage-*.xml || echo "No coverage files found"

      - name: Check job results
        id: results
        run: |
          echo "Job results:"
          echo "  test-core: ${{ needs.test-core.result }}"
          echo "  test-mainstream: ${{ needs.test-mainstream.result }}"
          echo "  test-common: ${{ needs.test-common.result }}"
          echo "  test-extended: ${{ needs.test-extended.result }}"

          # Determine overall result
          if [[ "${{ needs.test-core.result }}" == "success" ]] && \
             [[ "${{ needs.test-mainstream.result }}" == "success" ]] && \
             [[ "${{ needs.test-common.result }}" == "success" ]] && \
             [[ "${{ needs.test-extended.result }}" == "success" ]]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            echo "✅ All test jobs passed"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "❌ One or more test jobs failed"
          fi

      - name: Record run result
        run: |
          # Create a JSON artifact with run metadata for stop-the-line checks
          echo "{
            \"run_id\": \"${{ github.run_id }}\",
            \"sha\": \"${{ github.sha }}\",
            \"conclusion\": \"${{ steps.results.outputs.conclusion }}\",
            \"timestamp\": \"$(date -Iseconds)\",
            \"triggered_by\": \"${{ github.event_name }}\",
            \"jobs\": {
              \"core\": \"${{ needs.test-core.result }}\",
              \"mainstream\": \"${{ needs.test-mainstream.result }}\",
              \"common\": \"${{ needs.test-common.result }}\",
              \"extended\": \"${{ needs.test-extended.result }}\"
            }
          }" > full-suite-result.json
          cat full-suite-result.json

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-result
          path: full-suite-result.json
          retention-days: 30

      - name: Update coverage badge
        if: steps.results.outputs.conclusion == 'success'
        run: |
          # For now, just indicate pass/fail
          # TODO: Aggregate actual coverage percentages from XML reports
          COLOR="brightgreen"
          MESSAGE="passing"

          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${MESSAGE}\",\"color\":\"${COLOR}\"}" > /tmp/coverage.json

          git config user.name "CI Bot"
          git config user.email "ci@iterabloom.com"

          git fetch origin badges:badges 2>/dev/null || true
          git checkout badges 2>/dev/null || git checkout --orphan badges

          git rm -rf . 2>/dev/null || true
          cp /tmp/coverage.json coverage.json

          git add coverage.json
          git commit -m "Update badge: tests ${MESSAGE}" || echo "No changes to commit"
          git push origin badges --force || echo "Push failed - may need write permissions"

      - name: Fail if any job failed
        if: steps.results.outputs.conclusion != 'success'
        run: |
          echo "❌ Full suite FAILED"
          echo ""
          echo "Stop-the-line protocol is now active."
          echo "New PRs will be blocked until this is fixed."
          echo ""
          echo "To submit a fix, use PR title:"
          echo "  fix(job-${{ github.run_id }}): <description>"
          exit 1
