name: Context Dump
on:
  pull_request:

jobs:
  dump:
    runs-on: codeberg-small-lazy
    steps:
      - name: Dump all contexts
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
          RUNNER_CONTEXT: ${{ toJSON(runner) }}
          JOB_CONTEXT: ${{ toJSON(job) }}
          STEPS_CONTEXT: ${{ toJSON(steps) }}
          ENV_CONTEXT: ${{ toJSON(env) }}
          VARS_CONTEXT: ${{ toJSON(vars) }}
        run: |
          echo "=== github context ==="
          echo "$GITHUB_CONTEXT"
          echo "=== runner context ==="
          echo "$RUNNER_CONTEXT"
          echo "=== job context ==="
          echo "$JOB_CONTEXT"
          echo "=== steps context ==="
          echo "$STEPS_CONTEXT"
          echo "=== env context ==="
          echo "$ENV_CONTEXT"
          echo "=== vars context ==="
          echo "$VARS_CONTEXT"
          echo "=== all environment variables ==="
          env | sort
