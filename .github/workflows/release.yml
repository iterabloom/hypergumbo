# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

# Triggered manually or when a version tag is pushed.
#
# GitHub-Actions backend (post Codeberg -> GitHub migration, Phase 4): jobs run
# on GitHub-hosted `ubuntu-latest`; the release publishes to PyPI (twine) and a
# GitHub Release (`gh release create`). Multi-Python verification + integration
# tests are covered by the Woodpecker `nightly` cron (`.woodpecker/nightly.yml`),
# so the former self-hosted post-publish matrix/integration jobs (and the
# Codeberg nightly-status pre-check) are retired here.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 7.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Security audit (always runs — hard gate before publish)
  # ─────────────────────────────────────────────────────────────
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip "wheel>=0.46.2" setuptools
          # Install modular packages if available, otherwise legacy
          # Note: Use hypergumbo-core[dev] for test deps, don't use meta-package (pulls PyTorch)
          if [ -d "packages/hypergumbo-core" ]; then
            pip install -e "packages/hypergumbo-core[dev]" \
                        -e packages/hypergumbo-lang-mainstream \
                        -e packages/hypergumbo-lang-common \
                        -e packages/hypergumbo-lang-extended1 \
                        -e packages/hypergumbo-lang-rust-analyzer \
                        -e packages/hypergumbo-tracker
          else
            pip install -e .[dev]
          fi
          pip install pip-audit bandit pip-licenses
          # Mirror ci.yml's baseline-env pins: the runner's baseline Python can
          # ship older versions of these transitive deps than our packages
          # install at runtime, and pip-audit scans the environment as-is. The
          # 6.0.0 release run failed on a baseline urllib3 2.6.3 exactly this way.
          # Baseline-env pins — kept identical to the live Woodpecker CI audit
          # (.woodpecker/woodpecker.yml) so this gate's audit surface matches the
          # gate PRs already pass. Fixable transitive CVEs are pinned away here
          # rather than ignored below.
          pip install "requests~=2.33.0"   # CVE-2026-25645
          pip install "pygments~=2.20.0"   # CVE-2026-4539
          pip install "urllib3>=2.8.0"     # CVE-2026-44431 / CVE-2026-44432; PYSEC-2026-4175/4176/4177
          pip install "idna>=3.15"         # CVE-2026-45409
          pip install "msgpack>=1.2.1"     # GHSA-6v7p-g79w-8964 (via CacheControl->pip-audit)
          pip install "click>=8.3.3"       # PYSEC-2026-2132

      - name: Vulnerability scan (pip-audit)
        run: |
          # pip-audit's exit code is the gate. This --ignore-vuln list is kept
          # IDENTICAL to the live Woodpecker CI audit (.woodpecker/woodpecker.yml)
          # so this release gate accepts exactly the CVEs that per-PR CI already
          # passes with — no more, no less. The per-CVE rationale (pytest TOCTOU,
          # pip ZIP-confusion) lives in ci.yml; fixable
          # transitive CVEs (click, msgpack, setuptools, …) are pinned away in the
          # install step above rather than ignored here. Re-check cadence: WI-totak.
          pip-audit --skip-editable \
            --ignore-vuln CVE-2025-71176 --ignore-vuln CVE-2026-3219

      - name: Security linting (Bandit)
        run: |
          # --quiet suppresses Bandit's per-file "Test in comment: <word> is
          # not a test name or id" parser noise on free-text after `# nosec`
          # markers. The exit code and issue count (the actual gate) are
          # unaffected. Mirrors `scripts/release-check` which already runs
          # bandit --quiet locally; this brings CI to parity.
          if [ -d "packages/hypergumbo-core" ]; then
            bandit -r packages/*/src/ -c pyproject.toml --quiet
          else
            bandit -r src/ -c pyproject.toml --quiet
          fi

      # `safety` was previously wired here as `pipx run safety check || true`,
      # but the runner has no pipx (so the step always errored) and `|| true`
      # swallowed the exit code, making the gate a no-op. Its CVE corpus
      # overlaps with pip-audit (which IS gating), so the step was delivering
      # zero signal — removed rather than re-plumbed.

      - name: License audit
        run: |
          pip-licenses --format=markdown > licenses.md
          cat licenses.md
          # Check for problematic licenses
          if pip-licenses --format=csv | grep -qiE "GPL|AGPL|SSPL"; then
            echo "::warning::Some dependencies have copyleft licenses"
          fi

      - name: Secret scanning
        run: |
          pip install trufflehog
          trufflehog filesystem . --no-update --only-verified || true

  # ─────────────────────────────────────────────────────────────
  # Build and publish (gated on security-audit).
  # Multi-Python + integration verification is the Woodpecker `nightly` cron's
  # job now; this workflow builds, publishes to PyPI, and cuts a GitHub Release.
  # ─────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────
  # Observed I/O manifest (hard gate before publish)
  #
  # Runs the installed CLI over docs/io-manifest/corpus.txt under strace
  # and compares every write, delete, rename, launch and connect attempt
  # with docs/io-manifest/expected.txt. A new line fails the release; a
  # write into an analysed repository or a network connection fails it
  # whatever the expected file says. scripts/io-manifest's docstring is the
  # specification; docs/io-manifest/README.md says how to read a failure.
  # ─────────────────────────────────────────────────────────────
  io-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace

      - name: Install the default package set, as a user would
        run: |
          pip install --upgrade pip "wheel>=0.46.2"
          # The packages `pip install hypergumbo` resolves to, built from this
          # checkout and installed NON-editable so the traced code runs from
          # site-packages like a release. No extras: no embeddings, no
          # rust-analyzer, no scip-python, no tracker.
          pip install packages/hypergumbo-core \
                      packages/hypergumbo-lang-mainstream \
                      packages/hypergumbo-lang-common \
                      packages/hypergumbo-lang-extended1 \
                      packages/hypergumbo

      - name: Trace the corpus and compare with the expected manifest
        run: |
          ./scripts/io-manifest run \
            --corpus docs/io-manifest/corpus.txt \
            --expected docs/io-manifest/expected.txt \
            --out "$RUNNER_TEMP/io-manifest" 2>&1 | tee io-manifest.log
          exit "${PIPESTATUS[0]}"

      - name: Upload the observed manifest and raw traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: io-manifest
          path: |
            ${{ runner.temp }}/io-manifest/observed.txt
            ${{ runner.temp }}/io-manifest/observed.by-run.txt
            ${{ runner.temp }}/io-manifest/trace/
            ${{ runner.temp }}/io-manifest/logs/
          retention-days: 14

  build-and-publish:
    needs: [security-audit, io-manifest]
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` writes a Release object + uploads assets.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tools
        run: |
          pip install --upgrade pip "wheel>=0.46.2"
          pip install build twine cyclonedx-bom

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Build packages
        run: |
          # Build all packages in dependency order
          if [ -d "packages/hypergumbo-core" ]; then
            echo "Building modular packages..."
            mkdir -p dist

            # Build in dependency order
            for pkg in hypergumbo-core hypergumbo-lang-mainstream hypergumbo-lang-common hypergumbo-lang-extended1 hypergumbo-lang-rust-analyzer hypergumbo-lang-scip-python hypergumbo hypergumbo-tracker; do
              echo "Building packages/$pkg..."
              python -m build "packages/$pkg" --outdir dist/
            done

            echo "Built packages:"
            ls -la dist/
          else
            echo "Building legacy single package..."
            python -m build
          fi

      - name: Generate SBOM
        run: |
          # SBOM of what the release SHIPS: the built wheels, installed into a
          # scratch environment with their resolved dependencies. Until v9.1.0
          # this ran against the build environment itself, so every published
          # sbom.json listed build, twine and cyclonedx-bom (66 components, no
          # hypergumbo package) — WI-hasol. Best-effort: never fail the release
          # on it, and DROP a missing/empty/invalid file so the release step
          # cannot try to upload a 0-byte asset ("HTTP 400: Bad Content-Length"
          # failed the v7.0.0 run). Runs BEFORE checksums so SHA256SUMS covers it.
          SBOM_ENV="$RUNNER_TEMP/sbom-env"
          python -m venv "$SBOM_ENV"
          "$SBOM_ENV/bin/pip" install --quiet --upgrade pip
          if "$SBOM_ENV/bin/pip" install --quiet --find-links dist/ dist/*.whl; then
            cyclonedx-py environment "$SBOM_ENV/bin/python" --output-reproducible \
                --output-format JSON --output-file dist/sbom.json \
              || cyclonedx-py environment "$SBOM_ENV/bin/python" -o dist/sbom.json \
              || true
          else
            echo "::warning::could not install the built wheels into a scratch environment; no SBOM"
          fi
          sbom_ok=0
          if [[ -s dist/sbom.json ]]; then
            python3 - <<'PY' && sbom_ok=1
          import json, sys
          names = {c.get("name", "").lower().replace("_", "-")
                   for c in json.load(open("dist/sbom.json")).get("components", [])}
          sys.exit(0 if "hypergumbo-core" in names else 1)
          PY
          fi
          if [[ $sbom_ok -eq 1 ]]; then
            echo "SBOM generated ($(wc -c < dist/sbom.json) bytes; describes the shipped packages)."
          else
            echo "::warning::SBOM missing, invalid, or not describing hypergumbo — omitting it from the release."
            rm -f dist/sbom.json
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Verify wheels
        run: |
          # Verify all wheels (use dist/ as extra index so inter-package deps resolve)
          for wheel in dist/*.whl; do
            echo "Verifying $wheel..."
            pip install "$wheel" --dry-run --find-links dist/
          done
          twine check dist/*.whl dist/*.tar.gz

      - name: Publish to PyPI
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [[ -n "$TWINE_PASSWORD" ]]; then
            echo "Publishing to PyPI..."
            # Upload all wheels and source distributions
            twine upload dist/*.whl dist/*.tar.gz --skip-existing
          else
            echo "::warning::PYPI_TOKEN not set, skipping publish"
          fi

      - name: Extract changelog for release notes
        run: |
          VERSION="${{ env.VERSION }}"
          # Extract changelog section for this version
          awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "Release v$VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          TAG="v$VERSION"

          # Mark pre-releases (dev / rc / alpha / beta) so they don't surface as "latest".
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *"dev"* ]] || [[ "$VERSION" == *"rc"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Wheels, sdists, checksums, and — only when the SBOM step kept it — the SBOM.
          ASSETS=(dist/*.whl dist/*.tar.gz dist/SHA256SUMS)
          if [[ -s dist/sbom.json ]]; then
            ASSETS+=(dist/sbom.json)
          fi

          # 1. The Release itself, with NO assets, and only when it does not exist
          #    yet: a re-run of this job after a failed upload must REPAIR the
          #    Release, not die on "already exists". The tag exists already (this
          #    workflow was triggered by its push).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; attaching whatever is missing."
          else
            gh release create "$TAG" --title "$TAG" --notes-file release_notes.md $PRERELEASE_FLAG
          fi

          # 2. One upload per asset, retried. GitHub's upload host fails
          #    transiently (v7.0.0: HTTP 400, v9.1.0: HTTP 404), and one failure
          #    used to abort `gh release create` with the Release already public
          #    and the remaining files never attached (WI-hasol). --clobber makes
          #    a retry, and a re-run of the whole job, idempotent.
          failed=()
          for asset in "${ASSETS[@]}"; do
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$asset" --clobber; then
                break
              elif [[ $attempt -eq 4 ]]; then
                failed+=("$(basename "$asset")")
              else
                echo "upload of $asset failed (attempt $attempt); retrying in $((attempt * 15))s"
                sleep $((attempt * 15))
              fi
            done
          done

          # 3. Verify by name against the Release itself, not against our own
          #    bookkeeping: every file we built must be attached.
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > attached.txt
          missing=()
          for asset in "${ASSETS[@]}"; do
            grep -qxF "$(basename "$asset")" attached.txt || missing+=("$(basename "$asset")")
          done
          if (( ${#failed[@]} > 0 || ${#missing[@]} > 0 )); then
            echo "::error::Release $TAG is incomplete."
            echo "  upload failed: ${failed[*]:-none}"
            echo "  not attached:  ${missing[*]:-none}"
            exit 1
          fi
          echo "Release complete: $(wc -l < attached.txt) assets attached."
          echo "Release created: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
