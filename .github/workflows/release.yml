# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

# Triggered manually or when a version tag is pushed.
#
# GitHub-Actions backend (post Codeberg -> GitHub migration, Phase 4): jobs run
# on GitHub-hosted `ubuntu-latest`; the release publishes to PyPI (twine) and a
# GitHub Release (`gh release create`). Multi-Python verification + integration
# tests are covered by the Woodpecker `nightly` cron (`.woodpecker/nightly.yml`),
# so the former self-hosted post-publish matrix/integration jobs (and the
# Codeberg nightly-status pre-check) are retired here.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 7.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Security audit (always runs — hard gate before publish)
  # ─────────────────────────────────────────────────────────────
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip "wheel>=0.46.2"
          # Install modular packages if available, otherwise legacy
          # Note: Use hypergumbo-core[dev] for test deps, don't use meta-package (pulls PyTorch)
          if [ -d "packages/hypergumbo-core" ]; then
            pip install -e "packages/hypergumbo-core[dev]" \
                        -e packages/hypergumbo-lang-mainstream \
                        -e packages/hypergumbo-lang-common \
                        -e packages/hypergumbo-lang-extended1 \
                        -e packages/hypergumbo-lang-rust-analyzer \
                        -e packages/hypergumbo-tracker
          else
            pip install -e .[dev]
          fi
          pip install pip-audit bandit pip-licenses
          # Mirror ci.yml's baseline-env pins: the runner's baseline Python can
          # ship older versions of these transitive deps than our packages
          # install at runtime, and pip-audit scans the environment as-is. The
          # 6.0.0 release run failed on a baseline urllib3 2.6.3 exactly this way.
          pip install "requests~=2.33.0"   # CVE-2026-25645
          pip install "pygments~=2.20.0"   # CVE-2026-4539
          pip install "urllib3>=2.7.0"     # CVE-2026-44431 / CVE-2026-44432
          pip install "idna>=3.15"         # CVE-2026-45409
          pip install "msgpack>=1.2.1"     # GHSA-6v7p-g79w-8964 (via CacheControl->pip-audit)

      - name: Vulnerability scan (pip-audit)
        run: |
          # CVE-2025-71176: pytest /tmp/pytest-of-{user} TOCTOU on UNIX.
          # Fix is pytest 9.0.3, but we are pinned below 9.0.0 transitively by
          # syrupy 4.8.0 (hard-pinned by pytest-textual-snapshot 1.1.0).
          # Impact assessment: local attack boundary only, reachable solely in
          # CI/dev environments — pytest is a dev-only dep, never installed on
          # end-user systems running hypergumbo. The CI runner is ephemeral
          # (single-use per job), so practical exploitability is ~0.
          # Exit plan: upstream PR to relax the syrupy pin is tracked at
          # https://github.com/Textualize/pytest-textual-snapshot/pull/24
          # When that merges and a new pytest-textual-snapshot release ships,
          # bump pytest to 9.0.3+ and drop this ignore (same in ci.yml).
          #
          # CVE-2026-3219: pip concatenated-ZIP+tar archive confusion.
          # Mirror of ci.yml's ignore — same rationale (CVSS 4.6 MEDIUM,
          # AV:L + UI:A, zero attack surface on our pinned-dep ephemeral CI
          # runner). Fix is pip 26.1 (PR pypa/pip#13870), not yet on PyPI
          # when this was added. Drop once pip-audit stops flagging pip.
          #
          # PYSEC-2026-139 / CVE-2025-3000: torch, transitive via the dev
          # extra's sentence-transformers. No fixed release exists; the
          # full threat analysis (attacker-controlled tensors / crafted
          # JIT / malicious .pt2 — none reachable from the pinned
          # SentenceTransformer encode() path) lives in ci.yml's ML-stack
          # carve-out comment, which names this CVE. The two IDs are the
          # same advisory under different database keys (the CVE key began
          # surfacing independently on 2026-06-10). Re-check cadence is
          # tracker item WI-totak; drop both when a fixed torch ships.
          pip-audit --skip-editable --ignore-vuln CVE-2025-71176 --ignore-vuln CVE-2026-3219 \
            --ignore-vuln PYSEC-2026-139 --ignore-vuln CVE-2025-3000

      - name: Security linting (Bandit)
        run: |
          # --quiet suppresses Bandit's per-file "Test in comment: <word> is
          # not a test name or id" parser noise on free-text after `# nosec`
          # markers. The exit code and issue count (the actual gate) are
          # unaffected. Mirrors `scripts/release-check` which already runs
          # bandit --quiet locally; this brings CI to parity.
          if [ -d "packages/hypergumbo-core" ]; then
            bandit -r packages/*/src/ -c pyproject.toml --quiet
          else
            bandit -r src/ -c pyproject.toml --quiet
          fi

      # `safety` was previously wired here as `pipx run safety check || true`,
      # but the runner has no pipx (so the step always errored) and `|| true`
      # swallowed the exit code, making the gate a no-op. Its CVE corpus
      # overlaps with pip-audit (which IS gating), so the step was delivering
      # zero signal — removed rather than re-plumbed.

      - name: License audit
        run: |
          pip-licenses --format=markdown > licenses.md
          cat licenses.md
          # Check for problematic licenses
          if pip-licenses --format=csv | grep -qiE "GPL|AGPL|SSPL"; then
            echo "::warning::Some dependencies have copyleft licenses"
          fi

      - name: Secret scanning
        run: |
          pip install trufflehog
          trufflehog filesystem . --no-update --only-verified || true

  # ─────────────────────────────────────────────────────────────
  # Build and publish (gated on security-audit).
  # Multi-Python + integration verification is the Woodpecker `nightly` cron's
  # job now; this workflow builds, publishes to PyPI, and cuts a GitHub Release.
  # ─────────────────────────────────────────────────────────────
  build-and-publish:
    needs: [security-audit]
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` writes a Release object + uploads assets.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tools
        run: |
          pip install --upgrade pip "wheel>=0.46.2"
          pip install build twine cyclonedx-bom

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Build packages
        run: |
          # Build all packages in dependency order
          if [ -d "packages/hypergumbo-core" ]; then
            echo "Building modular packages..."
            mkdir -p dist

            # Build in dependency order
            for pkg in hypergumbo-core hypergumbo-lang-mainstream hypergumbo-lang-common hypergumbo-lang-extended1 hypergumbo-lang-rust-analyzer hypergumbo hypergumbo-tracker; do
              echo "Building packages/$pkg..."
              python -m build "packages/$pkg" --outdir dist/
            done

            echo "Built packages:"
            ls -la dist/
          else
            echo "Building legacy single package..."
            python -m build
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o dist/sbom.json --format json || true

      - name: Verify wheels
        run: |
          # Verify all wheels (use dist/ as extra index so inter-package deps resolve)
          for wheel in dist/*.whl; do
            echo "Verifying $wheel..."
            pip install "$wheel" --dry-run --find-links dist/
          done
          twine check dist/*.whl dist/*.tar.gz

      - name: Publish to PyPI
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [[ -n "$TWINE_PASSWORD" ]]; then
            echo "Publishing to PyPI..."
            # Upload all wheels and source distributions
            twine upload dist/*.whl dist/*.tar.gz --skip-existing
          else
            echo "::warning::PYPI_TOKEN not set, skipping publish"
          fi

      - name: Extract changelog for release notes
        run: |
          VERSION="${{ env.VERSION }}"
          # Extract changelog section for this version
          awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "Release v$VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          TAG="v$VERSION"

          # Mark pre-releases (dev / rc / alpha / beta) so they don't surface as "latest".
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *"dev"* ]] || [[ "$VERSION" == *"rc"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Attach the wheels, sdists, checksums, and (when present) the SBOM.
          ASSETS=(dist/*.whl dist/*.tar.gz dist/SHA256SUMS)
          if [[ -f dist/sbom.json ]]; then
            ASSETS+=(dist/sbom.json)
          fi

          # The tag already exists (this workflow was triggered by its push), so
          # `gh release create <tag>` attaches a Release to it.
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "$TAG" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG

          echo "Release created: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
