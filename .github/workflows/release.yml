name: Release

# Triggered manually or when a version tag is pushed
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.6.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Check if nightly already covered this SHA
  # Queries Forgejo commit status API for nightly/test-matrix and
  # nightly/integration-tests contexts set by nightly.yml.
  # ─────────────────────────────────────────────────────────────
  check-nightly:
    runs-on: codeberg-small-lazy
    outputs:
      matrix_covered: ${{ steps.check.outputs.matrix_covered }}
      integration_covered: ${{ steps.check.outputs.integration_covered }}
    steps:
      - name: Check nightly commit statuses
        id: check
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          API="https://codeberg.org/api/v1/repos/${REPO}/statuses/${SHA}"

          matrix_covered=false
          integration_covered=false

          if [ -n "$FORGEJO_TOKEN" ]; then
            STATUSES=$(curl -s -H "Authorization: token $FORGEJO_TOKEN" "$API")

            # Check for successful nightly/test-matrix status
            if echo "$STATUSES" | jq -e '.[] | select(.context == "nightly/test-matrix" and .status == "success")' > /dev/null 2>&1; then
              matrix_covered=true
              echo "Nightly test-matrix already passed for $SHA"
            fi

            # Check for successful nightly/integration-tests status
            if echo "$STATUSES" | jq -e '.[] | select(.context == "nightly/integration-tests" and .status == "success")' > /dev/null 2>&1; then
              integration_covered=true
              echo "Nightly integration-tests already passed for $SHA"
            fi
          else
            echo "::warning::FORGEJO_TOKEN not set, cannot check nightly status"
          fi

          echo "matrix_covered=$matrix_covered" >> "$GITHUB_OUTPUT"
          echo "integration_covered=$integration_covered" >> "$GITHUB_OUTPUT"
          echo "Matrix covered: $matrix_covered, Integration covered: $integration_covered"

  # ─────────────────────────────────────────────────────────────
  # Security audit (always runs — hard gate before publish)
  # ─────────────────────────────────────────────────────────────
  security-audit:
    runs-on: codeberg-small-lazy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install modular packages if available, otherwise legacy
          # Note: Use hypergumbo-core[dev] for test deps, don't use meta-package (pulls PyTorch)
          if [ -d "packages/hypergumbo-core" ]; then
            pip install -e "packages/hypergumbo-core[dev]" \
                        -e packages/hypergumbo-lang-mainstream \
                        -e packages/hypergumbo-lang-common \
                        -e packages/hypergumbo-lang-extended1 \
                        -e packages/hypergumbo-tracker
          else
            pip install -e .[dev]
          fi
          pip install pip-audit bandit safety pip-licenses

      - name: Vulnerability scan (pip-audit)
        run: pip-audit --skip-editable

      - name: Security linting (Bandit)
        run: |
          if [ -d "packages/hypergumbo-core" ]; then
            bandit -r packages/*/src/ -c pyproject.toml
          else
            bandit -r src/ -c pyproject.toml
          fi

      - name: Dependency safety check
        run: safety check || true  # Advisory, don't fail

      - name: License audit
        run: |
          pip-licenses --format=markdown > licenses.md
          cat licenses.md
          # Check for problematic licenses
          if pip-licenses --format=csv | grep -qiE "GPL|AGPL|SSPL"; then
            echo "::warning::Some dependencies have copyleft licenses"
          fi

      - name: Secret scanning
        run: |
          pip install trufflehog
          trufflehog filesystem . --no-update --only-verified || true

  # ─────────────────────────────────────────────────────────────
  # Build and publish
  # Now only gated on security-audit. Test-matrix and integration
  # are either covered by nightly or run post-publish as fallback.
  # ─────────────────────────────────────────────────────────────
  build-and-publish:
    needs: [security-audit]
    runs-on: codeberg-small-lazy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build twine cyclonedx-bom

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Build packages
        run: |
          # Build all packages in dependency order
          if [ -d "packages/hypergumbo-core" ]; then
            echo "Building modular packages..."
            mkdir -p dist

            # Build in dependency order
            for pkg in hypergumbo-core hypergumbo-lang-mainstream hypergumbo-lang-common hypergumbo-lang-extended1 hypergumbo hypergumbo-tracker; do
              echo "Building packages/$pkg..."
              python -m build "packages/$pkg" --outdir dist/
            done

            echo "Built packages:"
            ls -la dist/
          else
            echo "Building legacy single package..."
            python -m build
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o dist/sbom.json --format json || true

      - name: Verify wheels
        run: |
          # Verify all wheels (use dist/ as extra index so inter-package deps resolve)
          for wheel in dist/*.whl; do
            echo "Verifying $wheel..."
            pip install "$wheel" --dry-run --find-links dist/
          done
          twine check dist/*.whl dist/*.tar.gz

      - name: Publish to PyPI
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [[ -n "$TWINE_PASSWORD" ]]; then
            echo "Publishing to PyPI..."
            # Upload all wheels and source distributions
            twine upload dist/*.whl dist/*.tar.gz --skip-existing
          else
            echo "::warning::PYPI_TOKEN not set, skipping publish"
          fi

      - name: Extract changelog for release notes
        run: |
          VERSION="${{ env.VERSION }}"
          # Extract changelog section for this version
          awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "Release v$VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md
          fi
          cat release_notes.md

      - name: Create Forgejo Release
        if: github.event_name == 'push'
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          VERSION="${{ env.VERSION }}"
          TAG="v$VERSION"

          if [[ -z "$FORGEJO_TOKEN" ]]; then
            echo "::warning::FORGEJO_TOKEN not set, skipping release creation"
            exit 0
          fi

          # Determine if prerelease
          PRERELEASE=false
          if [[ "$VERSION" == *"dev"* ]] || [[ "$VERSION" == *"rc"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]]; then
            PRERELEASE=true
          fi

          # Read release notes
          BODY=$(cat release_notes.md | jq -Rs .)

          # Create release via Forgejo API
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"$TAG\",
              \"body\": $BODY,
              \"draft\": false,
              \"prerelease\": $PRERELEASE
            }" \
            "https://codeberg.org/api/v1/repos/${{ github.repository }}/releases")

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [[ -z "$RELEASE_ID" ]]; then
            echo "::warning::Failed to create release"
            echo "$RESPONSE"
            exit 0
          fi

          echo "Created release ID: $RELEASE_ID"

          # Upload assets
          for file in dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/sbom.json; do
            if [[ -f "$file" ]]; then
              FILENAME=$(basename "$file")
              echo "Uploading $FILENAME..."
              curl -s -X POST \
                -H "Authorization: token $FORGEJO_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "https://codeberg.org/api/v1/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$FILENAME"
            fi
          done

          echo "Release created: https://codeberg.org/${{ github.repository }}/releases/tag/$TAG"

  # ─────────────────────────────────────────────────────────────
  # Post-publish test matrix (runs only if nightly didn't cover it)
  # Verifies multi-Python compatibility after publish. If this fails,
  # the release is already out but the failure is visible for triage.
  # ─────────────────────────────────────────────────────────────
  # Uses container images to guarantee Python availability —
  # setup-python@v5 can't find pre-built binaries for Debian 12
  # (the versions manifest only ships Ubuntu builds).
  post-publish-matrix:
    needs: [check-nightly, build-and-publish]
    if: needs.check-nightly.outputs.matrix_covered != 'true'
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    runs-on: codeberg-small-lazy
    container: python:${{ matrix.python-version }}-bookworm
    timeout-minutes: 15
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

    steps:
      - name: Install Node.js for JS-based actions
        run: apt-get update && apt-get install -y nodejs

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -d "packages/hypergumbo-core" ]; then
            pip install -e "packages/hypergumbo-core[dev]" \
                        -e packages/hypergumbo-lang-mainstream \
                        -e packages/hypergumbo-lang-common \
                        -e packages/hypergumbo-lang-extended1 \
                        -e "packages/hypergumbo-tracker[dev,tui]" \
                        -e packages/hypergumbo \
                        jsonschema
          else
            pip install -e .[dev]
          fi

      - name: Build source-only grammars
        run: ./scripts/build-source-grammars

      - name: Check for sentence-transformers
        run: |
          if python -c "import sentence_transformers" 2>/dev/null; then
            echo "sentence-transformers available"
            echo "EMBEDDINGS_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "sentence-transformers not installed, embedding tests will be skipped"
            echo "EMBEDDINGS_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Run tests with coverage
        run: |
          if [ -d "packages/hypergumbo-core" ]; then
            COV_PATHS="--cov=packages/hypergumbo-core/src --cov=packages/hypergumbo-lang-mainstream/src --cov=packages/hypergumbo-lang-common/src --cov=packages/hypergumbo-lang-extended1/src --cov=packages/hypergumbo-tracker/src"
            TEST_PATHS="packages/*/tests/"
          else
            COV_PATHS="--cov=src"
            TEST_PATHS=""
          fi

          # Detect available CPUs from cgroup limits
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            read quota period < /sys/fs/cgroup/cpu.max
            if [ "$quota" != "max" ]; then
              WORKERS=$((quota / period))
            else
              WORKERS=$(nproc)
            fi
          else
            WORKERS=$(nproc)
          fi

          if [ "$EMBEDDINGS_AVAILABLE" = "true" ]; then
            pytest -n "$WORKERS" $COV_PATHS --cov-report=term-missing --cov-fail-under=100 $TEST_PATHS
          else
            pytest -n "$WORKERS" $COV_PATHS --cov-report=term-missing --cov-fail-under=100 \
              --cov-config=.coveragerc.no-embeddings $TEST_PATHS
          fi

  # ─────────────────────────────────────────────────────────────
  # Post-publish integration tests (runs only if nightly didn't cover it)
  # ─────────────────────────────────────────────────────────────
  post-publish-integration:
    needs: [check-nightly, build-and-publish]
    if: needs.check-nightly.outputs.integration_covered != 'true'
    runs-on: codeberg-small-lazy
    container: python:3.11-bookworm
    timeout-minutes: 30
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

    steps:
      - name: Install Node.js and jq for JS-based actions
        run: apt-get update && apt-get install -y nodejs jq

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -d "packages/hypergumbo-core" ]; then
            pip install -e "packages/hypergumbo-core[dev]" \
                        -e packages/hypergumbo-lang-mainstream \
                        -e packages/hypergumbo-lang-common \
                        -e packages/hypergumbo-lang-extended1 \
                        -e packages/hypergumbo
          else
            pip install -e .[dev]
          fi

      - name: Build source-only grammars
        run: ./scripts/build-source-grammars

      - name: Run integration tests
        run: ./scripts/integration-test --quick
