name: Release

# Triggered manually or when a version tag is pushed
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.6.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        type: boolean
        default: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Extended test matrix
  # ─────────────────────────────────────────────────────────────
  test-matrix:
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Build source-only grammars
        if: runner.os != 'Windows'
        run: ./scripts/build-source-grammars

      - name: Run tests
        run: pytest --cov=src

  # ─────────────────────────────────────────────────────────────
  # Security audit
  # ─────────────────────────────────────────────────────────────
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
          pip install pip-audit bandit safety pip-licenses

      - name: Vulnerability scan (pip-audit)
        run: pip-audit --strict

      - name: Security linting (Bandit)
        run: bandit -r src/ -c pyproject.toml

      - name: Dependency safety check
        run: safety check || true  # Advisory, don't fail

      - name: License audit
        run: |
          pip-licenses --format=markdown > licenses.md
          cat licenses.md
          # Check for problematic licenses
          if pip-licenses --format=csv | grep -qiE "GPL|AGPL|SSPL"; then
            echo "::warning::Some dependencies have copyleft licenses"
          fi

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  # ─────────────────────────────────────────────────────────────
  # Integration tests
  # ─────────────────────────────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
          pip install jq

      - name: Build source-only grammars
        run: ./scripts/build-source-grammars

      - name: Install hypergumbo globally
        run: pip install -e .

      - name: Run integration tests
        run: ./scripts/integration-test --quick

  # ─────────────────────────────────────────────────────────────
  # Build artifacts
  # ─────────────────────────────────────────────────────────────
  build:
    needs: [test-matrix, security-audit, integration-tests]
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build package
        run: python -m build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o dist/sbom.json --format json || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ─────────────────────────────────────────────────────────────
  # Publish to PyPI
  # ─────────────────────────────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !github.event.inputs.dry_run

    environment:
      name: pypi
      url: https://pypi.org/p/hypergumbo

    permissions:
      id-token: write  # For trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses trusted publishing (OIDC) - no token needed
          packages-dir: dist/
          skip-existing: true

  # ─────────────────────────────────────────────────────────────
  # Create GitHub/Codeberg release
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          # Extract changelog section for this version
          awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "Release v$VERSION" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/sbom.json
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, 'dev') || contains(needs.build.outputs.version, 'rc') }}
