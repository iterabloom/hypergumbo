# SPDX-License-Identifier: AGPL-3.0-or-later
name: Tracker CI

on:
  push:
    branches: [dev]
    paths:
      - '.agent/tracker/.ops/**'
      - '.agent/tracker-workspace/.ops/**'
  pull_request:
    branches: [dev]
    paths:
      - '.agent/tracker/.ops/**'
      - '.agent/tracker-workspace/.ops/**'

# Cancel any in-flight run on the same ref when a new push/PR-update arrives.
# Matches ci.yml's convention. Without this, the tracker auto-sync retry path
# stacks concurrent runs on a single sync PR when the runner is busy: observed
# 2026-04-21 on PR #3250 — three stacked runs on head SHA 586d52e, one hung
# for ~2h waiting behind a saturated runner because the prior runs were never
# cancelled before re-push.
concurrency:
  group: tracker-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tracker-ci:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            # Push event — check only the pushed commit
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push — skipping DCO check"
            exit 0
          fi
          for sha in $(git rev-list --no-merges $base..$head); do
            if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by:'; then
              echo "❌ Commit $sha is missing DCO sign-off"
              exit 1
            fi
          done
          echo "✅ All commits have DCO sign-off"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tracker
        run: |
          pip install --upgrade pip
          pip install -e packages/hypergumbo-tracker

      - name: Validate tracker data
        run: scripts/tracker validate

      # When ci.yml is skipped (paths-ignore), its required status check
      # never gets posted, blocking PR merges.  Post it here so tracker-only
      # PRs can merge.
      - name: Satisfy required CI status for tracker-only PRs
        if: github.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          curl -s -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "state": "success",
              "context": "CI / pytest (pull_request)",
              "description": "Skipped: tracker-only change"
            }' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$SHA"
