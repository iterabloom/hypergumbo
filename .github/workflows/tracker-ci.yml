name: Tracker CI

on:
  pull_request:
    branches: [dev]
    paths:
      - '.agent/tracker/.ops/**'
      - '.agent/tracker-workspace/.ops/**'

jobs:
  tracker-ci:
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          for sha in $(git rev-list --no-merges $base..$head); do
            if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by:'; then
              echo "❌ Commit $sha is missing DCO sign-off"
              exit 1
            fi
          done
          echo "✅ All commits have DCO sign-off"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tracker
        run: |
          pip install --upgrade pip
          pip install -e packages/hypergumbo-tracker

      - name: Validate tracker data
        run: scripts/tracker validate
