[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hypergumbo"
version = "7.0.0"
description = "Local-first repo behavior map generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Hypergumbo contributors" }]
keywords = ["static-analysis", "code-graph", "cli", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  # Meta-package that pulls in all hypergumbo components
  "hypergumbo-core==7.0.0",
  "hypergumbo-lang-mainstream==7.0.0",
  "hypergumbo-lang-common==7.0.0",
  "hypergumbo-lang-extended1==7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest~=9.0.2",
  "pytest-cov~=7.0.0",
  "pytest-xdist~=3.8.0",
  "ruff~=0.15.0",
  "bandit~=1.9.3",
  "pip-audit~=2.10.0",
  "jsonschema~=4.26.0",
  "yamllint~=1.38.0",
  "check-jsonschema~=0.36.1",
]
# Embeddings for full-quality output (elevator pitch, semantic ranking)
# Pulls in sentence-transformers which requires PyTorch (~2GB)
# Install with: pip install hypergumbo[embeddings] or ./scripts/install-embeddings
embeddings = [
  "sentence-transformers~=5.2.2",
]
# SCIP-backed Rust analysis via rust-analyzer (BUG-06 path (a)).
# Without this extra, --backend rust-analyzer hits the BUG-06 runtime gate.
# Install with: pipx install 'hypergumbo[rust-analyzer]'
rust-analyzer = [
  "hypergumbo-lang-rust-analyzer==7.0.0",
]

[project.scripts]
hypergumbo = "hypergumbo_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hypergumbo"]
