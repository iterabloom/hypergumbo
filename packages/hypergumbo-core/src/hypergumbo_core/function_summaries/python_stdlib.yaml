# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0017 §4b: Function summaries for the Python stdlib and common libraries.
#
# SCOPE: ENUMERATION-DERIVED, NOT A STDLIB SURVEY. See the header of
# go_stdlib.yaml for the full rationale — every entry is a callee the §3a walk
# was measured consulting at a real escape site on the cohort (pretix, kserve),
# plus same-family siblings.
#
# PYTHON'S SHARE IS SMALL, AND THE REASON IS WORTH RECORDING. Most Python
# escape-site callees on the cohort resolve to the module slot `external` —
# `external.append`, `external.save`, `external.get`, `external.log_action` —
# because the callee is an unresolved method on an untyped receiver. A declared
# summary is keyed by QUALIFIED name, so those cannot be named here at all;
# they need better callee resolution (WI-makij / the matching layer), not more
# YAML. Adding speculative `list.append` / `dict.get` entries would not match
# them and would only make this file look more complete than it is.

summaries:
  # --- builtins ---
  # list.pop returns the removed element, so the taint moves from the list to
  # the caller. This is the pretix `voucher_list.append(vouchers.pop(0))` shape
  # that produced three verified FALSE NEGATIVES when an earlier §3a arm
  # treated "lost track of it" as "it did not happen".
  - function: "builtins.list.pop"
    param_to_return: {}
    # Return derives from SELF, not from a parameter — no field expresses that,
    # and the absence of `side_effect` is what keeps this from reading as
    # terminating. Declared explicitly so a later reader does not add
    # `side_effect: true` on the grounds that pop() mutates the list.

  - function: "builtins.print"
    param_to_return: {}
    side_effect: true

  # THE NEXT TWO ARE THE ENTIRE `4a` BUCKET (key present, no summary) of
  # scripts/measure-call-escape-cause.py run against hypergumbo-core at dev
  # c53e6de270 -- the only two callees the §3a walk was measured consulting at
  # a real escape site and unable to look up. Added under this file's scope
  # rule, which forbids a stdlib survey, and NOT ranked by call frequency:
  # their verdicts DISAGREE, so a frequency list would have been half wrong in
  # the DELETING direction.
  #
  #   cli.py:11933   if hasattr(args, "_path_flag"):
  #   cli.py:4086    if float(e["last_used"]) != newest_per_repo[...]

  # hasattr(obj, name) -> bool. TERMINATING, and it is the first entry in any
  # of the four catalogues that carries `side_effect: true` while performing no
  # I/O. That is not a mislabel -- see the field's docstring in
  # function_summaries/__init__.py, which the same change made honest.
  # `side_effect` is the POSITIVE marker meaning "this dead end is modelled,
  # the taint stops here"; `param_to_return: {}` alone cannot mean that,
  # because builtins.list.pop above has exactly the same empty mapping and
  # returns its receiver's content.
  #
  # WHAT IS BEING TRADED, stated because a wrong TERMINATING drops a flow.
  # hasattr does leak one bit -- whether the attribute EXISTS -- and existence
  # is not content. The tainted object's value reaches nothing; the bool that
  # comes out gates a branch, and control-flow influence is outside what this
  # DDG walk models (ADR-0017 §7b). If that scope ever widens, this entry is
  # the first one to revisit.
  - function: "builtins.hasattr"
    param_to_return: {}
    side_effect: true

  # float(x) -> a numeric value DERIVED FROM x's CONTENT. PROPAGATES; a
  # tainted numeric string that becomes a float is still attacker-influenced.
  # Declaring it does NOT close its escape site and is not meant to: the value
  # genuinely leaves the call, so the walk is right to lose it there. What the
  # entry buys is that the escape is now an ARGUED propagation rather than an
  # unknown, and that nobody bulk-stamps it terminating alongside its
  # measurement partner above.
  - function: "builtins.float"
    param_to_return: {0: true}

  # --- logging: the canonical Python terminating family ---
  #
  # DECLARED TWICE ON PURPOSE, AND ONLY ONE FORM CAN FIRE TODAY (INV-rozaj).
  # The §4 lookup key is `{module-slot}.{name}`, so which form matches depends
  # entirely on what the analyzer put in the callee id's module slot. Measured
  # on a self-survey (72,822 call edges, 6,685 distinct callees): of 64
  # logger-method call sites, the module slots present are `warnings` (51),
  # `external` (12) and one file path. NOT ONE carries `logging.Logger`.
  #
  #   logging.info(msg)      -> python:logging:0-0:info:external_symbol
  #                          -> key `logging.info`          <- CAN match
  #   logger.info(msg)       -> python:external:0-0:info:unresolved
  #                          -> key ``                      <- cannot match
  #                             (receiver unresolved; `logger = getLogger(...)`
  #                             binds from a CALL expression, which
  #                             _resolve_receiver_hint does not follow)
  #
  # The bare-module entries are added because they are the form that actually
  # occurs. The `logging.Logger.*` entries are KEPT rather than deleted: they
  # are correct, they cost nothing (an entry that matches no key is never
  # consulted), and they are what will fire if receiver resolution ever
  # upgrades the slot. Recorded here rather than left as silent dead data.
  - function: "logging.debug"
    param_to_return: {}
    side_effect: true

  - function: "logging.info"
    param_to_return: {}
    side_effect: true

  - function: "logging.warning"
    param_to_return: {}
    side_effect: true

  - function: "logging.error"
    param_to_return: {}
    side_effect: true

  - function: "logging.exception"
    param_to_return: {}
    side_effect: true

  - function: "logging.Logger.debug"
    param_to_return: {}
    side_effect: true

  - function: "logging.Logger.info"
    param_to_return: {}
    side_effect: true

  - function: "logging.Logger.warning"
    param_to_return: {}
    side_effect: true

  - function: "logging.Logger.error"
    param_to_return: {}
    side_effect: true

  - function: "logging.Logger.exception"
    param_to_return: {}
    side_effect: true

  # --- decimal ---
  # Decimal(value) is a constructor: the argument IS the returned object's
  # value. Propagates.
  - function: "decimal.Decimal"
    param_to_return: {0: true}

  # --- django ORM ---
  # filter()/exclude() return a QuerySet built from the supplied lookups, so a
  # tainted lookup value lives on in the returned queryset. Propagates — and
  # this matters on the cohort, where pretix's largest violated claim is
  # entirely database-read-to-database-write (WI-vazal).
  - function: "django.db.models.filter"
    param_to_return: {0: true, 1: true}

  - function: "django.db.models.exclude"
    param_to_return: {0: true, 1: true}

  - function: "django.db.models.get"
    param_to_return: {0: true, 1: true}
