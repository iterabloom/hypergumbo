# ADR-0017 §4b: Function summaries for the Rust standard library
#
# Declares data flow through Rust standard-library functions
# for interprocedural taint propagation.

provenance: builtin
summaries:
  - function: "Vec::push"
    param_to_self: {0: true}
    mutates_self: true

  - function: "Vec::extend"
    param_to_self: {0: true}
    mutates_self: true

  - function: "String::from"
    param_to_return: {0: true}

  - function: "String::as_str"
    param_to_return: {}
    # Return inherits taint from self

  - function: "String::push_str"
    param_to_self: {0: true}
    mutates_self: true

  - function: "std::fs::write"
    param_to_return: {}
    side_effect: true

  - function: "std::fs::read_to_string"
    param_to_return: {}
    side_effect: true
