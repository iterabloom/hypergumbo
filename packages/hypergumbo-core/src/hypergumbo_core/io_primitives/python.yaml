    notes: "2026-09-06 WI-dupok: reads os.environ (MACOSX_DEPLOYMENT_TARGET and friends)."
  - module: xml.dom
    functions: [getDOMImplementation]
    notes: "2026-09-06 WI-dupok: consults os.environ (PYTHON_DOM) to pick an implementation."
  - module: os.environ
    functions: [get, keys, items, values, copy]
    notes: "INV-ponad slot family: a method call on the mapping carries os.environ as its module slot, where the parent's attribute row cannot reach. The mutation half sits under env_write. `functions:`, NOT `methods:` - the analyzer emits these attribute-chain calls with NO method construct (call_construct=None on every one in the self-survey), and a methods: kind starves the method-starvation gate exactly as tokenizers.Tokenizer did (its own row carries the same lesson)."
  - module: os.path
