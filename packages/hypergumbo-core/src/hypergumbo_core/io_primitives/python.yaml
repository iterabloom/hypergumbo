# F3 PR-C: per-module closed-world flags. A module listed here with
# ``completeness: complete`` means we've audited it and confirmed
# every I/O primitive it exposes is enumerated in the boundary sections
# above (fs_read, fs_write, ...). Filter 2 in ``_compute_external_potential``
# will then skip ``external_potential`` chains for that module — those
# chains are provably noise (the call is into the module but not into
# any of its I/O primitives, so it is structurally non-I/O).
#
# *** THIS SECTION IS NOW A SECURITY BOUNDARY, NOT A NOISE FILTER. ***
# INV-buzab: ``verify-claims`` may return ``confirmed`` for a
# ``must_not_exist`` claim ONLY over modules listed here. Every module
# NOT listed blocks the claim to ``inconclusive``. Adding an entry
# therefore converts "I cannot confirm this" into "I confirm this" for
# every repo that touches the module — it is the single grant of
# confirmability, and a wrong entry is a false all-clear on a security
# claim rather than a little extra output noise.
#
# What it replaced, and why nothing weaker is acceptable. The gate used
# to accept two other kinds of evidence and both were measured open on
# this very catalogue: membership in ``stdlib_modules`` below (283 of
# those 300 modules carry no row at all — ``telnetlib``, ``ssl`` and
# ``ctypes`` each confirmed "never sends data over the network" for a
# program that exfiltrates), and the mere presence of a row for the
# module (``os`` has 40 rows and none of them is ``os.open`` /
# ``os.write`` / ``os.sendfile``, so a program writing through
# ``os.open`` confirmed "never writes to the host filesystem").
#
# The bar for an entry is the closed-world claim as written, and it
# applies to EXACTLY the module named. Matching is exact — declaring
# ``urllib`` does NOT vouch for ``urllib.request``, and it must not:
# ``urllib`` is a namespace package whose submodules have unrelated I/O
# surfaces (``urllib.request`` opens URLs, ``urllib.parse`` does pure
# string work). Declare every module you actually audited, submodules
# included.
#
# Note the smaller scope this section carries after INV-buzab: a call the
# catalogue CLASSIFIES is already examined, so these flags are needed only
# for the calls it cannot classify. An entry is worth writing where a repo
# legitimately calls names this catalogue does not enumerate.
#
# Hand-curated. NOT touched by ``scripts/refresh-stdlib-modules``. Add
# a new entry only after a deliberate audit of the module's surface;
# the ``retrieved:`` date records when that audit was performed.
#
# SPELLED ``module_completeness`` since 2026-08-15. The old
# ``stdlib_module_completeness:`` is still READ from shipped catalogues so
# no curated file breaks, but it is not accepted in a project-local
# overlay: an overlay describes THIRD-PARTY modules, so a ``stdlib_*`` key
# there asserts something about a stdlib it is not describing. The concept
# was never stdlib-specific — only its authors were.
#
# Initial worked example: ``math``. The math module has no I/O
# primitives (no fs / net / subprocess / env / ipc), and no method on
# math is plausibly an I/O entry point. Flagging it complete drops
# external_potential noise for math.sqrt / math.floor / etc. on real
# repos.
module_completeness:
  - module: math
    completeness: complete
    retrieved: "2026-05-13"

