  # 2026-09-06 WI-dupok: the ssl module had ZERO rows (INV-buzab named it as a
  # live false confirm). SSLSocket wraps socket.socket; its own methods are
  # the surface a program calls.
  - module: socket
    functions: [create_connection]
    notes: "Connects to the address (and resolves it); the module-level twin of socket.socket.connect."
  - module: ssl.SSLSocket
    methods: [send, sendall, sendto, sendmsg, write, connect, connect_ex, do_handshake]
  - module: ssl.SSLObject
    methods: [write, do_handshake]
  - module: http.client.HTTPConnection
    methods: [request, putrequest, endheaders, send]
  - module: http.client.HTTPSConnection
    methods: [request, putrequest, endheaders, send]
  - module: urllib.request
    functions: [urlopen, Request, urlretrieve]
  - module: smtplib.SMTP
    methods: [sendmail, send_message]
  - module: xmlrpc.client.ServerProxy
    notes: "Any method call on ServerProxy triggers an XML-RPC network request"
  - module: ftplib.FTP
    methods: [storbinary, storlines, sendcmd]
  # asyncio networking
  - module: asyncio
    functions: [open_connection, create_connection]
    notes: "asyncio TCP client"
  - module: asyncio.StreamWriter
    methods: [write, writelines, close]
  # Plan C, PR A: third-party HTTP clients (requests / httpx / aiohttp,
  # plus WI-jihuj's huggingface_hub / sentence_transformers from before)
  # are no longer in the catalog. The catalog is strictly stdlib I/O
  # primitives — anything else creates a maintenance treadmill (one
  # entry per popular wrapper, no principled stopping point). The
  # structural answer is the external_potential bucket (Plan C, PR C):
  # tier-3 boundary calls surface as their own bucket, sub-grouped by
  # is_stdlib, without the catalog having to enumerate them. See
  # INV-miniz / Plan C / stop-stripping plan PRs for the rationale.

net_recv:
  - module: socket.socket
    methods: [recv, recvfrom, recv_into, recvmsg, accept]
  - module: ssl.SSLSocket
    methods: [recv, recvfrom, recv_into, recvfrom_into, recvmsg, recvmsg_into, read, accept]
    notes: "2026-09-06 WI-dupok. accept returns the peer's connection (peer-chosen, as socket.socket.accept)."
  - module: ssl.SSLObject
    methods: [read]
  - module: ssl
    functions: [get_server_certificate]
    notes: "Connects and returns the certificate the far side presented -- content the far side chose (ADR-0049)."
  - module: ftplib.FTP
    methods: [retrbinary, retrlines]
  - module: asyncio.StreamReader
    methods: [read, readline, readexactly, readuntil]

# ADR-0049 DEFERRED CROSSINGS. The call ARRANGES a crossing whose data arrives
# in a scope it does not name; net_listen mints no taint and shadows net_recv,
# so the crossing is DISCLOSED rather than either minted or silently dropped.
net_listen:
  - module: socket
    functions: [create_server]
    notes: "2026-09-06 WI-dupok. SETUP (ADR-0049): binds and listens, returns the listening socket; the bytes arrive through socket.socket.accept / recv, which stay net_recv."
  - module: http.server.HTTPServer
    methods: [serve_forever, handle_request]
    notes: >-
      LAUNCH (ADR-0049 ruling 4 row 2, measurement 0010). Blocks and serves;
      returns None. The request reaches the handler class the server was
      constructed with. socket.socket.accept and .recv stay net_recv and carry
      the real receive -- the represented-crossing probe confirms accept still
      fires after this move.
  - module: socketserver.TCPServer
    methods: [serve_forever, handle_request]
  - module: xmlrpc.server.SimpleXMLRPCServer
    methods: [serve_forever, handle_request]
  - module: asyncio
    functions: [start_server, start_unix_server]
    notes: >-
      SETUP. Returns a Server object; the bytes arrive at the client-connected
      callback, and asyncio.StreamReader.read* -- still net_recv -- is where a
      program reads them.

ipc_send:
  # ---------------------------------------------------------------
  # 2026-08-15 stdlib climb (INV-dabuf path-out). Every row below was a
  # measured unmatched call target on hypergumbo's own artifact-scoped
  # self-survey, or a peer required so its module's completeness entry
  # stays honest. os.open + os.write close INV-zubuh's measured
  # false-confirm pair. Slot-family rows (os.environ.*, sys.stdout.*)
  # resolve INV-ponad: the parent's attribute row speaks about REFERENCE
  # edges, these speak about CALL edges on the attribute object.
  # ---------------------------------------------------------------
  - module: os
    functions: [kill, killpg]
    notes: "Signalling another process."
  - module: multiprocessing.Queue
    methods: [put, put_nowait]
  - module: multiprocessing.Pipe
    methods: [send, send_bytes]
  - module: multiprocessing.Process
    methods: [kill, terminate]
    notes: "2026-09-06 WI-dupok: signals the child (os.kill's row is the module-level form); start() is the launch and sits under subprocess."

logging:
  # 2026-09-06 WI-dupok: writers to sys.stdout / sys.stderr by default
  # (python's print precedent). A stream argument the caller supplies is
  # the caller's I/O; the default is what makes these rows.
  - module: pprint
    functions: [pprint, pp]
  - module: pprint.PrettyPrinter
    methods: [pprint]
  - module: traceback
    functions: [print_tb, print_exception, print_exc, print_last, print_stack, print_list]
  - module: traceback.TracebackException
    methods: [print]
  - module: pstats.Stats
    methods: [print_stats, print_callers, print_callees]
  - module: unittest
    functions: [main]
    notes: "The runner writes results to stderr; TextTestRunner.run is the class form."
  - module: unittest.TextTestRunner
    methods: [run]
  - module: doctest
    functions: [testmod, run_docstring_examples]
    notes: "Reports to stdout; testfile is rowed fs_read for its open and reports the same way."
  - module: doctest.DocTestRunner
    methods: [run, summarize]
  - module: optparse.OptionParser
    methods: [print_help, print_usage, print_version, error, exit]
    notes: "help/usage/version to stdout, error/exit to stderr (argparse's twins)."
  - module: cProfile.Profile
    methods: [print_stats]
  # ---------------------------------------------------------------
  # 2026-08-15 stdlib climb (INV-dabuf path-out). Every row below was a
  # measured unmatched call target on hypergumbo's own artifact-scoped
  # self-survey, or a peer required so its module's completeness entry
  # stays honest. os.open + os.write close INV-zubuh's measured
  # false-confirm pair. Slot-family rows (os.environ.*, sys.stdout.*)
  # resolve INV-ponad: the parent's attribute row speaks about REFERENCE
  # edges, these speak about CALL edges on the attribute object.
  # ---------------------------------------------------------------
  - module: sys.stdout
    functions: [write, writelines, flush]
    notes: "INV-ponad slot family. functions:, not methods: - see the os.environ note."
  - module: sys.stderr
    functions: [write, writelines, flush]
  - module: sys
    functions: [displayhook, excepthook, unraisablehook, breakpointhook]
    notes: "The interpreter hooks that write the standard streams - what keeps sys's completeness entry honest."
  - module: builtins
    functions: [print, breakpoint, copyright, credits]
    notes: >-
      INV-bofab. The vocabulary's own rule -- a module that PRINTS does I/O --
      applied to the module every bare builtin call names since INV-foluz.
      print writes sys.stdout; breakpoint delegates to sys.breakpointhook
      (rowed above); copyright and credits are site's _Printer objects and
      print. The builtins completeness entry rests on these rows.
  - module: builtins
    functions: [license]
    simultaneous: true
    notes: >-
      INV-bofab. site's _Printer: on first call it OPENS its LICENSE.txt
      candidates (the fs_read twin) and then prints them. Both happen in the
      one call, hence `simultaneous` on both rows.
  - module: builtins
    functions: [help]
    boundary_ruling: unruled
    notes: >-
      INV-bofab. help() renders through pydoc to stdout on every call; on a
      tty pydoc.getpager hands the text to pipepager, which is
      subprocess.Popen(cmd, shell=True) over less/more (the subprocess twin).
      Not `simultaneous` -- the launch is conditioned on the ENVIRONMENT, not
      the arguments -- and not `call_site_undecidable`, because both can be
      true at once. `unruled` on both rows, per INV-vaduk: a visible open
      question beats an absent one. The question is stated in
      test_multi_boundary_ruling's EXPECTED_UNRULED and owned by WI-kapak.
      A THIRD surface is disclosed here and NOT rowed: help() with no
      argument runs pydoc's interactive loop, which reads stdin through
      input(). help returns None, so nothing the far side chose reaches
      the caller, and ADR-0049 says never mint -- an ipc_recv row would
      mint an untrusted_input source at a call that hands the program
      nothing.
  - module: warnings
    functions: [warn, warn_explicit, showwarning]
    notes: "showwarning writes stderr; warn reaches it. The audit's disqualifier for warnings, now a row."
  - module: typing
    functions: [reveal_type]
    notes: "The one I/O surface in typing - writes to stderr. The survey probe's catch."
  - module: argparse.ArgumentParser
    methods: [print_help, print_usage, error]
    notes: "error prints usage to stderr then raises SystemExit."
  - module: logging
    functions: [debug, info, warning, error, critical, exception, log, basicConfig, StreamHandler]
  - module: base64
    functions: [main]
    notes: "The python -m base64 entry point; opens files and writes stdout. The survey probe's catch."
  - module: xml.etree.ElementTree
    functions: [dump]
  # WI-tolif: stdio writes are terminal output / log destinations, not
  # inter-process communication in any threat-model sense — same reason
  # Go's log/slog/fmt sit in `logging` rather than `ipc_send`.  Keeping
  # them under ipc_send produced 70+ false positives per repo
  # (hypergumbo's own self-audit on 2026-04-23 surfaced this).
  - module: sys
    attributes: [stdout, stderr]
    notes: "Terminal / log output; redirectable to file or pipe but not by itself an IPC channel"

ipc_recv:
  # ---------------------------------------------------------------
  # 2026-08-15 stdlib climb (INV-dabuf path-out). Every row below was a
  # measured unmatched call target on hypergumbo's own artifact-scoped
  # self-survey, or a peer required so its module's completeness entry
  # stays honest. os.open + os.write close INV-zubuh's measured
  # false-confirm pair. Slot-family rows (os.environ.*, sys.stdout.*)
  # resolve INV-ponad: the parent's attribute row speaks about REFERENCE
  # edges, these speak about CALL edges on the attribute object.
  # ---------------------------------------------------------------
  - module: builtins
    functions: [input]
    notes: >-
      INV-muvis: reads STANDARD INPUT unconditionally, so the crossing is known at the call site. Stream-taking siblings stay where they are -- their boundary is a property of the argument (INV-bagok / INV-zumin class (b)), and moving them would assert an IPC crossing for every read over a file. input() reads a line from stdin and is the canonical untrusted
      source in Python. INV-foluz is the other half: py.py emits no call edge
      for a bare input(), because BUILTIN_CONSTRUCTOR_NAMES is a hardcoded
      frozenset({"open"}) rather than the catalogue-derived set that item's
      root_cause describes -- so this row alone does not make the call visible.
  - module: sys.stdin
    functions: [read, readline, readlines]
    notes: "INV-ponad slot family; consistent with the sys attribute row in this section. functions:, not methods: - see the os.environ note."
  - module: subprocess
    functions: [check_output, getoutput, getstatusoutput]
    simultaneous: true
    notes: >-
      INV-lozat / ADR-0049 ruling 1: returns the CHILD'S output, so the call is
      a transfer as well as a launch and mints an untrusted_input source. Both
      facts are true at once (the `scala.sys.process.Process.apply` shape), so
      `simultaneous` is required -- without it `io_boundaries` is unwritten and
      the subprocess chain loses the race to `ipc_recv`, which parses first.
      The siblings that return only an exit status or a HANDLE stay
      launch-only: a status is not the child's message, and a handle is a
      crossing that has not happened yet (the ADR-0049 deferred shape).
      Follows rust.yaml's `Child.wait_with_output`, which follows python.yaml's
      `os.wait`.
  - module: os
    functions: [wait, waitpid, wait3, wait4, waitid]
    notes: "Reaping a child collects its exit status - data received from another process."
  - module: shlex
    functions: [shlex]
    notes: "shlex(instream=None) defaults to READING sys.stdin - the survey probe's catch."
  - module: sys
    attributes: [stdin]
  - module: multiprocessing.Queue
    methods: [get, get_nowait]
  - module: multiprocessing.Pipe
    methods: [recv, recv_bytes]

subprocess:
  - module: multiprocessing.Process
    methods: [start]
    notes: "2026-09-06 WI-dupok: forks or spawns the child (Popen in the spawn context); the launch site of every multiprocessing worker."
  - module: multiprocessing
    functions: [Pool]
    notes: "Pool's constructor starts its workers."
  # ---------------------------------------------------------------
  # 2026-08-15 stdlib climb (INV-dabuf path-out). Every row below was a
  # measured unmatched call target on hypergumbo's own artifact-scoped
  # self-survey, or a peer required so its module's completeness entry
  # stays honest. os.open + os.write close INV-zubuh's measured
  # false-confirm pair. Slot-family rows (os.environ.*, sys.stdout.*)
  # resolve INV-ponad: the parent's attribute row speaks about REFERENCE
  # edges, these speak about CALL edges on the attribute object.
  # ---------------------------------------------------------------
  - module: subprocess
    functions: [getoutput, getstatusoutput]
    simultaneous: true
    notes: >-
      Shell-string conveniences the run/Popen rows did not cover.

      INV-lozat: both RETURN the command's output (`getstatusoutput` as
      `(status, output)`), so they also carry an ipc_recv row and mint an
      untrusted_input source. See that row for why `simultaneous` is
      required here rather than optional.
  - module: builtins
    functions: [help]
    boundary_ruling: unruled
    notes: >-
      INV-bofab. The pager half of help(): pydoc.pipepager launches less/more
      via subprocess.Popen(shell=True) when stdout is a tty. See the logging
      twin for why this pair is `unruled` rather than `simultaneous`.
  - module: asyncio
    functions: [create_subprocess_exec, create_subprocess_shell]
    notes: "asyncio carried net rows and NO subprocess rows - the one-boundary-vouches-for-all shape INV-zubuh measured on os."
  - module: os
    functions: [posix_spawn, posix_spawnp, startfile]
  - module: subprocess
    functions: [run, Popen, call, check_call]
    notes: >-
      INV-lozat, on why `check_output` left this row and these four did
      not. `call` and `check_call` return a returncode; `Popen` returns a
      HANDLE, which is an ADR-0049 deferred crossing rather than a
      transfer. `run` is the contested one: its `CompletedProcess.stdout`
      is the child's bytes ONLY when the caller passed `capture_output=` or
      `stdout=PIPE`, and the catalogue matches on name, not on keyword
      arguments. Rowing it would mint a source at every `subprocess.run`
      call in the corpus, most of which capture nothing -- so it stays out
      until the argument shape can be read, and that omission is disclosed
      rather than silent.
  - module: subprocess
    functions: [check_output]
    simultaneous: true
    notes: >-
      INV-lozat / ADR-0049 ruling 1: returns the CHILD'S output, so the call is
      a transfer as well as a launch and mints an untrusted_input source. Both
      facts are true at once (the `scala.sys.process.Process.apply` shape), so
      `simultaneous` is required -- without it `io_boundaries` is unwritten and
      the subprocess chain loses the race to `ipc_recv`, which parses first.
      The siblings that return only an exit status or a HANDLE stay
      launch-only: a status is not the child's message, and a handle is a
      crossing that has not happened yet (the ADR-0049 deferred shape).
      Follows rust.yaml's `Child.wait_with_output`, which follows python.yaml's
      `os.wait`.
  - module: os
    functions: [system, popen, execl, execle, execlp, execlpe, execv, execve, execvp, execvpe, spawnl, spawnle, spawnlp, spawnlpe, spawnv, spawnve, spawnvp, spawnvpe]
  - module: os
    functions: [fork, forkpty]
    notes: "Unix only"

env_read:
  - module: sysconfig
