# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for Python
#
# Maps stdlib functions/methods to I/O boundary types. Used by the
# boundary-tagging pass to identify which call edges reach system I/O.
# Covers Python 3.10+ stdlib. Third-party libraries (requests, aiohttp,
# etc.) are detected transitively — they ultimately call these primitives.
language: python

# Method names that are too generic to match without module context.
# Python duck-typing means .read(), .write(), .close() appear on many objects.
ambiguous_names:
  - read          # file.read vs io.BytesIO.read, any .read()
  - readline      # file.readline vs any .readline()
  - readlines     # file.readlines vs any .readlines()
  - write         # file.write vs io.StringIO.write, any .write()
  - writelines    # file.writelines vs any .writelines()
  - close         # file.close vs any .close()
  - send          # socket.send vs generator.send, queue.send
  - recv          # socket.recv vs multiprocessing.Pipe.recv
  - get           # requests.get vs dict.get, queue.get
  - post          # requests.post vs any .post()
  - put           # requests.put vs dict.__setitem__, queue.put
  - delete        # requests.delete vs dict.__delitem__
  - head          # requests.head vs any .head()
  - patch         # requests.patch vs any .patch()
  - request       # requests.request vs any .request()
  - run           # subprocess.run vs asyncio.run, flask.Flask.run, any .run()
  - open          # builtins.open vs any .open() method
  - connect       # socket.connect vs sqlite3.connect, any .connect()
  - accept        # socket.accept vs any .accept()
  - listen        # socket.listen vs any .listen()
  - bind          # socket.bind vs any .bind()
  - start         # Process.start vs any .start()
  - next          # Scanner.next vs builtins.next()
  - dump          # json.dump vs any .dump()
  - input         # fileinput.input vs builtins.input (not IO boundary)

fs_read:
  - module: builtins
    functions: [open]
    notes: "Dual-classified: fs_read when mode is 'r'/'rb' (default), fs_write when 'w'/'a'/'x'"
  - module: pathlib.Path
    methods: [read_text, read_bytes, stat, exists, is_file, is_dir, iterdir, glob, rglob]
  - module: os
    functions: [listdir, scandir, stat, access, readlink, walk]
  - module: os.path
    functions: [exists, isfile, isdir, getsize, getmtime, getatime, realpath, abspath]
  - module: shutil
    functions: [which, disk_usage]
  - module: importlib.resources
    functions: [read_text, read_binary, files]
  - module: io
    functions: [open]
    notes: "io.open is the same as builtins.open"
  - module: fileinput
    functions: [input, FileInput]

fs_write:
  - module: builtins
    functions: [open]
    notes: "Dual-classified: fs_write when mode is 'w'/'wb'/'a'/'x'"
  - module: pathlib.Path
    methods: [write_text, write_bytes, mkdir, touch, unlink, rename, replace, symlink_to, rmdir, chmod]
  - module: os
    functions: [mkdir, makedirs, remove, unlink, rename, replace, symlink, link, chmod, chown, rmdir]
  - module: shutil
    functions: [copy, copy2, copytree, move, rmtree, make_archive, unpack_archive]
  - module: tempfile
    functions: [mkstemp, mkdtemp, NamedTemporaryFile, TemporaryDirectory, TemporaryFile]
  - module: json
    functions: [dump]
    notes: "json.dump writes to a file object; json.dumps returns a string (not I/O)"
  - module: pickle
    functions: [dump]
  - module: csv
    functions: [writer]
    notes: "csv.writer wraps a file object for writing"

net_send:
  - module: socket.socket
    methods: [send, sendto, sendall, sendmsg, connect, connect_ex]
  - module: http.client.HTTPConnection
    methods: [request, putrequest, endheaders, send]
  - module: http.client.HTTPSConnection
    methods: [request, putrequest, endheaders, send]
  - module: urllib.request
    functions: [urlopen, Request, urlretrieve]
  - module: smtplib.SMTP
    methods: [sendmail, send_message]
  - module: xmlrpc.client.ServerProxy
    notes: "Any method call on ServerProxy triggers an XML-RPC network request"
  - module: ftplib.FTP
    methods: [storbinary, storlines, sendcmd]
  # asyncio networking
  - module: asyncio
    functions: [open_connection, create_connection]
    notes: "asyncio TCP client"
  - module: asyncio.StreamWriter
    methods: [write, writelines, close]
  # Popular HTTP clients
  - module: requests
    functions: [get, post, put, delete, head, patch, request]
    notes: "requests library (most popular Python HTTP client)"
  - module: requests.Session
    methods: [get, post, put, delete, head, patch, request, send]
  - module: aiohttp.ClientSession
    methods: [get, post, put, delete, head, patch, request, ws_connect]
    notes: "aiohttp async HTTP client"
  - module: httpx.Client
    methods: [get, post, put, delete, head, patch, request, send]
    notes: "httpx sync/async HTTP client"
  - module: httpx.AsyncClient
    methods: [get, post, put, delete, head, patch, request, send]
  # WI-jihuj: high-level network clients that wrap requests/httpx but live one
  # layer above what the io-boundary tracer can see by walking edges in
  # third-party code. Covers the embeddings extra's HF Hub download surface
  # (sentence_transformers.SentenceTransformer constructor → hf_hub).
  - module: huggingface_hub
    functions: [snapshot_download, hf_hub_download]
    notes: "HF Hub model/file download"
  - module: huggingface_hub.HfApi
    methods: [model_info, list_repo_files, download_file]
  - module: sentence_transformers
    functions: [SentenceTransformer]
    notes: "Constructor downloads from HF Hub on first use (model not cached locally)"

net_recv:
  - module: socket.socket
    methods: [recv, recvfrom, recv_into, recvmsg, accept]
  - module: http.server.HTTPServer
    methods: [serve_forever, handle_request]
  - module: socketserver.TCPServer
    methods: [serve_forever, handle_request]
  - module: ftplib.FTP
    methods: [retrbinary, retrlines]
  - module: xmlrpc.server.SimpleXMLRPCServer
    methods: [serve_forever, handle_request]
  # asyncio networking
  - module: asyncio
    functions: [start_server, start_unix_server]
    notes: "asyncio TCP server"
  - module: asyncio.StreamReader
    methods: [read, readline, readexactly, readuntil]
  # Popular web frameworks
  - module: flask.Flask
    methods: [run]
    notes: "Flask development server"
  - module: django.core.management
    functions: [execute_from_command_line]
    notes: "Django management command (includes runserver)"
  - module: uvicorn
    functions: [run]
    notes: "ASGI server (used by FastAPI, Starlette)"
  - module: aiohttp.web
    functions: [run_app]
    notes: "aiohttp web server"

ipc_send:
  - module: multiprocessing.Queue
    methods: [put, put_nowait]
  - module: multiprocessing.Pipe
    methods: [send, send_bytes]

logging:
  # WI-tolif: stdio writes are terminal output / log destinations, not
  # inter-process communication in any threat-model sense — same reason
  # Go's log/slog/fmt sit in `logging` rather than `ipc_send`.  Keeping
  # them under ipc_send produced 70+ false positives per repo
  # (hypergumbo's own self-audit on 2026-04-23 surfaced this).
  - module: sys
    attributes: [stdout, stderr]
    notes: "Terminal / log output; redirectable to file or pipe but not by itself an IPC channel"

ipc_recv:
  - module: sys
    attributes: [stdin]
  - module: multiprocessing.Queue
    methods: [get, get_nowait]
  - module: multiprocessing.Pipe
    methods: [recv, recv_bytes]

subprocess:
  - module: subprocess
    functions: [run, Popen, call, check_call, check_output]
  - module: os
    functions: [system, popen, execl, execle, execlp, execlpe, execv, execve, execvp, execvpe, spawnl, spawnle, spawnlp, spawnlpe, spawnv, spawnve, spawnvp, spawnvpe]
  - module: os
    functions: [fork, forkpty]
    notes: "Unix only"

env_read:
  - module: os
    attributes: [environ]
    functions: [getenv, get_exec_path]
  - module: sys
    attributes: [argv, executable, path, platform, version]
  - module: platform
    functions: [system, node, release, version, machine, processor, python_version]
  - module: locale
    functions: [getlocale, getdefaultlocale, getpreferredencoding]
