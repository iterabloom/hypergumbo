# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for Python
#
# Maps stdlib functions/methods to I/O boundary types. Used by the
# boundary-tagging pass to identify which call edges reach system I/O.
# Covers Python 3.10+ stdlib.
#
# THIRD-PARTY LIBRARIES ARE NOT COVERED HERE, AND ARE NOT DETECTED
# TRANSITIVELY. This header used to claim they were — "requests, aiohttp,
# etc. ... ultimately call these primitives" — which is false in the normal
# case and was measured as such (INV-fotav): hypergumbo analyzes YOUR
# repository, not site-packages, so there are no edges into requests'
# internals and its own socket calls are never seen. A file doing
# `requests.post(url, data=secret)` produced ZERO net_send chains while
# open()/os.environ controls fired in the same run.
#
# The stdlib scope itself is deliberate and stays (ADR-0016 §27: "a curated
# list of stdlib functions, not an unbounded set of library APIs") — owning
# every third-party API surface is the maintenance burden that ADR declined.
# Supply third-party primitives through a PROJECT-LOCAL OVERLAY instead:
#     hypergumbo io-boundaries . --io-primitives my-overlay.yaml
# or `extra_catalogs: io_primitives:` in a claims file. Worked example:
# hypergumbo_core/io_primitives_overlays/python-http-clients.yaml, which
# ships in the wheel and loads by default (ADR-0047).
language: python

# Plan C, PR B: this is the worked-example catalog — Python's stdlib
# is enumerated end-to-end from the official documentation index plus
# ``sys.stdlib_module_names``. Promotion to ``status: provenance_declared``
# requires ``stdlib_provenance`` to point at an allowlisted
# documentation host (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in
# io_boundary.py).
#
# F3 PR-C: ``stdlib_modules`` (below) is populated from
# ``sys.stdlib_module_names`` of the version pinned here. The
# operator script ``scripts/refresh-stdlib-modules python --version
# X.Y`` regenerates it deterministically; the closed-world
# ``completeness:`` flags inside ``stdlib_modules`` are hand-curated
# and not touched by the script.
status: provenance_declared
stdlib_provenance:
  source_url: https://docs.python.org/3.12/library/index.html
  version: "3.12"
  retrieved: "2026-05-14"
  notes: |
    Python stdlib I/O primitives derived from docs.python.org's
    library index for Python 3.12, cross-checked against
    ``sys.stdlib_module_names``. Non-IO stdlib symbols are not yet
    enumerated in stdlib_other — populated incrementally as needed
    by the PR C external_potential filter.

# Method names that are too generic to match without module context.
# Python duck-typing means .read(), .write(), .close() appear on many objects.
ambiguous_names:
  - read          # file.read vs io.BytesIO.read, any .read()
  - readline      # file.readline vs any .readline()
  - readlines     # file.readlines vs any .readlines()
  - write         # file.write vs io.StringIO.write, any .write()
  - writelines    # file.writelines vs any .writelines()
  - close         # file.close vs any .close()
  - send          # socket.send vs generator.send, queue.send
  - recv          # socket.recv vs multiprocessing.Pipe.recv
  - exit          # optparse.OptionParser.exit vs builtin exit(); WI-dupok 2026-09-06 -- a bare exit() is the builtin, the row matches only with the module hint
  - get           # requests.get vs dict.get, queue.get
  - post          # requests.post vs any .post()
  - put           # requests.put vs dict.__setitem__, queue.put
  - delete        # requests.delete vs dict.__delitem__
  - head          # requests.head vs any .head()
  - patch         # requests.patch vs any .patch()
  - request       # requests.request vs any .request()
  - run           # subprocess.run vs asyncio.run, flask.Flask.run, any .run()
  - open          # builtins.open vs any .open() method
  - connect       # socket.connect vs sqlite3.connect, any .connect()
  - accept        # socket.accept vs any .accept()
  - listen        # socket.listen vs any .listen()
  - bind          # socket.bind vs any .bind()
  - start         # Process.start vs any .start()
  - next          # Scanner.next vs builtins.next()
  - dump          # json.dump vs any .dump()
  - input         # fileinput.input (fs_read) vs builtins.input (ipc_recv):
                  # BOTH are boundaries, so a bare .input() must not pick one
  # INV-maluk: Path.replace and Path.rename are method primitives whose
  # short names collide with str / bytes / list / dict.replace and various
  # .rename() helpers (e.g. pandas DataFrame.rename). The 2026-04-23 audit
  # found 40+ false-positive fs_write chains in hypergumbo's own self-
  # analysis from string-normalization sites like name.replace("-", "_").
  - replace       # pathlib.Path.replace / os.replace vs str.replace, bytes.replace
  - rename        # pathlib.Path.rename / os.rename vs DataFrame.rename, dict-like .rename()
  # INV-mivud. The seven below were DERIVED, not hand-picked: every catalogued
  # python primitive whose short name also names a builtin or a dict/list/set/
  # str method, and which was not already suppressed. Hand-picking is what left
  # the gap — the item was filed for `copy` alone, and the campaign plan then
  # guessed "all seven shutil peers", which is wrong in both directions:
  # copytree/rmtree/make_archive collide with nothing and must stay matchable,
  # while five Django ORM names that DO collide were missed entirely.
  #
  # These fire only when the edge carries NO module hint. A resolved
  # `from os import remove` keeps its `os` hint and still matches; what is
  # suppressed is a bare unresolved `remove(...)`, where the analysis genuinely
  # cannot tell os.remove from list.remove and WI-razol's policy is to decline.
  - all           # django.db.models.all vs builtins.all()
  - copy          # shutil.copy vs dict.copy, list.copy  (the filed INV-mivud case)
  - count         # django.db.models.count vs list.count, str.count
  - filter        # django.db.models.filter vs builtins.filter()
  - remove        # os.remove vs list.remove, set.remove
  - update        # django.db.models.update vs dict.update, set.update
  - values        # django.db.models.values vs dict.values
  # 2026-08-15 stdlib climb. Two populations, one lesson. The first six were
  # flagged mechanically by test_ambiguous_names_completeness (dict-method
  # collisions on the new os.environ rows). The rest were flagged by a LIVE
  # bite: the new zipfile.Path row reached a locally-defined class named Path
  # through the ungated bare-name match (INV-fazim's shape) and minted a false
  # fs_read - caught by test_py_pathlib_constructor_typing within the same
  # run. Every name here that is also a new row's short name is common enough
  # as a bare local call that the same bite is guaranteed somewhere in a real
  # corpus. Suppression is bare-name ONLY: with module context every row
  # below still matches (the `file` precedent).
  - setdefault    # os.environ.setdefault vs dict.setdefault
  - pop           # os.environ.pop vs dict.pop, list.pop, set.pop
  - popitem       # os.environ.popitem vs dict.popitem
  - clear         # os.environ.clear vs dict.clear, list.clear, set.clear
  - keys          # os.environ.keys vs dict.keys
  - items         # os.environ.items vs dict.items
  - Path          # zipfile.Path vs pathlib.Path vs any local Path class (the live bite)
  - main          # base64.main vs every repo's own main()
  - info          # logging.info vs any logger-ish local helper
  - debug         # logging.debug vs same
  - warning       # logging.warning vs same
  - error         # logging.error / ArgumentParser.error vs same
  - critical      # logging.critical vs same
  - exception     # logging.exception vs same
  - log           # logging.log vs math.log, any local log()
  - warn          # warnings.warn vs any local warn()
  - wait          # os.wait vs Popen.wait, Event.wait, Condition.wait
  - kill          # os.kill vs Popen.kill, Process.kill
  - parse         # xml.etree.ElementTree.parse vs argparse-ish local parse()
  - version       # importlib.metadata.version vs any local version()
  - metadata      # importlib.metadata.metadata vs common attribute-ish name
  - files         # importlib.metadata.files vs common local name
  - platform      # platform.platform vs the module name used bare
  # INV-bofab. Derived by the same mechanical rule as the INV-mivud block
  # above (test_ambiguous_names_completeness flagged all six on the day they
  # landed): the rows added when `builtins` was enumerated are builtins BY
  # CONSTRUCTION, so each short name collides with itself. Suppression still
  # fires only on a HINT-LESS bare call -- every edge INV-foluz emits for a
  # bare builtin carries `builtins` in the module slot and matches through
  # the module path (the `open` / `input` precedent above). What a hint-less
  # match would have fabricated is a logging crossing at a repo's own
  # `help()` / `credits()` helper or a `self.print(...)` method the analysis
  # could not resolve. test_ambiguous_names_completeness pins both
  # directions: hinted still matches, hint-less is refused.
  - print         # builtins.print vs any local print() / .print() method
  - breakpoint    # builtins.breakpoint vs any local breakpoint()
  - copyright     # builtins.copyright vs any local copyright() or attribute
  - credits       # builtins.credits vs any local credits()
  - license       # builtins.license vs any local license() or attribute
  - help          # builtins.help vs any local help() / .help() (CLI frameworks)

fs_read:
  # ---------------------------------------------------------------
  # 2026-09-06 WI-dupok, third completeness leg. Rows found by the python
  # probe (~/hypergumbo_lab_notebook/dupok_python_09062026/probe_py.py:
  # public members one level deep, source scanned for open( / os. /
  # sys.std* / socket signals; NATIVE refuses) over the 41 stdlib module
  # strings the 08-24 scope audit found uncatalogued, then read at the
  # flagged member. Reads from a CALLER-OPENED object are not rowed (the
  # open is the caller's I/O, tomllib's rule); a path argument is.
  - module: glob
    functions: [glob, iglob]
    notes: "Walks directories (os.scandir) for the pattern; escape() is pure and unrowed."
  - module: mimetypes
    functions: [init, read_mime_types, guess_type]
    notes: "init/read_mime_types open the system mime.types files; guess_type triggers init on first use. The MimeTypes class's read/readfp are the same surface."
  - module: mimetypes.MimeTypes
    methods: [read, readfp]
  - module: filecmp
    functions: [cmp, cmpfiles]
    notes: "stat + read of both files; dircmp is the class form."
  - module: filecmp.dircmp
    methods: [report, report_partial_closure, report_full_closure]
  - module: sysconfig
    functions: [get_config_h_filename, get_makefile_filename, is_python_build, get_config_vars, get_config_var]
    notes: "Stat and read the build's config files; get_platform reads os.environ (env_read row)."
  - module: pstats.Stats
    methods: [load_stats]
    notes: "Reads a stats file by path; dump_stats is the write and sits under fs_write with cProfile's run / runctx / Profile.dump_stats."
  - module: xml.dom.minidom
    functions: [parse]
    notes: "parse(path) opens the path (parseString is pure; parse of a caller-opened object is the caller's read, tomllib's rule) -- the ElementTree precedent."
  - module: unittest.TestLoader
    methods: [discover]
    notes: "Walks the start directory for test modules."
  - module: optparse.Values
    methods: [read_file, read_module]
  - module: doctest
    functions: [testfile]
    notes: "Opens the named file; DocFileTest/DocFileSuite build cases over the same open."
  - module: codecs
    functions: [open]
    notes: "codecs.open(path, mode) opens a path, builtins.open's shape: fs_read AND fs_write, settled by io_mode (python's producer knows codecs.open's mode sits at positional 1 like open)."
  - module: ctypes
    functions: [CDLL, PyDLL, OleDLL, WinDLL]
    notes: "A shared object is loaded from a PATH (dlopen) -- a filesystem read that then runs foreign code; INV-buzab's own live false confirm. cdll.LoadLibrary is the method form."
  - module: ctypes.cdll
    methods: [LoadLibrary]
  - module: ctypes.util
    functions: [find_library]
    notes: "Searches the library path on disk (and shells out to ldconfig / gcc on some platforms -- disclosed here, rowed as the read)."
  - module: ssl.SSLContext
    methods: [load_cert_chain, load_verify_locations, load_dh_params, load_default_certs]
    notes: "Read certificate / key material from paths (or the system store)."
  # ---------------------------------------------------------------
  # 2026-08-15 stdlib climb (INV-dabuf path-out). Every row below was a
  # measured unmatched call target on hypergumbo's own artifact-scoped
  # self-survey, or a peer required so its module's completeness entry
  # stays honest. os.open + os.write close INV-zubuh's measured
  # false-confirm pair. Slot-family rows (os.environ.*, sys.stdout.*)
  # resolve INV-ponad: the parent's attribute row speaks about REFERENCE
  # edges, these speak about CALL edges on the attribute object.
  # ---------------------------------------------------------------
  - module: os
    functions: [open, read, pread, preadv, readv, fdopen, lstat, fstat, statvfs, fstatvfs, pathconf, fpathconf, listxattr, getxattr, ttyname, isatty, fwalk]
    notes: "os.open is dual-classified like builtins.open: fs_read here, fs_write under write flags. fdopen wraps an fd the caller opened; the wrap is where a file object enters the flow."
  - module: pathlib.Path
    methods: [open, resolve, readlink, samefile, lstat, owner, group, walk, is_symlink, is_mount, is_socket, is_fifo, is_block_device, is_char_device]
    notes: "open is dual-classified. resolve/readlink follow symlinks; the is_* family stats the filesystem."
  - module: os.path
    functions: [islink, lexists, getctime, samefile]
  - module: posixpath
    functions: [exists, isfile, isdir, islink, lexists, getsize, getmtime, getatime, getctime, realpath, samefile]
    notes: "posixpath IS os.path on POSIX; a call addressed through this name must classify identically. `abspath` REMOVED (INV-nular F7, WI-jojaf, 2026-09-06): it normalises against os.getcwd() and touches no file; realpath, which follows symlinks, stays."
  - module: gzip
    functions: [open, GzipFile]
    notes: "Dual-classified: mode-dependent, like builtins.open."
  - module: tarfile
    functions: [open, TarFile]
    notes: "Dual-classified: mode-dependent."
  - module: zipfile
    functions: [ZipFile, Path]
    notes: "Dual-classified: mode-dependent. zipfile.Path is the archive-membership path class, not pathlib's."
  - module: io
    functions: [open_code, FileIO]
    notes: "FileIO's CONSTRUCTOR opens the path; dual-classified."
  - module: importlib
    functions: [import_module, reload]
  - module: importlib.util
    functions: [find_spec, spec_from_file_location]
  - module: importlib.metadata
    functions: [version, metadata, distribution, distributions, entry_points, files, requires]
  - module: inspect
    functions: [getsource, getsourcefile, getsourcelines, getfile, getmodule]
  - module: xml.etree.ElementTree
    functions: [parse, iterparse]
  - module: argparse
    functions: [FileType]
    notes: "FileType returns an opener; classified on the strength of what the returned callable does. The audit's own disqualifier for argparse, now a row."
  - module: builtins
    functions: [open]
    notes: "Dual-classified: fs_read when mode is 'r'/'rb' (default), fs_write when 'w'/'a'/'x'"
  - module: builtins
    functions: [license]
    simultaneous: true
    notes: >-
      INV-bofab. The fs_read half of site's license(): _Printer.__setup opens
      LICENSE.txt candidates on first call, then prints (the logging twin).
  - module: pathlib.Path
    methods: [read_text, read_bytes, stat, exists, is_file, is_dir, iterdir, glob, rglob]
  - module: os
    functions: [listdir, scandir, stat, access, readlink, walk]
  - module: os.path
    functions: [exists, isfile, isdir, getsize, getmtime, getatime, realpath]
    notes: "`abspath` REMOVED (INV-nular F7, WI-jojaf, 2026-09-06): string arithmetic against os.getcwd(), no file touched; realpath stays."
  - module: shutil
    functions: [which, disk_usage]
  - module: importlib.resources
    functions: [read_text, read_binary, files]
  - module: io
    functions: [open]
    notes: "io.open is the same as builtins.open"
  - module: fileinput
    functions: [input, FileInput]
  - module: file
    methods: [read, readline, readlines]
    notes: |
      WI-fuvuj: synthetic module for the file object returned by open().
      Receiver-type inference in py.py types `f = open(p)` as the `file`
      module so f.read()/f.readline()/f.readlines() classify here via the
      module-filter path (untyped receivers stay suppressed by ambiguous_names).

fs_write:
  # 2026-09-06 WI-dupok (see the fs_read block for the method).
  - module: codecs
    functions: [open]
    notes: "The write half of codecs.open's dual declaration; see fs_read."
  - module: cProfile
    functions: [run, runctx]
    notes: "Write the profile to the optional filename argument; Profile.dump_stats is the method form. WRITE only -- an earlier draft also declared these fs_read, which the mode-parity gate refused: a dual row with no mode argument is a mode-decided primitive no analyzer can settle."
  - module: cProfile.Profile
    methods: [dump_stats]
  - module: pstats.Stats
    methods: [dump_stats]
  # ---------------------------------------------------------------
  # 2026-08-15 stdlib climb (INV-dabuf path-out). Every row below was a
  # measured unmatched call target on hypergumbo's own artifact-scoped
  # self-survey, or a peer required so its module's completeness entry
  # stays honest. os.open + os.write close INV-zubuh's measured
  # false-confirm pair. Slot-family rows (os.environ.*, sys.stdout.*)
  # resolve INV-ponad: the parent's attribute row speaks about REFERENCE
  # edges, these speak about CALL edges on the attribute object.
  # ---------------------------------------------------------------
  - module: os
    functions: [open, write, pwrite, pwritev, writev, fsync, fdatasync, ftruncate, truncate, fchmod, fchown, lchown, utime, mkfifo, mknod, chroot, setxattr, removexattr, sendfile, splice, copy_file_range, posix_fallocate]
    notes: "The descriptor-level surface whose absence let os.open + os.write confirm 'never writes to the host filesystem' (INV-zubuh). Descriptor PLUMBING (dup, dup2, pipe, openpty, memfd_create, eventfd) is deliberately NOT here: it duplicates access to already-open descriptors and moves no data, and an fs_write row for dup2 turned cli.py's own stdout-shutdown redirect into a false unsanitized host_fs finding (the wrapper-discipline gate caught it). The completeness entry vouches for plumbing instead."
  - module: pathlib.Path
    methods: [open, hardlink_to, lchmod]
  - module: file
    methods: [write, writelines, truncate]
    notes: "WI-fuvuj's synthetic module carried the READ half only, so f = open(p); f.write(secret) classified the open and lost the write. flush is DELIBERATELY not a row: it commits writes already counted, and a flush row made every bare .flush() in runtime code read as a direct unwrapped fs-write (the wrapper-discipline gate caught cli.py within the run)."
  - module: fcntl
    functions: [fcntl, ioctl, flock, lockf]
    notes: "Descriptor control and advisory locks."
  - module: gzip
    functions: [open, GzipFile]
  - module: tarfile
    functions: [open, TarFile]
  - module: zipfile
    functions: [ZipFile]
  - module: io
    functions: [FileIO]
  - module: shutil
    functions: [copyfile, copymode, copystat, chown]
  - module: tempfile
    functions: [SpooledTemporaryFile]
  - module: logging
    functions: [FileHandler]
    notes: "The handler CONSTRUCTOR opens the log file."
  - module: builtins
    functions: [open]
    notes: "Dual-classified: fs_write when mode is 'w'/'wb'/'a'/'x'"
  - module: pathlib.Path
    methods: [write_text, write_bytes, mkdir, touch, unlink, rename, replace, symlink_to, rmdir, chmod]
  - module: os
    functions: [mkdir, makedirs, remove, unlink, rename, replace, symlink, link, chmod, chown, rmdir]
  - module: shutil
    functions: [copy, copy2, copytree, move, rmtree, make_archive, unpack_archive]
  - module: tempfile
    functions: [mkstemp, mkdtemp, NamedTemporaryFile, TemporaryDirectory, TemporaryFile]
  - module: json
    functions: [dump]
    notes: "json.dump writes to a file object; json.dumps returns a string (not I/O)"
  - module: pickle
    functions: [dump]
  - module: csv
    functions: [writer]
    notes: "csv.writer wraps a file object for writing"
  - module: file
    methods: [write, writelines]
    notes: |
      WI-fuvuj: synthetic module for the file object returned by open().
      Receiver-type inference in py.py types `f = open(p)` as the `file`
      module so f.write()/f.writelines() classify here via the module-filter
      path (untyped receivers stay suppressed by ambiguous_names).

# WI-harin: stdlib database / key-value-store primitives (sqlite3 / dbm /
# shelve). Their calls arrive as bare untyped unresolved method calls
# (``.save()`` / ``.filter()`` / ``.get()`` on a receiver hypergumbo cannot
# type), which the matcher correctly refuses by SHORT NAME (INV-tapat/
# INV-maluk); matching them by short name would false-positive on every
# ``dict.get()`` / ``.save()`` in the corpus. The free-function datastore
# opens (connect / open) are the reliably-matchable anchors; the DB-API
# method surface is catalogued for completeness + taint even though untyped
# receivers keep it latent (the same shape as the JDBC method surface in
# java.yaml). db_read/db_write are already members of CATALOG_BOUNDARY_TYPES
# and populated in 6 other language catalogs; Python was the gap.
#
# WI-sozoj (type-verified framework carve-out): WI-harin's exclusion of
# third-party ORMs was a PRECISION rule scoped to short-name matching of
# UNTYPED receivers, not a purity ban — the catalog already carries
# type-verified third-party entries (flask.Flask.run below; javax.persistence
# in java.yaml). The sanctioned route WI-harin named ("a receiver-type-
# inference problem, tracked separately") is now here: py.py TYPES the ORM
# receiver via a framework-syntax marker (``<Model>.objects.<method>()`` /
# a ``models.Model``-subclass ``self.save()``) and emits a ``django.db.models``
# module-qualified dst, so these fire ONLY through the module-filter path
# (never the short-name gate) — no ``dict.get()`` false positive. Admission
# criterion for any future framework datastore entry (the "principled
# stopping point"): (a) keyed to a real, distinctive module namespace,
# (b) matched only via a type-verified receiver / qualified name — never a
# bare ambiguous short name, (c) a bounded, closed method set. Self-throttled
# by the per-framework receiver-typing cost (SQLAlchemy is deferred, not
# free). Do NOT add ``django.db.models`` to ``stdlib_modules`` /
# ``stdlib_module_completeness`` — it is third-party (would mis-suppress
# external_potential and corrupt py_deps ecosystem classification), and the
# stdlib-scoped ``status: provenance_declared`` citation above stays
# about stdlib only.
db_read:
  - module: sqlite3
    functions: [connect]
    notes: |
      Opens/creates a SQLite database file — the DB-API datastore boundary
      anchor and the reliably-matchable free-function entry (``connect`` is
      ambiguous with socket.socket.connect, disambiguated by the sqlite3
      module hint).
  - module: sqlite3.Connection
    methods: [iterdump, backup]
    notes: "Whole-database export / online backup (read path)"
  - module: sqlite3.Cursor
    methods: [fetchone, fetchmany, fetchall]
    notes: |
      DB-API result retrieval. Latent: untyped cursor receivers stay
      suppressed by the no-module gate (fires only when py.py types the
      cursor, mirroring the WI-fuvuj `file` synthetic module).
  - module: dbm
    functions: [open]
    notes: |
      Opens a Unix key-value db file. Dual read/write by flag; catalogued as
      the datastore boundary (``open`` is ambiguous with builtins.open,
      disambiguated by the dbm module hint).
  - module: shelve
    functions: [open]
    notes: "Persistent dict backed by dbm (module-hint-disambiguated open)"
  # WI-sozoj: Django ORM Manager/QuerySet READ surface -- the rows live in the
  # ``python-web-and-orm`` overlay (ADR-0047). Latent — fires only when py.py
  # types the receiver via the ``.objects`` Manager marker (module-filter
  # path, never the short-name gate). ``get``/``all``/etc. are ambiguous by
  # short name (dict.get, list.count); the ``django.db.models`` module hint
  # disambiguates. See the type-verified carve-out note above. Since WI-fasap
  # the lazy combinators (``filter``/``all``/``order_by``...) are ``db_compose``
  # there, and the evaluation (``__iter__``/``__getitem__``) is the read.

db_write:
  # ---------------------------------------------------------------
  # 2026-08-15 stdlib climb (INV-dabuf path-out). Every row below was a
  # measured unmatched call target on hypergumbo's own artifact-scoped
  # self-survey, or a peer required so its module's completeness entry
  # stays honest. os.open + os.write close INV-zubuh's measured
  # false-confirm pair. Slot-family rows (os.environ.*, sys.stdout.*)
  # resolve INV-ponad: the parent's attribute row speaks about REFERENCE
  # edges, these speak about CALL edges on the attribute object.
  # ---------------------------------------------------------------
  - module: sqlite3.Connection
    methods: [rollback]
  - module: sqlite3.Connection
    methods: [execute, executemany, executescript, commit]
    notes: |
      SQL execution + transaction flush. ``execute`` is ambiguous (may
      mutate), so it is classified as a write — matching how
      java.sql.Statement.execute is treated. Latent for untyped receivers.
  - module: sqlite3.Cursor
    methods: [execute, executemany, executescript]
    notes: "SQL execution via a cursor (latent — untyped receivers suppressed)"
