# ADR-0016: I/O primitive catalog for Scala
#
# Scala-specific I/O primitives. This catalog is MERGED with java.yaml
# (via _CATALOG_PARENTS) so all java.io.*, java.nio.*, java.net.* entries
# are also available — Scala stdlib is small and most I/O delegates to
# the Java parent.
#
# Plan C, PR A: strict-stdlib rule. Scala's stdlib namespace is `scala.*`
# (plus inherited `java.*` / `javax.*` / `jakarta.*`). The previously-
# catalogued third-party ecosystem libraries — fs2, cats-effect, sttp,
# http4s, akka / pekko, Play, Slick, Doobie, Quill, ScalikeJDBC, Anorm,
# ReactiveMongo, ZIO, scala-logging, SLF4J — are removed. First-party
# calls into them surface in `external_potential` (Plan C, PR C);
# project-local taint catalogs (WI-votan) provide per-project
# classification when needed.
language: scala

# Short names that are ambiguous between I/O and non-I/O Scala operations.
# When module_hint is "external" (unresolved), these names are skipped for
# short-name matching. Qualified-name and module-filtered matching still work.
ambiguous_names:
  # --- Java I/O primitives with generic Scala names ---
  - bind          # monadic bind vs ServerSocket.bind
  - start         # Eval.start, Future vs ProcessBuilder.start
  - run           # IO.run, ZIO.run vs Runtime.run
  - exec          # ExecutionContext.exec vs Runtime.exec
  - read          # collection read, Codec.read vs FileInputStream.read
  - write         # collection write vs FileOutputStream.write
  - send          # Actor.send, message passing vs Socket.send
  - connect       # db connect, stream connect vs Socket.connect
  - close         # Resource.close vs Stream.close
  - open          # generic open vs File.open
  - flush         # buffer flush vs Channel.flush
  - enqueue       # Queue.enqueue vs OkHttp.enqueue
  - accept        # type accept vs ServerSocket.accept
  - execute       # Executor.execute vs Statement.execute
  - get           # Map.get, Option.get (most common Scala method)
  - set           # Map.set
  - find          # collection find vs Files.find
  - delete        # collection delete vs File.delete
  - list          # Scala List vs File.list
  - next          # Iterator.next vs Scanner.next
  - nextInt       # Random.nextInt vs Scanner.nextInt
  - nextLine      # vs Scanner.nextLine
  - exists        # collection exists vs File.exists
  - command       # DSL command vs ProcessBuilder.command
  - apply         # Scala apply method (universal)
  - call          # function call
  - walk          # vs Files.walk
  - append        # collection append vs FileWriter.append
  - newLine       # vs BufferedWriter.newLine
  - receive       # Actor receive pattern vs DatagramSocket.receive
  - fireChannelRead  # Netty context but ambiguous in Scala actor code
  - size          # collection size vs Files.size
  # --- Scala collection/FP methods that collide with Scala catalog ---
  - mkString      # every Scala collection has mkString
  - getOrElse     # Option.getOrElse, Map.getOrElse (ubiquitous)
  - orElse        # Option.orElse, Try.orElse
  - foreach       # collection foreach (ubiquitous)
  - map           # Functor.map, collection map (ubiquitous)
  - flatMap       # Monad.flatMap (ubiquitous)
  - filter        # collection filter
  - fold          # Foldable.fold, collection fold
  - to            # collection conversion (toList, toSeq, etc.)
  - from          # factory method
  - copy          # case class copy, collection copy
  - update        # Map.update, Array.update
  - single        # collection.single
  - first         # collection.first
  - head          # collection.head
  - option        # as[Option], common in parsers
  - some          # Option.some
  - successful    # Future.successful, IO.pure
  - failed        # Future.failed, IO.failed, Try.failed
  - make          # generic factory method
  - use           # Resource.use but also generic
  - eval          # Eval class, REPL eval, generic evaluation
  - trans         # natural transformation in FP
  - sequence      # Applicative.sequence, collection
  - stream        # Stream type, collection streaming
  - props         # actor Props, config props
  - debug         # debugging method, log level
  - info          # log level but also generic info
  - warn          # log level but also generic warn
  - error         # log level but also generic error
  - trace         # log level but also generic trace
  - build         # Builder.build (ubiquitous)
  - default       # default value/method
  - resource      # Resource type, generic resource
  - status        # HTTP status, generic status
  - url           # URL string, generic url variable
  - on            # event handler, query DSL
  - as            # type cast (asInstanceOf, etc.)
  - toList        # collection conversion
  - toSeq         # collection conversion
  - headOption    # collection method

# ---------------------------------------------------------------------------
# Scala stdlib I/O
# ---------------------------------------------------------------------------
fs_read:
  - module: scala.io.Source
    methods: [fromFile, fromURL, fromInputStream, fromResource, getLines, mkString]
    notes: "Scala stdlib file/URL reading"
  - module: scala.io.StdIn
    functions: [readLine, readInt, readDouble, readFloat, readLong, readBoolean, readChar, readShort, readByte, readf]
    notes: "Scala stdlib stdin reading"
  - module: scala.io.Codec
    methods: [fromFile]

fs_write:
  - module: scala.sys.process.Process
    methods: [apply, run]
    notes: "Scala process execution (can write to filesystem via shell commands)"

subprocess:
  - module: scala.sys.process.Process
    methods: [apply, run]
    notes: "Scala process execution — wraps java.lang.ProcessBuilder"
  - module: scala.sys.process.ProcessBuilder
    methods: [run, lineStream, lazyLines]
    notes: "Scala process builder DSL"

env_read:
  - module: scala.sys
    functions: [env, props]
    notes: "Scala stdlib environment/properties access"
  - module: scala.sys.SystemProperties
    methods: [apply, get, getOrElse]
  - module: scala.util.Properties
    methods: [envOrElse, envOrNone, propOrElse, propOrNone, propIsSet, javaHome, tmpDir, userDir, userHome, userName, scalaHome]
