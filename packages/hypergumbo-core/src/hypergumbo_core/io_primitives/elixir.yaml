# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for Elixir
#
# Elixir runs on the BEAM and can call Erlang modules directly (via atom
# syntax — `:gen_tcp.send(...)`). This catalog is MERGED with erlang.yaml
# (via _CATALOG_PARENTS) so Erlang stdlib (`file`, `gen_tcp`, `ets`,
# `logger`, etc.) is covered for the atom-access path.
#
# Elixir idiom uses its own wrappers over Erlang: `File` for filesystem,
# `IO` for console/streams, `System` for process/env, `Logger` for logs.
#
# SCOPE (ADR-0016 §27, ADR-0047 ruling 8): the Elixir distribution plus OTP
# through the parent catalogue. This header used to continue "`Ecto` for
# databases, Phoenix for web server, and a galaxy of HTTP clients (HTTPoison,
# Tesla, Req, Finch, Mint)", justified by UAT-2026-04-13 BUG-09b, which
# reported 0 boundaries on plausible (a Phoenix/Ecto repository). That was
# 144 rows — the largest third-party holding in the tree, and the most
# openly declared.
#
# THE UAT FINDING STILL HOLDS AND IS STILL ANSWERED. Those rows moved to
# io_primitives_overlays/elixir-web-and-db.yaml, which LOADS BY DEFAULT, so
# a Phoenix/Ecto repository still gets its boundaries. What changed is that
# they no longer claim to BE the Elixir standard library — ADR-0047's point
# being that an openly-declared divergence is still a divergence, and that
# recall is better bought with a disclosed overlay than with a false claim.
#
# Naming convention: Elixir calls render as `Module.function` — the
# dotted form matches the `module.name` lookup the io_boundary engine
# uses for `kind="function"` entries.
language: elixir
# Plan C, PR B / INV-titih: partial catalog. Promotion to
# ``status: provenance_declared`` requires adding ``stdlib_provenance``
# (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in io_boundary.py) — a
# citation check only; coverage is claimed per-module via
# ``module_completeness``.
status: in_progress

# ---------------------------------------------------------------------------
# Ambiguous short names — function names that collide across Elixir
# ecosystem semantics when module_hint is unresolved.
# ---------------------------------------------------------------------------
ambiguous_names:
  # Elixir stdlib verbs with I/O analogs
  - read          # File.read vs any read/1
  - write         # File.write vs any write/2
  - open          # File.open vs :gen_tcp.open, any open/1
  - close         # File.close, :gen_tcp.close, any close/1
  - send          # Process.send, GenServer.cast-style vs :gen_tcp.send
  - recv          # :gen_tcp.recv vs any recv/2
  - connect       # DB connect, Mint.connect, Socket.connect
  - listen        # :gen_tcp.listen vs any listen/2
  - accept        # :gen_tcp.accept vs any accept/1
  - call          # GenServer.call vs any call/2
  - cast          # GenServer.cast vs any cast/2
  - reply         # GenServer.reply vs any reply/2
  - start         # Supervisor.start, Task.start, any start/1
  - start_link    # universal — spawns linked process
  - stop          # GenServer.stop, Supervisor.stop
  - stream        # Stream, File.stream!, IO.stream, DB stream
  - stream!       # File.stream!, IO.stream!
  - get           # Keyword.get, Map.get, Agent.get, any get/2
  - put           # Map.put, Agent.put, Keyword.put, any put/3
  - delete        # Map.delete, File.delete, Ecto.Repo.delete
  - update        # Map.update, Ecto.Repo.update
  - insert        # Ecto.Repo.insert, :ets.insert, any insert/2
  - lookup        # :ets.lookup vs Keyword.lookup
  - all           # Enum.all?, Ecto.Repo.all, any all/1
  - one           # Ecto.Repo.one
  - exists?       # File.exists?, Ecto.Repo.exists? (has ?)
  - exit          # Process.exit, Kernel.exit, any exit/1
  - spawn         # Kernel.spawn vs any spawn/1
  - register      # Process.register vs any register/2
  - monitor       # Process.monitor vs any monitor/2
  - run           # Ecto.Migrator.run, Task.run, generic run
  - exec          # generic exec verb
  - request       # Tesla.request, Req.request, generic
  - fetch         # Tesla.get, Req.get aliases, Map.fetch
  # Log levels (every logger in the ecosystem uses these)
  - debug
  - info
  - warn
  - warning
  - error
  # Elixir pipe/enum/flow verbs
  - map
  - filter
  - flat_map
  - reduce
  - each
  - count
  - take
  - take_while
  - drop
  - drop_while
  - new

# ---------------------------------------------------------------------------
# Filesystem read — Elixir File and IO modules
# ---------------------------------------------------------------------------
fs_read:
  - module: File
    functions:
      - read
      - read!
      - open
      - open!
      - stream!
      - ls
      - ls!
      - stat
      - stat!
      - lstat
      - lstat!
      - exists?
      - dir?
      - regular?
      - read_link
      - read_link!
    notes: "Elixir stdlib filesystem reads"
  - module: Path
    functions: [wildcard]
    notes: "glob expansion — reads directory contents"
  - module: IO
    functions:
      - read
      - binread
      - getn
      - gets
      - inspect
    notes: "Elixir IO module reads (stdin, devices, opened files)"

# ---------------------------------------------------------------------------
# Filesystem write — Elixir File module
# ---------------------------------------------------------------------------
fs_write:
  - module: File
    functions:
      - write
      - write!
      - touch
      - touch!
      - cp
      - cp!
      - cp_r
      - cp_r!
      - mkdir
      - mkdir!
      - mkdir_p
      - mkdir_p!
      - rm
      - rm!
      - rm_rf
      - rm_rf!
      - rmdir
      - rmdir!
      - rename
      - rename!
      - ln
      - ln!
      - ln_s
      - ln_s!
      - chmod
      - chmod!
      - chown
      - chown!
    notes: "Elixir stdlib filesystem writes"
# WI-dutah: IO.{write,binwrite,puts} moved out of fs_write — IO module
# takes a device, not a path. Real path-based writes go through
# File.{write,write!,...} (above). The IO entries live in the logging
# block below.

# ---------------------------------------------------------------------------
# Net send — HTTP clients and TCP
# ---------------------------------------------------------------------------
net_send:
  # PHOENIX / PLUG RESPONSE EGRESS (INV-nular, WI-budiv). Every one of these was
  # declared net_recv, and the rows' own notes admitted both directions in one
  # slot — "read request / write response", "receive and publish events". Two
  # things went wrong at once. net_recv is an auto-derived taint SOURCE, so each
  # MINTED untrusted_input at a call that emits; and because nothing here was a
  # SINK, a Phoenix application had NO egress rows for its own response path at
  # all, so a secret written into a response body or header could not be
  # reported as leaving the process. That second half is the false-all-clear
  # direction, which makes this the more serious of the two.
  #
  # The header/status builders are included deliberately: `put_resp_header(conn,
  # "x", secret)` is the point at which the secret enters the response that will
  # be transmitted, and a sink at the point the value enters is what catches it
  # (nothing carries taint from the conn struct to the eventual send).
  - module: :httpc
    functions: [request]
    notes: "Erlang stdlib HTTP client (called via atom from Elixir)"

# ---------------------------------------------------------------------------
# Net recv — Phoenix and Plug (web server request handling)
# ---------------------------------------------------------------------------
# NO ELIXIR-OWN net_recv ROWS. Every one belonged to Phoenix or Plug and
# moved to io_primitives_overlays/elixir-web-and-db.yaml (ADR-0047 ruling 1).
# Elixir still HAS a net_recv surface: gen_tcp / gen_udp / ssl / inet arrive
# through the OTP parent catalogue (_CATALOG_PARENTS: elixir -> erlang), which
# is where a language whose networking IS OTP should get them.

# ---------------------------------------------------------------------------
# Subprocess — System.cmd, System.shell, Port.open
# ---------------------------------------------------------------------------
subprocess:
  - module: System
    functions: [cmd, shell, halt]
    notes: "Elixir System.cmd launches external processes"
  - module: Port
    functions: [open, command]
    notes: "Erlang-style external ports (used for subprocess IPC)"

# ---------------------------------------------------------------------------
# Env read — Elixir System / Application
# ---------------------------------------------------------------------------
env_read:
  - module: System
    functions: [get_env, fetch_env, "fetch_env!", argv]
    notes: "Elixir System env + process info reads"
  - module: Application
    functions: [get_env, fetch_env, "fetch_env!", get_all_env]
    notes: "Application config reads (compile-time + runtime)"

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: System
    functions: [monotonic_time, system_time, time_offset, os_time]
    notes: >-
      WI-tubij: a clock read is host_info_read in EVERY catalogued language
      (WI-pavob ruling 2026-08-26, "yes in"). A monotonic clock counts: on
      Linux CLOCK_MONOTONIC runs from boot, so an early read leaks
      approximate uptime, which distinguishes machines. Arithmetic on an
      already-captured value is NOT a read and is refused.
      elixir-lang/elixir lib/elixir/lib/system.ex. The :os and :erlang rows
      are INHERITED from erlang.yaml and are not duplicated here.
  - module: DateTime
    functions: [utc_now]
  - module: NaiveDateTime
    functions: [utc_now]
  - module: System
    functions: [get_pid, tmp_dir, "tmp_dir!", user_home, "user_home!", cwd, "cwd!"]
    notes: "Elixir System env + process info reads"
  - module: Application
    functions: [get_application]
    notes: "Application config reads (compile-time + runtime)"

# ---------------------------------------------------------------------------
# Logging — Elixir Logger + Phoenix/plug-specific log helpers
# ---------------------------------------------------------------------------
logging:
  - module: Logger
    functions: [debug, info, warn, warning, error, notice, critical, alert, emergency, log, metadata, configure]
    notes: "Elixir stdlib Logger — unified logging API"
  - module: IO
    functions: [puts, warn, write, binwrite]
    notes: "IO-based ad-hoc logging (puts/write to :stdio; binwrite same but bytes)"

# ---------------------------------------------------------------------------
# Database — Ecto + direct driver modules
# ---------------------------------------------------------------------------
# NO ELIXIR-OWN db_read / db_write ROWS. Ecto, Postgrex, MyXQL and Redix are
# all Hex packages and moved to the overlay. The database surface Elixir
# inherits -- dets, ets and mnesia -- comes from OTP through the erlang
# parent, and those ARE the standard library.

# ---------------------------------------------------------------------------
# IPC — GenServer, Process, GenStage, Oban (job queues)
# ---------------------------------------------------------------------------
ipc_send:
  - module: GenServer
    functions: [call, cast, abcast, multi_call]
    notes: "GenServer message passing"
  - module: Process
    functions: [send, send_after]
    notes: "Raw process messaging"
  - module: Task
    functions: [async, async_stream, start, start_link, Supervisor.start_child]
    notes: "Task spawns — async execution boundary"
