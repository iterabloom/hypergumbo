# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for C
#
# Maps C standard library and POSIX functions to I/O boundary types.
language: c
# Plan C, PR B / INV-titih: partial catalog. Promotion to
# ``status: provenance_declared`` requires adding ``stdlib_provenance``
# (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in io_boundary.py) — a
# citation check only; coverage is claimed per-module via
# ``module_completeness``.
status: in_progress

# Function names that are too generic to match without module context.
# C has no namespaces, so bare names like read/write/open/close are always
# ambiguous — they could be libc IO or a project-local function with the same name.
ambiguous_names:
  - read          # unistd read vs project-local read()
  - write         # unistd write vs project-local write()
  - open          # fcntl open vs project-local open()
  - close         # unistd close vs project-local close()
  - send          # socket send vs project-local send()
  - recv          # socket recv vs project-local recv()
  - connect       # socket connect vs project-local connect()
  - bind          # socket bind vs project-local bind()
  - listen        # socket listen vs project-local listen()
  - accept        # socket accept vs project-local accept()
  - stat          # sys/stat stat vs project-local stat()
  - link          # unistd link vs project-local link()
  - rename        # stdio rename vs project-local rename()
  - remove        # stdio remove vs project-local remove()
  - truncate      # unistd truncate vs project-local truncate()
  - exec          # unistd exec vs project-local exec()
  - wait          # sys/wait wait vs project-local wait()
  - fork          # unistd fork vs project-local fork()
  - system        # stdlib system vs project-local system()

fs_read:
  - module: stdio
    functions: [fopen, fread, fgets, fgetc, fscanf, getc, getchar, scanf, fseek, rewind, ungetc, ftell]
  - module: unistd
    functions: [read, readlink, access, stat, lstat, fstat]
    boundary_ruling: call_site_undecidable
    notes: >-
      INV-vaduk: EXACTLY ONE of this primitive's boundaries is true per call
      and the call site cannot know which -- an fd's nature is established
      where it was opened, not where it is read or written. Declared rather
      than left blank because absence used to mean both "ruled undecidable"
      and "nobody looked". The fs_* row is never wrong; the ipc_*/net_* rows
      are the speculative ones, so today's behaviour over-reports rather than
      under-reports.
  - module: dirent
    functions: [opendir, readdir, scandir]
  - module: sys/stat
    functions: [stat, fstat, lstat]

fs_write:
  - module: stdio
    functions: [fopen, fwrite, fputs, fputc, fprintf, putc, putchar, printf, remove, rename, tmpfile, tmpnam, fclose, fflush]
    notes: "tmpfile/tmpnam create temp files on the filesystem; fclose releases file handle; fflush forces write"
  - module: stdlib
    functions: [mkstemp, mkdtemp, mkostemp, mkstemps]
    notes: "POSIX temp file/dir creation"
  - module: unistd
    functions: [write, unlink, rmdir, truncate, ftruncate, link, symlink, chown, chmod]
    boundary_ruling: call_site_undecidable
    notes: >-
      INV-vaduk: EXACTLY ONE of this primitive's boundaries is true per call
      and the call site cannot know which -- an fd's nature is established
      where it was opened, not where it is read or written. Declared rather
      than left blank because absence used to mean both "ruled undecidable"
      and "nobody looked". The fs_* row is never wrong; the ipc_*/net_* rows
      are the speculative ones, so today's behaviour over-reports rather than
      under-reports.
  - module: sys/stat
    functions: [mkdir, chmod]

net_send:
  - module: sys/socket
    functions: [connect, send, sendto, sendmsg]
  - module: unistd
    functions: [write]
    boundary_ruling: call_site_undecidable
    notes: "INV-vaduk: exactly one of fs_write/ipc_send/net_send is true per call; the fd's nature is established where it was opened, not here. This net_* row is the speculative one -- the fs_* row is never wrong."
    notes: "write() on a socket fd"

net_recv:
  - module: sys/socket
    functions: [socket, bind, listen, accept, recv, recvfrom, recvmsg]
  - module: unistd
    functions: [read]
    boundary_ruling: call_site_undecidable
    notes: "INV-vaduk: exactly one of fs_read/ipc_recv/net_recv is true per call; the fd's nature is established where it was opened, not here. This net_* row is the speculative one -- the fs_* row is never wrong."
    notes: "read() on a socket fd"

subprocess:
  - module: unistd
    functions: [fork, exec, execl, execlp, execle, execv, execvp, execve]
  - module: stdlib
    functions: [system, popen]
  - module: sys/wait
    functions: [wait, waitpid]
  - module: spawn
    functions: [posix_spawn, posix_spawnp]

env_read:
  - module: stdlib
    functions: [getenv]

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: unistd
    functions: [getcwd, gethostname, getuid, getgid, getpid]

ipc_send:
  - module: unistd
    functions: [write]
    boundary_ruling: call_site_undecidable
    notes: "write(STDOUT_FILENO, ...) or write(STDERR_FILENO, ...). INV-vaduk: exactly one of fs_write/ipc_send/net_send is true per call and the fd's nature is established where it was opened."

ipc_recv:
  - module: stdio
    attributes: [stdin]
  - module: unistd
    functions: [read]
    boundary_ruling: call_site_undecidable
    notes: "read(STDIN_FILENO, ...). INV-vaduk: exactly one of fs_read/ipc_recv/net_recv is true per call and the fd's nature is established where it was opened."

logging:
  # WI-dutah: stdio.{stdout,stderr} are terminal output, not IPC. Same
  # threat-model logic as Python sys.{stdout,stderr} (WI-tolif) and Go
  # log/slog/fmt: stdio writes inflate ipc_send false positives without
  # corresponding IPC threat. stdio.stdin stays in ipc_recv because it
  # can carry untrusted piped input from the parent process.
  - module: stdio
    attributes: [stdout, stderr]
    notes: "Terminal / log output; redirectable but not an IPC channel"
