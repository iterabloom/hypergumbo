# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for C
#
# Maps C standard library and POSIX functions to I/O boundary types.
language: c
# Plan C, PR B / INV-titih: partial catalog. Promotion to
# ``status: provenance_declared`` requires adding ``stdlib_provenance``
# (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in io_boundary.py) — a
# citation check only; coverage is claimed per-module via
# ``module_completeness``.
status: in_progress

# Function names that are too generic to match without module context.
# C has no namespaces, so bare names like read/write/open/close are always
# ambiguous — they could be libc IO or a project-local function with the same name.
ambiguous_names:
  - read          # unistd read vs project-local read()
  - write         # unistd write vs project-local write()
  - open          # fcntl open vs project-local open()
  - close         # unistd close vs project-local close()
  - send          # socket send vs project-local send()
  - recv          # socket recv vs project-local recv()
  - connect       # socket connect vs project-local connect()
  - bind          # socket bind vs project-local bind()
  - listen        # socket listen vs project-local listen()
  - accept        # socket accept vs project-local accept()
  - stat          # sys/stat stat vs project-local stat()
  - link          # unistd link vs project-local link()
  - rename        # stdio rename vs project-local rename()
  - remove        # stdio remove vs project-local remove()
  - truncate      # unistd truncate vs project-local truncate()
  - exec          # unistd exec vs project-local exec()
  - wait          # sys/wait wait vs project-local wait()
  - fork          # unistd fork vs project-local fork()
  - system        # stdlib system vs project-local system()

fs_read:
  - module: stdio
    functions: [fopen, fseek, rewind, ungetc, ftell]
  - module: stdio
    functions: [fread, fgets, fgetc, fscanf, getc]
    boundary_ruling: call_site_undecidable
    notes: >-
      WI-lipis: the stream-taking readers, split out of the row above because
      their boundary is a property of the FILE * argument and the row above
      is unconditional. THIS ROW STAYS FIRST: an unstamped call abstains to the
      first-declared row, so the fs_read answer is what a call whose stream
      origin cannot be recovered keeps. See the ipc_recv twin for the
      selection rule. `boundary_ruling` is declared on BOTH rows because it is
      a property of the PRIMITIVE, not of one declaration.
  - module: unistd
    functions: [read, readlink, access, stat, lstat, fstat]
    boundary_ruling: call_site_undecidable
    notes: >-
      INV-vaduk: EXACTLY ONE of this primitive's boundaries is true per call
      and the call site cannot know which -- an fd's nature is established
      where it was opened, not where it is read or written. Declared rather
      than left blank because absence used to mean both "ruled undecidable"
      and "nobody looked". The fs_* row is never wrong; the ipc_*/net_* rows
      are the speculative ones, so today's behaviour over-reports rather than
      under-reports.
  - module: dirent
    functions: [opendir, readdir, scandir]
  - module: sys/stat
    functions: [stat, fstat, lstat]

fs_write:
  - module: stdio
    functions: [fopen, fwrite, fputs, fputc, fprintf, putc, putchar, printf, remove, rename, tmpfile, tmpnam, fclose, fflush]
    notes: "tmpfile/tmpnam create temp files on the filesystem; fclose releases file handle; fflush forces write"
  - module: stdlib
    functions: [mkstemp, mkdtemp, mkostemp, mkstemps]
    notes: "POSIX temp file/dir creation"
  - module: unistd
    functions: [write, unlink, rmdir, truncate, ftruncate, link, symlink, chown, chmod]
    boundary_ruling: call_site_undecidable
    notes: >-
      INV-vaduk: EXACTLY ONE of this primitive's boundaries is true per call
      and the call site cannot know which -- an fd's nature is established
      where it was opened, not where it is read or written. Declared rather
      than left blank because absence used to mean both "ruled undecidable"
      and "nobody looked". The fs_* row is never wrong; the ipc_*/net_* rows
      are the speculative ones, so today's behaviour over-reports rather than
      under-reports.
  - module: sys/stat
    functions: [mkdir, chmod]

net_send:
  - module: sys/socket
    functions: [connect]
    notes: >-
      connect() transmits nothing but the connection itself -- ADR-0049's
      deferred shape -- and stays single-rowed; WI-baran left it out of the
      family-decided pair below on purpose.
  - module: sys/socket
    functions: [send, sendto, sendmsg]
    boundary_ruling: call_site_undecidable
    abstains_to: net_send
    notes: >-
      WI-baran (INV-nular, measurement 0012): a send over an AF_UNIX or
      socketpair descriptor is process-local IPC, not a network send -- tmux
      opens no AF_INET socket anywhere and was reported as one. The socket
      FAMILY decides, fixed where the descriptor was created (INV-vaduk's
      rule for unistd.read/write, one hop back through the descriptor
      variable): c.py stamps io_target_kind `pipe` (AF_UNIX / AF_LOCAL /
      socketpair, and accept() over such a listener) or `net_stream`
      (AF_INET / AF_INET6), and the ipc_send twin is selected on `pipe`. An
      unstamped call -- a parameter, a struct field, a kernel-family socket
      -- keeps THIS row (abstains_to), so nothing that classified before the
      stamp existed moves without one. REACH: bare `send` is in
      ambiguous_names and never classifies without a module hint; sendto and
      sendmsg do.
  - module: unistd
    functions: [write]
    boundary_ruling: call_site_undecidable
    notes: "write() on a socket fd. INV-vaduk: exactly one of fs_write/ipc_send/net_send is true per call; the fd's nature is established where it was opened, not here. This net_* row is the speculative one -- the fs_* row is never wrong. (INV-nular: these were TWO `notes:` keys on one row, so PyYAML kept the second and discarded this rationale at load; the catalogue loader now refuses duplicate keys.)"

net_recv:
  - module: sys/socket
    functions: [recv, recvfrom, recvmsg]
    boundary_ruling: call_site_undecidable
    abstains_to: net_recv
    notes: >-
      WI-baran: the receive twin of the send/sendto/sendmsg rule under
      net_send -- a recv over an AF_UNIX or socketpair descriptor is
      ipc_recv, selected on a `pipe` stamp; unstamped keeps this row. Both
      rows mint a taint SOURCE, so the stamp moves a source between zones
      rather than adding or removing one. REACH: bare `recv` is in
      ambiguous_names; recvfrom and recvmsg classify.
  - module: sys/socket
    functions: [accept]
    notes: >-
      socket/bind/listen REMOVED (INV-nular, WI-dosov): socket() creates an
      endpoint, bind() names it, listen() marks it passive. None receives
      anything, and net_recv is an auto-derived taint SOURCE, so each was
      minting untrusted_input at a call that observes nothing. accept is
      KEPT: it returns the peer address, which is chosen by whoever
      connected, so it is a real source.
  - module: unistd
    functions: [read]
    boundary_ruling: call_site_undecidable
    notes: "read() on a socket fd. INV-vaduk: exactly one of fs_read/ipc_recv/net_recv is true per call; the fd's nature is established where it was opened, not here. This net_* row is the speculative one -- the fs_* row is never wrong. (INV-nular: these were TWO `notes:` keys on one row, so PyYAML kept the second and discarded this rationale at load; the catalogue loader now refuses duplicate keys.)"

subprocess:
  - module: unistd
    functions: [fork, exec, execl, execlp, execle, execv, execvp, execve]
  - module: stdlib
    functions: [system, popen]
  - module: sys/wait
    functions: [wait, waitpid]
  - module: spawn
    functions: [posix_spawn, posix_spawnp]

env_read:
  - module: stdlib
    functions: [getenv]

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: time
    functions: [time, clock, clock_gettime, clock_getres, timespec_get]
    notes: >-
      WI-tubij: a clock read is host_info_read in EVERY catalogued language
      (WI-pavob ruling 2026-08-26, "yes in"). A monotonic clock counts: on
      Linux CLOCK_MONOTONIC runs from boot, so an early read leaks
      approximate uptime, which distinguishes machines. Arithmetic on an
      already-captured value is NOT a read and is refused. Verified against
      the installed glibc headers. clock_settime is a host WRITE and gets no
      row here.
  - module: sys/time
    functions: [gettimeofday]
  - module: sys/times
    functions: [times]
    notes: >-
      times() reports process CPU times — host information about this
      process, the same category as python's process_time.
  - module: unistd
    functions: [getcwd, gethostname, getuid, getgid, getpid]

ipc_send:
  - module: sys/socket
    functions: [send, sendto, sendmsg]
    boundary_ruling: call_site_undecidable
    abstains_to: net_send
    notes: "WI-baran: the process-local twin of the net_send row, selected when the descriptor's family is AF_UNIX / AF_LOCAL or it came from socketpair(). The rule is written on the net_send row."
  - module: unistd
    functions: [write]
    boundary_ruling: call_site_undecidable
    notes: "write() over a pipe or an AF_UNIX socket descriptor (a `pipe` stamp). NOT the standard streams: write(STDOUT_FILENO, ...) is terminal output, `logging` under WI-dutah, and the earlier text of this note that called it an ipc_send was the stale sibling INV-nular's 2026-09-03 entry disclosed. INV-vaduk: exactly one of fs_write/ipc_send/net_send is true per call and the fd's nature is established where it was opened."

ipc_recv:
  - module: sys/socket
    functions: [recv, recvfrom, recvmsg]
    boundary_ruling: call_site_undecidable
    abstains_to: net_recv
    notes: "WI-baran: the process-local twin of the net_recv row, selected on a `pipe` stamp. The rule is written on the net_send row."
  - module: stdio
    attributes: [stdin]
  - module: stdio
    functions: [getchar, scanf, gets]
    notes: >-
      INV-muvis: reads STANDARD INPUT unconditionally, so the crossing is known
      at the call site with no argument to inspect. getchar() is getc(stdin)
      and scanf() is fscanf(stdin, ...) with the stream fixed; gets() reads
      stdin by definition.
  - module: stdio
    functions: [fgets, fgetc, getc, fscanf, fread]
    boundary_ruling: call_site_undecidable
    notes: >-
      WI-lipis: the SAME five functions the fs_read row declares, and BOTH
      declarations are needed because the boundary is a property of the STREAM
      ARGUMENT (INV-bagok / INV-zumin class (b)) -- fgets(buf, n, stdin) and
      fgets(buf, n, f) are one row and two different crossings. The analyzer
      stamps io_target_kind from the argument's origin and
      _narrow_by_target_kind keeps the matching row; a call whose origin cannot be
      recovered abstains to the FIRST-DECLARED row, which is why fs_read stays
      above this one and why that order is pinned by a test rather than left to
      a reviewer. An earlier version of this file said these five "stay
      fs_read" because moving them "would assert an IPC crossing for every read
      over a file". That objection was correct about MOVING and is answered by
      SELECTING: the file read still gets fs_read, and only a read whose stream
      is demonstrably a standard stream gets ipc_recv. Measured before the
      change, with a live control in one cold run: scanf(...) reaching a file
      write returned violated while fgets(buf, n, stdin) with the identical
      flow shape returned nothing.
  - module: unistd
    functions: [read]
    boundary_ruling: call_site_undecidable
    notes: "read(STDIN_FILENO, ...). INV-vaduk: exactly one of fs_read/ipc_recv/net_recv is true per call and the fd's nature is established where it was opened."

logging:
  # WI-dutah: stdio.{stdout,stderr} are terminal output, not IPC. Same
  # threat-model logic as Python sys.{stdout,stderr} (WI-tolif) and Go
  # log/slog/fmt: stdio writes inflate ipc_send false positives without
  # corresponding IPC threat. stdio.stdin stays in ipc_recv because it
  # can carry untrusted piped input from the parent process.
  - module: stdio
    attributes: [stdout, stderr]
    notes: "Terminal / log output; redirectable but not an IPC channel"
