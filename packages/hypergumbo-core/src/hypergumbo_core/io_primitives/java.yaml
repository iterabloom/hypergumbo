# ADR-0016: I/O primitive catalog for Java
#
# Maps Java standard library classes/methods to I/O boundary types.
language: java

# Method names that are too generic to match without module context.
# Java interfaces mean .read(), .write(), .close() appear on many classes.
ambiguous_names:
  - read          # FileInputStream.read vs ByteBuffer.read, any .read()
  - write         # FileOutputStream.write vs ByteBuffer.write, any .write()
  - close         # Stream.close vs any AutoCloseable.close()
  - flush         # OutputStream.flush vs any .flush()
  - send          # Socket.send vs any .send()
  - connect       # Socket.connect vs any .connect()
  - accept        # ServerSocket.accept vs any .accept()
  - bind          # ServerSocket.bind vs any .bind()
  - in            # System.in vs CriteriaBuilder.in(), Kotlin keyword
  - out           # System.out vs PrintWriter.out(), any .out()
  - err           # System.err vs any .err()
  - put           # RestTemplate.put vs Map.put, ByteBuffer.put
  - get           # RestTemplate.getForObject vs Map.get
  - delete        # RestTemplate.delete vs Map.remove, File.delete
  - exchange      # RestTemplate.exchange vs any .exchange()
  - execute       # OkHttp.execute vs Executor.execute, Statement.execute
  - enqueue       # OkHttp.enqueue vs Queue.enqueue
  - start         # ProcessBuilder.start vs Thread.start, any .start()
  - exec          # Runtime.exec vs any .exec()
  - run           # actix.run vs Runnable.run, Thread.run
  - next          # Scanner.next vs Iterator.next
  - nextLine      # Scanner.nextLine vs any .nextLine()
  - append        # FileWriter.append vs StringBuilder.append
  - exists        # File.exists vs any .exists()
  - list          # File.list vs Collection, any .list()
  - readLine      # BufferedReader.readLine vs any .readLine()
  - size          # Files.size vs List.size/Map.size/Collection.size — WI-gonav
  - length        # File.length vs String.length, array.length — WI-gonav
  - copy          # Files.copy vs IOUtils.copy, any .copy()
  - find          # Files.find vs Stream.find, List.find, any .find()

fs_read:
  - module: java.io.File
    methods: [exists, isFile, isDirectory, list, listFiles, length, lastModified, canRead]
  - module: java.io.FileInputStream
    methods: [read]
  - module: java.io.FileReader
    methods: [read]
  - module: java.io.BufferedReader
    methods: [readLine, read]
  - module: java.nio.file.Files
    methods: [readAllBytes, readAllLines, readString, list, walk, find, exists, isRegularFile, isDirectory, size, getLastModifiedTime]
  - module: java.nio.file.Path
    methods: [toFile, toRealPath]
  - module: java.util.Scanner
    methods: [next, nextLine, nextInt]
    notes: "When reading from a file"
  # Apache Commons IO (WI-sakan)
  - module: org.apache.commons.io.FileUtils
    functions: [readFileToString, readFileToByteArray, readLines, lineIterator]
    methods: [readFileToString, readFileToByteArray, readLines, lineIterator]
    notes: "Apache Commons IO file read helpers"
  - module: org.apache.commons.io.IOUtils
    functions: [toString, toByteArray, readLines, copy, buffer]
    methods: [toString, toByteArray, readLines, copy, buffer]
    notes: "Apache Commons IO stream helpers"

fs_write:
  - module: java.io.File
    methods: [createNewFile, mkdir, mkdirs, delete, renameTo, setWritable, setReadable]
  - module: java.io.FileOutputStream
    methods: [write]
  - module: java.io.FileWriter
    methods: [write, append]
  - module: java.io.BufferedWriter
    methods: [write, newLine]
  - module: java.nio.file.Files
    methods: [write, writeString, createFile, createDirectory, createDirectories, delete, deleteIfExists, move, copy, createTempFile, createTempDirectory]
  # Apache Commons IO (WI-sakan)
  - module: org.apache.commons.io.FileUtils
    functions: [writeStringToFile, writeByteArrayToFile, writeLines, copyFile, copyDirectory, copyInputStreamToFile, deleteDirectory, deleteQuietly, forceDelete, forceMkdir, moveFile, touch, write]
    methods: [writeStringToFile, writeByteArrayToFile, writeLines, copyFile, copyDirectory, copyInputStreamToFile, deleteDirectory, deleteQuietly, forceDelete, forceMkdir, moveFile, touch, write]
    notes: "Apache Commons IO file write helpers"

net_send:
  - module: java.net.Socket
    methods: [connect, getOutputStream]
  - module: java.net.URL
    methods: [openConnection, openStream]
  - module: java.net.HttpURLConnection
    methods: [connect, getOutputStream, setRequestMethod]
  - module: java.net.http.HttpClient
    methods: [send, sendAsync]
  # Netty framework
  - module: io.netty.channel.Channel
    methods: [write, writeAndFlush, flush]
    notes: "Netty channel write operations"
  - module: io.netty.channel.ChannelHandlerContext
    methods: [write, writeAndFlush, flush, fireChannelRead]
    notes: "Netty handler context write operations"
  - module: io.netty.buffer.ByteBuf
    methods: [writeBytes, writeInt, writeLong, writeShort, writeByte, writeFloat, writeDouble, writeCharSequence, writeZero]
    notes: "Netty ByteBuf write operations"
  # OkHttp / Retrofit
  - module: okhttp3.Call
    methods: [execute, enqueue]
    notes: "OkHttp synchronous and asynchronous HTTP calls"
  - module: okhttp3.OkHttpClient
    methods: [newCall]
  # Spring Web
  - module: org.springframework.web.client.RestTemplate
    methods: [getForObject, getForEntity, postForObject, postForEntity, put, delete, exchange]
    notes: "Spring RestTemplate HTTP operations"
  # Spring 6 WebClient (reactive replacement for RestTemplate)
  - module: org.springframework.web.reactive.function.client.WebClient
    methods: [get, post, put, patch, delete, method]
    notes: "Spring WebClient fluent HTTP"
  # Apache HttpClient (4.x + 5.x)
  - module: org.apache.http.client.HttpClient
    methods: [execute]
    notes: "Apache HttpClient 4.x"
  - module: org.apache.hc.client5.http.classic.HttpClient
    methods: [execute]
    notes: "Apache HttpClient 5.x"
  - module: org.apache.http.impl.client.CloseableHttpClient
    methods: [execute]
  # Unirest
  - module: kong.unirest.Unirest
    methods: [get, post, put, patch, delete, head, options]
    notes: "Unirest HTTP client"
  # Retrofit
  - module: retrofit2.Call
    methods: [execute, enqueue]
    notes: "Retrofit typed HTTP calls"

net_recv:
  - module: java.net.ServerSocket
    methods: [accept, bind]
  - module: java.net.Socket
    methods: [getInputStream]
  - module: java.net.DatagramSocket
    methods: [receive, bind]
  # Netty framework
  - module: io.netty.channel.Channel
    methods: [read]
    notes: "Netty channel read operations"
  - module: io.netty.channel.ChannelHandlerContext
    methods: [read, fireChannelRead]
    notes: "Netty handler context read operations"
  - module: io.netty.buffer.ByteBuf
    methods: [readBytes, readInt, readLong, readShort, readByte, readFloat, readDouble, readCharSequence, readSlice, readRetainedSlice]
    notes: "Netty ByteBuf read operations"
  # Netty server bootstrap
  - module: io.netty.bootstrap.ServerBootstrap
    methods: [bind]
    notes: "Netty server bind — starts accepting connections"

subprocess:
  - module: java.lang.ProcessBuilder
    methods: [start, command]
  - module: java.lang.Runtime
    methods: [exec]

env_read:
  - module: java.lang.System
    methods: [getenv, getProperty, getProperties]
  - module: java.lang.Runtime
    methods: [availableProcessors, totalMemory, freeMemory, maxMemory]

ipc_send:
  - module: java.lang.System
    attributes: [out, err]

ipc_recv:
  - module: java.lang.System
    attributes: [in]

# WI-sakan: database access via JDBC and common JPA/Hibernate/Spring Data APIs.
db_read:
  - module: java.sql.Connection
    methods: [prepareStatement, prepareCall, createStatement]
    notes: "JDBC statement preparation (query path)"
  - module: java.sql.Statement
    methods: [executeQuery, getResultSet]
  - module: java.sql.PreparedStatement
    methods: [executeQuery]
  - module: java.sql.CallableStatement
    methods: [executeQuery]
  - module: java.sql.ResultSet
    methods: [next, getString, getInt, getLong, getBoolean, getObject, getDate, getTimestamp, getBigDecimal]
    notes: "Row traversal; read-only rowset access"
  # Spring Data JPA / Hibernate query interfaces
  - module: javax.persistence.EntityManager
    methods: [find, createQuery, createNamedQuery, createNativeQuery, getReference]
    notes: "JPA EntityManager query path"
  - module: jakarta.persistence.EntityManager
    methods: [find, createQuery, createNamedQuery, createNativeQuery, getReference]
    notes: "Jakarta EE 9+ EntityManager"
  - module: javax.persistence.TypedQuery
    methods: [getSingleResult, getResultList, getResultStream]
  - module: jakarta.persistence.TypedQuery
    methods: [getSingleResult, getResultList, getResultStream]
  - module: org.springframework.jdbc.core.JdbcTemplate
    methods: [query, queryForObject, queryForList, queryForMap, queryForRowSet]
    notes: "Spring JdbcTemplate query operations"
  - module: org.springframework.data.repository.CrudRepository
    methods: [findById, findAll, findAllById, existsById, count]
    notes: "Spring Data repository query methods"
  - module: org.springframework.data.jpa.repository.JpaRepository
    methods: [findById, findAll, findAllById, existsById, count, getOne, getReferenceById]
  - module: org.hibernate.Session
    methods: [get, load, find, createQuery, createNamedQuery, createNativeQuery, byId]
    notes: "Hibernate Session query path"

db_write:
  - module: java.sql.Statement
    methods: [executeUpdate, execute, addBatch, executeBatch]
  - module: java.sql.PreparedStatement
    methods: [executeUpdate, execute, addBatch, executeBatch]
  - module: java.sql.CallableStatement
    methods: [executeUpdate, execute]
  - module: java.sql.Connection
    methods: [commit, rollback, setAutoCommit]
    notes: "Transaction boundary control"
  - module: javax.persistence.EntityManager
    methods: [persist, merge, remove, flush, refresh]
  - module: jakarta.persistence.EntityManager
    methods: [persist, merge, remove, flush, refresh]
  - module: org.springframework.jdbc.core.JdbcTemplate
    methods: [update, batchUpdate, execute]
    notes: "Spring JdbcTemplate write operations"
  - module: org.springframework.data.repository.CrudRepository
    methods: [save, saveAll, delete, deleteById, deleteAll]
  - module: org.springframework.data.jpa.repository.JpaRepository
    methods: [save, saveAll, delete, deleteById, deleteAll, saveAndFlush, flush]
  - module: org.hibernate.Session
    methods: [save, update, saveOrUpdate, persist, delete, flush, merge]

# WI-sakan: logging — SLF4J / Log4j / java.util.logging / Logback.
logging:
  - module: org.slf4j.Logger
    methods: [trace, debug, info, warn, error]
    notes: "SLF4J facade — universal Java logging API"
  - module: org.apache.logging.log4j.Logger
    methods: [trace, debug, info, warn, error, fatal]
    notes: "Log4j 2.x"
  - module: org.apache.log4j.Logger
    methods: [trace, debug, info, warn, error, fatal]
    notes: "Log4j 1.x (legacy but still widespread)"
  - module: java.util.logging.Logger
    methods: [log, logp, fine, finer, finest, info, warning, severe, config]
    notes: "java.util.logging (JDK built-in)"
  - module: ch.qos.logback.classic.Logger
    methods: [trace, debug, info, warn, error]
    notes: "Logback classic implementation"

