# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for Java
#
# Maps Java standard library classes/methods to I/O boundary types.
language: java
# Plan C, PR B / INV-titih: partial catalog. Promotion to
# ``status: provenance_declared`` requires adding ``stdlib_provenance``
# (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in io_boundary.py) — a
# citation check only; coverage is claimed per-module via
# ``module_completeness``.
status: in_progress

# Method names that are too generic to match without module context.
# Java interfaces mean .read(), .write(), .close() appear on many classes.
ambiguous_names:
  - read          # FileInputStream.read vs ByteBuffer.read, any .read()
  - write         # FileOutputStream.write vs ByteBuffer.write, any .write()
  - close         # Stream.close vs any AutoCloseable.close()
  - flush         # OutputStream.flush vs any .flush()
  - send          # Socket.send vs any .send()
  - connect       # Socket.connect vs any .connect()
  - accept        # ServerSocket.accept vs any .accept()
  - bind          # ServerSocket.bind vs any .bind()
  - in            # System.in vs CriteriaBuilder.in(), Kotlin keyword
  - out           # System.out vs PrintWriter.out(), any .out()
  - err           # System.err vs any .err()
  - put           # RestTemplate.put vs Map.put, ByteBuffer.put
  - get           # RestTemplate.getForObject vs Map.get
  - delete        # RestTemplate.delete vs Map.remove, File.delete
  - exchange      # RestTemplate.exchange vs any .exchange()
  - execute       # OkHttp.execute vs Executor.execute, Statement.execute
  - enqueue       # OkHttp.enqueue vs Queue.enqueue
  - start         # ProcessBuilder.start vs Thread.start, any .start()
  - exec          # Runtime.exec vs any .exec()
  - run           # actix.run vs Runnable.run, Thread.run
  - next          # Scanner.next vs Iterator.next
  - nextLine      # Scanner.nextLine vs any .nextLine()
  - append        # FileWriter.append vs StringBuilder.append
  - exists        # File.exists vs any .exists()
  - list          # File.list vs Collection, any .list()
  - readLine      # BufferedReader.readLine vs any .readLine()
  - size          # Files.size vs List.size/Map.size/Collection.size — WI-gonav
  - length        # File.length vs String.length, array.length — WI-gonav
  - copy          # Files.copy vs IOUtils.copy, any .copy()
  - find          # Files.find vs Stream.find, List.find, any .find()

fs_read:
  - module: java.io.File
    methods: [exists, isFile, isDirectory, list, listFiles, length, lastModified, canRead]
  - module: java.io.FileInputStream
    methods: [read]
  - module: java.io.FileReader
    methods: [read]
  - module: java.io.BufferedReader
    methods: [readLine, read]
    boundary_ruling: call_site_undecidable
    notes: >-
      WI-tusav: the boundary is a property of the RECEIVER'S ORIGIN, not of the
      method -- `new BufferedReader(new InputStreamReader(System.in))` and
      `new BufferedReader(new FileReader(p))` are one row and two different
      crossings (INV-zumin class (b), INV-bagok's shape one hop later). THIS ROW
      STAYS FIRST: an unstamped call abstains to the first-declared row, so a
      receiver whose origin cannot be recovered keeps the fs_read answer it had
      before this split, and fs_read mints no taint source. See the ipc_recv
      twin for the selection rule. `boundary_ruling` is declared on BOTH rows
      because it is a property of the PRIMITIVE, not of one declaration.
  - module: java.io.InputStreamReader
    methods: [read]
    boundary_ruling: call_site_undecidable
    notes: >-
      WI-tusav. The decorator the canonical stdin idiom wraps System.in in, and
      a read surface in its own right -- `new InputStreamReader(System.in).read()`
      reaches the java.io.InputStreamReader slot, verified against the analyzer
      before this row was written (LIVE rule 9: presence is not reachability).
  - module: java.io.InputStream
    methods: [read]
    boundary_ruling: call_site_undecidable
    notes: >-
      WI-tusav. ABSENT before this item: only the FileInputStream subclass was
      rowed, so `InputStream is = System.in; is.read();` matched nothing at all.
      The declared type is what the analyzer puts in the module slot, so the
      base type needs its own row and cannot inherit FileInputStream's.
  - module: java.nio.file.Files
    methods: [readAllBytes, readAllLines, readString, list, walk, find, exists, isRegularFile, isDirectory, size, getLastModifiedTime]
  - module: java.nio.file.Path
    methods: [toFile, toRealPath]
  - module: java.util.Scanner
    methods: [next, nextLine, nextInt]
    boundary_ruling: call_site_undecidable
    notes: >-
      WI-tusav. This row's note used to read, in full, "When reading from a
      file" -- a disclosed residual that made the row true for `new Scanner(f)`
      and false for `new Scanner(System.in)`, which is the more common of the
      two in teaching code. Split rather than moved: the file scan keeps
      fs_read and only a scanner whose receiver demonstrably originates at a
      standard stream takes the ipc_recv twin. fs_read stays FIRST for the
      reason the BufferedReader row gives.
  # Plan C, PR A: Apache Commons IO removed under strict-stdlib rule.
  # First-party calls into Commons IO surface in external_potential
  # (Plan C, PR C); project-local taint-source catalogs (WI-votan) handle
  # case-by-case classification.

fs_write:
  - module: java.io.File
    methods: [createNewFile, mkdir, mkdirs, delete, renameTo, setWritable, setReadable]
  - module: java.io.FileOutputStream
    methods: [write]
  - module: java.io.FileWriter
    methods: [write, append]
  - module: java.io.BufferedWriter
    methods: [write, newLine]
  - module: java.nio.file.Files
    methods: [write, writeString, createFile, createDirectory, createDirectories, delete, deleteIfExists, move, copy, createTempFile, createTempDirectory]

net_send:
  - module: java.net.Socket
    methods: [connect, getOutputStream]
  - module: java.net.URL
    methods: [openConnection, openStream]
  - module: java.net.HttpURLConnection
    methods: [connect, getOutputStream, setRequestMethod]
  - module: java.net.http.HttpClient
    methods: [send, sendAsync]
  # Plan C, PR A: third-party HTTP / async-IO frameworks removed under
  # strict-stdlib rule (Netty, OkHttp / Retrofit, Spring Web /
  # RestTemplate / WebClient, Apache HttpClient 4.x / 5.x, Unirest).
  # First-party calls into these surface in external_potential
  # (Plan C, PR C); project-local taint-source catalogs (WI-votan)
  # provide per-project classification when needed.

net_recv:
  - module: java.net.ServerSocket
    methods: [accept]
  - module: java.net.Socket
    methods: [getInputStream]
  - module: java.net.DatagramSocket
    methods: [receive]
    notes: >-
      bind REMOVED from ServerSocket and DatagramSocket (INV-nular,
      WI-dosov): binding names a socket and receives nothing, while
      net_recv is an auto-derived taint source. accept / receive /
      getInputStream carry the real receive and are unchanged.
  # Plan C, PR A: Netty (io.netty.*) removed under strict-stdlib rule.
  # First-party calls into Netty surface in external_potential
  # (Plan C, PR C).

subprocess:
  - module: java.lang.ProcessBuilder
    methods: [start, command]
  - module: java.lang.Runtime
    methods: [exec]

env_read:
  - module: java.lang.System
    methods: [getenv, getProperty, getProperties]

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: java.lang.System
    methods: [currentTimeMillis, nanoTime]
    notes: >-
      WI-tubij: a clock read is host_info_read in EVERY catalogued language
      (WI-pavob ruling 2026-08-26, "yes in"). A monotonic clock counts: on
      Linux CLOCK_MONOTONIC runs from boot, so an early read leaks
      approximate uptime, which distinguishes machines. Arithmetic on an
      already-captured value is NOT a read and is refused. Static methods,
      catalogued method-kind on the precedent set by java.nio.file.Files'
      statics (INV-suril) — java's analyzer stamps call_construct=method on
      every selector-expression call. INHERITED BY kotlin AND scala via
      _CATALOG_PARENTS, which is why neither of those catalogues repeats
      these rows.
  - module: java.time.Instant
    methods: [now]
    notes: >-
      now() and now(Clock) both query a clock; ofEpochMilli / ofEpochSecond
      / from / parse convert a supplied value and get no row.
  - module: java.time.LocalDateTime
    methods: [now]
  - module: java.time.LocalDate
    methods: [now]
    notes: >-
      MEASURED, not assumed: across the corpus surveys java.time.LocalDate.now
      is the MOST-CALLED clock in java code (10 edges, ahead of
      java.time.Instant.now at 5), and the first cut of these rows omitted it
      along with ZonedDateTime. Every java.time type exposes a static now();
      the four below are the ones the corpus actually calls.
  - module: java.time.LocalTime
    methods: [now]
  - module: java.time.ZonedDateTime
    methods: [now]
  - module: java.time.OffsetDateTime
    methods: [now]
  - module: java.time.Clock
    methods: [systemUTC]
  - module: java.lang.Runtime
    methods: [availableProcessors, totalMemory, freeMemory, maxMemory]

ipc_send:
  - module: java.lang.System
    attributes: [out, err]

ipc_recv:
  - module: java.lang.System
    attributes: [in]
  - module: java.io.BufferedReader
    methods: [readLine, read]
    boundary_ruling: call_site_undecidable
    notes: >-
      WI-tusav: the SAME methods the fs_read row declares, and BOTH declarations
      are needed because the boundary is a property of the receiver's ORIGIN.
      java.py resolves the receiver's last binding in the enclosing method and
      unwraps the decorator chain -- BufferedReader over InputStreamReader over
      System.in -- then stamps io_target_kind; _narrow_by_target_kind keeps the
      matching row, and a receiver whose origin cannot be recovered abstains to
      the FIRST-DECLARED row, which is why fs_read stays above this one and why
      that order is pinned by a test rather than left to a reviewer.

      WHAT CARRIES THE UNRESOLVED CASE, checked before this row was written
      because an fs_read fallback with nothing behind it would leave the stdin
      crossing represented NOWHERE: java emits no `calls` edge for
      `object_creation_expression`, so there are no constructor rows to fall
      back to and there never could be. The fallback is the
      `java.lang.System.in` ATTRIBUTE row above, which fires on the
      module_attr_ref edge. Measured on a four-method fixture before the split:
      `fs_read: 4` (both the stdin and the file readers) plus `ipc_recv: 2` at
      System.in -- so the crossing was VISIBLE but attributed to the wrong
      boundary at the call that transfers the bytes, which is a
      misclassification rather than the total absence the item recorded.

      net_stream IS DELIBERATELY NEVER STAMPED and this row is why: narrowing
      keeps only rows whose boundary equals the resolved one, so a net_stream
      stamp with no net_recv twin would empty the candidate list and delete the
      classification outright. `new Scanner(sock.getInputStream())` abstains to
      fs_read instead, exactly as it did before, and c.yaml's stdio rows carry
      the same two-row shape for the same reason.
  - module: java.io.InputStreamReader
    methods: [read]
    boundary_ruling: call_site_undecidable
    notes: "WI-tusav. The ipc_recv twin; see the BufferedReader row for the selection rule."
  - module: java.io.InputStream
    methods: [read]
    boundary_ruling: call_site_undecidable
    notes: "WI-tusav. The ipc_recv twin; `InputStream is = System.in` is the shape this exists for."
  - module: java.util.Scanner
    methods: [next, nextLine, nextInt]
    boundary_ruling: call_site_undecidable
    notes: "WI-tusav. The ipc_recv twin of the row whose note used to say 'when reading from a file'."

# WI-sakan: database access via JDBC and common JPA/Hibernate/Spring Data APIs.
db_read:
  - module: java.sql.Connection
    methods: [prepareStatement, prepareCall]
    notes: >-
      JDBC statement preparation. createStatement REMOVED (INV-nular,
      WI-hikut): it returns an empty Statement and carries no SQL at all,
      so it cannot be any kind of read; Statement.executeQuery is rowed
      and carries it. prepareStatement / prepareCall are KEPT
      deliberately: most drivers send the SQL to the server for parsing
      at prepare time, so they may genuinely cross.
  - module: java.sql.Statement
    methods: [executeQuery, getResultSet]
  - module: java.sql.PreparedStatement
    methods: [executeQuery]
  - module: java.sql.CallableStatement
    methods: [executeQuery]
  - module: java.sql.ResultSet
    methods: [next, getString, getInt, getLong, getBoolean, getObject, getDate, getTimestamp, getBigDecimal]
    notes: "Row traversal; read-only rowset access"
  # Spring Data JPA / Hibernate query interfaces
  - module: javax.persistence.EntityManager
    methods: [find, getReference]
    notes: >-
      JPA EntityManager query path. createQuery / createNamedQuery /
      createNativeQuery REMOVED (INV-nular, WI-hikut): they build a
      Query and issue nothing. db_read is an auto-derived taint
      SOURCE, so each was minting untrusted_input at a call that
      returns a builder. The read is rowed where it happens --
      TypedQuery.getResultList / getSingleResult, below. find and
      getReference are KEPT because they do load the entity.
  - module: jakarta.persistence.EntityManager
    methods: [find, getReference]
    notes: >-
      Jakarta EE 9+ EntityManager. createQuery / createNamedQuery /
      createNativeQuery REMOVED (INV-nular, WI-hikut): they build a
      Query and issue nothing. db_read is an auto-derived taint
      SOURCE, so each was minting untrusted_input at a call that
      returns a builder. The read is rowed where it happens --
      TypedQuery.getResultList / getSingleResult, below. find and
      getReference are KEPT because they do load the entity.
  - module: javax.persistence.TypedQuery
    methods: [getSingleResult, getResultList, getResultStream]
  - module: jakarta.persistence.TypedQuery
    methods: [getSingleResult, getResultList, getResultStream]
  # Plan C, PR A: Spring Data, Spring JdbcTemplate, and Hibernate
  # removed under strict-stdlib rule. JDBC + JPA / Jakarta EE persistence
  # interfaces stay (java.sql.* / javax.persistence.* / jakarta.persistence.*).

db_write:
  - module: java.sql.Statement
    methods: [executeUpdate, execute, addBatch, executeBatch]
  - module: java.sql.PreparedStatement
    methods: [executeUpdate, execute, addBatch, executeBatch]
  - module: java.sql.CallableStatement
    methods: [executeUpdate, execute]
  - module: java.sql.Connection
    methods: [commit, rollback, setAutoCommit]
    notes: "Transaction boundary control"
  - module: javax.persistence.EntityManager
    methods: [persist, merge, remove, flush, refresh]
  - module: jakarta.persistence.EntityManager
    methods: [persist, merge, remove, flush, refresh]
  # Plan C, PR A: Spring Data, Spring JdbcTemplate, and Hibernate
  # removed under strict-stdlib rule.

# Plan C, PR A: only java.util.logging stays (JDK built-in). SLF4J,
# Log4j 1.x / 2.x, and Logback are third-party façades / implementations
# and surface in external_potential (Plan C, PR C) when first-party
# code uses them.
logging:
  - module: java.util.logging.Logger
    methods: [log, logp, fine, finer, finest, info, warning, severe, config]
    notes: "java.util.logging (JDK built-in)"

