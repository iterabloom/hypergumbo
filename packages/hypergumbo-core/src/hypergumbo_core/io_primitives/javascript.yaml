# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for JavaScript/TypeScript (Node.js)
#
# Maps Node.js built-in module functions to I/O boundary types.
# Third-party packages (express, axios, etc.) trace through these.
# Also used for TypeScript (same runtime primitives).
language: javascript
# Plan C, PR B / INV-titih: partial catalog. Promotion to
# ``status: provenance_declared`` requires adding ``stdlib_provenance``
# (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in io_boundary.py) — a
# citation check only; coverage is claimed per-module via
# ``module_completeness``.
status: in_progress

# Method/function names that are too generic to match without module context.
# Node.js uses the same names across many modules and user code.
ambiguous_names:
  - read          # fs.read vs any .read()
  - write         # fs.write vs any .write()
  - open          # fs.open vs any .open()
  - close         # fs.close vs any .close()
  - end           # response.end vs stream.end, any .end()
  - send          # socket.send vs express.Response.send
  - "on"          # EventEmitter.on (universal in Node.js). QUOTED DELIBERATELY:
                  # bare `on` is a YAML 1.1 BOOLEAN, so this entry parsed as
                  # True and suppressed nothing at all.
  - get           # http.get vs Map.get, express.app.get (route definition)
  - post          # axios.post vs any .post()
  - put           # axios.put vs Map.set
  - delete        # axios.delete vs Map.delete
  - patch         # axios.patch vs any .patch()
  - request       # http.request vs any .request()
  - connect       # net.connect vs any .connect()
  - listen        # net.Server.listen vs any .listen()
  - create        # net.createServer vs Object.create, any .create()
  - resolve       # path.resolve vs Promise.resolve
  - join          # path.join vs Array.join
  - spawn         # child_process.spawn vs any .spawn()
  - exec          # child_process.exec vs any .exec()
  - fork          # child_process.fork vs cluster.fork
  - run           # uvicorn.run vs any .run()
  - render        # express.Response.render vs any .render()
  - redirect      # express.Response.redirect vs any .redirect()
  - json          # express.Response.json vs JSON.parse
  - status        # express.Response.status vs any .status()
  - download      # express.Response.download vs any .download()
  - type          # os.type vs typeof
  - platform      # os.platform vs any .platform
  - arch          # os.arch vs any .arch
  - hostname      # os.hostname vs any .hostname
  - release       # os.release vs any .release
  - remove        # Deno.remove vs Array/DOM .remove(), react-hook-form useFieldArray
  - rename        # Deno.rename vs DOM .rename(), refactoring APIs

fs_read:
  - module: fs
    functions: [readFileSync, readFile, readdirSync, readdir, statSync, stat, lstatSync, lstat, existsSync, accessSync, access, readlinkSync, readlink, realpathSync, realpath]
  - module: fs.promises
    functions: [readFile, readdir, stat, lstat, access, readlink, realpath]
  - module: path
    functions: [resolve, join, dirname, basename, extname, relative, normalize]
    notes: "Path operations are not I/O but commonly precede fs_read"
  # Deno runtime API
  - module: Deno
    functions: [readFile, readTextFile, readDir, stat, lstat, readLink, realPath, open]
    notes: "Deno runtime file read operations"
  - module: Deno
    methods: [readFile, readTextFile, readDir, stat, lstat]
fs_write:
  - module: fs
    functions: [writeFileSync, writeFile, mkdirSync, mkdir, unlinkSync, unlink, rmdirSync, rmdir, renameSync, rename, copyFileSync, copyFile, chmodSync, chmod, chownSync, chown, appendFileSync, appendFile]
  - module: fs.promises
    functions: [writeFile, mkdir, unlink, rmdir, rename, copyFile, chmod, chown, appendFile, rm]
  - module: fs
    methods: [createWriteStream]
  # Deno runtime API
  - module: Deno
    functions: [writeFile, writeTextFile, mkdir, remove, rename, chmod, chown, truncate, create]
    notes: "Deno runtime file write operations"

# Browser persistent storage is NOT host-filesystem — it lives in the browser's
# own per-origin storage area and is primarily reachable via XSS rather than
# local-user filesystem access. Separating it from fs_write / fs_read lets the
# boundary map report accurately and lets taint-flow analysis treat it as its
# own trust zone (``browser_storage``) instead of conflating it with host-disk
# I/O. (Originally mis-categorized as fs_write / fs_read in WI-banaf; writes
# moved per WI-lokuv, reads moved per WI-kanir-huzuj.)
browser_storage_write:
  - module: localStorage
    methods: [setItem, removeItem, clear]
    notes: "Browser localStorage write"
  - module: sessionStorage
    methods: [setItem, removeItem, clear]
    notes: "Browser sessionStorage write"

browser_storage_read:
  - module: localStorage
    methods: [getItem, key, length]
    notes: "Browser localStorage read"
  - module: sessionStorage
    methods: [getItem, key, length]
    notes: "Browser sessionStorage read"
  - module: indexedDB
    functions: [open, databases]
    notes: "Browser IndexedDB read"
  - module: caches
    functions: [open, match, has, keys]
    notes: "Browser CacheStorage read (Service Workers)"

net_send:
  - module: http
    functions: [request, get]
  - module: https
    functions: [request, get]
  - module: net.Socket
    methods: [connect, write, end]
  - module: dgram.Socket
    methods: [send]
  - module: fetch
    functions: [fetch]
    notes: "Global fetch (Node 18+)"
  # Express response
  # Plan C, PR A: third-party npm HTTP clients (axios, node-fetch, ky,
  # superagent, got, undici) and the Express response surface
  # (express.Response.send / json / render / redirect / download / sendFile)
  # removed under strict-stdlib rule. First-party calls into these
  # surface in external_potential (Plan C, PR C).
  # Deno runtime API
  - module: Deno
    functions: [connect, connectTls]
    notes: "Deno runtime network client operations"
  # Browser network sinks (WI-banaf)
  - module: WebSocket
    methods: [send]
    notes: "Browser WebSocket client send"
  - module: window
    functions: [fetch]
    notes: "Browser window.fetch (same as global fetch)"
  - module: navigator
    methods: [sendBeacon]
    notes: "Browser navigator.sendBeacon for analytics/telemetry"
  - module: XMLHttpRequest
    methods: [send, open, setRequestHeader]
    notes: "Browser XHR"
net_recv:
  - module: http
    functions: [createServer]
  - module: https
    functions: [createServer]
  - module: net
    functions: [createServer]
  - module: dgram
    functions: [createSocket]
  # Deno runtime API
  - module: Deno
    functions: [listen, listenTls, listenDatagram]
    notes: "Deno runtime server operations"
  # Plan C, PR A: Express, Fastify, Koa servers removed under
  # strict-stdlib rule. First-party calls into these surface in
  # external_potential (Plan C, PR C).
  # Browser network sources (WI-banaf)
  - module: EventSource
    methods: [addEventListener, onmessage]
    notes: >-
      Browser Server-Sent Events client. `onerror` REMOVED (INV-nular): the
      error event is specified to carry no information -- deliberately, so a
      cross-origin failure cannot leak why -- so it receives nothing, while
      net_recv is an auto-derived taint SOURCE. onmessage and addEventListener
      carry the real receive. REACH: `onmessage` is assigned, not called
      (`es.onmessage = handler`), and the analyzer emits no edge for an
      assignment, so that row is declared unreachable in
      analyzer_disclosure.CONSTRUCT_BLIND_ROWS and disclosed on a clean
      verdict (WI-zumoz); addEventListener is a call and is reached.
  - module: WebSocket
    methods: [addEventListener, onmessage, onclose]
    notes: >-
      Browser WebSocket client receive. `onopen` and `onerror` REMOVED
      (INV-nular): the open event carries no data and the error event is
      specified to carry none, so both were minting untrusted_input at a
      connection-lifecycle callback. `onclose` is KEPT and the distinction is
      the point -- a CloseEvent carries `code` and `reason`, both chosen by the
      peer, so it genuinely receives peer-controlled data. REACH: `onmessage`
      and `onclose` are assigned, not called (`ws.onmessage = handler`), and
      the analyzer emits no edge for an assignment, so both rows are declared
      unreachable in analyzer_disclosure.CONSTRUCT_BLIND_ROWS and disclosed
      on a clean verdict (WI-zumoz); addEventListener is a call and is reached.

subprocess:
  - module: child_process
    functions: [exec, execFile, spawn, fork]
    notes: >-
      The ASYNCHRONOUS forms. Each returns a ChildProcess HANDLE; the
      child's output arrives later, through a callback or a stream, which
      is an ADR-0049 deferred crossing rather than a transfer. Split from
      the *Sync row below by INV-lozat.
  - module: child_process
    functions: [execSync, execFileSync, spawnSync]
    simultaneous: true
    notes: >-
      INV-lozat / ADR-0049 ruling 1: returns the CHILD'S output, so the call is
      a transfer as well as a launch and mints an untrusted_input source. Both
      facts are true at once (the `scala.sys.process.Process.apply` shape), so
      `simultaneous` is required -- without it `io_boundaries` is unwritten and
      the subprocess chain loses the race to `ipc_recv`, which parses first.
      The siblings that return only an exit status or a HANDLE stay
      launch-only: a status is not the child's message, and a handle is a
      crossing that has not happened yet (the ADR-0049 deferred shape).
      Follows rust.yaml's `Child.wait_with_output`, which follows python.yaml's
      `os.wait`.

env_read:
  - module: process
    attributes: [env, argv]
  - module: document
    attributes: [cookie, location, referrer]
    notes: "Browser document globals (cookie/referrer leak fingerprintable data)"

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: Date
    functions: [now]
    notes: >-
      WI-tubij: a clock read is host_info_read in EVERY catalogued language
      (WI-pavob ruling 2026-08-26, "yes in"). A monotonic clock counts: on
      Linux CLOCK_MONOTONIC runs from boot, so an early read leaks
      approximate uptime, which distinguishes machines. Arithmetic on an
      already-captured value is NOT a read and is refused. Date.now(). `new
      Date()` with no argument also samples the clock, but a constructor
      call is not a named-function call here and gets no row rather than a
      row that cannot match.
  - module: performance
    functions: [now]
  - module: performance
    attributes: [timeOrigin]
  - module: process
    functions: [hrtime, uptime]
  - module: os
    functions: [uptime]
    notes: >-
      Machine uptime is host information by the same argument that puts a
      monotonic clock in scope.
  - module: process
    attributes: [platform, arch, version, cwd]
  - module: os
    functions: [hostname, platform, arch, release, type, cpus, totalmem, freemem, homedir, tmpdir, userInfo]
  - module: navigator
    attributes: [userAgent, language, languages, platform, geolocation, cookieEnabled, onLine]
    notes: "Browser environment / capability detection"
  - module: window
    attributes: [location, navigator, screen, document]
    notes: "Browser window globals"

ipc_send:
  - module: process
    methods: [send]
    notes: "IPC to parent process in child_process.fork()"
  - module: BroadcastChannel
    methods: [postMessage]
    notes: >-
      Browser cross-tab messaging, moved out of net_* entirely (INV-nular).
      Two defects in one row: `postMessage` SENDS and was declared net_recv --
      a direction error that minted untrusted_input at a call that emits -- and
      the channel is not network in either direction. It is same-origin
      messaging between browsing contexts; nothing leaves the browser. Moving
      rather than deleting keeps the send REPRESENTED, and the receive label is
      unchanged because ipc_recv and net_recv both derive `untrusted_input`.

ipc_recv:
  - module: child_process
    functions: [execSync, execFileSync, spawnSync]
    simultaneous: true
    notes: >-
      INV-lozat: `execSync` and `execFileSync` RETURN the child's stdout;
      `spawnSync` returns an object whose `stdout`/`stderr` are the same
      bytes. The async siblings are deliberately absent -- they hand back a
      handle, and a crossing that has not happened yet is disclosed, not
      minted (ADR-0049).
  - module: BroadcastChannel
    methods: [addEventListener]
    notes: "Browser cross-tab messaging: the receive side (INV-nular)"
  - module: process
    attributes: [stdin]
  - module: process
    # Quote "on" so YAML 1.1 doesn't parse it as boolean True. Without
    # the quotes, the auto-derived TaintSource for process.on lands
    # with name=True, which trips `if "." in src.name` in
    # `propagate_taint_structural`.
    methods: ["on"]
    notes: "process.on('message', ...) for IPC from parent"

logging:
  # Browser + Node share console.* (WI-banaf)
  - module: console
    methods: [log, info, warn, error, debug, trace, dir, table, group, groupEnd, time, timeEnd]
    notes: "Universal console logging (browser + Node)"
  # WI-dutah: process.{stdout,stderr} are terminal output, not IPC.
  # Same threat-model logic as Python sys.{stdout,stderr} (WI-tolif).
  # process.send stays in ipc_send (real fork-channel) and process.stdin
  # stays in ipc_recv (can carry untrusted piped input).
  - module: process
    attributes: [stdout, stderr]
    notes: "Node stdio writes; terminal / log output, not an IPC channel"
