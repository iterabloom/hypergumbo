# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for Swift
#
# Maps the Swift standard library and Apple's SYSTEM frameworks —
# Foundation, UIKit, Core Data, SwiftData, Network.framework, os — to I/O
# boundary types.  Uses Swift method names (not ObjC selectors).
#
# SCOPE (ADR-0016 §27, ADR-0047 ruling 8): what ships with the OS. This
# header used to name SwiftNIO, AsyncHTTPClient, NIOSSL, distributed tracing
# and WebSocket, and the catalogue carried them — 38 rows, 36.5% of the file.
# They are SwiftPM dependencies, not the standard library, and they now live
# in io_primitives_overlays/swift-nio-and-log.yaml, which LOADS BY DEFAULT
# and discloses itself. No recall was given up; the claim and the contents
# simply agree now.
#
# Note: Swift's tree-sitter analyzer extracts bare identifiers from call
# expressions, so module context is often "external".  Only include methods
# distinctive enough to avoid false positives without module disambiguation.
# Overly generic names (write, read, run, data) go in ambiguous_names.
provenance: builtin
language: swift
# Plan C, PR B / INV-titih: partial catalog. Promotion to
# ``status: provenance_declared`` requires adding ``stdlib_provenance``
# (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in io_boundary.py) — a
# citation check only; coverage is claimed per-module via
# ``module_completeness``.
status: in_progress

fs_read:
  - module: FileManager
    methods:
      - fileExists
      - contentsOfDirectory
      - subpathsOfDirectory
      - attributesOfItem
      - attributesOfFileSystem
      - contentsAtPath
      - isReadableFile
      - isWritableFile
      - isExecutableFile
      - isDeletableFile
      - contentsEqual
      - destinationOfSymbolicLink
      - enumerator
    notes: "FileManager methods — callee names are distinctive enough for unqualified matching"
  - module: FileHandle
    methods:
      - fileHandleForReading
      - readDataToEndOfFile
      - readData
      - availableData
  - module: InputStream
    methods:
      - inputStreamWithFileAtPath
  - module: Bundle
    methods:
      - pathForResource
      - urlForResource

fs_write:
  - module: FileManager
    methods:
      - createFile
      - createDirectory
      - removeItem
      - moveItem
      - copyItem
      - createSymbolicLink
      - setAttributes
      - replaceItem
    notes: "FileManager write/mutate methods"
  - module: FileHandle
    methods:
      - fileHandleForWriting
      - fileHandleForUpdating
      - writeData
      - truncateFile
      - synchronizeFile
      - seekToEnd

net_send:
  - module: URLSession
    methods:
      - dataTask
      - uploadTask
    notes: "URLSession request methods — dual-classified with net_recv"
  # NOT ROWED: `URLRequest(url:)`. It builds a request value and sends
  # nothing; the send is the URLSession task above (INV-gujoh, the family of
  # python's urllib.request.Request). It was rowed here until 2026-09-23,
  # keyed `methods:`, and never matched a call.
  - module: NWConnection
    functions:
      - NWConnection
    notes: >-
      Network.framework connection, the HANDLE shape of ADR-0049 ruling 4:
      `NWConnection(host:port:using:)` names the peer, and the bytes cross at
      the instance's start/send/receive, which are not rowed. A constructor is
      called on the type itself, so function-kind (ADR-0059).

net_recv:
  - module: URLSession
    methods:
      - downloadTask
    notes: >-
      URLSession download is primarily receive. The task is created
      suspended and crosses nothing until resume(); the file location
      arrives in the completion handler or at the delegate (Apple's
      downloadTask(with:) documentation). A deferred crossing by ADR-0049
      ruling 1 that STAYS net_recv for the reasons the objc NSURLSession
      row gives (WI-tunog): net_listen is the server-side value, and the
      arrival is not represented as a source. Residual: WI-mapim.

# ADR-0049: a call that ARRANGES inbound data to arrive in a scope it does
# not name is disclosed, never minted. The disclosure boundary is in place,
# so ruling 3 licenses the retag; these rows had never fired (they were
# keyed `methods:` and the analyzer emits a constructor call with no module
# hint), so no represented crossing is removed.
net_listen:
  - module: NWListener
    functions:
      - NWListener
    notes: >-
      SETUP (ADR-0049 ruling 4). `NWListener(using:on:)` configures a
      listener on a port; connections arrive at its newConnectionHandler,
      which the runtime invokes. go's net.Listen is the same row.

db_read:
  - module: NSManagedObjectContext
    methods:
      - executeFetchRequest
      - countForFetchRequest
      - existingObject
    notes: "Core Data fetch operations"
  - module: ModelContext
    functions:
      - ModelContext
    notes: >-
      SwiftData model context (iOS 17+). A HANDLE constructor, which ADR-0049
      keeps under the transfer boundary until the reads it hands out are rowed
      (python's sqlite3.connect is the same shape). Function-kind: a
      constructor is called on the type itself (ADR-0059).

db_compose:
  - module: NSFetchRequest
    functions:
      - NSFetchRequest
    notes: >-
      LAZY (ADR-0049 ruling 4): `NSFetchRequest(entityName:)` composes a
      query that has run nothing; the read happens when a context executes
      it. Moved from db_read, where it would have minted a source at the
      composition.

db_write:
  - module: NSManagedObjectContext
    methods:
      - deleteObject
      - insertNewObject
    notes: "Core Data write operations (save is ambiguous)"

subprocess:
  - module: Process
    methods:
      - run
      - launch
      - launchedProcess
    notes: >-
      Foundation.Process. The members that START the child (INV-vamif): run()
      and its class form Process.run(_:arguments:terminationHandler:) share
      the name, launch() is the pre-macOS-10.13 spelling, and
      launchedProcess(launchPath:arguments:) is the class-method launcher. This
      row used to list launchPath (a property, so never a call site),
      waitUntilExit, terminate and interrupt, and no launch at all.

env_read:
  - module: ProcessInfo
    methods: [processInfo]
    notes: "ProcessInfo.processInfo access (environment, processName, etc.)"
  - module: CommandLine
    attributes: [arguments]
    notes: >-
      `CommandLine.arguments`, a static property READ, not called (ADR-0059);
      argv is env_read in every catalogue (python sys.argv, javascript
      process.argv). No call ever named `CommandLine(...)`, so the old
      `methods: [CommandLine]` row could not match anything. The swift
      analyzer emits no module_attr_ref edge, so this row is unreachable
      until it does -- a stated recall gap, not a claim of coverage.

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: Date
    methods: [now]
    notes: >-
      WI-tubij: a clock read is host_info_read in EVERY catalogued language
      (WI-pavob ruling 2026-08-26, "yes in"). A monotonic clock counts: on
      Linux CLOCK_MONOTONIC runs from boot, so an early read leaks
      approximate uptime, which distinguishes machines. Arithmetic on an
      already-captured value is NOT a read and is refused. Date.now samples
      the clock.
  - module: ProcessInfo
    methods: [systemUptime]
  - module: DispatchTime
    methods: [now]
  - module: Bundle
    methods: [bundleIdentifier, infoDictionary]
    notes: "App bundle metadata"

logging:
  - module: Swift
    functions:
      - print
      - debugPrint
      - dump
    notes: "Swift standard output functions"
  - module: os
    functions:
      - NSLog
    notes: "Foundation logging function"

ipc_send:
  - module: Process
    methods:
      - terminate
      - interrupt
      - suspend
      - resume
    notes: >-
      INV-babiz: signals a child that is already running (swift-corelibs-foundation
      terminate is kill(processIdentifier, SIGTERM); interrupt SIGINT; suspend and
      resume SIGSTOP / SIGCONT). python.yaml's multiprocessing.Process kill/terminate
      and rust.yaml's Child.kill are rowed here under the dated WI-dupok ruling;
      these were under subprocess.
  # NotificationCenter.post is NOT rowed (WI-povom, audit-findings 0021 Step 5):
  # in-process pub/sub delivers to observers in the SAME process, and ipc_send
  # is data sent to ANOTHER process. Deleted rather than moved -- no process
  # boundary is crossed -- and disclosed as external_potential. objc.yaml's
  # NSNotificationCenter post* rows went the same way; the cross-process center
  # below stays.
  - module: DistributedNotificationCenter
    methods:
      - postNotificationName
    notes: "Cross-process notification (macOS only)"

ipc_recv:
  - module: NotificationCenter
    methods:
      - addObserver
    notes: >-
      Notification observation. NOT removeObserver (WI-rivur, swept with
      objc.yaml's removeObserver: rows): un-registering receives nothing, and
      ipc_recv minted an untrusted_input source at the call.

process_send:
  - module: Swift
    functions:
      - fatalError
      - preconditionFailure
      - assertionFailure
    notes: "Swift process termination/assertion functions"

# Names too generic to match without module context — these appear in many
# non-IO contexts (e.g., Data() for empty data, String interpolation,
# save() on custom types, write() on custom protocols).
ambiguous_names:
  - write
  - read
  - run
  - data
  - save
  - send
  - receive
  - open
  - close
  - start
  - stop
  - connect
  - listen
  - accept
  - Data
  - String
  - URL
  # Logger level methods — too generic without module context (e.g., info()
  # could be a struct property, error() could be Result handling, debug could
  # be a flag). Only match when module hint resolves to Logger.
  - trace
  - debug
  - info
  - notice
  - warning
  - error
  - critical

# ADR-0016 / INV-buzab: a dated, per-module audit that the module's I/O surface
# is enumerated, so an unrowed call into it is an EXAMINED negative.
module_completeness:
  - module: Process
    completeness: complete
    retrieved: "2026-09-27"
    notes: >-
      INV-babiz / INV-vamif. Methods: run (instance and class), launch,
      launchedProcess rowed subprocess; terminate, interrupt, suspend, resume
      rowed ipc_send. waitUntilExit is declared NOT I/O: it blocks until the
      child exits and returns nothing -- python.yaml's
      multiprocessing.Process.join, which is disclosed and not rowed (rust's
      Child.wait is rowed ipc_recv because it RETURNS the status; here the
      status is read separately, from the terminationStatus property).
      Everything else on the class is a property (executableURL, launchPath,
      arguments, environment, standardInput/Output/Error, terminationStatus,
      isRunning ...), configured before the launch or read after it, and is
      not a call site.
