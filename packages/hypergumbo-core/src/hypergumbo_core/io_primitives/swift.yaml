# ADR-0016: I/O primitive catalog for Swift
#
# Maps Foundation, UIKit, SwiftNIO, AsyncHTTPClient, NIOSSL, distributed
# tracing, and WebSocket APIs to I/O boundary types.  Uses Swift method names
# (not ObjC selectors).
#
# Note: Swift's tree-sitter analyzer extracts bare identifiers from call
# expressions, so module context is often "external".  Only include methods
# distinctive enough to avoid false positives without module disambiguation.
# Overly generic names (write, read, run, data) go in ambiguous_names.
language: swift

fs_read:
  - module: FileManager
    methods:
      - fileExists
      - contentsOfDirectory
      - subpathsOfDirectory
      - attributesOfItem
      - attributesOfFileSystem
      - contentsAtPath
      - isReadableFile
      - isWritableFile
      - isExecutableFile
      - isDeletableFile
      - contentsEqual
      - destinationOfSymbolicLink
      - enumerator
    notes: "FileManager methods — callee names are distinctive enough for unqualified matching"
  - module: FileHandle
    methods:
      - fileHandleForReading
      - readDataToEndOfFile
      - readData
      - availableData
  - module: InputStream
    methods:
      - inputStreamWithFileAtPath
  - module: NonBlockingFileIO
    methods:
      - readChunked
      - readChunk
      - readChunks
      - readToEnd
      - openFile
      - withFileHandle
    notes: "SwiftNIO non-blocking file I/O read operations"
  - module: Bundle
    methods:
      - pathForResource
      - urlForResource

fs_write:
  - module: FileManager
    methods:
      - createFile
      - createDirectory
      - removeItem
      - moveItem
      - copyItem
      - createSymbolicLink
      - setAttributes
      - replaceItem
    notes: "FileManager write/mutate methods"
  - module: FileHandle
    methods:
      - fileHandleForWriting
      - fileHandleForUpdating
      - writeData
      - truncateFile
      - synchronizeFile
      - seekToEnd
  - module: NonBlockingFileIO
    methods:
      - writeBuffer
    notes: "SwiftNIO non-blocking file write"

net_send:
  - module: URLSession
    methods:
      - dataTask
      - uploadTask
    notes: "URLSession request methods — dual-classified with net_recv"
  - module: URLRequest
    methods:
      - URLRequest
    notes: "URLRequest constructor implies HTTP request setup"
  - module: AsyncHTTPClient
    methods:
      - HTTPClientRequest
    notes: "AsyncHTTPClient request constructor (server-side Swift)"
  - module: NWConnection
    methods:
      - NWConnection
    notes: "Network.framework connection"
  - module: Channel
    methods:
      - writeAndFlush
      - fireChannelRead
      - addHandler
    notes: "SwiftNIO channel write, inbound data forwarding, and pipeline setup"
  - module: ChannelHandlerContext
    methods:
      - writeAndFlush
      - fireChannelRead
      - fireChannelInactive
      - fireErrorCaught
    notes: "SwiftNIO handler context I/O forwarding methods"
  - module: NIOSSL
    methods:
      - NIOSSLContext
      - NIOSSLCertificate
      - NIOSSLPrivateKey
    notes: "SwiftNIO TLS/SSL context and credential loading"

net_recv:
  - module: URLSession
    methods:
      - downloadTask
    notes: "URLSession download is primarily receive"
  - module: NWListener
    methods:
      - NWListener
    notes: "Network.framework listener"
  - module: ServerBootstrap
    methods:
      - ServerBootstrap
    notes: "SwiftNIO server bootstrap"
  - module: ClientBootstrap
    methods:
      - ClientBootstrap
    notes: "SwiftNIO client bootstrap"
  - module: EventLoopGroup
    methods:
      - MultiThreadedEventLoopGroup
    notes: "SwiftNIO event loop group for server networking"
  - module: NIOAsyncChannel
    methods:
      - NIOAsyncChannel
    notes: "SwiftNIO async channel for bidirectional IO (Swift Concurrency)"
  - module: Channel
    methods:
      - channelRead
    notes: "SwiftNIO channel handler inbound data callback"
  - module: NIOWebSocketServerUpgrader
    methods:
      - NIOWebSocketServerUpgrader
    notes: "SwiftNIO WebSocket server upgrader"
  - module: WebSocket
    methods:
      - onText
      - onBinary
      - onClose
    notes: "WebSocket event handlers for incoming messages"

db_read:
  - module: NSManagedObjectContext
    methods:
      - executeFetchRequest
      - countForFetchRequest
      - existingObject
    notes: "Core Data fetch operations"
  - module: NSFetchRequest
    methods:
      - NSFetchRequest
    notes: "Core Data fetch request constructor"
  - module: ModelContext
    methods:
      - ModelContext
    notes: "SwiftData model context (iOS 17+)"

db_write:
  - module: NSManagedObjectContext
    methods:
      - deleteObject
      - insertNewObject
    notes: "Core Data write operations (save is ambiguous)"

subprocess:
  - module: Process
    methods:
      - launchPath
      - waitUntilExit
      - terminate
      - interrupt
    notes: "Foundation.Process (macOS-only subprocess execution)"

env_read:
  - module: ProcessInfo
    methods:
      - processInfo
    notes: "ProcessInfo.processInfo access (environment, processName, etc.)"
  - module: CommandLine
    methods:
      - CommandLine
    notes: "CommandLine.arguments access"
  - module: Bundle
    methods:
      - bundleIdentifier
      - infoDictionary
    notes: "App bundle metadata"

logging:
  - module: Swift
    functions:
      - print
      - debugPrint
      - dump
    notes: "Swift standard output functions"
  - module: os
    functions:
      - NSLog
    notes: "Foundation logging function"
  - module: Logger
    methods:
      - Logger
      - trace
      - debug
      - info
      - notice
      - warning
      - error
      - critical
    notes: "swift-log Logger: constructor and level methods (trace/debug/info/notice/warning/error/critical)"
  - module: Tracing
    methods:
      - startSpan
      - endSpan
    notes: "Distributed tracing span lifecycle (swift-distributed-tracing)"

ipc_send:
  - module: NotificationCenter
    methods:
      - post
    notes: "In-process pub/sub notification posting"
  - module: DistributedNotificationCenter
    methods:
      - postNotificationName
    notes: "Cross-process notification (macOS only)"

ipc_recv:
  - module: NotificationCenter
    methods:
      - addObserver
      - removeObserver
    notes: "Notification observation"

process_send:
  - module: Swift
    functions:
      - fatalError
      - preconditionFailure
      - assertionFailure
    notes: "Swift process termination/assertion functions"
  - module: EventLoopGroup
    methods:
      - syncShutdownGracefully
    notes: "SwiftNIO event loop graceful shutdown"

# Names too generic to match without module context — these appear in many
# non-IO contexts (e.g., Data() for empty data, String interpolation,
# save() on custom types, write() on custom protocols).
ambiguous_names:
  - write
  - read
  - run
  - data
  - save
  - send
  - receive
  - open
  - close
  - start
  - stop
  - connect
  - listen
  - accept
  - Data
  - String
  - URL
  # Logger level methods — too generic without module context (e.g., info()
  # could be a struct property, error() could be Result handling, debug could
  # be a flag). Only match when module hint resolves to Logger.
  - trace
  - debug
  - info
  - notice
  - warning
  - error
  - critical
