# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for Swift
#
# Maps the Swift standard library and Apple's SYSTEM frameworks —
# Foundation, UIKit, Core Data, SwiftData, Network.framework, os — to I/O
# boundary types.  Uses Swift method names (not ObjC selectors).
#
# SCOPE (ADR-0016 §27, ADR-0047 ruling 8): what ships with the OS. This
# header used to name SwiftNIO, AsyncHTTPClient, NIOSSL, distributed tracing
# and WebSocket, and the catalogue carried them — 38 rows, 36.5% of the file.
# They are SwiftPM dependencies, not the standard library, and they now live
# in io_primitives_overlays/swift-nio-and-log.yaml, which LOADS BY DEFAULT
# and discloses itself. No recall was given up; the claim and the contents
# simply agree now.
#
# Note: Swift's tree-sitter analyzer extracts bare identifiers from call
# expressions, so module context is often "external".  Only include methods
# distinctive enough to avoid false positives without module disambiguation.
# Overly generic names (write, read, run, data) go in ambiguous_names.
language: swift
# Plan C, PR B / INV-titih: partial catalog. Promotion to
# ``status: provenance_declared`` requires adding ``stdlib_provenance``
# (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in io_boundary.py) — a
# citation check only; coverage is claimed per-module via
# ``module_completeness``.
status: in_progress

fs_read:
  - module: FileManager
    methods:
      - fileExists
      - contentsOfDirectory
      - subpathsOfDirectory
      - attributesOfItem
      - attributesOfFileSystem
      - contentsAtPath
      - isReadableFile
      - isWritableFile
      - isExecutableFile
      - isDeletableFile
      - contentsEqual
      - destinationOfSymbolicLink
      - enumerator
    notes: "FileManager methods — callee names are distinctive enough for unqualified matching"
  - module: FileHandle
    methods:
      - fileHandleForReading
      - readDataToEndOfFile
      - readData
      - availableData
  - module: InputStream
    methods:
      - inputStreamWithFileAtPath
  - module: Bundle
    methods:
      - pathForResource
      - urlForResource

fs_write:
  - module: FileManager
    methods:
      - createFile
      - createDirectory
      - removeItem
      - moveItem
      - copyItem
      - createSymbolicLink
      - setAttributes
      - replaceItem
    notes: "FileManager write/mutate methods"
  - module: FileHandle
    methods:
      - fileHandleForWriting
      - fileHandleForUpdating
      - writeData
      - truncateFile
      - synchronizeFile
      - seekToEnd

net_send:
  - module: URLSession
    methods:
      - dataTask
      - uploadTask
    notes: "URLSession request methods — dual-classified with net_recv"
  - module: URLRequest
    methods:
      - URLRequest
    notes: "URLRequest constructor implies HTTP request setup"
  - module: NWConnection
    methods:
      - NWConnection
    notes: "Network.framework connection"

net_recv:
  - module: URLSession
    methods:
      - downloadTask
    notes: "URLSession download is primarily receive"
  - module: NWListener
    methods:
      - NWListener
    notes: "Network.framework listener"

db_read:
  - module: NSManagedObjectContext
    methods:
      - executeFetchRequest
      - countForFetchRequest
      - existingObject
    notes: "Core Data fetch operations"
  - module: NSFetchRequest
    methods:
      - NSFetchRequest
    notes: "Core Data fetch request constructor"
  - module: ModelContext
    methods:
      - ModelContext
    notes: "SwiftData model context (iOS 17+)"

db_write:
  - module: NSManagedObjectContext
    methods:
      - deleteObject
      - insertNewObject
    notes: "Core Data write operations (save is ambiguous)"

subprocess:
  - module: Process
    methods:
      - launchPath
      - waitUntilExit
      - terminate
      - interrupt
    notes: "Foundation.Process (macOS-only subprocess execution)"

env_read:
  - module: ProcessInfo
    methods: [processInfo]
    notes: "ProcessInfo.processInfo access (environment, processName, etc.)"
  - module: CommandLine
    methods: [CommandLine]
    notes: "CommandLine.arguments access"

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: Date
    methods: [now]
    notes: >-
      WI-tubij: a clock read is host_info_read in EVERY catalogued language
      (WI-pavob ruling 2026-08-26, "yes in"). A monotonic clock counts: on
      Linux CLOCK_MONOTONIC runs from boot, so an early read leaks
      approximate uptime, which distinguishes machines. Arithmetic on an
      already-captured value is NOT a read and is refused. Date.now samples
      the clock.
  - module: ProcessInfo
    methods: [systemUptime]
  - module: DispatchTime
    methods: [now]
  - module: Bundle
    methods: [bundleIdentifier, infoDictionary]
    notes: "App bundle metadata"

logging:
  - module: Swift
    functions:
      - print
      - debugPrint
      - dump
    notes: "Swift standard output functions"
  - module: os
    functions:
      - NSLog
    notes: "Foundation logging function"

ipc_send:
  - module: NotificationCenter
    methods:
      - post
    notes: "In-process pub/sub notification posting"
  - module: DistributedNotificationCenter
    methods:
      - postNotificationName
    notes: "Cross-process notification (macOS only)"

ipc_recv:
  - module: NotificationCenter
    methods:
      - addObserver
      - removeObserver
    notes: "Notification observation"

process_send:
  - module: Swift
    functions:
      - fatalError
      - preconditionFailure
      - assertionFailure
    notes: "Swift process termination/assertion functions"

# Names too generic to match without module context — these appear in many
# non-IO contexts (e.g., Data() for empty data, String interpolation,
# save() on custom types, write() on custom protocols).
ambiguous_names:
  - write
  - read
  - run
  - data
  - save
  - send
  - receive
  - open
  - close
  - start
  - stop
  - connect
  - listen
  - accept
  - Data
  - String
  - URL
  # Logger level methods — too generic without module context (e.g., info()
  # could be a struct property, error() could be Result handling, debug could
  # be a flag). Only match when module hint resolves to Logger.
  - trace
  - debug
  - info
  - notice
  - warning
  - error
  - critical
