# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for Haskell
#
# Maps Haskell base/stdlib modules and common libraries to I/O boundary types.
# Haskell uses qualified module names (Data.Map, System.IO, Network.Socket).
# Prelude functions are auto-imported so appear without qualification.
# Third-party web frameworks (Servant, Yesod, Warp) call these primitives
# transitively, so covering base + common libraries is sufficient.
language: haskell
# Plan C, PR B / INV-titih: partial catalog. Promotion to
# ``status: provenance_declared`` requires adding ``stdlib_provenance``
# (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in io_boundary.py) — a
# citation check only; coverage is claimed per-module via
# ``module_completeness``.
status: in_progress

# Function names that are too generic to match without module context.
# Haskell Prelude auto-imports many names; same names appear in non-IO contexts.
ambiguous_names:
  - read          # Prelude.read (parse) vs System.IO.hGet
  - write         # any .write vs System.IO.hPut
  - run           # Warp.run vs IO.run, any .run
  - send          # Network.Socket.send vs any .send
  - recv          # Network.Socket.recv vs any .recv
  - connect       # Network.Socket.connect vs any .connect
  - bind          # Network.Socket.bind vs Monad.bind (>>=)
  - accept        # Network.Socket.accept vs any .accept
  - listen        # Network.Socket.listen vs any .listen
  - close         # Network.Socket.close vs any .close
  - open          # System.IO.openFile vs any .open
  - new           # IORef.new, MVar.new, TVar.new (very common)
  - get           # IORef.readIORef vs any .get
  - put           # IORef.writeIORef vs any .put, putStrLn (Prelude)
  - start         # Process.startProcess vs any .start
  - spawn         # forkIO vs any .spawn
  - print         # Prelude.print (IO) — common but often used for debugging
  - log           # any logging framework vs math log
  - trace         # Debug.Trace.trace vs any .trace
  - yield         # Control.Concurrent.yield vs any .yield

fs_read:
  - module: Prelude
    functions: [readFile, getContents, readIO, readLn, interact]
  - module: System.IO
    functions: [hGetContents, hGetLine, hGetChar, hReady, hIsEOF, hSeek, hTell, hFileSize, openFile, openBinaryFile, withFile, withBinaryFile]
  - module: System.Directory
    functions: [listDirectory, getDirectoryContents, doesFileExist, doesDirectoryExist, getPermissions, getFileSize, getModificationTime, getCurrentDirectory, getHomeDirectory, getTemporaryDirectory, findFile, findFiles, canonicalizePath, makeAbsolute]
  - module: Data.ByteString
    functions: [readFile, hGetContents, hGetLine, hGet, hGetSome, hGetNonBlocking]
  - module: Data.Text.IO
    functions: [readFile, hGetContents, hGetLine, getContents, getLine]

fs_write:
  - module: Prelude
    functions: [writeFile, appendFile]
  - module: System.IO
    functions: [hPutStr, hPutStrLn, hPutChar, hPrint, hPutBuf, hPutBufNonBlocking, hSetFileSize, hSetBuffering, hFlush, hClose]
    boundary_ruling: call_site_undecidable
    notes: >-
      Handle-based output. INV-vaduk: EXACTLY ONE of fs_write / logging is
      true per call and the call site cannot know which, because the answer
      is which Handle was passed -- stderr reads as logging, a file handle
      as fs_write. Same shape as C unistd.write depending on the fd. The
      `logging` row already said so in prose ("stderr handle used for
      logging"); this is that sentence made machine-readable.
  - module: System.Directory
    functions: [createDirectory, createDirectoryIfMissing, removeFile, removeDirectory, removeDirectoryRecursive, removePathForcibly, renameFile, renameDirectory, copyFile, copyFileWithMetadata, setPermissions, setCurrentDirectory]
  - module: Data.ByteString
    functions: [writeFile, appendFile, hPut, hPutStr, hPutNonBlocking]
  - module: Data.Text.IO
    functions: [writeFile, appendFile, hPutStr, hPutStrLn]

net_send:
  - module: Network.Socket
    functions: [send, sendTo, sendAll, sendMany, connect]
    notes: >-
      `close` REMOVED (INV-nular): closing a socket transmits no application
      data. It emits a FIN at the transport layer, which is not a payload any
      line of the program produced, and net_send is a taint SINK -- so the row
      accepted a tainted value as "sent" at a call that sends nothing of the
      program's. send/sendTo/sendAll/sendMany carry the real egress.
  - module: Network.Socket.ByteString
    functions: [send, sendAll, sendTo, sendMany, sendManyTo]
  - module: Network.HTTP.Client
    functions: [httpLbs, httpNoBody, httpBS, responseOpen, withResponse, newManager]
  - module: Network.HTTP.Simple
    functions: [httpBS, httpLBS, httpJSON, httpNoBody, httpSink, httpJSONEither]
  - module: Network.HTTP.Req
    functions: [req, runReq]

net_recv:
  - module: Network.Socket
    functions: [recv, recvFrom, accept]
    notes: >-
      socket/bind/listen REMOVED (INV-nular, WI-dosov): setup calls that
      transfer nothing, minting untrusted_input via the auto-source map.
      `gracefulClose` REMOVED for a related but distinct reason: it sends a FIN
      and then READS AND DISCARDS until EOF or timeout, so bytes do cross the
      boundary but none reaches the program -- the function returns unit -- and
      net_recv under the auto-source map means a SOURCE of data the program
      then uses. recv/recvFrom remain and carry the real receive.
  - module: Network.Socket.ByteString
    functions: [recv, recvFrom]
  - module: Network.Wai
    functions: [responseLBS, responseFile, responseBuilder, responseStream]
    notes: "WAI response constructors (used with Warp)"
  - module: Network.Wai.Handler.Warp
    functions: [run, runSettings, runTLS, runEnv]
    notes: "Warp HTTP server"

subprocess:
  - module: System.Process
    functions: [callProcess, callCommand, readProcess, readProcessWithExitCode, readCreateProcess, readCreateProcessWithExitCode, createProcess, spawnProcess, spawnCommand, system, rawSystem, waitForProcess, terminateProcess, interruptProcessGroupOf, cleanupProcess]
  - module: System.Process.Typed
    functions: [runProcess, readProcess, startProcess, stopProcess, withProcessWait, withProcessTerm]

env_read:
  - module: System.Environment
    functions: [getArgs, getEnvironment, lookupEnv, getEnv]

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: Data.Time.Clock
    functions: [getCurrentTime]
    notes: >-
      WI-tubij: a clock read is host_info_read in EVERY catalogued language
      (WI-pavob ruling 2026-08-26, "yes in"). A monotonic clock counts: on
      Linux CLOCK_MONOTONIC runs from boot, so an early read leaks
      approximate uptime, which distinguishes machines. Arithmetic on an
      already-captured value is NOT a read and is refused.
  - module: Data.Time.Clock.System
    functions: [getSystemTime]
  - module: GHC.Clock
    functions: [getMonotonicTime]
    notes: >-
      base's monotonic clock.
  - module: System.Environment
    functions: [getProgName, getExecutablePath]
  - module: System.Info
    functions: [os, arch, compilerName, compilerVersion]

env_write:
  - module: System.Environment
    functions: [setEnv, unsetEnv, withArgs, withProgName]
  - module: System.Exit
    functions: [exitWith, exitFailure, exitSuccess, die]

logging:
  - module: Prelude
    functions: [putStr, putStrLn, print, putChar]
  - module: System.IO
    functions: [hPutStr, hPutStrLn, hPrint, hPutChar]
    boundary_ruling: call_site_undecidable
    notes: >-
      Handle-based output. INV-vaduk: EXACTLY ONE of fs_write / logging is
      true per call and the call site cannot know which, because the answer
      is which Handle was passed -- stderr reads as logging, a file handle
      as fs_write. Same shape as C unistd.write depending on the fd. The
      `logging` row already said so in prose ("stderr handle used for
      logging"); this is that sentence made machine-readable.
  - module: Debug.Trace
    functions: [trace, traceShow, traceShowId, traceIO, traceM, traceShowM, traceStack]

# db_read / db_write: DELETED (INV-nular, WI-rigut).
#
# Haskell's ENTIRE db_* surface was Data.IORef, Data.STRef,
# Control.Concurrent.MVar and Control.Concurrent.STM -- 31 rows, and not one
# database among them. These are in-process mutable references: no descriptor,
# no syscall, and nothing outside this process can observe a write to one.
#
# THE ROWS DID NOT MERELY MISLABEL, THEY MINTED TAINT. db_read is an
# auto-derived taint SOURCE (AUTO_SOURCE_LABEL_MAP: db_read -> untrusted_input)
# and db_write an auto-derived SINK, so `readIORef` invented untrusted input at
# every call site and `writeIORef` accepted it as a database write. All five
# shellcheck true positives in measurement 0006 are real dataflow filed under
# `untrusted-input-no-database` against exactly this family -- genuine value
# chains making a vacuous claim, which is the mechanism behind that
# measurement's headline being an upper bound on useful precision.
#
# THE QUESTION WAS ALREADY WRITTEN HERE AND DEFERRED, in the STM rows' own
# `boundary_ruling: unruled` note: "the prior question is whether the db_*
# classification of the whole Data.IORef / STRef / MVar / STM family is right
# at all -- these are in-process mutable references, not a database -- which is
# a vocabulary decision beyond this row." This is that decision.
#
# REMOVING THEM NARROWS NO CLAIM. Haskell rows no real database anywhere, so
# the catalogue loses no ability it had; it stops asserting one it never had
# the rows to support. Taint PROPAGATION through a ref is a dataflow question
# and was never what these rows provided -- they fabricated a source, they did
# not carry one across.

process_send:
  - module: Control.Concurrent
    functions: [forkIO, forkOS, forkFinally, killThread, throwTo, yield, threadDelay]
  - module: Control.Exception
    functions: [throwIO, throw, throwTo]
    notes: "Exception throwing as a form of inter-thread communication"
