# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for Go
#
# Maps Go standard library functions to I/O boundary types.
language: go
# Plan C, PR B / INV-titih: partial catalog. Promotion to
# ``status: provenance_declared`` requires adding ``stdlib_provenance``
# (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in io_boundary.py) — a
# citation check only; coverage is claimed per-module via
# ``module_completeness``.
status: in_progress

# Method names that are too generic to match without module context.
# When the edge has no module_hint (or "external"), these names are skipped
# to avoid false positives like t.Run() → gin.Engine.Run.
ambiguous_names:
  - Read          # io.Reader.Read vs any .Read() method
  - Write         # io.Writer.Write vs any .Write() method
  - Run           # exec.Cmd.Run vs testing.T.Run, cobra.Command.Run
  - Start         # exec.Cmd.Start vs any .Start() method
  - String        # fmt.Stringer.String vs any .String() method
  - Close         # net.Conn.Close vs any .Close() method
  - Do            # http.Client.Do vs any .Do() method
  - Get           # http.Client.Get vs map.Get, cache.Get
  - Post          # http.Client.Post vs forum.Post
  - Head          # http.Client.Head vs list.Head
  - Serve         # overlay-supplied grpc.Server.Serve vs any .Serve()
  - Accept        # net.Listener.Accept vs any .Accept() method
  - Listen        # net.Listen vs any .Listen() method
  - Dial          # net.Dial vs any .Dial() method
  - DialContext   # grpc.DialContext vs any .DialContext() method
  - Output        # exec.Cmd.Output vs any .Output() method
  - JSON          # overlay-supplied gin.Context.JSON vs encoding/json
  - HTML          # overlay-supplied gin.Context.HTML vs template.HTML
  - XML           # overlay-supplied gin.Context.XML vs encoding/xml
  - Send          # net.UdpSocket.Send vs channel send
  - Debug         # slog.Debug vs any .Debug() method
  - Info          # slog.Info vs any .Info() method
  - Warn          # slog.Warn vs any .Warn() method
  - Error         # slog.Error vs error.Error(), any .Error() method
  - Log           # slog.Log vs any .Log() method
  - Data          # smtp.Client.Data vs any .Data() method
  - Mail          # smtp.Client.Mail vs any .Mail() method
  - Handshake     # tls.Conn.Handshake vs any .Handshake() method

fs_read:
  - module: os
    functions: [Open, ReadFile, ReadDir, Stat, Lstat, Readlink]
  - module: io
    functions: [ReadAll, ReadFull, Copy]
  - module: io/ioutil
    functions: [ReadFile, ReadDir, ReadAll]
    notes: "Deprecated in Go 1.16 but still widely used"
  - module: filepath
    functions: [Walk, WalkDir, Glob]
  # Low-level syscall IO (important for kernel/runtime projects like gvisor)
  - module: syscall
    functions: [Open, Openat, Read, Pread, Readlink, Stat, Lstat, Fstat, Getdents]

fs_write:
  - module: os
    functions: [Create, CreateTemp, Mkdir, MkdirAll, MkdirTemp, Remove, RemoveAll, Rename, WriteFile, Chmod, Chown, Chtimes, Link, Symlink, Truncate]
  - module: io/ioutil
    functions: [WriteFile, TempFile, TempDir]
  - module: io
    functions: [WriteString]
  - module: testing.T
    methods: [TempDir]
    notes: "Go testing stdlib — creates temp dir scoped to test"
  - module: testing.B
    methods: [TempDir]
    notes: "Go benchmark stdlib — creates temp dir scoped to benchmark"
  - module: syscall
    functions: [Write, Pwrite, Mkdir, Rmdir, Unlink, Rename, Chmod, Fchmod, Chown, Fchown, Truncate, Ftruncate]

net_send:
  - module: net
    functions: [Dial, DialTCP, DialUDP, DialUnix, DialTimeout]
  - module: net.Conn
    methods: [Write]
  - module: crypto/tls
    functions: [Dial, DialWithDialer, Client]
    notes: "TLS connection establishment"
  - module: crypto/tls.Conn
    methods: [Write, Handshake]
  - module: net/smtp
    functions: [NewClient, Dial, SendMail]
    notes: "SMTP email sending"
  - module: net/smtp.Client
    methods: [Mail, Rcpt, Data, Close]
  - module: net/http
    functions: [Get, Post, PostForm, Head, NewRequest]
  - module: net/http.Client
    methods: [Do, Get, Post, Head]
  - module: net/http.Transport
    methods: [RoundTrip]
  # gRPC client
  - module: syscall
    functions: [Connect, Sendto, Sendmsg]

net_recv:
  - module: net.Listener
    methods: [Accept]
    notes: >-
      KEPT (ADR-0049 ruling 4). Accept returns a PEER-CHOSEN connection to its
      own caller, so it is a transfer and not a member of the deferred-crossing
      family -- the same verdict WI-dosov reached for Haskell when it dropped
      socket/bind/listen while keeping accept.
  - module: net.Conn
    methods: [Read]
  - module: net/http
    functions: [ListenAndServe, ListenAndServeTLS, Serve]
    notes: >-
      KEPT net_recv DELIBERATELY. These are server LAUNCH, not connection
      setup, and the launch family is pinned together across nine languages by
      TestServerLaunchStaysAReceive until ADR-0049 §"Open work" step 3
      (adjudicated findings per shape) clears. INV-kanuk moved the SETUP rows
      only.
  - module: syscall
    functions: [Accept, Accept4, Recvfrom, Recvmsg]
    notes: >-
      Socket/Bind/Listen MOVED to net_listen (INV-kanuk, ADR-0049 ruling 1):
      they return a descriptor or an error and transfer nothing, while net_recv
      auto-derives a taint source via AUTO_SOURCE_LABEL_MAP. Accept/Accept4
      return a peer-chosen connection and Recvfrom/Recvmsg return bytes, so
      those four stay.

# ADR-0049 DEFERRED CROSSINGS: the call ARRANGES a crossing whose data arrives
# somewhere it does not name. net_listen mints no taint and shadows net_recv,
# so the crossing is DISCLOSED rather than either minted or silently dropped.
net_listen:
  - module: net
    functions: [Listen, ListenTCP, ListenUDP, ListenUnix, ListenPacket]
    notes: >-
      SETUP. Returns a net.Listener; nothing has been received. The bytes
      arrive at a later Accept/Read, which are rowed separately under net_recv.
  - module: syscall
    functions: [Socket, Bind, Listen]
    notes: >-
      SETUP. Returns a file descriptor or an error.

subprocess:
  - module: os/exec
    functions: [Command, CommandContext, LookPath]
  - module: os/exec.Cmd
    methods: [Run, Start, Output, CombinedOutput]
  - module: syscall
    functions: [Exec, ForkExec]

env_read:
  - module: os
    functions: [Getenv, LookupEnv, Environ]

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: time
    functions: [Now, Since, Until]
    notes: >-
      WI-tubij: a clock read is host_info_read in EVERY catalogued language
      (WI-pavob ruling 2026-08-26, "yes in"). A monotonic clock counts: on
      Linux CLOCK_MONOTONIC runs from boot, so an early read leaks
      approximate uptime, which distinguishes machines. Arithmetic on an
      already-captured value is NOT a read and is refused. golang/go
      src/time/time.go: Since and Until are documented as shorthand for
      Now()-based expressions and sample the clock internally, so they are
      reads, not arithmetic.
  - module: os
    functions: [Hostname, UserHomeDir, UserCacheDir, UserConfigDir, Executable, Getwd]
  - module: runtime
    functions: [GOOS, GOARCH]
    notes: "Constants, not functions, but captured as host_info_read"

ipc_send:
  - module: os
    attributes: [Stdout, Stderr]

logging:
  - module: fmt
    functions: [Print, Println, Printf, Fprint, Fprintln, Fprintf]
    notes: "Console output — logging, not IPC"
  - module: log
    functions: [Print, Println, Printf, Fatal, Fatalln, Fatalf, Panic, Panicln, Panicf]
    notes: "Go stdlib log package — writes to stderr by default"
  - module: log/slog
    functions: [Debug, Info, Warn, Error, Log, NewTextHandler, NewJSONHandler]
    notes: "Go stdlib structured logging — writes to stderr by default"
  - module: log/slog.Logger
    methods: [Debug, Info, Warn, Error, Log]
    notes: "slog.Logger instance methods"

ipc_recv:
  - module: os
    attributes: [Stdin]
  - module: bufio
    functions: [NewScanner, NewReader]
    notes: "When wrapping os.Stdin"
