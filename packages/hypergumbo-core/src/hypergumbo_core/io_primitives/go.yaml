# ADR-0016: I/O primitive catalog for Go
#
# Maps Go standard library functions to I/O boundary types.
language: go

fs_read:
  - module: os
    functions: [Open, ReadFile, ReadDir, Stat, Lstat, Readlink]
  - module: io
    functions: [ReadAll, ReadFull, Copy]
  - module: io/ioutil
    functions: [ReadFile, ReadDir, ReadAll]
    notes: "Deprecated in Go 1.16 but still widely used"
  - module: filepath
    functions: [Walk, WalkDir, Glob]
  # Low-level syscall IO (important for kernel/runtime projects like gvisor)
  - module: syscall
    functions: [Open, Openat, Read, Pread, Readlink, Stat, Lstat, Fstat, Getdents]
  - module: unix
    functions: [Open, Openat, Read, Pread, Readlink, Stat, Lstat, Fstat, Fstatat]
    notes: "golang.org/x/sys/unix"

fs_write:
  - module: os
    functions: [Create, CreateTemp, Mkdir, MkdirAll, MkdirTemp, Remove, RemoveAll, Rename, WriteFile, Chmod, Chown, Chtimes, Link, Symlink, Truncate]
  - module: io/ioutil
    functions: [WriteFile, TempFile, TempDir]
  - module: io
    functions: [WriteString]
  - module: syscall
    functions: [Write, Pwrite, Mkdir, Rmdir, Unlink, Rename, Chmod, Fchmod, Chown, Fchown, Truncate, Ftruncate]
  - module: unix
    functions: [Write, Pwrite, Mkdir, Rmdir, Unlink, Unlinkat, Renameat, Mkdirat]
    notes: "golang.org/x/sys/unix"

net_send:
  - module: net
    functions: [Dial, DialTCP, DialUDP, DialUnix, DialTimeout]
  - module: net.Conn
    methods: [Write]
  - module: net/http
    functions: [Get, Post, PostForm, Head, NewRequest]
  - module: net/http.Client
    methods: [Do, Get, Post, Head]
  # Gin/Echo/Fiber/Chi frameworks (response writing)
  - module: gin.Context
    methods: [JSON, String, HTML, XML, YAML, Data, IndentedJSON]
    notes: "Gin web framework response methods"
  - module: echo.Context
    methods: [JSON, String, HTML, XML, Blob, Stream]
    notes: "Echo web framework response methods"
  # gRPC client
  - module: grpc
    functions: [Dial, DialContext, NewClient]
    notes: "gRPC client connection"
  - module: syscall
    functions: [Connect, Sendto, Sendmsg]
  - module: unix
    functions: [Connect, Sendto, Sendmsg]

net_recv:
  - module: net
    functions: [Listen, ListenTCP, ListenUDP, ListenUnix, ListenPacket]
  - module: net.Listener
    methods: [Accept]
  - module: net.Conn
    methods: [Read]
  - module: net/http
    functions: [ListenAndServe, ListenAndServeTLS, Serve]
  # Gin/Echo/Fiber frameworks (server startup)
  - module: gin.Engine
    methods: [Run, RunTLS]
    notes: "Gin web framework server"
  - module: echo.Echo
    methods: [Start, StartTLS]
    notes: "Echo web framework server"
  - module: fiber.App
    methods: [Listen, ListenTLS]
    notes: "Fiber web framework server"
  # gRPC server
  - module: grpc.Server
    methods: [Serve]
    notes: "gRPC server"
  - module: syscall
    functions: [Socket, Bind, Listen, Accept, Accept4, Recvfrom, Recvmsg]
  - module: unix
    functions: [Socket, Bind, Listen, Accept, Accept4, Recvfrom, Recvmsg]

subprocess:
  - module: os/exec
    functions: [Command, CommandContext, LookPath]
  - module: os/exec.Cmd
    methods: [Run, Start, Output, CombinedOutput]
  - module: syscall
    functions: [Exec, ForkExec]

env_read:
  - module: os
    functions: [Getenv, LookupEnv, Environ, Hostname, UserHomeDir, UserCacheDir, UserConfigDir, Executable, Getwd]
  - module: runtime
    functions: [GOOS, GOARCH]
    notes: "Constants, not functions, but captured as env_read"

ipc_send:
  - module: os
    attributes: [Stdout, Stderr]
  - module: fmt
    functions: [Print, Println, Printf, Fprint, Fprintln, Fprintf]
    notes: "When writing to os.Stdout/Stderr"

ipc_recv:
  - module: os
    attributes: [Stdin]
  - module: bufio
    functions: [NewScanner, NewReader]
    notes: "When wrapping os.Stdin"
