# ADR-0016: I/O primitive catalog for Kotlin
#
# Kotlin-specific I/O primitives. This catalog is MERGED with java.yaml
# (via _CATALOG_PARENTS) so all java.io.*, java.nio.*, java.net.*, JDBC,
# JPA entries are also available — Kotlin code that calls
# `java.io.FileInputStream` directly is matched via the parent. This file
# adds the things Kotlin idiom favors over the raw Java APIs:
#
# - Kotlin stdlib top-level I/O (println, print, readLine).
# - kotlin.io extension functions on java.io.File / java.nio.file.Path
#   (readText, writeText, forEachLine, useLines, copyTo, walk, etc.).
#
# Plan C, PR A: strict-stdlib rule. Kotlin's stdlib is `kotlin.*`
# (plus inherited `java.*` / `javax.*` / `jakarta.*` from the Java
# parent). The previously-catalogued third-party Kotlin ecosystem —
# ktor, kotlin-logging (mu.KLogger / io.github.oshai.kotlinlogging),
# Android SDK (android.util.Log), Exposed ORM
# (org.jetbrains.exposed.*) — is removed. First-party calls into them
# surface in `external_potential` (Plan C, PR C); project-local taint
# catalogs (WI-votan) provide per-project classification when needed.
language: kotlin

# ---------------------------------------------------------------------------
# Ambiguous short names — Kotlin idioms that collide with I/O primitive names.
# ---------------------------------------------------------------------------
# Kotlin stdlib has many extension functions whose names overlap with both
# Java I/O methods and Kotlin's own collection / scope-function vocabulary.
# These names are skipped for SHORT-NAME matching when module_hint is
# "external" (unresolved). Qualified-name and module-filtered matching
# still work normally.
ambiguous_names:
  # Kotlin scope functions and collection ops that collide with I/O verbs
  - apply       # kotlin scope function vs Statement.apply (rare)
  - run         # kotlin scope function vs Process.run / Runtime.exec
  - let         # kotlin scope function — frequent
  - also        # kotlin scope function
  - with        # kotlin scope function
  - use         # kotlin Resource.use vs anything named `use`
  - takeIf      # kotlin idiom
  - takeUnless  # kotlin idiom
  - map         # collection map (ubiquitous)
  - flatMap     # collection flatMap (ubiquitous)
  - filter      # collection filter
  - fold        # collection fold
  - reduce      # collection reduce
  - forEach     # collection forEach (ubiquitous)
  - first       # collection first
  - last        # collection last
  - find        # collection find vs File.find (Files.find is FQN)
  - get         # operator function (ubiquitous)
  - set         # operator function (ubiquitous)
  - copy        # data class copy vs File.copyTo
  - to          # Pair construction (ubiquitous)
  # Kotlin coroutines / Flow / Channel ops that collide with networking verbs
  - send        # Channel.send vs Socket.send
  - receive     # Channel.receive vs Socket.receive
  - close       # Channel.close, Closeable.close
  - flow        # Flow builder
  - emit        # FlowCollector.emit
  - collect     # Flow.collect (collides with collection.collect)
  # Logging level names (every logging library has these)
  - trace
  - debug
  - info
  - warn
  - warning
  - error
  - fatal

# ---------------------------------------------------------------------------
# Filesystem read — Kotlin extension functions on java.io.File / Path
# ---------------------------------------------------------------------------
fs_read:
  - module: java.io.File
    methods:
      - readText
      - readLines
      - readBytes
      - forEachLine
      - useLines
      - bufferedReader
      - reader
      - inputStream
    notes: "kotlin.io extension functions on java.io.File"
  - module: java.nio.file.Path
    methods:
      - readText
      - readLines
      - readBytes
      - bufferedReader
      - inputStream
      - useLines
      - forEachLine
    notes: "Kotlin 1.5+ kotlin.io.path.* extensions"
  - module: kotlin.io.FilesKt
    methods:
      - readText
      - readLines
      - readBytes
      - forEachLine
      - useLines
    notes: "kotlin.io public top-level (compiler-emitted FilesKt receiver)"

# ---------------------------------------------------------------------------
# Filesystem write — Kotlin extension functions on java.io.File / Path
# ---------------------------------------------------------------------------
fs_write:
  - module: java.io.File
    methods:
      - writeText
      - writeBytes
      - appendText
      - appendBytes
      - bufferedWriter
      - writer
      - outputStream
      - printWriter
      - copyTo
      - copyRecursively
      - deleteRecursively
      - mkdir
      - mkdirs
    notes: "kotlin.io extension functions on java.io.File"
  - module: java.nio.file.Path
    methods:
      - writeText
      - writeBytes
      - appendText
      - appendBytes
      - bufferedWriter
      - outputStream
      - copyTo
      - moveTo
      - createFile
      - createDirectory
      - createDirectories
    notes: "Kotlin 1.5+ kotlin.io.path.* extensions"

# ---------------------------------------------------------------------------
# Logging — Kotlin top-level println/print only (stdlib).
# Plan C, PR A: SLF4J wrappers (kotlin-logging mu.KLogger /
# io.github.oshai.kotlinlogging.KLogger), Android Log (android.util.Log),
# and ktor's logger removed under strict-stdlib rule.
# ---------------------------------------------------------------------------
logging:
  - module: kotlin.io.ConsoleKt
    methods: [println, print]
    notes: "kotlin.io top-level println/print (compiler emits ConsoleKt receiver)"
