# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for Rust
#
# Maps std library functions to I/O boundary types. Covers Rust stable std.
# Third-party crates (tokio, reqwest, etc.) trace through these primitives.
language: rust
# WI-tukif (Plan C, PR B) audited this catalog against doc.rust-lang.org/std/
# on 2026-05-24 for Rust 1.78 and recorded that "coverage is complete for the
# strict-stdlib IO surface", naming std::fs and std::path::Path among the
# modules it covered.
#
# THAT COMPLETENESS CLAIM WAS FALSE AND IS WITHDRAWN (WI-bupor, 2026-08-27).
# A total-surface audit against the installed toolchain found TWENTY missing
# stable I/O primitives in exactly those modules: std::fs::File carried three
# associated functions and NOT ONE of its eleven stable methods, and
# std::fs::DirBuilder / std::fs::DirEntry / std::path were absent outright.
# The module was IN the catalog, so it never appeared on any "unexamined
# module" list while half its I/O surface was missing. CATALOGUE PRESENCE IS
# NOT CATALOGUE COVERAGE, and a claim of completeness written from a doc index
# is not the same evidence as an enumeration of the module's surface.
#
# AUDITED BY ENUMERATION (rustc 1.94.0, library/std/src, 2026-08-27):
#   std::fs, std::fs::File, std::fs::DirBuilder, std::fs::DirEntry,
#   std::path, std::path::Path.
# NOT YET AUDITED, and therefore NOT complete however full they look:
#   std::io, std::net, std::process, std::env, std::path::PathBuf.
#
# std::ffi (FFI types are meta-IO, not IO) and std::sync / std::thread
# (concurrency primitives — and a mutex changes no state outside the process)
# are intentionally absent.
#
# std::os::* IS AN OPEN CONFLICT, NOT A SETTLED EXCLUSION. This header
# previously excluded "std::os::* raw-fd extensions", whose noun is the raw-fd
# extension traits — meta-IO, correctly out. But WI-bupor names
# std::os::windows::fs as IN scope, and its symlink_file / symlink_dir are
# plain filesystem mutation, not raw-fd anything, while the cross-platform
# equivalent std::fs::soft_link IS catalogued below. Excluding one and
# cataloguing the other is an inconsistency rather than a decision, and it is
# recorded here rather than resolved silently in passing.
status: provenance_declared
stdlib_provenance:
  source_url: https://doc.rust-lang.org/std/
  version: "1.78"
  retrieved: "2026-05-24"
  notes: |
    Rust std I/O primitives derived from doc.rust-lang.org's std-library
    index for Rust 1.78 stable. Third-party async-IO and HTTP crates
    (tokio, hyper, reqwest, axum, actix-web) are intentionally excluded
    under the Plan C strict-stdlib rule; first-party calls into them
    surface in external_potential via the Plan C, PR C filter.
    stdlib_other is not enumerated yet — populated incrementally as needed.

# Method names that are too generic to match without module context.
# Rust traits mean .read(), .write(), .connect() etc. appear on many types;
# only some are actual IO.
ambiguous_names:
  - read          # Read trait — Vec<u8>, Cursor, BufReader, not just TcpStream
  - read_to_end   # Read::read_to_end on any impl Read, not just network
  - read_to_string # Read::read_to_string on any impl Read
  - write         # Write trait — Vec<u8>, BufWriter, not just TcpStream
  - write_all     # Write::write_all on any impl Write
  - write_fmt     # Write::write_fmt on any impl Write
  - flush         # Write::flush on any impl Write
  - connect       # TcpStream::connect vs any .connect() method
  - bind          # TcpListener::bind vs any .bind() method
  - accept        # TcpListener::accept vs any .accept() method
  - send          # UdpSocket::send vs channel::Sender.send
  - send_to       # UdpSocket::send_to vs any .send_to()
  - recv          # UdpSocket::recv vs channel::Receiver.recv
  - recv_from     # UdpSocket::recv_from vs any .recv_from()
  - run           # actix_web::HttpServer.run vs tokio::Runtime.run, any .run()
  - get           # reqwest::Client.get vs HashMap.get
  - post          # reqwest::Client.post vs any .post()
  - put           # reqwest::Client.put vs HashMap::insert (called .put in other APIs)
  - delete        # reqwest::Client.delete vs any .delete()
  - head          # reqwest::Client.head vs any .head()
  - open          # File::open vs any .open()
  - create        # File::create vs any .create()
  - spawn         # Command::spawn vs tokio::spawn, thread::spawn
  - new           # Command::new vs any constructor
  - output        # Command::output vs any .output()
  - status        # Command::status vs any .status()
  - route         # axum::Router.route vs any .route()

fs_read:
  - module: std::fs
    functions: [read, read_to_string, read_dir, metadata, symlink_metadata, canonicalize,
                exists, read_link]
  - module: std::fs::File
    functions: [open]
    methods: [metadata]
    notes: >-
      File::open is read-mode by default. DECLARED AS A FUNCTION, NOT A
      METHOD, and the distinction is load-bearing rather than pedantic:
      `File::open(p)` is an ASSOCIATED function with no receiver, so a call
      site can never produce a method-construct edge. Declared as a method it
      was unmatchable by construction, AND it made
      `verify_claims.method_starved_modules` report std::fs::File as a module
      whose I/O is "structurally invisible" — withholding every verdict on any
      Rust repo that opens a file. Measured on encrypted-dns-server: the edge
      resolves correctly to std::fs::File / open and the verdict was withheld
      anyway (INV-nular: kind asserted by name, never checked against
      semantics).
  - module: std::path::Path
    methods: [exists, is_file, is_dir, read_dir, metadata, symlink_metadata, canonicalize,
              read_link, try_exists, is_symlink]
  - module: std::fs::DirEntry
    methods: [metadata, file_type]
    notes: >-
      `path` and `file_name` are in-memory and are deliberately absent.
      `file_type` is platform-dependent — it returns a cached type where
      readdir supplies d_type and stats otherwise — and is included on
      refuse-by-default grounds: the wrong answer here is a false
      all-clear.
  - module: std::env
    functions: [current_dir]
  - module: std::path
    functions: [absolute]
    notes: >-
      `std::path::absolute` delegates to `env::current_dir()` for a
      relative path, which is getcwd(2). Catalogued as fs_read to match
      the boundary already assigned to `std::env::current_dir` directly
      above — one fact, one kind. `is_separator` performs no I/O and is
      absent.
  # Plan C, PR A: tokio::fs (async filesystem) removed under
  # strict-stdlib rule. tokio is ubiquitous but a third-party crate;
  # first-party calls into it surface in external_potential (Plan C, PR C).

fs_write:
  - module: std::fs
    functions: [write, create_dir, create_dir_all, remove_file, remove_dir, remove_dir_all,
                rename, copy, hard_link, soft_link, set_permissions]
  - module: std::fs::File
    functions: [create, create_new]
    methods: [set_len, set_permissions, set_times, sync_all, sync_data,
              lock, lock_shared, try_lock, try_lock_shared, unlock]
    notes: >-
      Associated functions, not methods — see the std::fs::File fs_read note.
      `File::create(p)` takes no receiver.
      THE LOCK FAMILY IS fs_write, AND THE CHOICE IS DELIBERATE. flock /
      LockFileEx changes no byte of the file, so `fs_write` overstates it —
      but a lock is observable to another PROCESS, which is the boundary
      test that ruled std::sync::Mutex out, and it is the one case in that
      discussion which passes. Omitting it is a false all-clear; fs_write
      is the only one of the nine kinds that carries it without a new
      heavyweight axis, and the residual over-claim is narrow — it can only
      mislead a program that opens read-only and locks. Reversible: a
      dedicated kind would be the alternative if this proves noisy.
      `try_clone` is dup(2) and is ABSENT: a syscall, but nothing crosses
      and nothing outside the process changes.
  - module: std::fs::DirBuilder
    methods: [create]
    notes: >-
      `create` takes &self and is a METHOD — `DirBuilder::new()` is the
      associated function and performs no I/O, so it is absent.
      `recursive` is a builder setter.
  - module: std::fs::OpenOptions
    methods: [open]
    notes: "When write/append/create flags are set"
  - module: std::io::Write
    methods: [write, write_all, write_fmt, flush]
  # Plan C, PR A: tokio::fs removed (third-party crate).

net_send:
  - module: std::net::TcpStream
    functions: [connect]
    notes: >-
      Associated functions take no receiver, so a call site can never
      produce a method-construct edge. Declared as methods they were
      unmatchable by construction AND marked the module method-starved,
      withholding every verdict on the repo (INV-nular).
  - module: std::net::TcpStream
    methods: [write, write_all]
  - module: std::net::UdpSocket
    methods: [send, send_to]
  # Plan C, PR A: tokio::net (async networking) and the Hyper /
  # Reqwest HTTP clients removed under strict-stdlib rule. First-party
  # calls into tokio / hyper / reqwest surface in external_potential
  # (Plan C, PR C).

net_recv:
  - module: std::net::TcpListener
    functions: [bind]
    notes: >-
      Associated functions take no receiver, so a call site can never
      produce a method-construct edge. Declared as methods they were
      unmatchable by construction AND marked the module method-starved,
      withholding every verdict on the repo (INV-nular).
  - module: std::net::TcpListener
    methods: [accept, incoming]
  - module: std::net::TcpStream
    methods: [read, read_to_end, read_to_string]
  - module: std::net::UdpSocket
    functions: [bind]
    notes: >-
      Associated functions take no receiver, so a call site can never
      produce a method-construct edge. Declared as methods they were
      unmatchable by construction AND marked the module method-starved,
      withholding every verdict on the repo (INV-nular).
  - module: std::net::UdpSocket
    methods: [recv, recv_from]
  # Plan C, PR A: tokio::net, hyper::Server, axum::Router, and
  # actix_web::HttpServer removed (third-party crates).

subprocess:
  - module: std::process::Command
    functions: [new]
    notes: >-
      Associated functions take no receiver, so a call site can never
      produce a method-construct edge. Declared as methods they were
      unmatchable by construction AND marked the module method-starved,
      withholding every verdict on the repo (INV-nular).
  - module: std::process::Command
    methods: [spawn, output, status]
  - module: std::process
    functions: [exit, abort]

env_read:
  - module: std::env
    functions: [var, var_os, vars, args, args_os]

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: std::env
    functions: [current_exe]
  - module: std::env
    attributes: [consts]
    notes: "std::env::consts::OS, ARCH, etc."

ipc_recv:
  - module: std::io
    functions: [stdin]

logging:
  # WI-dutah: std::io.{stdout,stderr} are terminal output, not IPC.
  # Same threat-model logic as Python sys.{stdout,stderr} (WI-tolif).
  - module: std::io
    functions: [stdout, stderr]
    notes: "Terminal / log output; redirectable but not an IPC channel"
