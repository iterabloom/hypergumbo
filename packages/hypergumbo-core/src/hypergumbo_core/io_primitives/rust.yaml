# ADR-0016: I/O primitive catalog for Rust
#
# Maps std library functions to I/O boundary types. Covers Rust stable std.
# Third-party crates (tokio, reqwest, etc.) trace through these primitives.
language: rust

fs_read:
  - module: std::fs
    functions: [read, read_to_string, read_dir, metadata, symlink_metadata, canonicalize]
  - module: std::fs::File
    methods: [open]
    notes: "File::open is read-mode by default"
  - module: std::path::Path
    methods: [exists, is_file, is_dir, read_dir, metadata, symlink_metadata, canonicalize, read_link]
  - module: std::env
    functions: [current_dir]

fs_write:
  - module: std::fs
    functions: [write, create_dir, create_dir_all, remove_file, remove_dir, remove_dir_all, rename, copy, hard_link, soft_link]
  - module: std::fs::File
    methods: [create, create_new]
  - module: std::fs::OpenOptions
    methods: [open]
    notes: "When write/append/create flags are set"
  - module: std::io::Write
    methods: [write, write_all, write_fmt, flush]

net_send:
  - module: std::net::TcpStream
    methods: [connect, write, write_all]
  - module: std::net::UdpSocket
    methods: [send, send_to]

net_recv:
  - module: std::net::TcpListener
    methods: [bind, accept, incoming]
  - module: std::net::TcpStream
    methods: [read, read_to_end, read_to_string]
  - module: std::net::UdpSocket
    methods: [recv, recv_from, bind]

subprocess:
  - module: std::process::Command
    methods: [new, spawn, output, status]
  - module: std::process
    functions: [exit, abort]

env_read:
  - module: std::env
    functions: [var, var_os, vars, args, args_os, current_exe]
  - module: std::env
    attributes: [consts]
    notes: "std::env::consts::OS, ARCH, etc."

ipc_send:
  - module: std::io
    functions: [stdout, stderr]
    notes: "Writing to stdout/stderr"

ipc_recv:
  - module: std::io
    functions: [stdin]
