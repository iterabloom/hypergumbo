# ADR-0016: I/O primitive catalog for Objective-C
#
# Maps Foundation, UIKit, and common framework APIs to I/O boundary types.
# Selectors use ObjC colon notation (e.g., "removeItemAtPath:error:").
# All selectors with colons MUST be quoted to avoid YAML key-value parsing.
#
# Note: C-level I/O (fopen, read, write, socket, etc.) is covered by c.yaml.
# This catalog covers ObjC-specific Foundation/Cocoa wrappers.
provenance: builtin
language: objc
# Plan C, PR B / INV-titih: partial catalog. Promotion to
# ``status: provenance_declared`` requires adding ``stdlib_provenance``
# (see ALLOWED_PROVENANCE_HOSTNAME_SUFFIXES in io_boundary.py) — a
# citation check only; coverage is claimed per-module via
# ``module_completeness``.
status: in_progress

# Selector names that are too generic to match without class context.
# ObjC message sends use short selectors that appear on many classes.
ambiguous_names:
  - read          # NSFileHandle read vs any read
  - write         # NSFileHandle write vs any write
  - open          # NSFileHandle open vs any open
  - close         # NSFileHandle close vs any close
  - send          # NSURLSession send vs any send
  - start         # NSURLSessionTask start vs any start
  - data          # NSData.data vs any .data property
  - run           # NSRunLoop.run vs any run
  - get           # NSURLSession GET vs NSDictionary.objectForKey
  - delete        # NSFileManager delete vs any delete
  - connect       # NSStream connect vs any connect

fs_read:
  - module: NSFileManager
    methods:
      - "fileExistsAtPath:"
      - "fileExistsAtPath:isDirectory:"
      - "contentsOfDirectoryAtPath:error:"
      - "contentsOfDirectoryAtURL:includingPropertiesForKeys:options:error:"
      - "subpathsOfDirectoryAtPath:error:"
      - "subpathsAtPath:"
      - "attributesOfItemAtPath:error:"
      - "attributesOfFileSystemForPath:error:"
      - "contentsAtPath:"
      - "isReadableFileAtPath:"
      - "isWritableFileAtPath:"
      - "isExecutableFileAtPath:"
      - "isDeletableFileAtPath:"
      - "contentsEqualAtPath:andPath:"
      - "destinationOfSymbolicLinkAtPath:error:"
  - module: NSData
    methods:
      - "dataWithContentsOfFile:"
      - "dataWithContentsOfFile:options:error:"
      - "dataWithContentsOfURL:"
      - "dataWithContentsOfURL:options:error:"
      - "initWithContentsOfFile:"
      - "initWithContentsOfURL:"
    notes: "NSData file/URL constructors cross I/O boundary"
  - module: NSString
    methods:
      - "stringWithContentsOfFile:encoding:error:"
      - "stringWithContentsOfURL:encoding:error:"
      - "initWithContentsOfFile:encoding:error:"
      - "initWithContentsOfURL:encoding:error:"
  - module: NSFileHandle
    methods:
      - "fileHandleForReadingAtPath:"
      - "fileHandleForReadingFromURL:error:"
      - "readDataOfLength:"
      - readDataToEndOfFile
      - availableData
  - module: NSInputStream
    methods:
      - "inputStreamWithFileAtPath:"
      - "inputStreamWithURL:"
      - "read:maxLength:"
  - module: NSBundle
    methods:
      - "pathForResource:ofType:"
      - "pathForResource:ofType:inDirectory:"
      - "URLForResource:withExtension:"
      - "URLForResource:withExtension:subdirectory:"

fs_write:
  - module: NSFileManager
    methods:
      - "createFileAtPath:contents:attributes:"
      - "createDirectoryAtPath:withIntermediateDirectories:attributes:error:"
      - "createDirectoryAtURL:withIntermediateDirectories:attributes:error:"
      - "removeItemAtPath:error:"
      - "removeItemAtURL:error:"
      - "moveItemAtPath:toPath:error:"
      - "moveItemAtURL:toURL:error:"
      - "copyItemAtPath:toPath:error:"
      - "copyItemAtURL:toURL:error:"
      - "createSymbolicLinkAtPath:withDestinationPath:error:"
      - "setAttributes:ofItemAtPath:error:"
  - module: NSData
    methods:
      - "writeToFile:atomically:"
      - "writeToFile:options:error:"
      - "writeToURL:atomically:"
      - "writeToURL:options:error:"
  - module: NSString
    methods:
      - "writeToFile:atomically:encoding:error:"
      - "writeToURL:atomically:encoding:error:"
  - module: NSFileHandle
    methods:
      - "fileHandleForWritingAtPath:"
      - "fileHandleForWritingToURL:error:"
      - "fileHandleForUpdatingAtPath:"
      - "fileHandleForUpdatingURL:error:"
      - "writeData:"
      - "truncateFileAtOffset:"
      - "seekToFileOffset:"
      - synchronizeFile
  - module: NSOutputStream
    methods:
      - "outputStreamToFileAtPath:append:"
      - "write:maxLength:"

net_send:
  - module: NSURLSession
    methods:
      - "dataTaskWithRequest:completionHandler:"
      - "dataTaskWithRequest:"
      - "uploadTaskWithRequest:fromData:completionHandler:"
      - "uploadTaskWithRequest:fromData:"
      - "uploadTaskWithRequest:fromFile:completionHandler:"
      - "uploadTaskWithRequest:fromFile:"
      - "uploadTaskWithStreamedRequest:"
    notes: "Dual-classified with net_recv; request implies both send and receive"
  # SPLIT from the row below (INV-zumin). These two methods perform the request
  # and hand back the response, so net_send and net_recv are BOTH true of one
  # call; the `net_recv:` section declares the same two, and `simultaneous`
  # must be spelled on every row for a primitive or the loader rejects the pair.
  - module: NSURLConnection
    simultaneous: true
    methods:
      - "sendSynchronousRequest:returningResponse:error:"
      - "sendAsynchronousRequest:queue:completionHandler:"
    notes: "Deprecated but still widely used in older codebases"
  # NOT simultaneous: these are declared under net_send ALONE, so there is no
  # second boundary for them to be simultaneous with. Kept in their own row
  # because a parity test rejects the flag on a single-boundary primitive —
  # it fired on this very row's first version, which grouped all four methods.
  - module: NSURLConnection
    methods:
      - "connectionWithRequest:delegate:"
      - "initWithRequest:delegate:"
    notes: "Deprecated connection constructors — send side only"
  - module: NSMutableURLRequest
    methods:
      - "requestWithURL:"
      - "initWithURL:"
      - "setHTTPBody:"
      - "setHTTPMethod:"

net_recv:
  - module: NSURLSession
    methods:
      - "dataTaskWithURL:completionHandler:"
      - "dataTaskWithURL:"
      - "downloadTaskWithURL:completionHandler:"
      - "downloadTaskWithURL:"
      - "downloadTaskWithRequest:completionHandler:"
      - "downloadTaskWithRequest:"
      - "downloadTaskWithResumeData:completionHandler:"
  - module: NSURLConnection
    simultaneous: true
    methods:
      - "sendSynchronousRequest:returningResponse:error:"
      - "sendAsynchronousRequest:queue:completionHandler:"
    notes: >-
      Dual-classified with net_send. INV-zumin: `simultaneous` implements what
      the sibling row's note already ASSERTED in prose -- "request implies both
      send and receive" -- which nothing consumed, so net_recv was unreachable
      and inbound response data was never tracked as a network read.
      `connectionWithRequest:delegate:` appears only on the net_send row and so
      stays single-boundary; the loader returns no simultaneity for a primitive
      with one declared boundary.

db_read:
  - module: NSManagedObjectContext
    methods:
      - "executeFetchRequest:error:"
      - "countForFetchRequest:error:"
      - "objectWithID:"
      - "existingObjectWithID:error:"
      - "objectRegisteredForID:"
    notes: "Core Data fetch operations"
  - module: NSFetchRequest
    methods:
      - "fetchRequestWithEntityName:"
    notes: "Core Data fetch request creation"
  - module: NSPersistentStoreCoordinator
    methods:
      - "addPersistentStoreWithType:configuration:URL:options:error:"

db_write:
  - module: NSManagedObjectContext
    methods:
      - "save:"
      - "deleteObject:"
      - "insertNewObjectForEntityForName:inManagedObjectContext:"
    notes: "Core Data write operations"
  - module: NSPersistentStoreCoordinator
    methods:
      - "removePersistentStore:error:"
      - "migratePersistentStore:toURL:options:withType:error:"

subprocess:
  - module: NSTask
    methods:
      - launch
      - "launchAndReturnError:"
      - "launchedTaskWithLaunchPath:arguments:"
      - "launchedTaskWithExecutableURL:arguments:error:terminationHandler:"
    notes: >-
      NSTask is macOS-only. The members that START the child: launch /
      launchAndReturnError: on an instance, and the two class-method launchers
      (INV-vamif: launchedTaskWithLaunchPath:arguments: was missing).
      waitUntilExit, terminate and interrupt used to sit here too; see
      ipc_send and module_completeness (INV-babiz).

env_read:
  - module: NSProcessInfo
    methods: [environment]

# INV-tutar: host DESCRIPTION reads. Split out of env_read because
# AUTO_SOURCE_LABEL_MAP derives a taint LABEL from the boundary, and
# calling runtime.GOOS or platform.system a host SECRET made every
# host-secret-* claim count description reads as secret flows.
host_info_read:
  - module: NSDate
    methods: [date, timeIntervalSinceReferenceDate]
    notes: >-
      WI-tubij: a clock read is host_info_read in EVERY catalogued language
      (WI-pavob ruling 2026-08-26, "yes in"). A monotonic clock counts: on
      Linux CLOCK_MONOTONIC runs from boot, so an early read leaks
      approximate uptime, which distinguishes machines. Arithmetic on an
      already-captured value is NOT a read and is refused.
      swift-corelibs-foundation Sources/Foundation/NSDate.swift: the
      no-argument initialiser calls CFAbsoluteTimeGetCurrent(), and the
      CLASS property timeIntervalSinceReferenceDate returns
      Date().timeIntervalSinceReferenceDate. Instance arithmetic
      (timeIntervalSince:, addingTimeInterval:) gets no row.
  - module: NSProcessInfo
    methods: [systemUptime]
  - module: NSProcessInfo
    methods: [processName, hostName, operatingSystemVersionString, physicalMemory, processorCount]
  - module: NSBundle
    methods: [bundleIdentifier, infoDictionary, "objectForInfoDictionaryKey:"]
    notes: "App bundle metadata access"

logging:
  - module: Foundation
    functions:
      - NSLog
    notes: "The standard Objective-C logging function"
  - module: os_log
    functions:
      - os_log
      - os_log_error
      - os_log_fault
      - os_log_debug
      - os_log_info
    notes: "Apple unified logging (macOS 10.12+, iOS 10+)"

ipc_send:
  - module: NSTask
    methods:
      - terminate
      - interrupt
      - suspend
      - resume
    notes: >-
      INV-babiz: signals a child that is already running (SIGTERM, SIGINT,
      SIGSTOP / SIGCONT). python.yaml's multiprocessing.Process kill/terminate
      and rust.yaml's Child.kill are rowed here under the dated WI-dupok ruling;
      terminate and interrupt were under subprocess.
  # NSNotificationCenter postNotificationName:object: /
  # postNotificationName:object:userInfo: / postNotification: are NOT rowed
  # (WI-povom, audit-findings 0021 Step 5). They were here, "In-process pub/sub;
  # classified as IPC for boundary analysis": a notification posted to an
  # in-process center is delivered to observers in the SAME process, and
  # ipc_send is data sent to ANOTHER process. No process boundary is crossed,
  # so there is no data-crossing value to move them to; unrowed, they are
  # disclosed as external_potential. The cross-process center below stays.
  - module: NSDistributedNotificationCenter
    methods:
      - "postNotificationName:object:userInfo:deliverImmediately:"
    notes: "Cross-process notification (macOS only)"

ipc_recv:
  - module: NSNotificationCenter
    methods:
      - "addObserverForName:object:queue:usingBlock:"
      - "addObserver:selector:name:object:"
      - "removeObserver:"
      - "removeObserver:name:object:"

# ADR-0016 / INV-buzab: a dated, per-module audit that the module's I/O surface
# is enumerated, so an unrowed call into it is an EXAMINED negative.
module_completeness:
  - module: NSTask
    completeness: complete
    retrieved: "2026-09-27"
    notes: >-
      INV-babiz / INV-vamif. launch, launchAndReturnError: and the class
      launchers launchedTaskWithLaunchPath:arguments: and
      launchedTaskWithExecutableURL:arguments:error:terminationHandler: rowed
      subprocess; terminate, interrupt, suspend, resume rowed ipc_send.
      waitUntilExit is declared NOT I/O: it blocks until the child exits and
      returns void (python.yaml's multiprocessing.Process.join, disclosed not
      rowed). The setters and getters (setLaunchPath:, setArguments:,
      setStandardOutput:, terminationStatus, isRunning ...) configure the task
      before the launch or read it after, and cross nothing themselves.
