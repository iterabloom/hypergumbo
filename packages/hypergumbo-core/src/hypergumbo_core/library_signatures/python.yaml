# Library signatures for Python.
#
# WI-lalot. py.py's TYPE_PRESERVING_MEMBERS says in its own comment that the
# concept's home is FileAnalysis.method_return_types and that it exists only
# because "the types here ship no source for Pass 1 to parse". These rows ARE
# that home, so the pathlib entries MIGRATE here rather than being duplicated --
# one fact, one home.
#
# KEY SHAPE: the callee's IMPORT-RESOLVED qualified name, the same for a member
# (`pathlib.Path.joinpath`) and a module-level FACTORY (`csv.writer`):
# `import csv; csv.writer(f)`, `import csv as c; c.writer(f)` and
# `from csv import writer; writer(f)` all resolve to `csv.writer`. VALUE: the
# returned type, spelled as the io_primitives rows spell the module slot.
# Two consumers in py.py read these rows, and they answer different questions:
#   * _library_producer_type (WI-kozaj): what does a CALL to this callee
#     return? Types `w = csv.writer(f)` so `w.writerow(row)` reaches the
#     _csv.Writer rows. Any row, member or factory.
#   * TYPE_PRESERVING_MEMBERS: which members keep a typed RECEIVER's type
#     across a chain? Only rows whose value equals their owner.
#
# NOT here: EXTERNAL_CONSTRUCTOR_TYPES, which is catalogue-DERIVED from the
# io_primitives method rows and answers "what does sqlite3.connect() CONSTRUCT".
# Deriving beats enumerating; these rows answer a different question.
provenance: builtin
language: python
module_completeness: partial
signatures:
  # pathlib: migrated from TYPE_PRESERVING_MEMBERS. Every one returns a Path.
  pathlib.Path.__truediv__: pathlib.Path
  pathlib.Path.joinpath: pathlib.Path
  pathlib.Path.resolve: pathlib.Path
  pathlib.Path.absolute: pathlib.Path
  pathlib.Path.expanduser: pathlib.Path
  pathlib.Path.with_name: pathlib.Path
  pathlib.Path.with_suffix: pathlib.Path
  pathlib.Path.with_stem: pathlib.Path
  pathlib.Path.relative_to: pathlib.Path
  pathlib.Path.readlink: pathlib.Path
  # socket / subprocess / sqlite3: the receivers INV-mumov's Django-shaped chains
  # and WI-lipis's wrapper census reach through a library return value.
  socket.socket.accept: socket.socket
  socket.socket.makefile: io.BufferedRWPair
  subprocess.Popen.communicate: builtins.tuple
  sqlite3.Connection.cursor: sqlite3.Cursor
  sqlite3.Connection.execute: sqlite3.Cursor
  sqlite3.Cursor.execute: sqlite3.Cursor
  # csv (WI-kozaj): csv.writer is a builtin FUNCTION returning a _csv.Writer
  # (python 3.12: `type(csv.writer(io.StringIO())) is _csv.Writer`). The data
  # goes in at Writer.writerow / writerows, which io_primitives rows fs_write;
  # this row is what lets a receiver bound to the factory reach them.
  csv.writer: _csv.Writer
  # urllib.request (WI-dibit): build_opener is a FUNCTION returning an
  # OpenerDirector (python 3.12: `type(urllib.request.build_opener()) is
  # urllib.request.OpenerDirector`). The send happens at OpenerDirector.open,
  # which io_primitives rows net_send; this row is what lets `opener =
  # build_opener(); opener.open(url, data)` reach it.
  urllib.request.build_opener: urllib.request.OpenerDirector
  # WI-kanor: os.popen hands back a pipe to the child, not its output; the
  # read through it (os._wrap_close.read) is where the child's bytes cross.
  os.popen: os._wrap_close
