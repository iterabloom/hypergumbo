  # django ORM (INV-mumov, Phase 6 PR 1). The QuerySet API members that return a
  # QuerySet, keyed on the module the io community overlay rows this API under
  # (``django.db.models`` + method name), so the type PRESERVES
  # across a chain -- ``Order.objects.filter(...).exclude(...).exists()`` -- through
  # TYPE_PRESERVING_MEMBERS exactly as pathlib.Path does. The chain ROOT
  # (``<x>.objects.<member>()``) is WI-sozoj's marker, recognised in
  # ``_preserved_receiver_type``; this file only says which members keep the type.
  # NOT here, deliberately: get / first / last / earliest / latest (a Model
  # instance: a project class, no module), count / exists / aggregate (scalars),
  # in_bulk (a dict), iterator (a generator), raw (RawQuerySet), and every write.
  # Django is a third-party framework, so these rows are community (ADR-0061):
