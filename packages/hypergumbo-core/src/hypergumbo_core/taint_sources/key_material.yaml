# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0017: Built-in taint source catalog — cryptographic key material.
#
# Functions whose return values carry the "key_material" taint label.
# Key material should never be written to persistent storage or sent
# to untrusted zones. Standard-library rows only; third-party key APIs
# (cryptography, hkdf, ring) are in key_material_community.yaml (ADR-0061).
provenance: builtin
description: "Cryptographic key material"
taint_label: key_material

sources:
  python:
    - module: os
      functions: [urandom]
      return_tainted: true

  typescript:
    - module: crypto
      functions: [subtle.generateKey, subtle.importKey, subtle.deriveKey, subtle.deriveBits]
      return_tainted: true

  go:
    - module: crypto/rand
      functions: [Read]
      return_tainted: true

  java:
    - module: javax.crypto
      methods: [KeyGenerator.generateKey, SecretKeyFactory.generateSecret]
      return_tainted: true
