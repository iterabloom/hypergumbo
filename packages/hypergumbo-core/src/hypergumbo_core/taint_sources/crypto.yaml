# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0017: Built-in taint source catalog — cryptographic decryption outputs.
#
# Functions whose return values carry the "plaintext" taint label.
# Applies to any project that decrypts data and needs to track where
# the plaintext goes. Standard-library rows only; third-party decryption
# APIs (cryptography, aes-gcm, ring, @noble/ciphers) are in
# crypto_community.yaml (ADR-0061).
provenance: builtin
description: "Cryptographic decryption outputs — data is now plaintext"
taint_label: plaintext

sources:
  typescript:
    - module: crypto
      functions: [subtle.decrypt]
      return_tainted: true

  go:
    - module: crypto/aes
      methods: [cipher.Open]
      return_tainted: true
    - module: crypto/cipher
      methods: [AEAD.Open]
      return_tainted: true

  java:
    - module: javax.crypto
      methods: [Cipher.doFinal]
      return_tainted: true
