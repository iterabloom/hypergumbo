# SPDX-License-Identifier: AGPL-3.0-or-later
# Configuration file convention patterns
#
# These patterns add concept metadata to symbols from config file analyzers
# (json_config.py, xml_config.py, toml_config.py). This enables dependency
# symbols to participate in concept-based features.
#
# Note: Dependencies are not typically entrypoints, but having concepts
# enables consistent filtering and future concept-driven features.

id: config-conventions
language: multi

patterns:
  # ====== NPM/Node.js (json_config.py) ======
  # NPM dependencies
  - concept: npm_dependency
    symbol_kind: "^dependency$"
    language: "^json$"

  # NPM dev dependencies (WI-limas: Wave 6 fold — kind="dependency" +
  # meta["dependency_scope"]="dev"; previously kind="devDependency")
  - concept: npm_dev_dependency
    symbol_kind: "^dependency$"
    language: "^json$"
    meta_match:
      dependency_scope: "^dev$"

  # NPM scripts are potential entry points (npm run <script>)
  # WI-limas: post-fold the json_config producer emits kind="file" +
  # meta["entry_role"]="script"; the legacy "^script$" kind never landed.
  - concept: npm_script
    symbol_kind: "^file$"
    language: "^json$"
    meta_match:
      entry_role: "^script$"

  # NPM bin entries are CLI entry points (executables installed globally)
  - concept: npm_bin
    symbol_kind: "^bin$"
    language: "^json$"

  # Package definition
  - concept: package_definition
    symbol_kind: "^package$"
    language: "^json$"

  # TypeScript project references
  - concept: typescript_reference
    symbol_kind: "^reference$"
    language: "^json$"

  # TypeScript config
  # WI-limas: post-fold producer emits kind="file" + meta["config_format"]="tsconfig"
  # per audit-findings 0005 (composite-config DEPRECATE-NO-FOLD). The legacy
  # "^tsconfig$" symbol_kind never landed in the canonical registry.
  - concept: typescript_config
    symbol_kind: "^file$"
    language: "^json$"
    meta_match:
      config_format: "^tsconfig$"

  # Composer (PHP) packages
  # WI-limas: post-fold producer emits kind="package" + meta["package_ecosystem"]="composer"
  # (json_config.py:837-848). The legacy "^composer_package$" symbol_kind never
  # landed in the canonical registry.
  - concept: composer_dependency
    symbol_kind: "^package$"
    language: "^json$"
    meta_match:
      package_ecosystem: "^composer$"

  # ====== Maven/Android (xml_config.py) ======
  # Maven dependencies
  - concept: maven_dependency
    symbol_kind: "^dependency$"
    language: "^xml$"

  # Maven modules
  - concept: maven_module
    symbol_kind: "^module$"
    language: "^xml$"

  # Android permissions
  - concept: android_permission
    symbol_kind: "^permission$"
    language: "^xml$"

  # Android activities / services / receivers / providers (potential entry
  # points). Producer xml_config.py:_process_android_application emits
  # kind="component" with meta["component_type"] = "activity" | "service" |
  # "receiver" | "provider" per WI-razus's canonical fold; the four rules
  # below filter on the meta key. Routing <provider> through
  # component+meta keeps the canonical "provider" kind (Apex/Salesforce)
  # cleanly disjoint from Android content providers.
  - concept: android_component
    symbol_kind: "^component$"
    language: "^xml$"
    meta_match:
      component_type: "^activity$"

  - concept: android_component
    symbol_kind: "^component$"
    language: "^xml$"
    meta_match:
      component_type: "^service$"

  - concept: android_component
    symbol_kind: "^component$"
    language: "^xml$"
    meta_match:
      component_type: "^receiver$"

  - concept: android_component
    symbol_kind: "^component$"
    language: "^xml$"
    meta_match:
      component_type: "^provider$"

  # ====== Cargo/Rust (toml_config.py) ======
  # WI-vifun: cargo_* and poetry_* dependency patterns share the identical
  # symbol_kind + language ("^dependency$" in "^toml$") — but TOML is a FORMAT,
  # not an ecosystem, so both fired on every pyproject.toml AND Cargo.toml dep
  # (bare and dev variants alike). Discriminate by file: cargo_* → Cargo.toml,
  # poetry_* → pyproject.toml.
  # Cargo dependencies
  - concept: cargo_dependency
    symbol_kind: "^dependency$"
    language: "^toml$"
    symbol_path: "Cargo\\.toml$"

  # Cargo dev dependencies (WI-limas: producer toml_config.py emits
  # kind="dependency" + meta["dependency_scope"]="dev" for [dev-dependencies];
  # the bare "^dev-dependency$" kind was never canonical.)
  - concept: cargo_dev_dependency
    symbol_kind: "^dependency$"
    language: "^toml$"
    symbol_path: "Cargo\\.toml$"
    meta_match:
      dependency_scope: "^dev$"

  # Cargo build dependencies (WI-limas: producer emits
  # kind="dependency" + meta["dependency_scope"]="build" for [build-dependencies].)
  - concept: cargo_build_dependency
    symbol_kind: "^dependency$"
    language: "^toml$"
    symbol_path: "Cargo\\.toml$"
    meta_match:
      dependency_scope: "^build$"

  # Cargo package definition
  - concept: cargo_package
    symbol_kind: "^package$"
    language: "^toml$"

  # Cargo workspace member (WI-limas: producer emits kind="workspace" for
  # [workspace] tables — the legacy "^workspace-member$" kind never landed.)
  - concept: cargo_workspace_member
    symbol_kind: "^workspace$"
    language: "^toml$"

  # Cargo binary target (analyzer creates kind="binary" for [[bin]] sections)
  - concept: cargo_binary
    symbol_kind: "^binary$"
    language: "^toml$"

  # Cargo library target (WI-limas: producer toml_config.py:157 emits
  # kind="library" for [lib] tables; the legacy "^lib$" kind never landed.)
  - concept: cargo_library
    symbol_kind: "^library$"
    language: "^toml$"

  # Python (pyproject.toml) console scripts - CLI entry points
  # [project.scripts] defines executables installed with the package.
  # WI-limas: post-fold producer emits kind="file" + meta["entry_role"]="script"
  # (toml_config.py:568-590), matching the same shape as npm scripts.
  - concept: pyproject_script
    symbol_kind: "^file$"
    language: "^toml$"
    meta_match:
      entry_role: "^script$"

  # Poetry (Python) dependencies (WI-vifun: gated to pyproject.toml — see the
  # cargo block above; without this both cargo_dependency and poetry_dependency
  # fired on every TOML dependency regardless of ecosystem.)
  - concept: poetry_dependency
    symbol_kind: "^dependency$"
    language: "^toml$"
    symbol_path: "pyproject\\.toml$"

  # Poetry dev dependencies (WI-limas: see cargo_dev_dependency rationale —
  # the toml_config producer routes both Cargo and Poetry dev tables through
  # _extract_cargo_dependencies, so the same kind + dependency_scope shape applies.)
  - concept: poetry_dev_dependency
    symbol_kind: "^dependency$"
    language: "^toml$"
    symbol_path: "pyproject\\.toml$"
    meta_match:
      dependency_scope: "^dev$"

linkers:
  - dependency
