# Micronaut framework patterns (ADR-0003)
#
# Micronaut is a Java/Kotlin microservices framework. Controllers use
# @Controller with @Get/@Post/@Put/@Delete method annotations.
#
# Note: Java analyzer stores annotations in meta["decorators"] (not
# meta["annotations"]), so all patterns use the `decorator:` field.
# This matches the convention used by jax-rs.yaml and spring-boot.yaml.

id: micronaut
language: java

patterns:
  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================
  # Micronaut Controller annotation
  # @Controller("/api") defines the base path for all method routes
  - concept: controller
    decorator: "^Controller$"
    extract_path: "args[0]"

  # Micronaut HTTP method annotations
  # Method routes inherit path prefix from class-level @Controller (prefix_from_parent)
  - concept: route
    decorator: "^(Get|Post|Put|Delete|Patch|Head|Options)$"
    extract_path: "args[0]"
    extract_method: "decorator_name_upper"
    prefix_from_parent: "controller"

  # Micronaut @Produces
  - concept: route
    decorator: "^Produces$"

  # Micronaut @Consumes
  - concept: route
    decorator: "^Consumes$"

  # Micronaut path variable
  - concept: route
    decorator: "^PathVariable$"

  # Micronaut query parameter
  - concept: route
    decorator: "^QueryValue$"

  # Micronaut request body
  - concept: route
    decorator: "^Body$"

  # Micronaut HTTP client
  - concept: http_client
    decorator: "^Client$"

  # Micronaut Singleton (dependency injection)
  - concept: service
    decorator: "^Singleton$"

  # Micronaut Prototype
  - concept: service
    decorator: "^Prototype$"

  # Micronaut Bean
  - concept: service
    decorator: "^Bean$"

  # Micronaut Factory
  - concept: factory
    decorator: "^Factory$"

  # Micronaut Replaces
  - concept: service
    decorator: "^Replaces$"

  # Micronaut event listeners
  - concept: event_handler
    decorator: "^EventListener$"

  # Micronaut async events
  - concept: event_handler
    decorator: "^Async$"

  # Micronaut scheduled tasks
  - concept: scheduled
    decorator: "^Scheduled$"

  # Micronaut ServerFilter (middleware)
  - concept: middleware
    decorator: "^Filter$"

  # Micronaut ExceptionHandler
  - concept: error_handler
    decorator: "^(Error|ExceptionHandler)$"

  # Micronaut WebSocket
  - concept: websocket_handler
    decorator: "^(ServerWebSocket|ClientWebSocket)$"

  # Micronaut messaging (Kafka, RabbitMQ)
  - concept: message_handler
    decorator: "^(KafkaListener|RabbitListener)$"

  # Micronaut gRPC
  - concept: grpc_service
    decorator: "^GrpcService$"

  # Micronaut Data Repository
  - concept: repository
    decorator: "^Repository$"

  # Micronaut Configuration
  - concept: config
    decorator: "^(ConfigurationProperties|EachProperty)$"

linkers:
  - http
  - grpc
  - message_queue
