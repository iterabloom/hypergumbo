# CLI entrypoint patterns - Ruby (ADR-3aaa)
#
# Patterns for detecting command-line interface entrypoints:
# Thor, GLI, OptionParser (DSL calls, which no `decorator:` row detects).

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: cli-ruby
language: ruby

patterns:
  # ==================== THOR PATTERNS ====================
  # Thor base class
  - concept: command
    base_class: "^Thor$"

  # Thor: subcommand "name", SubcommandClass -- the Thor class that runs
  # the subcommand, also when it inherits an app base class, not Thor
  - concept: command
    usage:
      kind: "^call$"
      name: "^subcommand$"
      position: "^args\\[1\\]$"

  # Thor: register(CommandClass, "name", "usage", "description") and
  # dry-cli: register "name", CommandClass (also prefix.register in a block)
  - concept: command
    usage:
      kind: "^call$"
      name: "^register$"
      position: "^args\\[[01]\\]$"

  # Thor method_option
  - concept: option
    decorator: "^method_option$"

  # Thor class_option
  - concept: option
    decorator: "^class_option$"

  # Thor option (alias)
  - concept: option
    decorator: "^option$"

  # ==================== GLI PATTERNS ====================

  # GLI flag
  - concept: option
    decorator: "^flag$"

  # GLI switch
  - concept: option
    decorator: "^switch$"

  # GLI arg
  - concept: argument
    decorator: "^arg$"

  # ==================== OPTIONPARSER PATTERNS ====================

  # OptionParser on
  - concept: option
    decorator: "^on$"

  # ==================== DRY-CLI PATTERNS ====================
  # Dry::CLI command
  - concept: command
    base_class: "^Dry::CLI::Command$"
