# SPDX-License-Identifier: AGPL-3.0-or-later
# Naming-based heuristic patterns (ADR-0003 v1.4.x)
#
# These patterns detect entrypoints by naming conventions alone, without
# requiring explicit annotations or base class inheritance. This is the
# lowest-confidence tier (0.70) because:
# - Naming can be misleading (TestController, ControllerHelper)
# - Some projects use different conventions
# - Framework-specific detection is more reliable
#
# The patterns here serve as a fallback when no framework-specific
# detection matches. The deduplication in entrypoints.py ensures
# symbols with explicit annotations won't get duplicate entrypoints.

id: naming-conventions
language: multi

patterns:
  # ====== Controller-like classes ======
  # Classes ending in "Controller" are often HTTP controllers
  # Exclude test/mock/helper patterns to reduce false positives
  - concept: controller_by_name
    symbol_name: "^[A-Z][a-zA-Z0-9_]*Controller$"
    symbol_kind: "^class$"
    # Note: This pattern intentionally does NOT filter by language
    # because controller naming is common across Java, Python, Ruby, PHP, etc.

  # ====== Handler-like classes ======
  # Classes ending in "Handler" may be request handlers, but "Handler" is
  # also used for logging, event handling, data processing, and generic
  # callback patterns.  Require the file path to suggest HTTP context to
  # avoid false positives like PartitionStatsHandler, OAuth2Handler, etc.
  - concept: handler_by_name
    symbol_name: "^[A-Z][a-zA-Z0-9_]*Handler$"
    symbol_kind: "^class$"
    symbol_path: "(routers?|handlers?|controllers?|endpoints?|api|web|views?|servlets?|resources?)/"

  # ====== Service-like classes ======
  # Classes ending in "Service" are often business logic entry points
  - concept: service_by_name
    symbol_name: "^[A-Z][a-zA-Z0-9_]*Service$"
    symbol_kind: "^class$"

  # ====== C subcommand functions ======
  # Functions named cmd_<name> in C are a common pattern for CLI subcommand
  # dispatch (used by git, systemd, busybox, etc.). These are the real
  # developer-facing entrypoints for each subcommand.
  - concept: command_by_name
    symbol_name: "^cmd_"
    symbol_kind: "^function$"
    language: "^c$"

  # ====== Broker / server lifecycle methods (WI-nazir) ======
  # Kafka-style server processes do not use a single ``main()`` entry point.
  # Instead, lifecycle methods on classes ending in ``Server`` (BrokerServer,
  # ControllerServer, KafkaRaftServer, SocketServer) are invoked by a thin
  # outer ``Kafka.main`` to start each component. The previous detector only
  # caught the outer main, leaving every BrokerServer / ControllerServer
  # invisible to the entrypoint list. These patterns surface them as
  # naming-tier entrypoints (confidence 0.70) so DEEP-mode reverse-slice
  # consumers can root analysis at the actual broker startup paths.
  - concept: broker_lifecycle_by_name
    symbol_name: "(^|\\.)\\w*Server\\.(startup|start|run|shutdown)$"
    symbol_kind: "^method$"
    language: "^(java|scala|kotlin)$"

  # ====== Apis dispatch methods (WI-nazir) ======
  # Kafka uses ``KafkaApis.handle*()`` (handleProduceRequest, handleFetchRequest,
  # etc.) as the broker request-dispatch surface. These are the real
  # equivalent of HTTP route handlers and should be entrypoints, not buried
  # nodes in the call graph.
  - concept: broker_lifecycle_by_name
    symbol_name: "(^|\\.)\\w*Apis\\.(handle\\w*|process\\w*|dispatch\\w*)$"
    symbol_kind: "^method$"
    language: "^(java|scala|kotlin)$"

  # ====== Acceptor.run (WI-nazir) ======
  # ``SocketServer.Acceptor`` and similar Acceptor classes implement Runnable
  # and start the connection-accept loop in their ``run()`` method. The path
  # constraint is intentionally absent because Acceptors typically live next
  # to the Server that owns them, not under a ``handlers/`` directory.
  - concept: broker_lifecycle_by_name
    symbol_name: "(^|\\.)\\w*Acceptor\\.run$"
    symbol_kind: "^method$"
    language: "^(java|scala|kotlin)$"

linkers: []
