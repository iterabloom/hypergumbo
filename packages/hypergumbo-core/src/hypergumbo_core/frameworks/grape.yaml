# Grape framework patterns (ADR-3aaa)
#
# Grape is a Ruby REST-like API framework. APIs are defined as
# classes inheriting from Grape::API with route DSL methods.

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-06-18
id: grape
language: ruby

patterns:
  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # Grape route DSL
  - concept: route
    usage:
      kind: "^call$"
      name: "^(get|post|put|patch|delete|options|head)$"
      position: "^args\\[last\\]$"
    extract:
      path: "metadata.route_path"
      method: "metadata.http_method"

  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================
  # Grape API class
  - concept: controller
    base_class: "^Grape::API$"

  # Grape API::Instance
  - concept: controller
    base_class: "^Grape::API::Instance$"

  # Grape helpers
  - concept: helper
    decorator: "^helpers$"

  # Grape params validation
  - concept: validation
    decorator: "^params$"

  # Grape authentication
  - concept: auth
    decorator: "^(http_basic|http_digest)$"

  # Grape entity (serialization)
  - concept: serializer
    base_class: "^Grape::Entity$"

  # Grape desc (documentation)
  - concept: documentation
    decorator: "^desc$"
