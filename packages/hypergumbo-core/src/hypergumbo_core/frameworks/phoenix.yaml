# SPDX-License-Identifier: AGPL-3.0-or-later
# Phoenix Framework patterns (ADR-3aaa v1.0.x + v1.1.x)
#
# Matches Phoenix/Elixir conventions for controllers, channels, LiveView, etc.
# Symbols matching these patterns get enriched with concept metadata.
#
# Definition-based patterns (v1.0.x): Match use/import macros for behavior injection
# Usage-based patterns (v1.1.x): Match router DSL calls via UsageContext

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.
#
# `adopts:` rows (WI-movur) read `meta["adopted_modules"]`, which the Elixir
# analyzer writes on each module: the modules its `use` directives run and the
# behaviours they declare, through in-repo `__using__` quotes and the generated
# web module's dispatcher, so `use MyAppWeb, :live_view` adopts
# Phoenix.LiveView. One row per construct covers both spellings. The OTP rows
# (GenServer, Agent, Task, Supervisor) moved to otp.yaml, loaded for every
# Elixir repository; Oban, Broadway and Absinthe have their own files.
# The `decorator:` rows left below (component, view) feed concepts no entry
# reads and still match nothing.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: phoenix
language: elixir

patterns:
  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # These match against UsageContext records for router DSL calls

  # Phoenix HTTP method routes - get "/path", Controller, :action
  - concept: route
    usage:
      kind: "^call$"
      name: "^(get|post|put|patch|delete|head|options)$"
      position: "^args\\[0\\]$"
    extract:
      path: "metadata.route_path"
      method: "metadata.http_method"

  # Phoenix resources - resources "/path", Controller
  - concept: route
    usage:
      kind: "^call$"
      name: "^resources$"
      position: "^args\\[0\\]$"
    extract:
      path: "metadata.route_path"
      method: "literal:RESOURCES"

  # Phoenix LiveView routes - live "/path", LiveViewModule
  - concept: route
    usage:
      kind: "^call$"
      name: "^live$"
      position: "^args\\[0\\]$"
    extract:
      path: "metadata.route_path"
      method: "literal:LIVE"

  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================
  # Match route symbols emitted by the Elixir analyzer.
  # ADR-0027 Phase 3 fold (audit-findings 0013): kind="function" + meta.framework_role="route".
  - concept: route
    framework_role: "^route$"

  # Controllers - `use Phoenix.Controller` / `use MyAppWeb, :controller`.
  # Phoenix calls an action through a route; a controller no route names is
  # still marked (the deleted row's concept, restored as it was).
  - concept: controller
    adopts: "^Phoenix\\.Controller$"

  # LiveView - `use Phoenix.LiveView` / `use MyAppWeb, :live_view`: Phoenix
  # calls mount / render / handle_event on it, from a `live` route or a
  # `live_render`.
  - concept: liveview
    adopts: "^Phoenix\\.LiveView$"

  # Channels - `use Phoenix.Channel` / `use MyAppWeb, :channel`: the socket
  # calls join / handle_in on it.
  - concept: websocket_handler
    adopts: "^Phoenix\\.Channel$"

  # Plugs - a `use Plug.Builder` / `use Plug.Router` module is a plug: its
  # call/2 runs in a plug pipeline.
  - concept: middleware
    adopts: "^Plug\\.(Builder|Router)$"

  # LiveComponent - reusable LiveView components
  - concept: component
    decorator: "^use Phoenix\\.LiveComponent$"

  - concept: component
    decorator: "^use .*Web, :live_component$"

  # Ecto Schemas - database models
  - concept: model
    adopts: "^Ecto\\.Schema$"

  # Ecto Changesets (often in schema modules)
  - concept: model
    decorator: "^import Ecto\\.Changeset$"

  # Phoenix Router - `use Phoenix.Router` / `use MyAppWeb, :router`
  - concept: router
    adopts: "^Phoenix\\.Router$"

  # Phoenix View (deprecated in favor of components)
  - concept: view
    decorator: "^use Phoenix\\.View$"

  - concept: view
    decorator: "^use .*Web, :view$"

  # Phoenix HTML helpers
  - concept: view
    decorator: "^use Phoenix\\.HTML$"

  # Phoenix Component (new in 1.7+)
  - concept: component
    decorator: "^use Phoenix\\.Component$"
