# SPDX-License-Identifier: AGPL-3.0-or-later
# Language-level main() function detection (ADR-3aaa v1.2.x)
#
# Detects idiomatic entry point functions across languages:
# - Go: func main() in package main
# - Java: public static void main(String[] args)
# - Python: main() function (often called from if __name__ == "__main__")
# - C/C++: int main(...)
# - Rust: fn main()
# - C#: static void Main(...)
# - Kotlin: fun main(...)
# - Swift: main function
# - Dart: main function
#
# These are language conventions, not framework patterns. The patterns use
# symbol_name + symbol_kind + language filters to identify main entry points.
#
# The detection confidence of a match is set per language in entrypoints.py
# (MAIN_FUNCTION_CONFIDENCE), from a census of how often a match is really a
# program start; it is not a ranking value. Most of these patterns check name,
# kind and language only. Go's and Haskell's also check where the language
# says a program starts (`package main`, module `Main`), through the qualified
# name the analyzer records. Rust's does not check that the file is a crate
# root.

provenance: builtin
id: main-functions
language: multi

patterns:
  # Go: func main() of package main. The Go analyzer's qualified name is
  # `<package>.<name>`: a `main` in any other package (a cobra callback
  # `func main(cmd, args)`, a vendored tool renamed into a library package)
  # is an ordinary function.
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^go$"
    qualified_name: "^main\\.main$"

  # Java: main method — use (^|\.)main$ to match both bare "main" and
  # qualified "ClassName.main" (Java analyzer produces qualified names).
  # INV-lumiz.
  - concept: main_function
    symbol_name: "(^|\\.)main$"
    symbol_kind: "^method$"
    language: "^java$"

  # Kotlin: main function — use (^|\.)main$ for consistency with Java.
  # Kotlin top-level main() produces bare "main", but companion object
  # main() could produce qualified names. INV-lumiz.
  - concept: main_function
    symbol_name: "(^|\\.)main$"
    symbol_kind: "^function$"
    language: "^kotlin$"

  # Scala: def main(args: Array[String]) — in Scala objects.
  # Scala analyzer produces qualified names like "Kafka.main".
  - concept: main_function
    symbol_name: "(^|\\.)main$"
    symbol_kind: "^method$"
    language: "^scala$"

  # Python: main() function (often called from if __name__ == "__main__")
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^python$"

  # C: int main(...)
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^c$"

  # C++: int main(...)
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^cpp$"

  # Rust: fn main()
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^rust$"

  # C#: static void Main(...) — use (^|\.)Main$ to match both bare "Main"
  # and qualified "Program.Main" (C# analyzer produces qualified names).
  # INV-lumiz.
  - concept: main_function
    symbol_name: "(^|\\.)Main$"
    symbol_kind: "^method$"
    language: "^csharp$"

  # Swift: main function (or @main entry point)
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^swift$"

  # Dart: main function
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^dart$"

  # D: main function - systems programming language
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^d$"

  # Nim: main proc
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^nim$"

  # Zig: pub fn main() - low-level language
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^zig$"

  # V: fn main() - modern systems language
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^v$"

  # Odin: main :: proc() - performance-focused language
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^odin$"

  # Gleam: pub fn main() - functional language for BEAM VM
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^gleam$"

  # Haxe: static function main() - cross-platform language
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^haxe$"

  # Haskell: main :: IO () of module Main (a file with no module header is
  # module Main). The Haskell analyzer's qualified name is `<Module>.<name>`.
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^haskell$"
    qualified_name: "^Main\\.main$"

  # Erlang: main/1, the entry point `escript` calls. The Erlang analyzer names
  # a function `name/arity`. An OTP `start/2` is an application callback, not
  # a program start, and is not matched here.
  - concept: main_function
    symbol_name: "^main/1$"
    symbol_kind: "^function$"
    language: "^erlang$"

  # Circom: component main = Template() = Template() — circuit entry point
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^variable$"
    language: "^circom$"
