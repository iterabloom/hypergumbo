# SPDX-License-Identifier: AGPL-3.0-or-later
# Language-level main() function detection (ADR-3aaa v1.2.x)
#
# Detects idiomatic entry point functions across languages:
# - Go: func main() in package main
# - Java: public static void main(String[] args)
# - Python: main() function (often called from if __name__ == "__main__")
# - C/C++: int main(...)
# - Rust: fn main()
# - C#: static void Main(...)
# - Kotlin: fun main(...)
# - Swift: main function
# - Dart: main function
#
# These are language conventions, not framework patterns. The patterns use
# symbol_name + symbol_kind + language filters to identify main entry points.
#
# The detection confidence of a match is set per language in entrypoints.py
# (MAIN_FUNCTION_CONFIDENCE), from a census of how often a match is really a
# program start; it is not a ranking value. These patterns check name, kind
# and language only: Go's does not check `package main`, and Erlang's also
# takes every `start` function, most of them OTP start functions.

provenance: builtin
id: main-functions
language: multi

patterns:
  # Go: func main() - must be in package main (detected by presence)
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^go$"

  # Java: main method — use (^|\.)main$ to match both bare "main" and
  # qualified "ClassName.main" (Java analyzer produces qualified names).
  # INV-lumiz.
  - concept: main_function
    symbol_name: "(^|\\.)main$"
    symbol_kind: "^method$"
    language: "^java$"

  # Kotlin: main function — use (^|\.)main$ for consistency with Java.
  # Kotlin top-level main() produces bare "main", but companion object
  # main() could produce qualified names. INV-lumiz.
  - concept: main_function
    symbol_name: "(^|\\.)main$"
    symbol_kind: "^function$"
    language: "^kotlin$"

  # Scala: def main(args: Array[String]) — in Scala objects.
  # Scala analyzer produces qualified names like "Kafka.main".
  - concept: main_function
    symbol_name: "(^|\\.)main$"
    symbol_kind: "^method$"
    language: "^scala$"

  # Python: main() function (often called from if __name__ == "__main__")
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^python$"

  # C: int main(...)
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^c$"

  # C++: int main(...)
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^cpp$"

  # Rust: fn main()
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^rust$"

  # C#: static void Main(...) — use (^|\.)Main$ to match both bare "Main"
  # and qualified "Program.Main" (C# analyzer produces qualified names).
  # INV-lumiz.
  - concept: main_function
    symbol_name: "(^|\\.)Main$"
    symbol_kind: "^method$"
    language: "^csharp$"

  # Swift: main function (or @main entry point)
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^swift$"

  # Dart: main function
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^dart$"

  # D: main function - systems programming language
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^d$"

  # Nim: main proc
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^nim$"

  # Zig: pub fn main() - low-level language
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^zig$"

  # V: fn main() - modern systems language
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^v$"

  # Odin: main :: proc() - performance-focused language
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^odin$"

  # Gleam: pub fn main() - functional language for BEAM VM
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^gleam$"

  # Haxe: static function main() - cross-platform language
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^haxe$"

  # Haskell: main :: IO () — standard entry point
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^function$"
    language: "^haskell$"

  # Erlang: main/0 or start/0 — common CLI entry points
  # OTP applications use -behaviour(application) start/2 which is framework-level,
  # but standalone scripts use main() or start().
  - concept: main_function
    symbol_name: "^(main|start)$"
    symbol_kind: "^function$"
    language: "^erlang$"

  # Circom: component main = Template() = Template() — circuit entry point
  - concept: main_function
    symbol_name: "^main$"
    symbol_kind: "^variable$"
    language: "^circom$"
