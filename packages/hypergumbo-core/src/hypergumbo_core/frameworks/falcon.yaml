# SPDX-License-Identifier: AGPL-3.0-or-later
# Falcon framework patterns (ADR-3aaa)
#
# Falcon is a bare-metal Python web API framework for building
# high-performance microservices and app backends.
#
# Unlike Flask/FastAPI, Falcon uses resource classes with responder methods
# (on_get, on_post, etc.) rather than route decorators.
# Routes are registered via app.add_route('/path', resource).
#
# See: https://falcon.readthedocs.io/

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: falcon
language: python

patterns:
  # ==================== METHOD-BASED PATTERNS (Responders) ====================
  # Falcon responder methods - on_get, on_post, etc.
  # These methods handle HTTP requests for a resource. route_handler maps to
  # an HTTP_ROUTE entrypoint, and a test file's responder loses the concept
  # after classification: the concept is test-excluded by the always-loaded
  # python-http-server.yaml and the strip is by concept name (WI-losij).

  # py.py names a method `Class.method`, so the responder's own name is
  # read (`method_name`). A responder registered with a suffix
  # (`app.add_route('/things', res, suffix='collection')`) is named
  # `on_get_collection`.

  - concept: route_handler
    method_name: "^on_get(_\\w+)?$"
    symbol_kind: "^method$"

  - concept: route_handler
    method_name: "^on_post(_\\w+)?$"
    symbol_kind: "^method$"

  - concept: route_handler
    method_name: "^on_put(_\\w+)?$"
    symbol_kind: "^method$"

  - concept: route_handler
    method_name: "^on_delete(_\\w+)?$"
    symbol_kind: "^method$"

  - concept: route_handler
    method_name: "^on_patch(_\\w+)?$"
    symbol_kind: "^method$"

  - concept: route_handler
    method_name: "^on_head(_\\w+)?$"
    symbol_kind: "^method$"

  - concept: route_handler
    method_name: "^on_options(_\\w+)?$"
    symbol_kind: "^method$"

  # WebSocket responder
  - concept: websocket_handler
    method_name: "^on_websocket(_\\w+)?$"
    symbol_kind: "^method$"

  # ==================== DECORATOR-BASED PATTERNS ====================

  # Before/after hooks - @falcon.before(hook_func), @falcon.after(hook_func)
  - concept: middleware
    decorator: "^falcon\\.(before|after)$"

  # ==================== CLASS-BASED PATTERNS ====================

  # Resource base class (optional, but common)
  - concept: controller
    base_class: "^Resource$"
