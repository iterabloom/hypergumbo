# Padrino framework patterns (ADR-3aaa v1.1.x)
#
# Padrino is a Ruby web framework built on Sinatra.
# Controllers use routing DSL: get '/path' do ... end
# Adds structure around Sinatra: controllers, models, helpers, mailers.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: padrino
language: ruby

patterns:
  # Padrino Application
  - concept: application
    base_class: "^Padrino::Application$"

  # Controller definition
  - concept: controller
    usage:
      kind: "^call$"
      name: "^controller$"
      # The handler is the call's block. No Ruby analyzer records a context
      # for a block (it has no symbol; WI-tavum), and the arguments are not
      # the handler, so this position is one no context has: the row matches
      # nothing until a block becomes a symbol.
      position: "^block$"

  # GET route
  - concept: route
    usage:
      kind: "^call$"
      name: "^get$"
      position: "^args\\[0\\]$"
    extract:
      method: "GET"
      path: "metadata.url"

  # POST route
  - concept: route
    usage:
      kind: "^call$"
      name: "^post$"
      position: "^args\\[0\\]$"
    extract:
      method: "POST"
      path: "metadata.url"

  # PUT route
  - concept: route
    usage:
      kind: "^call$"
      name: "^put$"
      position: "^args\\[0\\]$"
    extract:
      method: "PUT"
      path: "metadata.url"

  # DELETE route
  - concept: route
    usage:
      kind: "^call$"
      name: "^delete$"
      position: "^args\\[0\\]$"
    extract:
      method: "DELETE"
      path: "metadata.url"

  # PATCH route
  - concept: route
    usage:
      kind: "^call$"
      name: "^patch$"
      position: "^args\\[0\\]$"
    extract:
      method: "PATCH"
      path: "metadata.url"

  # Before filter
  - concept: middleware
    usage:
      kind: "^call$"
      name: "^before$"
      # The handler is the call's block. No Ruby analyzer records a context
      # for a block (it has no symbol; WI-tavum), and the arguments are not
      # the handler, so this position is one no context has: the row matches
      # nothing until a block becomes a symbol.
      position: "^block$"

  # After filter
  - concept: middleware
    usage:
      kind: "^call$"
      name: "^after$"
      # The handler is the call's block. No Ruby analyzer records a context
      # for a block (it has no symbol; WI-tavum), and the arguments are not
      # the handler, so this position is one no context has: the row matches
      # nothing until a block becomes a symbol.
      position: "^block$"

  # Helper module
  - concept: helper
    usage:
      kind: "^call$"
      name: "^helpers$"
      # The handler is a module the call is given by name (args[i]).
      position: "^args\\[\\d+\\]$"

  # Register helper
  - concept: helper
    usage:
      kind: "^call$"
      name: "^register$"
      # The handler is a module the call is given by name (args[i]).
      position: "^args\\[\\d+\\]$"

  # Mailer
  - concept: mailer
    usage:
      kind: "^call$"
      name: "^mailer$"
      # The handler is the call's block. No Ruby analyzer records a context
      # for a block (it has no symbol; WI-tavum), and the arguments are not
      # the handler, so this position is one no context has: the row matches
      # nothing until a block becomes a symbol.
      position: "^block$"

  # Email delivery
  - concept: mailer
    usage:
      kind: "^call$"
      name: "^email$"
      # The handler is the call's block. No Ruby analyzer records a context
      # for a block (it has no symbol; WI-tavum), and the arguments are not
      # the handler, so this position is one no context has: the row matches
      # nothing until a block becomes a symbol.
      position: "^block$"

  # Deliver mail
  - concept: mailer
    usage:
      kind: "^call$"
      name: "^deliver$"
      # The arguments name no code of the repository (a template, a status,
      # a URL, a library plugin); a context naming a local method or class
      # here would be a false match. No context has this position, so the
      # row matches nothing.
      position: "^none$"

  # Model (ActiveRecord)
  - concept: model
    base_class: "^ActiveRecord::Base$"

  # Model (Sequel)
  - concept: model
    base_class: "^Sequel::Model$"

  # Model (DataMapper)
  - concept: model
    base_class: "^DataMapper::Resource$"

  # Model (Mongoid)
  - concept: model
    base_class: "^Mongoid::Document$"

  # Render template
  - concept: view
    usage:
      kind: "^call$"
      name: "^render$"
      # The arguments name no code of the repository (a template, a status,
      # a URL, a library plugin); a context naming a local method or class
      # here would be a false match. No context has this position, so the
      # row matches nothing.
      position: "^none$"

  # Halt request
  - concept: halt
    usage:
      kind: "^call$"
      name: "^halt$"
      # The arguments name no code of the repository (a template, a status,
      # a URL, a library plugin); a context naming a local method or class
      # here would be a false match. No context has this position, so the
      # row matches nothing.
      position: "^none$"

  # Redirect
  - concept: redirect
    usage:
      kind: "^call$"
      name: "^redirect$"
      # The arguments name no code of the repository (a template, a status,
      # a URL, a library plugin); a context naming a local method or class
      # here would be a false match. No context has this position, so the
      # row matches nothing.
      position: "^none$"

  # Error handler
  - concept: error_handler
    usage:
      kind: "^call$"
      name: "^error$"
      # The handler is the call's block. No Ruby analyzer records a context
      # for a block (it has no symbol; WI-tavum), and the arguments are not
      # the handler, so this position is one no context has: the row matches
      # nothing until a block becomes a symbol.
      position: "^block$"

  # Not found handler
  - concept: error_handler
    usage:
      kind: "^call$"
      name: "^not_found$"
      # The handler is the call's block. No Ruby analyzer records a context
      # for a block (it has no symbol; WI-tavum), and the arguments are not
      # the handler, so this position is one no context has: the row matches
      # nothing until a block becomes a symbol.
      position: "^block$"

  # Admin app
  - concept: admin
    base_class: "^Padrino::Admin::App$"

  # Access control
  - concept: authorization
    usage:
      kind: "^call$"
      name: "^access_control$"
      # The arguments name no code of the repository (a template, a status,
      # a URL, a library plugin); a context naming a local method or class
      # here would be a false match. No context has this position, so the
      # row matches nothing.
      position: "^none$"
