# SPDX-License-Identifier: AGPL-3.0-or-later
# CLI entrypoint patterns - Python (ADR-3aaa)
#
# Patterns for detecting command-line interface entrypoints in Python:
# Click, Typer and Django management commands. Fire and argparse are calls
# (fire.Fire(), argparse.ArgumentParser()), which no row detects.
#
# For other languages, see:
# - cli-js.yaml (Commander, yargs, oclif)
# - cli-rust.yaml (clap, structopt)
# - cli-go.yaml (Cobra, urfave/cli)
# - cli-ruby.yaml (Thor, GLI)

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: cli
language: python

patterns:
  # ==================== CLICK PATTERNS ====================
  # Click command decorator
  - concept: command
    decorator: "^click\\.command$"

  # Click group (subcommands)
  - concept: command
    decorator: "^click\\.group$"

  # Click pass_context
  - concept: command
    decorator: "^click\\.pass_context$"

  # Click option
  - concept: option
    decorator: "^click\\.option$"

  # Click argument
  - concept: argument
    decorator: "^click\\.argument$"

  # ==================== TYPER PATTERNS ====================
  # Typer app.command
  - concept: command
    decorator: "^app\\.command$"

  # Typer callback
  - concept: command
    decorator: "^app\\.callback$"

  # A typer command on an app of any name: @users_app.command() where
  # users_app = typer.Typer(). The analyzer writes what made the decorator's
  # receiver (meta["decorator_receivers"], space-separated).
  - concept: command
    meta_match:
      decorator_receivers: "(.* )?typer\\.Typer\\.(command|callback)( |$)"

  # A click subcommand or subgroup: @cli.command() / @cli.group() where cli
  # is a function decorated @click.group() (or a click.Group()), at any depth.
  - concept: command
    meta_match:
      decorator_receivers: "(.* )?click\\.(group|Group)(\\.group)*\\.(command|group)( |$)"

  # Typer registration as a call, app.command()(download): the decorator of
  # the row above applied by hand (transformers registers its CLI this way).
  - concept: command
    usage:
      kind: "^call$"
      name: "^app\\.command\\(\\)$"
      position: "^args\\[0\\]$"

  # typer.run(main): the function becomes the program's single command.
  - concept: command
    usage:
      kind: "^call$"
      name: "^typer\\.run$"
      position: "^args\\[0\\]$"

  # ==================== FIRE PATTERNS ====================
  # fire.Fire(main), fire.Fire(Calculator), fire.Fire({"add": add}): Fire
  # turns the function, the class's methods or the dict's values into
  # commands. fire.Fire() with no argument (the module's globals) is not
  # matched: it names no callable.
  - concept: command
    usage:
      kind: "^call$"
      name: "^(fire\\.)?Fire$"
      position: "^args\\[0\\]"

  # ==================== DJANGO CLI PATTERNS ====================
  # Django management command
  - concept: command
    base_class: "^BaseCommand$"

  # Django CommandError
  - concept: error
    base_class: "^CommandError$"

  # ==================== FLASK CLI PATTERNS ====================
  # Flask CLI command
  - concept: command
    decorator: "^app\\.cli\\.command$"

  # Flask CLI group
  - concept: command
    decorator: "^app\\.cli\\.group$"

  # ==================== CELERY CLI PATTERNS ====================
  # Celery command
  - concept: command
    decorator: "^celery\\.command$"

  # ==================== RICH CLI PATTERNS ====================
  # Rich Console (common in CLIs)
  - concept: output
    decorator: "^Console$"

  # Rich Progress
  - concept: output
    decorator: "^Progress$"
