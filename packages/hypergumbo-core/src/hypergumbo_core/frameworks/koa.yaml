# SPDX-License-Identifier: AGPL-3.0-or-later
# Koa.js framework patterns (ADR-3aaa v1.0.x)
#
# Matches Koa.js routing and middleware patterns.
# Symbols matching these patterns get enriched with concept metadata.
#
# Koa is minimalist; most routing uses koa-router or @koa/router.

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: koa
language: javascript

patterns:

  # Koa context extensions - ctx.body, ctx.status, etc.
  # These are typically detected in function bodies rather than decorators

  # koa-passport
  - concept: auth_strategy
    decorator: "^passport\\.(use|authenticate|initialize|session)$"

  # koa-jwt
  - concept: auth_middleware
    decorator: "^jwt$"

  # koa-views / koa-ejs
  - concept: view_middleware
    decorator: "^(views|render)$"

  # ==================== REGISTRATION ROWS (WI-movur) ====================
  # These match the registration UsageContext the JS/TS analyzer records when
  # a call hands a LOCAL function to a library call: ``position`` is
  # ``args[i]`` for the i-th argument, ``args[i].<key>`` for a function in an
  # option object, ``[j]`` for an array element. A chained receiver is written
  # with its calls collapsed (``program.command('x').action(f)`` ->
  # ``program.action``); a bare callee as its import (``koa-mount``).

  # Koa middleware - app.use(fn), router.use(fn), router.use('/api', fn)
  # (not Axios's ``<x>.interceptors.request.use(fn)``)
  - concept: middleware
    usage:
      kind: "^call$"
      name: "^(?![\\w$.]*\\binterceptors\\.)[\\w$.]+\\.use$"
      position: "^args\\[\\d+\\]$"

  # koa-router param middleware - router.param('id', fn)
  - concept: middleware
    usage:
      kind: "^call$"
      name: "^[\\w$.]+\\.param$"
      position: "^args\\[1\\]$"

  # koa-mount - app.use(mount('/path', fn)); the bare callee is its import
  - concept: middleware
    usage:
      kind: "^call$"
      name: "^koa-mount$"
      position: "^args\\[\\d+\\]$"
