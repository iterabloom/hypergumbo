# Ktor framework patterns (ADR-3aaa)
#
# Ktor is a Kotlin web framework using DSL-based routing.
# Routes are defined using routing { }, get { }, post { }, etc.

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: ktor
language: kotlin

patterns:
  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # Ktor DSL routing - routing { get("/path") { } }
  - concept: route
    usage:
      kind: "^call$"
      name: "^(get|post|put|delete|patch|head|options)$"
      position: "^args\\[last\\]$"
    extract:
      path: "metadata.route_path"
      method: "metadata.http_method"

  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================

  # A Ktor module: an extension function on Application, `fun Application.module()`,
  # which the server runs when it starts (named in `embeddedServer(...,
  # module = Application::module)` or in application.conf's
  # `ktor.application.modules`). It installs the plugins and calls the route
  # functions. `application` is the hosted-application kind (ADR-0063): what a
  # server hosts, not the program start. The kotlin analyzer records the receiver
  # as written in meta.extension_receiver (Ktor 2 `io.ktor.server.application`,
  # Ktor 1 `io.ktor.application`). Route-receiver functions get no row: the
  # module's `routing { }` calls them, and one nothing calls is unused.
  - concept: application
    symbol_kind: "^function$"
    language: "^kotlin$"
    meta_match:
      extension_receiver: "^(io\\.ktor\\.(server\\.)?application\\.)?Application$"

  # Ktor authentication
  - concept: auth
    decorator: "^authenticate$"
