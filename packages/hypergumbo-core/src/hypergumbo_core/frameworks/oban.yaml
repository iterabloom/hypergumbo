# Oban job workers (WI-movur)
#
# ``use Oban.Worker`` (with or without options: ``use Oban.Worker, queue:
# :mailers``) makes the module a job worker: Oban calls its ``perform/1``
# for each job, and nothing in the repository calls the module. The row reads
# ``meta["adopted_modules"]`` (``adopts:``), written by the Elixir analyzer.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: oban
language: elixir

patterns:
  # Oban worker - the module Oban calls perform/1 on
  - concept: task
    adopts: "^Oban\\.Worker$"
