# Fastify framework patterns (ADR-3aaa)
#
# Fastify is a fast Node.js web framework. Routes are defined using
# fastify.get(), fastify.post(), etc. or via route schemas.

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-06-18
id: fastify
language: javascript

patterns:
  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # Fastify route handlers - fastify.get('/path', handler)
  - concept: route
    usage:
      kind: "^call$"
      name: "^(fastify|app|server)\\.(get|post|put|delete|patch|options|head|all)$"
      position: "^args\\[last\\]$"
    extract:
      path: "metadata.route_path"
      method: "metadata.http_method"

  # Fastify route() method with schema
  - concept: route
    usage:
      kind: "^call$"
      name: "^(fastify|app|server)\\.route$"
      position: "^args\\[0\\]$"
    extract:
      path: "metadata.route_path"
      method: "metadata.http_method"

  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================

  # Fastify schema
  - concept: schema
    decorator: "^(fastify|app|server)\\.addSchema$"
