# SPDX-License-Identifier: AGPL-3.0-or-later
# Electron framework patterns (ADR-3aaa)
#
# Electron apps have main process, renderer process, and preload scripts.
# IPC communication uses ipcMain/ipcRenderer and contextBridge.
#
# Entrypoint detection uses USAGE-BASED patterns (v1.1.x) because
# app.whenReady() and app.on('ready') are call expressions, not decorators.
# The JS/TS analyzer emits UsageContext records for these calls, and for the
# two facts that name a preload script (a contextBridge exposure, a literal
# webPreferences.preload path).

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-06-18
id: electron
language: javascript

patterns:
  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # These match UsageContext records emitted by the JS/TS analyzer for
  # Electron app lifecycle calls that indicate the main process entry point.

  # Electron app ready (main process entry)
  - concept: entrypoint
    usage:
      kind: "^call$"
      name: "^app\\.whenReady$"
      position: "^caller$"

  # Electron app.on('ready') / app.once('ready') lifecycle
  - concept: entrypoint
    usage:
      kind: "^call$"
      name: "^app\\.(on|once)$"
      position: "^caller$"

  # Electron preload script: a file that exposes an API to the page through
  # contextBridge. The JS/TS analyzer emits a caller-position UsageContext on
  # the FILE for the call (contextBridge.<method> or <x>.contextBridge.<method>),
  # so the concept lands on the preload file -> electron_preload entry.
  - concept: api_bridge
    usage:
      kind: "^call$"
      name: "^contextBridge\\.(exposeInMainWorld|exposeInIsolatedWorld)$"
      position: "^caller$"

  # Electron preload script: the file a window's webPreferences.preload names,
  # where the path is a literal off __dirname that resolves to an analysed file
  # (path.join / path.resolve / join / resolve, __dirname + '...', or a
  # template). The UsageContext's symbol_ref is that file -> electron_preload.
  - concept: preload_script
    usage:
      kind: "^call$"
      name: "^webPreferences\\.preload$"
      position: "^webPreferences\\.preload$"

  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================
  # Electron renderer process IPC
  - concept: ipc_sender
    decorator: "^ipcRenderer\\.(send|invoke|sendSync)$"

  # Electron BrowserWindow creation
  - concept: window
    decorator: "^new BrowserWindow$"

  # Electron app lifecycle events (for concept tagging, not entrypoint detection)
  - concept: lifecycle
    decorator: "^app\\.(on|once|whenReady)$"

  # Electron Menu
  - concept: menu
    decorator: "^Menu\\.(buildFromTemplate|setApplicationMenu)$"

  # Electron Tray
  - concept: tray
    decorator: "^new Tray$"

  # Electron Dialog
  - concept: dialog
    decorator: "^dialog\\.(showOpenDialog|showSaveDialog|showMessageBox)$"

  # Electron Notification
  - concept: notification
    decorator: "^new Notification$"

  # Electron shell
  - concept: shell
    decorator: "^shell\\.(openExternal|openPath|showItemInFolder)$"

  # Electron auto-updater
  - concept: updater
    decorator: "^autoUpdater\\.(checkForUpdates|on)$"

  # Electron session/cookies
  - concept: session
    decorator: "^session\\.(defaultSession|fromPartition)$"

  # Electron protocol handlers
  - concept: protocol
    decorator: "^protocol\\.(registerFileProtocol|registerHttpProtocol|registerSchemeAsPrivileged)$"

  # Electron remote (deprecated but still used)
  - concept: remote
    decorator: "^remote\\.(require|getCurrentWindow|getGlobal)$"

  # Electron crashReporter
  - concept: telemetry
    decorator: "^crashReporter\\.start$"

  # Electron powerMonitor
  - concept: system
    decorator: "^powerMonitor\\.(on|getSystemIdleState)$"

  # Electron globalShortcut
  - concept: shortcut
    decorator: "^globalShortcut\\.(register|unregister)$"

  # Electron nativeTheme
  - concept: theme
    decorator: "^nativeTheme\\.(on|shouldUseDarkColors)$"
