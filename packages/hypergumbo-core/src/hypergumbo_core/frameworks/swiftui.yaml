# SPDX-License-Identifier: AGPL-3.0-or-later
# SwiftUI and iOS/macOS app lifecycle patterns (ADR-3aaa v1.1.x)
#
# Detects native Swift application entry points across Apple platforms:
# - SwiftUI apps: struct conforming to App protocol
# - UIKit apps: class conforming to UIApplicationDelegate
# - AppKit apps: class conforming to NSApplicationDelegate
# - View controllers: common UI entry points
# - ParsableCommand: Swift Argument Parser commands (cli_command)

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-06-18
id: swiftui
language: swift

patterns:
  # The app's program start (`entrypoint` -> main_function): the type
  # `@main` or the platform launches as the program (audit 0027, ruled
  # 2026-11-21: program starts by construction).
  # SwiftUI App protocol conformance (iOS 14+, macOS 11+)
  - concept: entrypoint
    base_class: "^App$"

  # UIKit application delegate
  - concept: entrypoint
    base_class: "^UIApplicationDelegate$"

  # AppKit application delegate (macOS)
  - concept: entrypoint
    base_class: "^NSApplicationDelegate$"

  # UIKit view controllers (common UI entry points)
  - concept: controller
    base_class: "^UIViewController$"
  - concept: controller
    base_class: "^UITableViewController$"
  - concept: controller
    base_class: "^UICollectionViewController$"
  - concept: controller
    base_class: "^UINavigationController$"
  - concept: controller
    base_class: "^UITabBarController$"

  # AppKit view controllers (macOS)
  - concept: controller
    base_class: "^NSViewController$"
  - concept: controller
    base_class: "^NSWindowController$"

  # SwiftUI views are not entrypoints (too numerous), but the App struct is.

  # Swift Argument Parser commands (`command` -> cli_command): every
  # subcommand conforms too, so a conformer is a command, not a program start
  # (audit 0027, ruled 2026-11-21). These rows load only where SwiftUI is
  # detected.
  - concept: command
    base_class: "^ParsableCommand$"
  - concept: command
    base_class: "^AsyncParsableCommand$"

  # XCTestCase — test lifecycle (lower confidence)
  - concept: test_class
    base_class: "^XCTestCase$"
