# SPDX-License-Identifier: AGPL-3.0-or-later
# Go Web Framework patterns (ADR-3aaa v1.0.x + v1.1.x)
#
# Matches common Go web frameworks: Gin, Echo, Fiber, Chi, net/http, go-restful.
# Symbols matching these patterns get enriched with concept metadata.
#
# Definition-based patterns (v1.0.x): Match base_class for GORM, gRPC, etc.
# Usage-based patterns (v1.1.x): Match call-based routing via UsageContext

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: go-web
language: go

patterns:
  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # These match against UsageContext records for call-based routing

  # Gin/Echo framework - r.GET("/path", handler), e.POST("/path", handler)
  - concept: route
    usage:
      kind: "^call$"
      name: "\\.(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$"
      position: "^args\\[last\\]$"
    extract:
      path: "metadata.route_path"
      method: "metadata.http_method"

  # Fiber/Chi framework - app.Get("/path", handler), r.Post("/path", handler)
  - concept: route
    usage:
      kind: "^call$"
      name: "\\.(Get|Post|Put|Delete|Patch|Options|Head)$"
      position: "^args\\[last\\]$"
    extract:
      path: "metadata.route_path"
      method: "metadata.http_method"

  # go-restful framework - ws.Route(ws.GET("/path").To(handler))
  # The handler is specified in the .To() call, not as a direct argument.
  # NOT FIRING, ON PURPOSE (WI-movur): go.py's registration context for
  # ``x.To(handler)`` (position args[0]) carries no method and no path --
  # they sit in the builder chain before ``.To`` -- so this row would stamp
  # a route with neither. The position below is one no context has, until
  # an extractor reads the chain (``ws.GET("/path")``) into
  # metadata.http_method / metadata.route_path and this row extracts them.
  - concept: route
    usage:
      kind: "^call$"
      name: "\\.To$"
      position: "^route_builder_chain$"

  # Middleware - r.Use(auth), api.Use(a, b), e.Use(timing), router.Use(log):
  # a LOCAL function or method passed to a library ``Use``. go.py records the
  # callee as written (the receiver as written, ``r.Use``), one context per
  # argument that names a local function, and only when the callee is not
  # repository code. Library middleware (``gin.Logger()``) and a factory call
  # (``r.Use(auth())``) are calls, not local function values: not recorded.
  - concept: middleware
    usage:
      kind: "^call$"
      name: "\\.Use$"
      position: "^args\\[\\d+\\]$"

  # gin.CustomRecovery(onPanic): a LOCAL function gin calls with the panic
  # value when a handler panics (a library recovery middleware around it).
  - concept: error_handler
    usage:
      kind: "^call$"
      name: "^gin\\.CustomRecovery$"
      position: "^args\\[0\\]$"

  # echo's middleware.BasicAuth(validator): a LOCAL validator the library
  # middleware calls on every request (echo/v4/middleware, imported as
  # ``middleware``). chi's middleware.BasicAuth takes a map, no function.
  - concept: middleware
    usage:
      kind: "^call$"
      name: "^middleware\\.BasicAuth$"
      position: "^args\\[0\\]$"

  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================
  # Note: These decorator patterns are kept for backwards compatibility but
  # the primary route detection now uses UsageContext patterns above.

  # go-restful WebService (Kubernetes-style API frameworks)
  - concept: web_service
    base_class: "^restful\\.WebService$"

  # GORM models (ORM)
  - concept: model
    base_class: "^gorm\\.Model$"

  # GORM database operations
  - concept: repository
    decorator: "^db\\.(Create|First|Find|Save|Delete|Update|Where)$"

  # XORM engine operations (Forgejo/Gitea ORM)
  - concept: repository
    decorator: "^(e|x|engine|sess|session)\\.(Get|Find|Insert|Update|Delete|Exec|Query|Where|ID|Count|Exist|Iterate|Cols|Incr|Decr|SetExpr|AllCols)$"

  # gRPC service definitions
  - concept: grpc_service
    base_class: "^.*Server$"

  # gRPC client definitions
  - concept: grpc_client
    base_class: "^.*Client$"
