# SPDX-License-Identifier: AGPL-3.0-or-later
# Ruby on Rails framework patterns (ADR-3aaa v1.0.x + v1.1.x)
#
# Matches Rails conventions for controllers, models, jobs, mailers, and more.
# Symbols matching these patterns get enriched with concept metadata.
#
# Definition-based patterns (v1.0.x): Match base_class, symbol_kind for inheritance
# Usage-based patterns (v1.1.x): Match call-based routing via UsageContext

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: rails
language: ruby

patterns:
  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # These match against UsageContext records for call-based routing DSL

  # Rails HTTP method routes - get '/path', post '/path', etc.
  - concept: route
    usage:
      kind: "^call$"
      name: "^(get|post|put|patch|delete|head|options)$"
      position: "^args\\[0\\]$"
    extract:
      path: "metadata.route_path"
      method: "metadata.http_method"

  # Rails resource routes - resources :users, resource :profile
  - concept: route
    usage:
      kind: "^call$"
      name: "^resources?$"
      position: "^args\\[0\\]$"
    extract:
      path: "metadata.route_path"
      method: "literal:RESOURCES"

  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================
  # Match route symbols emitted by the Ruby analyzer.
  # ADR-0027 Phase 3 fold (audit-findings 0013): kind="function" + meta.framework_role="route".
  - concept: route
    framework_role: "^route$"

  # Controllers - inherit from ApplicationController or ActionController::Base
  - concept: controller
    base_class: "^ApplicationController$"

  - concept: controller
    base_class: "^ActionController::Base$"

  - concept: controller
    base_class: "^ActionController::API$"

  # Models - inherit from ApplicationRecord or ActiveRecord::Base
  - concept: model
    base_class: "^ApplicationRecord$"

  - concept: model
    base_class: "^ActiveRecord::Base$"

  # Jobs - inherit from ApplicationJob or ActiveJob::Base
  - concept: task
    base_class: "^ApplicationJob$"

  - concept: task
    base_class: "^ActiveJob::Base$"

  # Mailers - inherit from ApplicationMailer or ActionMailer::Base
  - concept: mailer
    base_class: "^ApplicationMailer$"

  - concept: mailer
    base_class: "^ActionMailer::Base$"

  # Channels (Action Cable) - inherit from ApplicationCable::Channel
  - concept: websocket_handler
    base_class: "^ApplicationCable::Channel$"

  - concept: websocket_handler
    base_class: "^ActionCable::Channel::Base$"

  # Connections (Action Cable) - inherit from ApplicationCable::Connection
  - concept: websocket_connection
    base_class: "^ApplicationCable::Connection$"

  - concept: websocket_connection
    base_class: "^ActionCable::Connection::Base$"

  # Serializers (ActiveModelSerializers)
  - concept: serializer
    base_class: "^ActiveModel::Serializer$"

  - concept: serializer
    base_class: "^ApplicationSerializer$"

  # Form objects
  - concept: form
    base_class: "^ActiveModel::Model$"

  # Validators
  - concept: validator
    base_class: "^ActiveModel::Validator$"

  - concept: validator
    base_class: "^ActiveModel::EachValidator$"

  # Services (common Rails pattern - no specific base class)
  # Service objects typically don't have a standard base class

  # Policies (Pundit authorization)
  - concept: policy
    base_class: "^ApplicationPolicy$"

  # Decorators (Draper)
  - concept: decorator
    base_class: "^Draper::Decorator$"

  - concept: decorator
    base_class: "^ApplicationDecorator$"

  # Sidekiq workers (common with Rails)
  - concept: task
    base_class: "^Sidekiq::Worker$"

  # Sidekiq workers as written: `include Sidekiq::Worker`, `Sidekiq::Job`,
  # `Sidekiq::IterableJob` (a mixin, not a base class, so the row above does
  # not match them)
  - concept: task
    adopts: "^Sidekiq::(Worker|Job|IterableJob)$"

  # BaseJob (app-specific job base class, e.g., postal)
  - concept: task
    base_class: "^BaseJob$"

  # Scheduled tasks (cron-like entry points, e.g., postal's ApplicationScheduledTask)
  - concept: scheduled_task
    base_class: "^ApplicationScheduledTask$"

  - concept: scheduled_task
    base_class: "^ScheduledTask$"

  # Rack middleware (classes ending in Middleware are HTTP request interceptors)
  - concept: event_handler
    symbol_name: "Middleware$"
    symbol_kind: "^class$"

  # Rake tasks are not classes, so can't be matched here

  # ==================== CALLBACKS (Event-Like Patterns) ====================
  # ActiveRecord lifecycle callbacks are primary side-effect mechanisms.
  # after_commit, after_save, before_action etc. define the actual
  # control flow in Rails apps; ruby.py links each symbol-named callback
  # with a dispatches_to edge from its class (_extract_rails_callbacks).

  # (Removed) Two usage rows named the model lifecycle callbacks
  # (after_commit, before_save, ...) and the controller callbacks
  # (before_action, after_action, around_action, skip_before_action,
  # prepend_before_action) with concept event_handler. No analyzer recorded a
  # context for them until the registration contexts of WI-movur, so they
  # never fired. The callback targets already have a caller: ruby.py's
  # _extract_rails_callbacks writes a dispatches_to edge from the class to
  # each one. Whether a callback should ALSO be an entry (event_handler)
  # is an open decision: on gitlab app/controllers it was 527 new concepts
  # and 34 of 87 capped entry places taken from controllers.

  # Controller error handlers: rescue_from SomeError, with: :handler -- the
  # local method Rails calls when the error is raised in an action.
  - concept: error_handler
    usage:
      kind: "^call$"
      name: "^rescue_from$"
      position: "^kwargs\\[with\\]$"

  # ==================== WISPER PUB/SUB ====================
  # Wisper is a common Ruby pub/sub library used in Rails apps (e.g., chatwoot).
  # Publishers include Wisper::Publisher; subscribers register via .subscribe

  # Wisper publisher module inclusion
  - concept: event_publisher
    base_class: "^Wisper::Publisher$"
