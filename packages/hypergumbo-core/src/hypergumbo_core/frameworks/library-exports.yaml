# Library export detection (ADR-0003 v1.3.x)
#
# Detects exports that define the public API surface of a library.
#
# Libraries differ from applications:
# - Applications have main() functions, HTTP routes, CLI commands
# - Libraries have exports that form their public API
#
# Confidence is lower than framework routes (0.75 vs 0.95) because:
# - Libraries may have many exports, not all equally important
# - Not all exports are meaningful entry points
#
# Detection strategies by language:
# - JS/TS: Match UsageContext records for exports from index files
# - Go: Match exported (uppercase) functions, types, interfaces, structs
# - Elixir: Match module definitions (defmodule)
#
# The entrypoint scoring system (confidence * connectivity boost) ensures
# the most important/connected exports are prioritized for auto-slicing.

id: library-exports
language: multi

patterns:
  # === JS/TS: Usage-based (index file exports) ===

  # Default exports from index files
  # Usage: export default class Hls { ... }
  # Context: kind="library_export", context_name="export.default"
  - concept: library_export
    usage:
      kind: "^library_export$"
      name: "^export\\.default$"
    extract:
      export_name: "metadata.export_name"
      is_default: "literal:true"

  # Named exports from index files
  # Usage: export function doSomething() { ... }
  # Context: kind="library_export", context_name="export.<name>"
  - concept: library_export
    usage:
      kind: "^library_export$"
      name: "^export\\."
    extract:
      export_name: "metadata.export_name"
      is_default: "literal:false"

  # === Go: Definition-based (exported symbols) ===
  # Go convention: exported symbols start with uppercase.
  # Matches functions, types, interfaces, and structs.
  # Test files (_test.go) are handled by the entrypoint scorer's
  # test-file penalty (50% confidence reduction).

  # Exported functions (e.g., New, Default, HandleRequest)
  - concept: library_export
    symbol_name: "^[A-Z]"
    symbol_kind: "^function$"
    language: "^go$"

  # Exported types (type aliases, named types)
  - concept: library_export
    symbol_name: "^[A-Z]"
    symbol_kind: "^type$"
    language: "^go$"

  # Exported interfaces (e.g., Handler, Router)
  - concept: library_export
    symbol_name: "^[A-Z]"
    symbol_kind: "^interface$"
    language: "^go$"

  # Exported structs (e.g., Engine, Context, Config)
  - concept: library_export
    symbol_name: "^[A-Z]"
    symbol_kind: "^struct$"
    language: "^go$"

  # === Elixir: Definition-based (modules) ===
  # Elixir modules (defmodule) are the primary unit of public API.
  # Test modules are handled by the entrypoint scorer's test-file penalty.

  # Modules (e.g., Phoenix.Router, Ecto.Query)
  - concept: library_export
    symbol_kind: "^module$"
    language: "^elixir$"

linkers: []
