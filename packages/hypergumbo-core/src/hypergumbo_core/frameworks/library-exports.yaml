# SPDX-License-Identifier: AGPL-3.0-or-later
# Library export detection (ADR-0003 v1.3.x)
#
# Detects exports that define the public API surface of a library.
#
# Libraries differ from applications:
# - Applications have main() functions, HTTP routes, CLI commands
# - Libraries have exports that form their public API
#
# Confidence is lower than framework routes (0.75 vs 0.95) because:
# - Libraries may have many exports, not all equally important
# - Not all exports are meaningful entry points
#
# Detection strategies by language:
# - JS/TS: Match UsageContext records for exports from index files
# - Go: Match exported (uppercase) functions, types, interfaces, structs
# - Elixir: Match module definitions (defmodule) and public functions (def, not defp)
# - Rust: Match pub items (functions, structs, traits, enums, methods)
#   Note: pub(crate)/pub(super) are crate-internal, not library exports
#
# The entrypoint scoring system (confidence * connectivity boost) ensures
# the most important/connected exports are prioritized for auto-slicing.

id: library-exports
language: multi

patterns:
  # === JS/TS: Usage-based (index file exports) ===

  # Default exports from index files
  # Usage: export default class Hls { ... }
  # Context: kind="library_export", context_name="export.default"
  - concept: library_export
    usage:
      kind: "^library_export$"
      name: "^export\\.default$"
    extract:
      export_name: "metadata.export_name"
      is_default: "literal:true"

  # Named exports from index files
  # Usage: export function doSomething() { ... }
  # Context: kind="library_export", context_name="export.<name>"
  - concept: library_export
    usage:
      kind: "^library_export$"
      name: "^export\\."
    extract:
      export_name: "metadata.export_name"
      is_default: "literal:false"

  # === Python: Definition-based (__init__.py public symbols) ===
  # Python libraries expose their public API through __init__.py files.
  # Symbols defined/imported in __init__.py are the package's public interface.
  # Private symbols (prefixed with _) are excluded via symbol_name filter.
  # Test files are handled by the entrypoint scorer's test-file penalty.

  # Public functions in __init__.py (e.g., create_app, get_application)
  - concept: library_export
    symbol_name: "^[^_]"
    symbol_kind: "^function$"
    language: "^python$"
    symbol_path: "__init__\\.py$"

  # Public classes in __init__.py (e.g., FastAPI, Flask, Django)
  - concept: library_export
    symbol_name: "^[^_]"
    symbol_kind: "^class$"
    language: "^python$"
    symbol_path: "__init__\\.py$"

  # Re-exported functions from __init__.py
  # When __init__.py does "from .module import func", the original symbol
  # in module.py gets a "re_exported" modifier. This pattern matches those
  # symbols even though they're not physically in __init__.py.
  - concept: library_export
    symbol_name: "^[^_]"
    symbol_kind: "^function$"
    language: "^python$"
    modifiers: "^re_exported$"

  # Re-exported classes from __init__.py (e.g., FastAPI, APIRouter)
  - concept: library_export
    symbol_name: "^[^_]"
    symbol_kind: "^class$"
    language: "^python$"
    modifiers: "^re_exported$"

  # === Go: Definition-based (exported symbols) ===
  # Go convention: exported symbols start with uppercase.
  # Matches functions, types, interfaces, and structs.
  # Test files (_test.go) are handled by the entrypoint scorer's
  # test-file penalty (50% confidence reduction).

  # Exported functions (e.g., New, Default, HandleRequest)
  - concept: library_export
    symbol_name: "^[A-Z]"
    symbol_kind: "^function$"
    language: "^go$"

  # Exported types (type aliases, named types)
  - concept: library_export
    symbol_name: "^[A-Z]"
    symbol_kind: "^type$"
    language: "^go$"

  # Exported interfaces (e.g., Handler, Router)
  - concept: library_export
    symbol_name: "^[A-Z]"
    symbol_kind: "^interface$"
    language: "^go$"

  # Exported structs (e.g., Engine, Context, Config)
  - concept: library_export
    symbol_name: "^[A-Z]"
    symbol_kind: "^struct$"
    language: "^go$"

  # === Java/Kotlin: Definition-based (public interfaces, classes, enums) ===
  # Java libraries expose their public API through public classes and interfaces.
  # Interfaces define the API contract; public classes are implementations.
  # Test files are handled by the entrypoint scorer's test-file penalty (90% reduction).
  # When semantic entrypoints exist (routes, controllers, commands), library
  # exports are further demoted by 90%.

  # Public interfaces (e.g., Table, Catalog, Schema in Apache Iceberg)
  - concept: library_export
    symbol_kind: "^interface$"
    language: "^java$"
    modifiers: "^public$"

  # Public classes (e.g., BaseTable, GenericRecord, PartitionSpec)
  - concept: library_export
    symbol_kind: "^class$"
    language: "^java$"
    modifiers: "^public$"

  # Public enums (e.g., FileFormat, ManifestContent)
  - concept: library_export
    symbol_kind: "^enum$"
    language: "^java$"
    modifiers: "^public$"

  # Kotlin public interfaces
  - concept: library_export
    symbol_kind: "^interface$"
    language: "^kotlin$"
    modifiers: "^public$"

  # Kotlin public classes
  - concept: library_export
    symbol_kind: "^class$"
    language: "^kotlin$"
    modifiers: "^public$"

  # === Elixir: Definition-based (modules + public functions) ===
  # Elixir modules (defmodule) are the primary unit of public API.
  # Public functions (def) are the callable API surface.
  # Private functions (defp) are excluded via modifiers_exclude.
  # Test modules/functions are handled by the entrypoint scorer's test-file penalty.

  # Modules (e.g., Phoenix.Router, Ecto.Query)
  - concept: library_export
    symbol_kind: "^module$"
    language: "^elixir$"

  # Public functions (e.g., Phoenix.Socket.handle_in)
  # Excludes defp (private) functions via modifiers_exclude.
  - concept: library_export
    symbol_kind: "^function$"
    language: "^elixir$"
    modifiers_exclude: "^private$"

  # === Rust: Definition-based (pub items) ===
  # Rust library crates expose their public API through `pub` items.
  # `pub(crate)`, `pub(super)`, and `pub(in path)` are crate-internal
  # visibility, NOT library exports — the regex matches only bare `pub`.
  # The Rust analyzer extracts modifiers as ["pub"], ["pub(crate)"], etc.
  # Test files are handled by the entrypoint scorer's test-file penalty.

  # Pub functions (e.g., pub fn new(), pub fn parse())
  - concept: library_export
    symbol_kind: "^function$"
    language: "^rust$"
    modifiers: "^pub$"

  # Pub structs (e.g., pub struct Config, pub struct Builder)
  - concept: library_export
    symbol_kind: "^struct$"
    language: "^rust$"
    modifiers: "^pub$"

  # Pub traits (e.g., pub trait Handler, pub trait Serialize)
  - concept: library_export
    symbol_kind: "^trait$"
    language: "^rust$"
    modifiers: "^pub$"

  # Pub enums (e.g., pub enum ErrorKind, pub enum Mode)
  - concept: library_export
    symbol_kind: "^enum$"
    language: "^rust$"
    modifiers: "^pub$"

  # Pub methods (e.g., pub fn load(&self) in impl blocks)
  - concept: library_export
    symbol_kind: "^method$"
    language: "^rust$"
    modifiers: "^pub$"

  # === Solidity: Definition-based (public/external contract functions) ===
  # Solidity smart contracts expose their ABI through public and external functions.
  # These are the callable surface from external accounts and other contracts.
  # Internal and private functions are excluded via explicit modifiers match.
  # The Solidity analyzer extracts visibility modifiers: public, external, internal, private.

  # Public functions (callable externally and internally)
  - concept: library_export
    symbol_kind: "^function$"
    language: "^solidity$"
    modifiers: "^public$"

  # External functions (callable only externally — primary ABI surface)
  - concept: library_export
    symbol_kind: "^function$"
    language: "^solidity$"
    modifiers: "^external$"

  # Public contracts (the contract itself is a deployable unit)
  - concept: library_export
    symbol_kind: "^contract$"
    language: "^solidity$"

  # Public interfaces (define the callable surface)
  - concept: library_export
    symbol_kind: "^interface$"
    language: "^solidity$"

  # === Circom: Templates are the API surface ===
  # Circom templates define reusable circuit components. In library repos
  # like circomlib, templates are the primary exports (Poseidon, MiMC, etc.)
  - concept: library_export
    symbol_kind: "^class$"
    language: "^circom$"

  # Circom functions (pure computations) are also library exports
  - concept: library_export
    symbol_kind: "^function$"
    language: "^circom$"

  # === Lean 4: Definition-based (all public defs are API surface) ===

  # Lean 4 definitions (def, theorem, lemma) are public by default.
  # In proof libraries like ArkLib, theorems ARE the library exports.
  - concept: library_export
    symbol_kind: "^function$"
    language: "^lean$"

  # Lean 4 structures (equivalent to classes/records)
  - concept: library_export
    symbol_kind: "^(structure|inductive)$"
    language: "^lean$"

  # === Agda: Definition-based (public functions and data types) ===

  # Agda functions (including theorems/lemmas) are public by default
  - concept: library_export
    symbol_kind: "^function$"
    language: "^agda$"

  # Agda data types and records
  - concept: library_export
    symbol_kind: "^(data|record)$"
    language: "^agda$"

  # === Wolfram: Definition-based (all public definitions are API surface) ===

  # Wolfram function definitions (SetDelayed :=) are public by default
  - concept: library_export
    symbol_kind: "^function$"
    language: "^wolfram$"

  # Wolfram variable definitions (Set =) - package-level constants
  - concept: library_export
    symbol_kind: "^variable$"
    language: "^wolfram$"

  # === C/C++: Header file exports (include/ directories) ===
  # C/C++ libraries expose their public API through header files in include/
  # directories. Functions, classes, and structs declared in these headers are
  # the public API surface (e.g., rocksdb's include/rocksdb/db.h).

  # Classes in public headers
  - concept: library_export
    symbol_kind: "^class$"
    language: "^cpp$"
    symbol_path: "(?:^|/)include/"

  # Structs in public headers
  - concept: library_export
    symbol_kind: "^struct$"
    language: "^cpp$"
    symbol_path: "(?:^|/)include/"

  # Functions in public headers
  - concept: library_export
    symbol_kind: "^function$"
    language: "^cpp$"
    symbol_path: "(?:^|/)include/"

  # Methods in public headers (class methods declared in headers)
  - concept: library_export
    symbol_kind: "^method$"
    language: "^cpp$"
    symbol_path: "(?:^|/)include/"

  # C public header functions
  - concept: library_export
    symbol_kind: "^function$"
    language: "^c$"
    symbol_path: "(?:^|/)include/"

linkers: []
