# SPDX-License-Identifier: AGPL-3.0-or-later
# FastAPI framework patterns (ADR-3aaa v0.8.x)
#
# Matches FastAPI route decorators, Pydantic models, and Depends injection.
# Symbols matching these patterns get enriched with concept metadata.

id: fastapi
language: python

patterns:
  # Route patterns - @app.get("/path"), @router.post("/path"),
  # @dag_run_router.get("/dag_runs"), etc.
  # Named routers (e.g. connections_router, v1_router) are common in
  # FastAPI projects like Airflow's core_api.
  - concept: route
    decorator: "^(app|router|\\w+_router)\\.(get|post|put|delete|patch|options|head)$"
    extract_path: "args[0]"
    extract_method: "decorator_suffix"

  # Generic route - @app.route("/path", methods=["POST"])
  - concept: route
    decorator: "^(app|router|\\w+_router)\\.route$"
    extract_path: "args[0]"
    extract_method: "kwargs.methods"

  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # These match against UsageContext records for call-based routing

  # FastAPI add_api_route - router.add_api_route('/path', handler, methods=['GET'])
  - concept: route
    usage:
      kind: "^call$"
      name: "^(app|router|\\w+_router)\\.add_api_route$"
      position: "^view_func$"
    extract:
      path: "metadata.route_path"
      method: "metadata.methods"

  # APIRouter with prefix - router = APIRouter(prefix="/api/v1")
  # Note: This pattern won't match directly since it's an assignment,
  # but the prefix info should be in symbol metadata

  # Pydantic model - class User(BaseModel):
  - concept: model
    base_class: "^(pydantic\\.)?BaseModel$"

  # Dependency injection - def endpoint(db: Session = Depends(get_db)):
  - concept: dependency
    parameter_type: "^Depends$"

  # Background task parameter - def endpoint(background_tasks: BackgroundTasks):
  - concept: background_task
    parameter_type: "^BackgroundTasks$"

  # Request/Response parameters
  - concept: request
    parameter_type: "^(Request|Response)$"

  # OAuth2 authentication
  - concept: auth
    parameter_type: "^(OAuth2PasswordBearer|OAuth2AuthorizationCodeBearer|HTTPBasic|HTTPBearer)$"

  # Security utilities
  - concept: security
    decorator: "^Depends$"

  # Middleware decorator (Starlette)
  - concept: middleware
    decorator: "^(app|router|\\w+_router)\\.middleware$"

  # Exception handlers
  - concept: error_handler
    decorator: "^(app|router|\\w+_router)\\.exception_handler$"

  # Startup/shutdown events
  - concept: lifecycle
    decorator: "^(app|router|\\w+_router)\\.(on_event|on_startup|on_shutdown)$"

  # SQLModel (SQLAlchemy + Pydantic)
  - concept: model
    base_class: "^SQLModel$"


  # ============ CONSTRUCTION-BASED PATTERNS (WI-nopod) ============
  # FastAPI's application object is CONSTRUCTED (`app = FastAPI()`), not
  # subclassed or decorated — so neither the decorator surface above nor a
  # base_class rule can reach it. Contrast aiohttp, whose Application IS
  # subclassed and is matched with `base_class: "^Application$"`.
  #
  # The producer records the callee on the bound variable as
  # meta["constructed_from"], keeping any qualification. meta_match applies
  # re.match (NOT re.search), so `(.*\.)?` is required to accept the
  # qualified form — `(^|\.)FastAPI$` silently misses `fastapi.FastAPI`.
  - concept: application
    symbol_kind: "^variable$"
    meta_match:
      constructed_from: "(.*\\.)?FastAPI$"

  # APIRouter instances are the sub-application unit; same construction shape.
  - concept: router
    symbol_kind: "^variable$"
    meta_match:
      constructed_from: "(.*\\.)?APIRouter$"

linkers:
  - http
