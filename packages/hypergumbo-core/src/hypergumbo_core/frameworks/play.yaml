# SPDX-License-Identifier: AGPL-3.0-or-later
# Play Framework patterns for Scala (ADR-3aaa)
#
# Play Framework is a high-productivity Scala/Java web framework.
# Routes are defined in conf/routes, controllers extend BaseController.
#
# Pattern types:
# - Definition-based: Match controller base classes and action blocks
# - Usage-based: Match Action { } DSL patterns

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: play
language: scala

patterns:
  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # Play Action DSL - Action { request => ... }
  - concept: route
    usage:
      kind: "^call$"
      name: "^Action(\\.(async))?$"
      position: "^args\\[last\\]$"
    extract:
      method: "metadata.http_method"

  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================
  # Play controllers extend BaseController or AbstractController
  - concept: controller
    base_class: "^(BaseController|AbstractController|InjectedController)$"

  # A CSRF error handler: an implementation of CSRF.ErrorHandler (Scala API)
  # or CSRFErrorHandler (Java interface) handed to CSRFCheck(action, handler)
  # or the CSRF filter; Play calls its `handle` when a request fails the token
  # check. Anchored on the qualified spelling: another library's bare
  # `ErrorHandler` is not Play's.
  - concept: error_handler
    base_class: "^((.*\\.)?CSRF\\.ErrorHandler|CSRFErrorHandler)$"
    symbol_kind: "^(class|object)$"
    language: "^scala$"

  # Play EventSource handlers
  - concept: event_source
    decorator: "^EventSource$"

  # Play authentication helpers
  - concept: auth
    decorator: "^(Authenticated|OptionallyAuthenticated|Security\\.Authenticated)$"

  # Play silhouette auth (common Play auth library)
  - concept: auth
    decorator: "^(SecuredAction|UserAwareAction|UnsecuredAction)$"

  # Play WS (HTTP client)
  - concept: http_client
    decorator: "^ws\\.(url|get|post|put|delete)$"

  # Akka Streams integration
  - concept: streaming
    decorator: "^Source\\.(single|apply|fromIterator|fromPublisher)$"

  # Play Slick database actions
  - concept: database
    decorator: "^db\\.run$"

  # Play cache
  - concept: cache
    decorator: "^cache\\.(get|set|remove|getOrElseUpdate)$"
