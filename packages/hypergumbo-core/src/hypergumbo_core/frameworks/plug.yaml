# SPDX-License-Identifier: AGPL-3.0-or-later
# Plug framework patterns (ADR-3aaa)
#
# Plug is Elixir's HTTP middleware library. Routes are defined
# using the Plug.Router DSL with get/post/put/delete macros.

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.
#
# `adopts:` rows (WI-movur) read `meta["adopted_modules"]`, which the Elixir
# analyzer writes on each module: the modules its `use` directives run and the
# behaviours they declare. `use Plug.SSL` (a deleted row) names no construct:
# Plug.SSL has no `__using__`; `plug Plug.SSL`, `plug Plug.Session` and
# `plug Plug.CSRFProtection` register library plugs, no code of the repository.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: plug
language: elixir

patterns:
  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # Plug.Router route macros
  - concept: route
    usage:
      kind: "^call$"
      name: "^(get|post|put|patch|delete|options|head|match)$"
      position: "^args\\[last\\]$"
    extract:
      path: "metadata.route_path"
      method: "metadata.http_method"

  # Registrations (WI-movur): a call that hands the framework code of the
  # repository. The Elixir analyzer records one only when the argument is an
  # alias naming a module of the repository or an atom naming a function of
  # the enclosing module, and only for call names a row here names.

  # Function plug `plug :authenticate` (a function of the module) or module
  # plug `plug MyApp.Auth` (a module of the repository); `plug Plug.Logger`
  # and `plug :match` name no code of the repository and are not recorded.
  - concept: middleware
    usage:
      kind: "^call$"
      name: "^plug$"
      position: "^args\\[0\\]$"

  # A plug mounted under a path: `forward "/admin", to: MyApp.AdminRouter`
  # (Plug.Router) / `forward "/admin", MyApp.AdminPlug` (Phoenix.Router)
  - concept: middleware
    usage:
      kind: "^call$"
      name: "^forward$"
      position: "^(args\\[1\\]|kwargs\\[to\\])$"

  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================

  # Plug.Router module - `use Plug.Router`
  - concept: controller
    adopts: "^Plug\\.Router$"

  # Plug.Builder module - `use Plug.Builder`: a plug pipeline of its own
  - concept: middleware
    adopts: "^Plug\\.Builder$"

  # Plug.ErrorHandler - `use Plug.ErrorHandler`: Plug calls its
  # handle_errors/2 when the wrapped call/2 raises
  - concept: error_handler
    adopts: "^Plug\\.ErrorHandler$"

  # Plug.Conn manipulation
  # CANNOT FIRE: nothing writes a decorator named `conn`. A module plug is a
  # module that defines init/1 and call/2, a function plug a function of
  # (conn, opts); neither is detected.
  - concept: middleware
    decorator: "^conn$"

  # Ecto schemas (commonly used with Plug)
  - concept: model
    adopts: "^Ecto\\.Schema$"

  # Ecto changesets
  - concept: model
    decorator: "^use Ecto\\.Changeset$"
