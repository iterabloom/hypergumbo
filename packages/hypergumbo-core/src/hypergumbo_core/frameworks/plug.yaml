# SPDX-License-Identifier: AGPL-3.0-or-later
# Plug framework patterns (ADR-3aaa)
#
# Plug is Elixir's HTTP middleware library. Routes are defined
# using the Plug.Router DSL with get/post/put/delete macros.

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-06-18
id: plug
language: elixir

patterns:
  # ==================== USAGE-BASED PATTERNS (v1.1.x) ====================
  # Plug.Router route macros
  - concept: route
    usage:
      kind: "^call$"
      name: "^(get|post|put|patch|delete|options|head|match)$"
      position: "^args\\[last\\]$"
    extract:
      path: "metadata.route_path"
      method: "metadata.http_method"

  # ==================== DEFINITION-BASED PATTERNS (v1.0.x) ====================

  # Plug.Conn manipulation
  - concept: middleware
    decorator: "^conn$"

  # Ecto schemas (commonly used with Plug)
  - concept: model
    decorator: "^use Ecto\\.Schema$"

  # Ecto changesets
  - concept: model
    decorator: "^use Ecto\\.Changeset$"
