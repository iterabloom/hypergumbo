# SPDX-License-Identifier: AGPL-3.0-or-later
# ZIO framework patterns (ADR-3aaa v1.1.x)
#
# ZIO is a functional effect system for Scala. ZIO 2.x uses Scala 3 features
# (givens, extension methods) and provides structured concurrency, resource
# management, and built-in dependency injection via ZLayer.
#
# Application entry: extends ZIOAppDefault (ZIO 2.x) or ZIOApp (generic).
# Both define a `def run` method as the application entry point.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-06-18
id: zio
language: scala

patterns:
  # ZIO application entry points
  - concept: application
    base_class: "^ZIOAppDefault$"
  - concept: application
    base_class: "^ZIOApp$"

  # ZIO HTTP (zio-http) routes are NOT detected. Two rules here used a
  # `usage_call:` key the loader never read, so they matched nothing; and the
  # supported `usage:` spelling would match nothing either, because the
  # scala analyzer emits no usage context for `Routes(Method.GET / "x" ->
  # handler(...))` (checked on a fixture, WI-hapon). Deleted rather than
  # kept as rules that look like coverage; the gap is filed.
