# CLI entrypoint patterns - JavaScript/TypeScript (ADR-3aaa)
#
# Patterns for detecting command-line interface entrypoints:
# Commander.js, yargs, oclif, Inquirer, CAC.

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: cli-js
language: javascript

patterns:
  # ==================== COMMANDER.JS PATTERNS ====================

  # Commander option
  - concept: option
    decorator: "^(program|commander)\\.option$"

  # Commander argument
  - concept: argument
    decorator: "^(program|commander)\\.argument$"

  # ==================== YARGS PATTERNS ====================

  # yargs option
  - concept: option
    decorator: "^yargs\\.option$"

  # yargs positional
  - concept: argument
    decorator: "^yargs\\.positional$"

  # ==================== OCLIF PATTERNS ====================
  # oclif Command class
  - concept: command
    base_class: "^Command$"

  # oclif flags
  - concept: option
    decorator: "^Flags\\.(string|boolean|integer)$"

  # ==================== CAC PATTERNS ====================

  # CAC option
  - concept: option
    decorator: "^(cli|cac)\\.option$"

  # ==================== GLUEGUN PATTERNS ====================
  # Gluegun command module
  - concept: command
    base_class: "^GluegunCommand$"

  # ==================== REGISTRATION ROWS (WI-movur) ====================
  # These match the registration UsageContext the JS/TS analyzer records when
  # a call hands a LOCAL function to a library call: ``position`` is
  # ``args[i]`` for the i-th argument, ``args[i].<key>`` for a function in an
  # option object, ``[j]`` for an array element. A chained receiver is written
  # with its calls collapsed (``program.command('x').action(f)`` ->
  # ``program.action``); a bare callee as its import (``koa-mount``).

  # Commander / CAC / Vorpal action - program.command('x').action(fn)
  # (the chain is collapsed: the context is named program.action)
  - concept: command
    usage:
      kind: "^call$"
      name: "^[\\w$.]+\\.action$"
      position: "^args\\[0\\]$"

  # yargs command - yargs.command(cmd, desc, builder, handler)
  - concept: command
    usage:
      kind: "^call$"
      name: "^[\\w$.]+\\.command$"
      position: "^args\\[3\\]$"

  # yargs command object - yargs.command({ command, describe, handler })
  - concept: command
    usage:
      kind: "^call$"
      name: "^[\\w$.]+\\.command$"
      position: "^args\\[0\\]\\.handler$"
