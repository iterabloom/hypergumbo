# Starlette framework patterns (WI-sulaz)
#
# Starlette routes are bare constructor calls — Route("/path", handler, ...)
# and WebSocketRoute("/ws", handler) — typically passed as a list to a
# Starlette(routes=[...]) constructor or to Mount(...). The Python analyzer
# emits UsageContext records for these calls (with import-scoped strict
# matching against starlette.routing) so this YAML can attach concept=route
# to handler symbols, complementing the kind="route" symbols emitted directly.

id: starlette
language: python

patterns:
  # Route("/path", handler, methods=["GET", "POST"])
  - concept: route
    usage:
      kind: "^call$"
      name: "^Route$"
      position: "^view_func$"
    extract:
      path: "metadata.route_path"
      method: "metadata.methods"

  # WebSocketRoute("/ws", handler) → method "WS" set synthetically by the
  # extractor; the handler concept is websocket_handler (WI-kuvig/WI-lomoz)
  # so it classifies as a WebSocket entrypoint, not an HTTP route. The
  # synthetic "WS" method is retained on the minted route symbol's meta.
  - concept: websocket_handler
    usage:
      kind: "^call$"
      name: "^WebSocketRoute$"
      position: "^view_func$"
    extract:
      path: "metadata.route_path"
      method: "metadata.methods"

linkers:
  - http
