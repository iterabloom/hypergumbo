# SPDX-License-Identifier: AGPL-3.0-or-later
# Bare Node.js HTTP server patterns (WI-tisam / WI-donud)
#
# Node's stdlib ``http.createServer`` / ``https.createServer`` /
# ``http2.createServer`` accept a request callback that handles every
# incoming request — no framework router, no per-route registration.
# The function that *calls* createServer is therefore the HTTP entry
# point for the deployment. The reflect agent's "where do HTTP requests
# enter?" question on apollo-server-style deployments was answerable
# from rslice seeds + slice.0 but not from the route-handler-linker
# output, because no YAML pattern recognised this idiom.
#
# Sibling framework files (express.yaml, graphql.yaml) capture the
# router-attached idioms. This file is the catch-all for raw-stdlib
# patterns AND for high-specificity HTTP-entrypoint names from frameworks
# that are otherwise invisible to the framework_role-driven route
# materialiser when the framework is not detected (WI-donud: a thin
# Apollo consumer importing via a workspace can fail the package.json
# dependency check).

id: node-http
language: javascript

patterns:
  # Node stdlib HTTP/HTTPS/HTTP2 server creation.
  # The receiver (``http``, ``https``, ``http2``, ``Http`` for typed
  # imports, or a renamed import) is followed by ``.createServer``.
  - concept: route
    usage:
      kind: "^call$"
      name: "^(http|https|http2|Http)\\.createServer$"
    extract:
      path: "literal:/"
      method: "literal:ALL"

  # Destructured-import shape: ``import { createServer } from 'http'``
  # makes the function callable as bare ``createServer(...)``. UsageContext
  # records this with ``context_name == "createServer"``.
  - concept: route
    usage:
      kind: "^call$"
      name: "^createServer$"
    extract:
      path: "literal:/"
      method: "literal:ALL"

  # Apollo Server v4 standalone HTTP listener (WI-donud).
  # startStandaloneServer(server, options) launches the GraphQL server
  # as its own HTTP listener — no Express/Fastify middleware wraps it,
  # so the standard app.use(expressMiddleware(server)) detection misses
  # it. The function that calls startStandaloneServer IS the HTTP
  # entrypoint for the deployment. Lives here rather than in graphql.yaml
  # because thin Apollo consumers (workspace imports without local
  # package.json dep) get frameworks=set() and graphql.yaml never loads.
  - concept: route
    usage:
      kind: "^call$"
      name: "^startStandaloneServer$"
    extract:
      path: "literal:/"
      method: "literal:ALL"

  # Apollo Server v3-style runHttpQuery and executeHTTPGraphQLRequest —
  # the underlying HTTP entry that newer Apollo wrappers delegate to.
  # Same workspace-import rationale as startStandaloneServer; name set
  # is high-specificity so always-loading is safe (DEEP cohort 1 reflect
  # on apollo-server).
  - concept: route
    usage:
      kind: "^call$"
      name: "^(runHttpQuery|executeHTTPGraphQLRequest)$"
    extract:
      path: "literal:/"
      method: "literal:ALL"

linkers: []
