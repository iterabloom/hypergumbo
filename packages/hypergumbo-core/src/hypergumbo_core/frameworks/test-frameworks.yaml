# SPDX-License-Identifier: AGPL-3.0-or-later
# Language-level test function detection (ADR-3aaa v1.2.x)
#
# Detects idiomatic test functions across languages and frameworks:
# - Python: pytest (test_*), unittest (test_*)
# - JavaScript/TypeScript: jest/mocha/vitest (test/it functions with "test" in name)
# - Go: Test* functions, Benchmark* functions
# - Java: @Test annotation (JUnit, TestNG)
# - Ruby: RSpec (describe/it), Minitest (test_*)
# - Rust: #[test] attribute
# - C#: [Test], [Fact], [Theory] attributes
# - Kotlin: @Test annotation
# - Swift: XCTest (test* methods)
# - PHP: PHPUnit (test*)
# - Elixir: ExUnit (test blocks)
# - Scala: ScalaTest, MUnit, Specs2
# - Dart: test package (test/group functions)
# - Clojure: clojure.test (deftest)
# - Haskell: HSpec, Tasty
# - Erlang: EUnit, Common Test
# - F#: Expecto, NUnit, xUnit
# - Julia: Test stdlib (@test, @testset)
# - OCaml: OUnit, Alcotest
# - Lua: busted, luaunit
# - R: testthat
# - Nim: unittest
# - Zig: built-in test blocks
# - D: built-in unittest
# - Groovy: Spock, JUnit
#
# These patterns identify test code which is useful for:
# - Filtering test files from production code slices
# - Understanding test coverage and structure
# - Identifying test entry points
#
# Note: Some patterns use decorator matching (Java/C#/Rust) while others use
# naming conventions (Python/Go/Swift).
#
# A NAME ROW IS WRITTEN AGAINST THE NAME THE ANALYZER RECORDS. Most analyzers
# name a member with its owner (`MathTest.test_adds`, Ruby `MathTest#test_adds`,
# a Python function nested in another `outer.inner`) and Erlang names a
# function `name/arity`. `symbol_name:` is searched in that whole name;
# `method_name:` is matched from the start of the member's own name. Rows
# here that anchored a member's name with `symbol_name: "^..."` matched
# nothing for years. Check a row by running the analyzer on a fixture and
# reading the node, never against a symbol built by hand.
#
# A NAME ALONE IS NOT A TEST. A production class can have a `test_connection`
# or a `testSetup` method. A name row therefore also asks for what makes the
# runner collect it, which for these runners is the file. The file condition
# of a `test_function` row accepts only paths that `paths.is_test_file` also
# calls a test file: the entry ranking demotes a test by that rule alone, so
# a test function the rule does not know would be listed as a prominent
# entry point (see the Erlang rows).
#
# NOT A SYMBOL: a test written as a CALL with a block (RSpec `it "..." do`,
# ExUnit `test "..." do`, ScalaTest and MUnit `test("...") { }`, a Spock
# feature method named by a string) is recorded by no analyzer as a symbol.
# The rows for them below are marked; they match only a definition that
# happens to be NAMED `it` or `describe`.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: test-frameworks
language: multi

patterns:
  # ====== Python ======
  # pytest and unittest: a top-level test_* function. The whole name, with
  # no dot in it: py.py names a function nested in another `outer.inner`,
  # and a helper nested in a test function is not a test (`^test_` alone
  # matched every one of them through the outer name).
  - concept: test_function
    symbol_name: "^test_\\w*$"
    symbol_kind: "^function$"
    language: "^python$"

  # pytest and unittest: test* methods of a class in a test file. pytest
  # collects them from `test_*.py` and `*_test.py`; `tests.py` and a `test/`
  # or `tests/` directory are where Django and most projects keep theirs.
  # py.py names a method `Class.method`. The file is asked for because a
  # name alone is not a test (`Backend.test_connection`).
  - concept: test_function
    method_name: "^test"
    symbol_kind: "^method$"
    language: "^python$"
    symbol_path: "(^|/)(test_[^/]*|[^/]*_test|tests)\\.py$|(^|/)tests?/"

  # pytest fixture functions (decorated with @pytest.fixture)
  - concept: test_fixture
    decorator: "^(pytest\\.)?fixture$"
    language: "^python$"

  # ====== Go ======
  # Go testing: Test* functions (must be in _test.go files)
  - concept: test_function
    symbol_name: "^Test[A-Z]"
    symbol_kind: "^function$"
    symbol_path: "_test\\.go$"
    language: "^go$"

  # Go testing: Benchmark* functions (must be in _test.go files)
  - concept: benchmark_function
    symbol_name: "^Benchmark[A-Z]"
    symbol_kind: "^function$"
    symbol_path: "_test\\.go$"
    language: "^go$"

  # Go testing: Example* functions (must be in _test.go files)
  - concept: example_function
    symbol_name: "^Example[A-Z]?"
    symbol_kind: "^function$"
    symbol_path: "_test\\.go$"
    language: "^go$"

  # ====== Java ======
  # JUnit 4/5, TestNG: @Test annotation
  - concept: test_function
    decorator: "^Test$"
    language: "^java$"

  # JUnit 5: @BeforeEach, @AfterEach
  - concept: test_lifecycle
    decorator: "^(BeforeEach|AfterEach|BeforeAll|AfterAll)$"
    language: "^java$"

  # JUnit 5: @ParameterizedTest
  - concept: test_function
    decorator: "^ParameterizedTest$"
    language: "^java$"

  # ====== Kotlin ======
  # JUnit: @Test annotation
  - concept: test_function
    decorator: "^Test$"
    language: "^kotlin$"

  # ====== JavaScript/TypeScript ======
  # jest/mocha/vitest: function names containing "test" or starting with "test"
  - concept: test_function
    symbol_name: "^test"
    symbol_kind: "^function$"
    language: "^(javascript|typescript)$"

  # ====== Ruby ======
  # Minitest and Test::Unit: test_* methods of a test case, which live
  # under `test/` or in a `*_test.rb` file. ruby.py names a method
  # `Class#method`. The file is asked for because the name alone is not a
  # test, and a `test_*.rb` file name is not asked for because that is not
  # one either: chatwoot's `Instagram::TestEventService#test_message_params`
  # in `app/services/instagram/test_event_service.rb` is production code.
  - concept: test_function
    method_name: "^test_"
    symbol_kind: "^method$"
    language: "^ruby$"
    symbol_path: "(^|/)tests?/|_test\\.rb$"

  # RSpec: it/specify examples.
  # NOT A SYMBOL: an example is a call with a block and ruby.py emits no
  # symbol for it (chatwoot's spec/ has none). The row matches only a
  # top-level method that is itself NAMED `it` or `specify`.
  - concept: test_function
    symbol_name: "^(it|specify)$"
    symbol_kind: "^(function|method)$"
    language: "^ruby$"

  # RSpec: describe/context blocks.
  # NOT A SYMBOL, as above.
  - concept: test_suite
    symbol_name: "^(describe|context)$"
    symbol_kind: "^(function|method)$"
    language: "^ruby$"

  # ====== Rust ======
  # Rust #[test] attribute, also under a runtime's path (#[tokio::test]).
  # rust.py records an attribute in meta.annotations, by its path as written.
  - concept: test_function
    annotation: "^(\\w+::)*test$"
    language: "^rust$"

  # Rust #[bench] attribute
  - concept: benchmark_function
    annotation: "^(\\w+::)*bench$"
    language: "^rust$"

  # ====== C# ======
  # NUnit: [Test] attribute (csharp.py records attributes in meta.annotations)
  - concept: test_function
    annotation: "^Test$"
    language: "^csharp$"

  # xUnit: [Fact] attribute (csharp.py records attributes in meta.annotations)
  - concept: test_function
    annotation: "^Fact$"
    language: "^csharp$"

  # xUnit: [Theory] attribute (csharp.py records attributes in meta.annotations)
  - concept: test_function
    annotation: "^Theory$"
    language: "^csharp$"

  # MSTest: [TestMethod] attribute (csharp.py records attributes in meta.annotations)
  - concept: test_function
    annotation: "^TestMethod$"
    language: "^csharp$"

  # ====== Swift ======
  # XCTest: a test case class. Here, not in a framework file: XCTest is only
  # ever imported by test code, so no framework file keyed on it would load.
  - concept: test_class
    base_class: "^XCTestCase$"
    language: "^swift$"

  # XCTest: test* methods of a test case. swift.py names a method
  # `Class.method`. XCTest collects them from XCTestCase subclasses, which a
  # SwiftPM package keeps under `Tests/` and which by convention sit in a
  # `<Name>Tests.swift` file; the file is asked for because a name alone is
  # not a test. NOT ASKED FOR: an Xcode group `<Name>Tests/` or
  # `<Name>UITests/` holding a file of another name, which
  # `paths.is_test_file` does not call a test file.
  - concept: test_function
    method_name: "^test"
    symbol_kind: "^method$"
    language: "^swift$"
    symbol_path: "(^|/)[Tt]ests?/|Tests\\.swift$"

  # XCTest: setUp/tearDown lifecycle methods, in the same files.
  - concept: test_lifecycle
    method_name: "^(setUp|tearDown)(WithError)?$"
    symbol_kind: "^method$"
    language: "^swift$"
    symbol_path: "(^|/)[Tt]ests?/|Tests\\.swift$"

  # ====== PHP ======
  # PHPUnit: test* methods of a test case file. php.py names a method
  # `Class.method`; PHPUnit collects `*Test.php`. The file is asked for
  # because the name alone is not a test: koel's storage classes have a
  # production `testSetup()` each.
  - concept: test_function
    symbol_name: "(^|\\.)test\\w*$"
    symbol_kind: "^method$"
    language: "^php$"
    symbol_path: "Test\\.php$"

  # PHPUnit: @test docblock annotation / #[Test] attribute.
  # CANNOT FIRE: php.py records neither a docblock tag nor an attribute.
  - concept: test_function
    decorator: "^test$"
    language: "^php$"

  # ====== C/C++ ======
  # Google Test: TEST(), TEST_F(), TEST_P() macros
  # These macros expand to functions named TEST/TEST_F/TEST_P
  - concept: test_function
    symbol_name: "^TEST(_F|_P)?$"
    symbol_kind: "^function$"
    language: "^(cpp|c)$"

  # Catch2: TEST_CASE(), SCENARIO() macros
  - concept: test_function
    symbol_name: "^(TEST_CASE|SCENARIO)$"
    symbol_kind: "^function$"
    language: "^(cpp|c)$"

  # ====== Elixir ======
  # ExUnit: test "..." do blocks.
  # NOT A SYMBOL: elixir.py emits no symbol for a `test`, `describe` or
  # `setup` block (phoenix's test/ holds 441 function symbols, none of them
  # one), and it names a function `Module.function`, so none of these three
  # rows can match.
  - concept: test_function
    symbol_name: "^test "
    symbol_kind: "^function$"
    language: "^elixir$"

  # ExUnit: setup/setup_all callbacks. NOT A SYMBOL, as above.
  - concept: test_lifecycle
    symbol_name: "^(setup|setup_all)$"
    symbol_kind: "^function$"
    language: "^elixir$"

  # ExUnit: describe blocks. NOT A SYMBOL, as above.
  - concept: test_suite
    symbol_name: "^describe "
    symbol_kind: "^function$"
    language: "^elixir$"

  # ====== Scala ======
  # JUnit: @Test annotation. This is the one rule by which a Scala `def` is
  # a test.
  - concept: test_function
    decorator: "^Test$"
    language: "^scala$"

  # No name row. A Scala method is not a test by being named test*: JUnit
  # asks for @Test (above), and ScalaTest, MUnit and Specs2 tests are calls
  # (`test("...") { }`), which are NOT A SYMBOL. Two rows stood here,
  # `symbol_name: "^test"` and `"^test$"`. scala.py names a method
  # `Class.method`, so they matched only top-level functions (tapir's
  # example helper `testWith`), and read against the method's own name they
  # would have marked 111 of tapir's methods, none of which is a test (50
  # are builders named `tests`, the rest `testServer`, `testClient` ...).

  # ====== Dart ======
  # Dart test package: test() function calls
  - concept: test_function
    symbol_name: "^test$"
    symbol_kind: "^function$"
    language: "^dart$"

  # Dart test package: group() for test suites
  - concept: test_suite
    symbol_name: "^group$"
    symbol_kind: "^function$"
    language: "^dart$"

  # Dart: setUp/tearDown lifecycle
  - concept: test_lifecycle
    symbol_name: "^(setUp|tearDown)(All)?$"
    symbol_kind: "^function$"
    language: "^dart$"

  # ====== Clojure ======
  # clojure.test: deftest macro creates test functions.
  # Guard: require test directory because Clojure uses test- as a naming
  # convention for "verify/probe" (e.g., test-ldap-connection is production
  # code that validates LDAP connectivity). WI-vutum.
  - concept: test_function
    symbol_name: "^test-"
    symbol_kind: "^function$"
    symbol_path: "(^|/)test(s)?/"
    language: "^clojure$"

  # clojure.test: deftest (captured as macro call)
  - concept: test_function
    symbol_name: "^deftest$"
    symbol_kind: "^(function|macro)$"
    language: "^clojure$"

  # ====== Haskell ======
  # HSpec: spec/describe/it functions
  - concept: test_function
    symbol_name: "^(spec|it)$"
    symbol_kind: "^function$"
    language: "^haskell$"

  - concept: test_suite
    symbol_name: "^describe$"
    symbol_kind: "^function$"
    language: "^haskell$"

  # Tasty: testCase, testGroup, testProperty
  - concept: test_function
    symbol_name: "^test(Case|Property)$"
    symbol_kind: "^function$"
    language: "^haskell$"

  - concept: test_suite
    symbol_name: "^testGroup$"
    symbol_kind: "^function$"
    language: "^haskell$"

  # QuickCheck: prop_* naming convention
  - concept: test_function
    symbol_name: "^prop_"
    symbol_kind: "^function$"
    language: "^haskell$"

  # ====== Erlang ======
  # EUnit: *_test functions.
  # MATCHES NOTHING, AND LEFT SO: erlang.py names a function `name/arity`,
  # so `_test$` never matches (`_test/0$` would: EUnit's rule is the name
  # and no argument). Not repaired here because EUnit tests live in `src/`,
  # beside the code they test, where the entry ranking does not demote a
  # test: with the repaired rows cowboy's 25 EUnit functions became its first
  # 25 entry points, ahead of everything else. Repair these two rows
  # together with that.
  - concept: test_function
    symbol_name: "_test$"
    symbol_kind: "^function$"
    language: "^erlang$"

  # EUnit: *_test_ generators. MATCHES NOTHING, AND LEFT SO, as above.
  - concept: test_function
    symbol_name: "_test_$"
    symbol_kind: "^function$"
    language: "^erlang$"

  # Common Test: test case functions (often prefixed with test_ or tc_)
  - concept: test_function
    symbol_name: "^(test_|tc_)"
    symbol_kind: "^function$"
    language: "^erlang$"

  # Common Test: init_per_*/end_per_* lifecycle
  - concept: test_lifecycle
    symbol_name: "^(init_per_|end_per_)"
    symbol_kind: "^function$"
    language: "^erlang$"

  # ====== F# ======
  # Expecto: testCase, testList
  - concept: test_function
    symbol_name: "^testCase$"
    symbol_kind: "^function$"
    language: "^fsharp$"

  - concept: test_suite
    symbol_name: "^testList$"
    symbol_kind: "^function$"
    language: "^fsharp$"

  # NUnit/xUnit: [<Test>], [<Fact>], [<Theory>] attributes
  # CANNOT FIRE: fsharp.py records no attribute of a function or member.
  - concept: test_function
    decorator: "^(Test|Fact|Theory)$"
    language: "^fsharp$"

  # Expecto: testProperty for property-based testing
  - concept: test_function
    symbol_name: "^testProperty$"
    symbol_kind: "^function$"
    language: "^fsharp$"

  # ====== Julia ======
  # Test stdlib: @test macro (functions containing test assertions)
  - concept: test_function
    symbol_name: "^test_"
    symbol_kind: "^function$"
    language: "^julia$"

  # Test stdlib: @testset blocks
  - concept: test_suite
    symbol_name: "^@testset$"
    symbol_kind: "^(function|macro)$"
    language: "^julia$"

  # ====== OCaml ======
  # OUnit/Alcotest: test_* functions
  - concept: test_function
    symbol_name: "^test_"
    symbol_kind: "^function$"
    language: "^ocaml$"

  # OUnit: suite naming
  - concept: test_suite
    symbol_name: "^suite$"
    symbol_kind: "^function$"
    language: "^ocaml$"

  # ====== Lua ======
  # busted: describe/it/pending blocks
  - concept: test_function
    symbol_name: "^(it|pending)$"
    symbol_kind: "^function$"
    language: "^lua$"

  - concept: test_suite
    symbol_name: "^describe$"
    symbol_kind: "^function$"
    language: "^lua$"

  # luaunit: test* functions
  - concept: test_function
    symbol_name: "^test"
    symbol_kind: "^function$"
    language: "^lua$"

  # busted: setup/teardown
  - concept: test_lifecycle
    symbol_name: "^(setup|teardown|before_each|after_each)$"
    symbol_kind: "^function$"
    language: "^lua$"

  # ====== R ======
  # testthat: test_that() calls
  - concept: test_function
    symbol_name: "^test_that$"
    symbol_kind: "^function$"
    language: "^r$"

  # testthat: describe/it for BDD style
  - concept: test_function
    symbol_name: "^it$"
    symbol_kind: "^function$"
    language: "^r$"

  - concept: test_suite
    symbol_name: "^describe$"
    symbol_kind: "^function$"
    language: "^r$"

  # testthat: setup/teardown
  - concept: test_lifecycle
    symbol_name: "^(setup|teardown)$"
    symbol_kind: "^function$"
    language: "^r$"

  # ====== Nim ======
  # unittest: test "..." blocks
  - concept: test_function
    symbol_name: "^test$"
    symbol_kind: "^(function|template)$"
    language: "^nim$"

  # unittest: suite blocks
  - concept: test_suite
    symbol_name: "^suite$"
    symbol_kind: "^(function|template)$"
    language: "^nim$"

  # unittest: setup/teardown
  - concept: test_lifecycle
    symbol_name: "^(setup|teardown)$"
    symbol_kind: "^(function|template)$"
    language: "^nim$"

  # ====== Zig ======
  # Zig: test "..." blocks (extracted as test functions)
  - concept: test_function
    symbol_name: "^test "
    symbol_kind: "^function$"
    language: "^zig$"

  # ====== D ======
  # D: unittest blocks
  - concept: test_function
    symbol_name: "^unittest$"
    symbol_kind: "^function$"
    language: "^d$"

  # D: @("test") UDA pattern
  # CANNOT FIRE: d_lang.py records no user-defined attribute.
  - concept: test_function
    decorator: "^test$"
    language: "^d$"

  # ====== Groovy ======
  # Spock: feature methods (def "should ..."()).
  # NOT A SYMBOL: groovy.py emits no symbol for a method named by a string,
  # so this row cannot match.
  - concept: test_function
    symbol_name: "^(should|def) "
    symbol_kind: "^method$"
    language: "^groovy$"

  # JUnit: @Test annotation
  - concept: test_function
    decorator: "^Test$"
    language: "^groovy$"

  # Spock: setup/cleanup fixture methods of a specification, in a test
  # source set (`src/test/`, `src/integTest/` ...), a `tests/` directory or
  # a `*Spec.groovy` / `*Test.groovy` file. groovy.py names most methods
  # `Class.method` and some without their class; `method_name` reads both.
  - concept: test_lifecycle
    method_name: "^(setup|cleanup|setupSpec|cleanupSpec)$"
    symbol_kind: "^method$"
    language: "^groovy$"
    symbol_path: "(^|/)src/\\w*[tT]est\\w*/|(^|/)tests?/|(Spec|Test|Specification)\\.groovy$"
