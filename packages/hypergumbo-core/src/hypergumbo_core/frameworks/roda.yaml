# SPDX-License-Identifier: AGPL-3.0-or-later
# Roda framework patterns (ADR-3aaa v1.1.x)
#
# Roda is a Ruby web framework with a routing tree approach.
# Routes are defined using r.on, r.get, r.post, etc. within a route block.
# Known for performance and simplicity.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-11-22
id: roda
language: ruby

patterns:
  # Application class (inherits Roda)
  - concept: application
    base_class: "^Roda$"

  # Route block - main entry point for routing
  - concept: route_definition
    usage:
      kind: "^call$"
      name: "^route$"
      # The handler is the call's block. No Ruby analyzer records a context
      # for a block (it has no symbol; WI-tavum), and the arguments are not
      # the handler, so this position is one no context has: the row matches
      # nothing until a block becomes a symbol.
      position: "^block$"

  # Root route handler
  - concept: route
    usage:
      kind: "^call$"
      name: "^r\\.root$"

  # Path segment matching - r.on "path" do ... end
  - concept: route_segment
    usage:
      kind: "^call$"
      name: "^r\\.on$"
      position: "^args\\[0\\]$"

  # Terminal path segment - r.is "path" do ... end
  - concept: route_terminal
    usage:
      kind: "^call$"
      name: "^r\\.is$"
      position: "^args\\[0\\]$"

  # HTTP GET method handler
  - concept: route
    usage:
      kind: "^call$"
      name: "^r\\.get$"
    extract:
      method: "GET"

  # HTTP POST method handler
  - concept: route
    usage:
      kind: "^call$"
      name: "^r\\.post$"
    extract:
      method: "POST"

  # HTTP PUT method handler
  - concept: route
    usage:
      kind: "^call$"
      name: "^r\\.put$"
    extract:
      method: "PUT"

  # HTTP PATCH method handler
  - concept: route
    usage:
      kind: "^call$"
      name: "^r\\.patch$"
    extract:
      method: "PATCH"

  # HTTP DELETE method handler
  - concept: route
    usage:
      kind: "^call$"
      name: "^r\\.delete$"
    extract:
      method: "DELETE"

  # HTTP HEAD method handler
  - concept: route
    usage:
      kind: "^call$"
      name: "^r\\.head$"
    extract:
      method: "HEAD"

  # HTTP OPTIONS method handler
  - concept: route
    usage:
      kind: "^call$"
      name: "^r\\.options$"
    extract:
      method: "OPTIONS"

  # Hash routes plugin - hash-based routing
  - concept: hash_route
    usage:
      kind: "^call$"
      name: "^r\\.hash_routes$"

  # Hash branch plugin - hash-based branching
  - concept: hash_branch
    usage:
      kind: "^call$"
      name: "^r\\.hash_branch$"

  # Plugin system - plugin :name
  - concept: plugin
    usage:
      kind: "^call$"
      name: "^plugin$"
      # The arguments name no code of the repository (a template, a status,
      # a URL, a library plugin); a context naming a local method or class
      # here would be a false match. No context has this position, so the
      # row matches nothing.
      position: "^none$"

  # Halt processing - r.halt
  - concept: halt
    usage:
      kind: "^call$"
      name: "^r\\.halt$"

  # Redirect - r.redirect
  - concept: redirect
    usage:
      kind: "^call$"
      name: "^r\\.redirect$"

  # Response body - response.write
  - concept: response
    usage:
      kind: "^call$"
      name: "^response\\.(write|status|headers|body)$"

  # Request parameters - r.params
  - concept: params
    usage:
      kind: "^call$"
      name: "^r\\.params$"

  # View rendering - view method from render plugin
  - concept: view
    usage:
      kind: "^call$"
      name: "^view$"
      # The arguments name no code of the repository (a template, a status,
      # a URL, a library plugin); a context naming a local method or class
      # here would be a false match. No context has this position, so the
      # row matches nothing.
      position: "^none$"
