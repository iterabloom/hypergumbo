# CLI entrypoint patterns - Rust (ADR-3aaa)
#
# Patterns for detecting command-line interface entrypoints:
# clap, structopt, argh.

# Rows that keyed a call on `decorator:` were deleted (audit 0027): the matcher
# reads decorator / annotation syntax only, so a call never matched them.

# ADR-0061: shipped, not maintained by hypergumbo. `retrieved` is the date these
# rows were last edited, the latest date they can have been checked upstream.
provenance: community
retrieved: 2026-06-18
id: cli-rust
language: rust

patterns:
  # ==================== CLAP PATTERNS ====================
  # clap Parser derive macro
  - concept: command
    annotation: "^Parser$"

  # clap Args derive macro
  - concept: command
    annotation: "^Args$"

  # clap Subcommand derive macro
  - concept: command
    annotation: "^Subcommand$"

  # clap ValueEnum derive macro
  - concept: schema
    annotation: "^ValueEnum$"

  # clap arg! macro
  - concept: argument
    decorator: "^arg!$"

  # ==================== STRUCTOPT PATTERNS (LEGACY) ====================
  # structopt derive macro
  - concept: command
    annotation: "^StructOpt$"

  # ==================== ARGH PATTERNS ====================
  # argh FromArgs derive
  - concept: command
    annotation: "^FromArgs$"

  # argh Subcommand derive
  - concept: command
    annotation: "^argh::Subcommand$"
