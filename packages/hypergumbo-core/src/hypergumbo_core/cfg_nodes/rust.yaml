# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0017 §1d: CFG node mapping for Rust (tree-sitter-rust grammar)
#
# Maps tree-sitter-rust node types to generic control-flow categories.
# Includes the early_return semantic hook for the ? operator.
#
# Child references: "field:name" → child_by_field_name("name"),
#                   "type:name" → first child with .type == "name"
provenance: builtin
language: rust
grammar: tree-sitter-rust

conditional:
  - node_type: if_expression
    condition_child: "field:condition"
    true_child: "field:consequence"
    false_child: "field:alternative"
  - node_type: if_let_expression
    condition_child: "field:pattern"
    true_child: "field:consequence"
    false_child: "field:alternative"

loop:
  - node_type: loop_expression
    body_child: "field:body"
    infinite: true
  - node_type: while_expression
    condition_child: "field:condition"
    body_child: "field:body"
  - node_type: while_let_expression
    condition_child: "field:pattern"
    body_child: "field:body"
  - node_type: for_expression
    body_child: "field:body"
    # `for v in xs` binds `v` with no node of its own: recorded at the loop
    # node, which rust_def_use's for_expression handler reads as the header
    # only (WI-losod).
    header_is_node: true

break_statement: [break_expression]
continue_statement: [continue_expression]
return_statement: [return_expression]

early_return:
  - node_type: try_expression
    semantics: return_on_err
    ok_defines: true
    err_edge: exit

switch:
  - node_type: match_expression
    scrutinee_child: "field:value"
    arms_child: "field:body"
    arm_type: match_arm

# Rust uses Result/? instead of try/catch
try_catch: []

# Atomic statement node types — the CFG builder treats these as a single
# CfgStatement and stops descending. Without this the builder recurses past
# let_declaration/assignment_expression down to bare identifiers, so a def/use
# extractor keyed on statement node types is never called with one: correct in
# isolation, inert in the pipeline. The reachability tests cannot see that,
# because a CFG of leaf tokens is still fully reachable.
#
# These are exactly the keys of rust_def_use._HANDLERS that classify() does not
# already own. Deliberately EXCLUDED because listing a type in both would make
# the atomic check shadow its control-flow role: return_expression (return),
# if_expression (conditional), for_expression (loop), match_arm (switch),
# try_expression (early_return), break_expression, continue_expression.
#
# NOTE: ADR-0017 §1d's illustrative example lists `return_expression` here.
# That example predates the convention above and would shadow the return hook;
# go.yaml documents the rule and this mapping follows it.
#
# A `closure_expression` is not atomic and not control flow: it is a
# `nested_function` (below), so the statement holding it stays ONE statement
# and its body is built as a region that may run (WI-faful).
# Node types that ARE a call in this grammar (WI-joluk). Consumed by
# cfg.uncovered_call_lines to ask whether the CFG's recorded statement
# extents cover every call site in a function body; a call outside every
# extent means the def/use extractor never saw it, and the taint walk
# forfeits its ability to return False for that function. A language that
# declares NONE is treated as unknowable and forfeits everything.
call_node_types:
  - call_expression
  - macro_invocation
  - method_call_expression

atomic_statement:
  - let_declaration
  - assignment_expression
  - compound_assignment_expr
  - expression_statement

# Functions nested in a function body (WI-faful): a closure or a nested `fn`
# runs when it is called, not where it is written. Its body is built as its own
# CFG region that MAY run, hung off the statement that holds it, rather than
# inlined in sequence. `let h = |y| { if y { .. } };` used to decompose into
# leaves, so `h` was a use that was never defined.
nested_function:
  - node_type: closure_expression
    body_child: "field:body"
  - node_type: function_item
    body_child: "field:body"
