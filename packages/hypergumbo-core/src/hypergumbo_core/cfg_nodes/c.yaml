# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0017 §1d: CFG node mapping for C (tree-sitter-c grammar), WI-himob.
#
# Child references: "field:name" → child_by_field_name("name"),
#                   "type:name" → first child with .type == "name"
#
# C++ is NOT covered by this file: its grammar adds try/catch, range-for and
# lambdas, and a cpp spec would be claiming coverage nobody measured.
provenance: builtin
language: c
grammar: tree-sitter-c

conditional:
  - node_type: if_statement
    condition_child: "field:condition"
    true_child: "field:consequence"
    false_child: "field:alternative"

loop:
  - node_type: while_statement
    condition_child: "field:condition"
    body_child: "field:body"
  - node_type: do_statement
    condition_child: "field:condition"
    body_child: "field:body"
  - node_type: for_statement
    # `for (i = 0; i < n; i++)`: the initializer runs once ahead of the test,
    # the update after the body and after a `continue` (WI-losod).
    initializer_child: "field:initializer"
    condition_child: "field:condition"
    update_child: "field:update"
    body_child: "field:body"

break_statement: [break_statement]
continue_statement: [continue_statement]
return_statement: [return_statement]

switch:
  - node_type: switch_statement
    scrutinee_child: "field:condition"
    arms_child: "field:body"
    arm_type: case_statement

# Node types that ARE a call in this grammar (WI-joluk): consumed by
# cfg.uncovered_semantic_lines to decide whether the CFG saw every call.
call_node_types:
  - call_expression

# Atomic statement node types: recorded as ONE CfgStatement each, so
# c_def_use's walker is handed the whole statement. Excluded because classify()
# owns them: return_statement, if/while/do/for/switch. `goto_statement` and
# labels are not modelled as edges (disclosed in c_def_use's docstring).
atomic_statement:
  - declaration
  - expression_statement

# In-place stores and address-of (WI-buzup). Read ONLY by
# cfg.exposed_definitions, for the ADR-0017 §7b withhold rule: a §3a walk that
# relied on a definition written INTO a referent (an element, field or
# dereference target of one of these assignment forms), or on a variable whose
# address is taken, may not refute a flow, because another name may reach the
# value. The def/use records are not affected. Every entry has its own test in
# test_definition_exposure.py, and the wiring gate requires both keys.
store_target:
  assignment:
    - node_type: assignment_expression
      target_field: left
  target:
    - node_type: subscript_expression
    - node_type: field_expression
    - node_type: pointer_expression
      operator: "*"
address_of:
  - node_type: pointer_expression
    operator: "&"

# Late-evaluation capture forms (WI-buzup), read ONLY by
# cfg.exposed_definitions and unioned there with nested_function: a form that
# reads enclosing names when it RUNS, later than where it is written, but
# that the CFG builder must not treat as a nested function. A name mentioned
# inside one is "captured". Required by the wiring gate in every language with
# a def/use extractor; an empty list is the declared answer. Forms checked and
# not added are listed, with the observed verdict, in
# test_definition_exposure.py (_CAPTURE_FORMS_NOT_ADDED).
capture_scope: []
