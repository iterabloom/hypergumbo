# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0017 §1d: CFG node mapping for Go (tree-sitter-go grammar)
#
# Includes the `deferred` semantic hook for Go's defer statement.
# Go switch cases (expression_case, default_case) are direct children of
# the switch statement — arms_child is null so the builder iterates over
# the switch node's own children.
#
# Child references: "field:name" → child_by_field_name("name"),
#                   "type:name" → first child with .type == "name"
provenance: builtin
language: go
grammar: tree-sitter-go

conditional:
  - node_type: if_statement
    # `if err := do(a); err != nil`: the initializer is a statement of its
    # own, recorded ahead of the condition (WI-losod).
    initializer_child: "field:initializer"
    condition_child: "field:condition"
    true_child: "field:consequence"
    false_child: "field:alternative"

loop:
  # One node type, four header shapes. `for i := 0; i < n; i++` keeps its
  # parts one level down, in a `for_clause`; `for k, v := range xs` binds in a
  # `range_clause`; `for x < n` gives its bare condition NO field (hence the
  # `unfielded` alternative, which must skip the two clause types); `for {}`
  # has no header at all and is an ordinary conditional loop with an empty
  # header (WI-losod).
  - node_type: for_statement
    initializer_child: "type:for_clause/field:initializer"
    condition_child: "type:for_clause/field:condition|unfielded:except=for_clause,range_clause"
    update_child: "type:for_clause/field:update"
    header_child: "type:range_clause"
    body_child: "field:body"

break_statement: [break_statement]
continue_statement: [continue_statement]
return_statement: [return_statement]

deferred:
  - node_type: defer_statement
    body_child: "type:call_expression"

switch:
  - node_type: expression_switch_statement
    initializer_child: "field:initializer"
    scrutinee_child: "field:value"
    # Cases are direct children of the switch node (no wrapper)

try_catch: []

# Atomic statement node types — the CFG builder treats these as a single
# CfgStatement and stops descending into their children. Without this the
# builder recurses past short_var_declaration/assignment_statement down to
# bare identifiers, so a def/use extractor keyed on statement node types is
# never called with one: correct in isolation, inert in the pipeline. The
# reachability tests cannot see that, because a CFG of leaf tokens is still
# fully reachable.
#
# Listed types are the def/use-carrying children of a `statement_list`.
# Deliberately EXCLUDED because `classify()` already owns them (listing a
# type in both would make the atomic check shadow its control-flow role):
# return_statement (return), defer_statement (deferred), if_statement /
# for_statement / expression_switch_statement.
#
# Header bindings (`if err := do(); err != nil`, `for i := 0; ...`,
# `for k, v := range xs`, `switch x := f(); x`) are recorded by the
# conditional/loop/switch hooks' `initializer_child` / `header_child` /
# `update_child` keys, not here (WI-losod). NOT reached: a `type_switch_statement`
# (`switch v := x.(type)`) and a `select_statement`, which this file does not map
# at all, so their cases are walked as straight-line code.
# Node types that ARE a call in this grammar (WI-joluk). Consumed by
# cfg.uncovered_call_lines to ask whether the CFG's recorded statement
# extents cover every call site in a function body; a call outside every
# extent means the def/use extractor never saw it, and the taint walk
# forfeits its ability to return False for that function. A language that
# declares NONE is treated as unknowable and forfeits everything.
call_node_types:
  - call_expression

atomic_statement:
  - short_var_declaration
  - var_declaration
  - const_declaration
  - assignment_statement
  - expression_statement
  - inc_statement
  - dec_statement
  - send_statement
  - go_statement

# Functions nested in a function body (WI-faful). A function literal's body is
# built as its own CFG region that MAY run, hung off the statement that creates
# it, rather than inlined as though it ran in sequence: an inlined
# `t := "x"` inside a literal killed the enclosing function's `t`.
nested_function:
  - node_type: func_literal
    body_child: "field:body"
