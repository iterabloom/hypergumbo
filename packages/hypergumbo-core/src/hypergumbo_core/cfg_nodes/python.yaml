# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0017 §1d: CFG node mapping for Python (tree-sitter-python grammar)
#
# Maps tree-sitter-python node types to generic control-flow categories
# that the CFG builder understands. This file serves as the normalization
# layer between Python's AST and the language-parameterized CFG builder.
#
# Child references: "field:name" → child_by_field_name("name"),
#                   "type:name" → first child with .type == "name"
provenance: builtin
language: python
grammar: tree-sitter-python

conditional:
  - node_type: if_statement
    condition_child: "field:condition"
    true_child: "field:consequence"
    # REPEATED: every `elif_clause` and the `else_clause` of one chain sit
    # under this field, in order. The builder chains them (INV-kakav); read
    # once, only the first survived.
    false_child: "field:alternative"
  # An `elif` arm is a conditional of its own. Its false branch is not a
  # child of its own node but the NEXT alternative of the enclosing
  # `if_statement`, which the builder hands it; hence no false_child here.
  - node_type: elif_clause
    condition_child: "field:condition"
    true_child: "field:consequence"

loop:
  - node_type: while_statement
    condition_child: "field:condition"
    body_child: "field:body"
    # `while ... else:` runs when the condition fails, never after a
    # `break`; skipped whole before INV-rotol.
    else_child: "type:else_clause"
  - node_type: for_statement
    body_child: "field:body"
    # `for v in xs:` binds `v` from `xs` each iteration, and the binding has
    # no node of its own: the header statement is recorded AT the loop node
    # (py_def_use's for_statement handler reads only left/right), cut at the
    # body for the coverage gates (WI-losod).
    header_is_node: true
    # `for ... else:` runs on exhaustion, never after a `break`; skipped
    # whole before INV-rotol.
    else_child: "type:else_clause"

break_statement: [break_statement]
continue_statement: [continue_statement]
return_statement: [return_statement]

try_catch:
  - node_type: try_statement
    body_child: "field:body"
    catch_clause_type: except_clause
    finally_child: "type:finally_clause"
    # `try ... else:` runs when the body raised nothing, before `finally`;
    # the handlers skip it. Skipped whole before INV-rotol.
    else_child: "type:else_clause"

context_manager:
  - node_type: with_statement
    value_child: "type:with_clause"
    body_child: "field:body"

switch:
  - node_type: match_statement
    scrutinee_child: "field:subject"
    arms_child: "field:body"
    arm_type: case_clause

# Atomic statement node types — the CFG builder treats these as a single
# CfgStatement and stops descending into their children. Without this, the
# builder recurses past expression_statement / assignment into bare
# identifiers and integers, destroying the statement-level granularity
# that def/use extractors operate on. Listed types correspond to Python's
# statement-level AST shapes (the children of a block / module body).
# Node types that ARE a call in this grammar (WI-joluk). Consumed by
# cfg.uncovered_call_lines to ask whether the CFG's recorded statement
# extents cover every call site in a function body; a call outside every
# extent means the def/use extractor never saw it, and the taint walk
# forfeits its ability to return False for that function. A language that
# declares NONE is treated as unknowable and forfeits everything.
call_node_types:
  - call

atomic_statement:
  - expression_statement
  - assignment
  - augmented_assignment
  - delete_statement
  - raise_statement
  - assert_statement
  - global_statement
  - nonlocal_statement
  - print_statement
  - exec_statement
  - import_statement
  - import_from_statement
  - future_import_statement
  - pass_statement
  - call

# Functions nested in a function body (WI-faful): a nested `def` runs when it
# is called, not where it is written. Its body is built as its own CFG region
# that MAY run, hung off the def statement, rather than inlined in sequence,
# where its assignments killed the enclosing function's variables of the same
# name.
nested_function:
  - node_type: function_definition
    body_child: "field:body"
  # A `lambda` holds one expression and no statement, but it reads what it
  # captures when it RUNS: `get = lambda: x` then `x = secret` returns the
  # secret. As a region its body is a statement that late_capture_edges can
  # link a later `x` to (WI-pubat); as a capture_scope entry nothing read it
  # late, so the walk saw the secret die at a print and could only withhold.
  - node_type: lambda
    body_child: "field:body"
  # A class body runs once, where it is written, but its bindings are CLASS
  # attributes, not this scope's names: inlined, `u = "x"` in a class killed the
  # module's `u` (WI-nilir). A may-run region keeps what it reads and lets
  # nothing it binds kill an outer definition.
  - node_type: class_definition
    body_child: "field:body"

# In-place stores and address-of (WI-buzup). Read ONLY by
# cfg.exposed_definitions, for the ADR-0017 §7b withhold rule: a §3a walk that
# relied on a definition written INTO a referent (an element, field or
# dereference target of one of these assignment forms), or on a variable whose
# address is taken, may not refute a flow, because another name may reach the
# value. The def/use records are not affected. Every entry has its own test in
# test_definition_exposure.py, and the wiring gate requires both keys.
store_target:
  assignment:
    - node_type: assignment
      target_field: left
    - node_type: augmented_assignment
      target_field: left
  target:
    - node_type: subscript
    - node_type: attribute
address_of: []

# Late-evaluation capture forms (WI-buzup), read ONLY by
# cfg.exposed_definitions and unioned there with nested_function: a form that
# reads enclosing names when it RUNS, later than where it is written, but
# that the CFG builder must not treat as a nested function. A name mentioned
# inside one is "captured". Required by the wiring gate in every language with
# a def/use extractor; an empty list is the declared answer. Forms checked and
# not added are listed, with the observed verdict, in
# test_definition_exposure.py (_CAPTURE_FORMS_NOT_ADDED).
capture_scope:
  - node_type: generator_expression
