# ADR-0017 §1d: CFG node mapping for Python (tree-sitter-python grammar)
#
# Maps tree-sitter-python node types to generic control-flow categories
# that the CFG builder understands. This file serves as the normalization
# layer between Python's AST and the language-parameterized CFG builder.
#
# Child references: "field:name" → child_by_field_name("name"),
#                   "type:name" → first child with .type == "name"
language: python
grammar: tree-sitter-python

conditional:
  - node_type: if_statement
    condition_child: "field:condition"
    true_child: "field:consequence"
    false_child: "field:alternative"

loop:
  - node_type: while_statement
    condition_child: "field:condition"
    body_child: "field:body"
  - node_type: for_statement
    body_child: "field:body"
    # for loops iterate over 'right'; condition is implicit (iterator exhaustion)

break_statement: [break_statement]
continue_statement: [continue_statement]
return_statement: [return_statement]

try_catch:
  - node_type: try_statement
    body_child: "field:body"
    catch_clause_type: except_clause
    finally_child: "type:finally_clause"

context_manager:
  - node_type: with_statement
    value_child: "type:with_clause"
    body_child: "field:body"

switch:
  - node_type: match_statement
    scrutinee_child: "field:subject"
    arms_child: "field:body"
    arm_type: case_clause

# Atomic statement node types — the CFG builder treats these as a single
# CfgStatement and stops descending into their children. Without this, the
# builder recurses past expression_statement / assignment into bare
# identifiers and integers, destroying the statement-level granularity
# that def/use extractors operate on. Listed types correspond to Python's
# statement-level AST shapes (the children of a block / module body).
atomic_statement:
  - expression_statement
  - assignment
  - augmented_assignment
  - delete_statement
  - raise_statement
  - assert_statement
  - global_statement
  - nonlocal_statement
  - print_statement
  - exec_statement
  - import_statement
  - import_from_statement
  - future_import_statement
  - pass_statement
  - call
