# SPDX-License-Identifier: AGPL-3.0-or-later
# ADR-0017 §1d: CFG node mapping for Java (tree-sitter-java grammar)
#
# Also used as a base for Kotlin, Scala, and Groovy with minor overrides.
#
# Child references: "field:name" → child_by_field_name("name"),
#                   "type:name" → first child with .type == "name"
provenance: builtin
language: java
grammar: tree-sitter-java

conditional:
  - node_type: if_statement
    condition_child: "field:condition"
    true_child: "field:consequence"
    false_child: "field:alternative"

loop:
  - node_type: while_statement
    condition_child: "field:condition"
    body_child: "field:body"
  - node_type: do_statement
    condition_child: "field:condition"
    body_child: "field:body"
  - node_type: for_statement
    # `for (int k = 0, j = 0; k < n; k++, j++)`: every `init` and `update`
    # field is recorded (WI-losod).
    initializer_child: "field:init"
    condition_child: "field:condition"
    update_child: "field:update"
    body_child: "field:body"
  - node_type: enhanced_for_statement
    body_child: "field:body"
    # `for (T v : xs)` binds `v` with no node of its own: recorded at the loop
    # node, which java_def_use reads as the header only (WI-losod).
    header_is_node: true

break_statement: [break_statement]
continue_statement: [continue_statement]
return_statement: [return_statement]

try_catch:
  - node_type: try_statement
    body_child: "field:body"
    catch_clause_type: catch_clause
    finally_child: "type:finally_clause"

switch:
  - node_type: switch_expression
    scrutinee_child: "field:condition"
    arms_child: "field:body"
    # `case 1: ...` groups and `case 1 -> ...` rules are two node types. With
    # only the first named, an arrow-form switch had NO arms, and an empty
    # fringe left every statement after it unreachable (WI-faful).
    arm_type: [switch_block_statement_group, switch_rule]

# Node types that ARE a call in this grammar (WI-joluk). Consumed by
# cfg.uncovered_semantic_lines, which asks whether the CFG's recorded
# statement extents cover every semantic leaf of a function body. A language
# that declares none is treated as unknowable and forfeits refutation (and the
# same-function sanitizer credit) everywhere.
call_node_types:
  - method_invocation
  - object_creation_expression
  - explicit_constructor_invocation

# Atomic statement node types (WI-gotun): the CFG builder records each as ONE
# CfgStatement instead of descending to its leaves, so java_def_use's walker is
# handed the whole statement. Without this key the extractor would be correct
# and inert, the state rust.yaml and typescript.yaml were in for months.
#
# `resource` and `catch_formal_parameter` are listed because they bind a
# variable (`try (T r = e)`, `catch (E ex)`) and sit inside constructs the
# builder descends through. Deliberately EXCLUDED because classify() owns them:
# return_statement, if/while/do/for/enhanced_for, try_statement and
# switch_expression. Their headers' bindings (the enhanced-for variable, a
# classic for's init and update) are recorded by the loop hook (WI-losod).
atomic_statement:
  - local_variable_declaration
  - expression_statement
  - resource
  - catch_formal_parameter
  - explicit_constructor_invocation
  - throw_statement
  - assert_statement
  - yield_statement

# Functions nested in a function body (WI-faful): a lambda, or a method of an
# anonymous or local class, runs when it is called, not where it is written.
# Its body is built as its own CFG region that MAY run, hung off the statement
# that holds it, rather than inlined in sequence; the statement stays ONE
# statement, so `Runnable q = () -> { if (x > 0) go(); };` defines `q`.
nested_function:
  - node_type: lambda_expression
    body_child: "field:body"
  - node_type: method_declaration
    body_child: "field:body"
  - node_type: constructor_declaration
    body_child: "field:body"

# In-place stores and address-of (WI-buzup). Read ONLY by
# cfg.exposed_definitions, for the ADR-0017 §7b withhold rule: a §3a walk that
# relied on a definition written INTO a referent (an element, field or
# dereference target of one of these assignment forms), or on a variable whose
# address is taken, may not refute a flow, because another name may reach the
# value. The def/use records are not affected. Every entry has its own test in
# test_definition_exposure.py, and the wiring gate requires both keys.
store_target:
  assignment:
    - node_type: assignment_expression
      target_field: left
  target:
    - node_type: array_access
    - node_type: field_access
address_of: []

# Late-evaluation capture forms (WI-buzup), read ONLY by
# cfg.exposed_definitions and unioned there with nested_function: a form that
# reads enclosing names when it RUNS, later than where it is written, but
# that the CFG builder must not treat as a nested function. A name mentioned
# inside one is "captured". Required by the wiring gate in every language with
# a def/use extractor; an empty list is the declared answer. Forms checked and
# not added are listed, with the observed verdict, in
# test_definition_exposure.py (_CAPTURE_FORMS_NOT_ADDED).
capture_scope: []
