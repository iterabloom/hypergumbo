# SPDX-License-Identifier: AGPL-3.0-or-later
# Drift baseline between io_primitives write-side categories and taint_sinks
# trust-zone catalogs (WI-hizik).
#
# This file is the *grandfather* list of drift between the two catalogs at the
# time WI-hizik landed (2026-04-22). It is loaded by
# `tests/test_taint_sink_drift.py`, which asserts:
#
#     current_drift(category, lang) ⊆ baseline[category][lang]
#
# - Adding a new primitive to `io_primitives/<lang>.yaml` for fs_write or
#   net_send without also adding it to the corresponding taint_sinks file
#   will grow `current_drift` beyond the baseline → test failure. The fix is
#   to either add the entry to taint_sinks (preferred) or append it here with
#   a rationale comment.
# - Removing a grandfather entry from this file (by actually aligning the
#   two catalogs) does NOT require updating any other file; the test is a
#   subset check, not equality.
# - Scope today: the 5 languages that taint_sinks already declares coverage
#   for (python, rust, go, java, typescript [via io_primitives/javascript]).
#   The 8 other io_primitives languages (c, elixir, erlang, haskell, kotlin,
#   objc, scala, swift) are not drift-guarded — they require first adding
#   language sections to taint_sinks, which is tracked separately.
#
# Structure: baseline[category][taint_sinks_lang_key] is a list of
# {module, name, kind} records representing io_primitives entries that are
# currently absent from the matching taint_sinks section. `kind` is one of
# "function", "method", or "attribute".
#
# Rationale entries (free-form comments next to specific lines) are welcome
# and encouraged when adding new exemptions. The bulk of the current contents
# are grandfather entries from the initial WI-hizik landing — no per-entry
# rationale was recorded beyond "separate catalogs drifted over time".

