# ADR-0015: Dataflow patterns for PHP (tree-sitter grammar)
language: php

assignments:
  - node_type: assignment_expression
    write: left
    read: right
  - node_type: augmented_assignment_expression
    mutate: left
    read: right

deletions:
  - node_type: unset_statement
    delete: argument
