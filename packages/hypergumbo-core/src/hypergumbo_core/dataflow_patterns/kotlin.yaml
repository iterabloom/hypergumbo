# ADR-0015: Dataflow patterns for Kotlin (tree-sitter grammar)
language: kotlin

assignments:
  - node_type: assignment
    write: left
    read: right
  - node_type: property_declaration
    write: name
    read: value
  - node_type: augmented_assignment
    mutate: left
    read: right
