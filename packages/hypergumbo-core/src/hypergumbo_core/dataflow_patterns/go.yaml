# ADR-0015: Dataflow patterns for Go (tree-sitter grammar)
language: go

assignments:
  - node_type: short_var_declaration
    write: left
    read: right
  - node_type: assignment_statement
    write: left
    read: right
  - node_type: var_declaration
    write: name
    read: value
  # Range loop variable assignment
  - node_type: range_clause
    write: left
    read: right
  # Channel send/receive
  - node_type: send_statement
    write: channel
    read: value

returns:
  - node_type: return_statement
    read: expression_list

calls:
  - node_type: call_expression
    read: arguments
  # Method calls: receiver is read
  - node_type: selector_expression
    read: operand
  # Defer/go statements: the function call is read
  - node_type: defer_statement
    read: call
  - node_type: go_statement
    read: call
