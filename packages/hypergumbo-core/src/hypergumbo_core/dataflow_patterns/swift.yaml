# ADR-0015: Dataflow patterns for Swift (tree-sitter grammar)
language: swift

assignments:
  - node_type: assignment
    write: target
    read: value
  - node_type: property_declaration
    write: name
    read: value

calls:
  - node_type: call_expression
    read: arguments
