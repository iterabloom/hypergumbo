# ADR-0015: Dataflow patterns for C++ (tree-sitter grammar)
language: cpp

assignments:
  - node_type: assignment_expression
    write: left
    read: right
  - node_type: init_declarator
    write: declarator
    read: value
  # Range-based for loop: for (auto& item : container)
  - node_type: for_range_loop
    write: declarator
    read: right

returns:
  - node_type: return_statement
    read: expression
  - node_type: throw_statement
    read: expression

deletions:
  - node_type: delete_expression
    delete: argument
