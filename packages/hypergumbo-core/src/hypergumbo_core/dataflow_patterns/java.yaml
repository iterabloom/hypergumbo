# ADR-0015: Dataflow patterns for Java (tree-sitter grammar)
language: java

assignments:
  - node_type: assignment_expression
    write: left
    read: right
  - node_type: local_variable_declaration
    write: name
    read: value

calls:
  - node_type: method_invocation
    read: arguments
  - node_type: object_creation_expression
    read: arguments
