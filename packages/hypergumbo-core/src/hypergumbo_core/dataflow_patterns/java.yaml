# ADR-0015: Dataflow patterns for Java (tree-sitter grammar)
language: java

assignments:
  - node_type: assignment_expression
    write: left
    read: right
  - node_type: local_variable_declaration
    write: name
    read: value
  # Enhanced for loop: for (Type item : collection)
  - node_type: enhanced_for_statement
    write: name
    read: value
  # Resource in try-with-resources
  - node_type: resource
    write: name
    read: value

returns:
  - node_type: return_statement
    read: expression
  - node_type: throw_statement
    read: expression

# Name-based heuristics for Java method calls (WI-vinub).
# Java convention: Collections/Map/Builder mutations use add/put/remove/set/clear.
library_patterns:
  # Write/mutate patterns
  - match: '\.add\('
    access_mode: write
  - match: '\.addAll\('
    access_mode: write
  - match: '\.put\('
    access_mode: write
  - match: '\.putAll\('
    access_mode: write
  - match: '\.set\('
    access_mode: write
  - match: '\.remove\('
    access_mode: write
  - match: '\.removeAll\('
    access_mode: write
  - match: '\.clear\('
    access_mode: write
  - match: '\.push\('
    access_mode: write
  - match: '\.pop\('
    access_mode: write
  - match: '\.offer\('
    access_mode: write
  - match: '\.poll\('
    access_mode: write
  - match: '\.delete\('
    access_mode: write
  - match: '\.insert\('
    access_mode: write
  - match: '\.update\('
    access_mode: write
  - match: '\.close\('
    access_mode: write
  - match: '\.flush\('
    access_mode: write
  - match: '\.reset\('
    access_mode: write
  # Read patterns
  - match: '\.get\('
    access_mode: read
  - match: '\.peek\('
    access_mode: read
  - match: '\.contains\('
    access_mode: read
  - match: '\.containsKey\('
    access_mode: read
  - match: '\.containsValue\('
    access_mode: read
  - match: '\.isEmpty\('
    access_mode: read
  - match: '\.size\('
    access_mode: read
