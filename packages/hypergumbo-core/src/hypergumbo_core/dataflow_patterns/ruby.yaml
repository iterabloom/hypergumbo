# ADR-0015: Dataflow patterns for Ruby (tree-sitter grammar)
language: ruby

assignments:
  - node_type: assignment
    write: left
    read: right
  - node_type: operator_assignment
    mutate: left
    read: right

calls:
  - node_type: call
    read: arguments
  - node_type: method_call
    read: arguments
