# ADR-0015: Dataflow patterns for Python.
#
# This file is consumed by both the tree-sitter Python pipeline (via
# annotate_dataflow) AND the stdlib-ast pipeline in py.py (via
# annotate_dataflow_ast, which loads library_patterns from this file
# as a per-language fallback after the AST positional walk).
language: python

assignments:
  - node_type: assignment
    write: left
    read: right
  - node_type: augmented_assignment
    mutate: left
    read: right
  # For loop iteration
  - node_type: for_statement
    write: left
    read: right
  # With statement (context manager)
  - node_type: with_clause
    write: alias
    read: value
  # Comprehension variable binding
  - node_type: for_in_clause
    write: left
    read: right

returns:
  - node_type: return_statement
    read: expression
  - node_type: yield
    read: expression

deletions:
  - node_type: delete_statement
    delete: argument

# Library patterns: regex matched against the source line of an unannotated
# call edge.  Used as a fallback after the AST walk classifies positional
# context (assignment LHS/RHS, return values, etc.).  Conservative — only
# methods whose name unambiguously implies the access mode regardless of
# the receiver type.
library_patterns:
  # === Mutating list/dict/set operations ===
  - match: '\.append\('
    access_mode: write
  - match: '\.extend\('
    access_mode: write
  - match: '\.add\('
    access_mode: write
  - match: '\.update\('
    access_mode: mutate
  - match: '\.insert\('
    access_mode: write
  - match: '\.pop\('
    access_mode: delete
  - match: '\.remove\('
    access_mode: delete
  - match: '\.clear\('
    access_mode: delete
  - match: '\.discard\('
    access_mode: delete
  - match: '\.popitem\('
    access_mode: delete

  # === File / stream / socket writes ===
  - match: '\.write\('
    access_mode: write
  - match: '\.writelines\('
    access_mode: write
  - match: '\.send\('
    access_mode: write
  - match: '\.sendall\('
    access_mode: write
  - match: '\.put\('
    access_mode: write
  - match: '\.put_nowait\('
    access_mode: write
  - match: '\.flush\('
    access_mode: write

  # === Reads ===
  - match: '\.read\('
    access_mode: read
  - match: '\.readline\('
    access_mode: read
  - match: '\.readlines\('
    access_mode: read
  - match: '\.recv\('
    access_mode: read
  - match: '\.get\('
    access_mode: read
  - match: '\.keys\('
    access_mode: read
  - match: '\.values\('
    access_mode: read
  - match: '\.items\('
    access_mode: read
