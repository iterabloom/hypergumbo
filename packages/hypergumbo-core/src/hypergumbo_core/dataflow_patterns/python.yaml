# ADR-0015: Dataflow patterns for Python (tree-sitter grammar)
#
# Note: py.py uses Python's ast module, not tree-sitter. This YAML is for
# any future tree-sitter-based Python analysis or for analyzers that parse
# Python files via the base class (e.g., embedded Python in notebooks).
# The py.py-specific integration is tracked as WI-mimon.
language: python

assignments:
  - node_type: assignment
    write: left
    read: right
  - node_type: augmented_assignment
    mutate: left
    read: right
  # For loop iteration
  - node_type: for_statement
    write: left
    read: right
  # With statement (context manager)
  - node_type: with_clause
    write: alias
    read: value
  # Comprehension variable binding
  - node_type: for_in_clause
    write: left
    read: right

returns:
  - node_type: return_statement
    read: expression
  - node_type: yield
    read: expression

calls:
  - node_type: call
    read: arguments
  # Attribute access (method call receiver is read)
  - node_type: attribute
    read: object

deletions:
  - node_type: delete_statement
    delete: argument
