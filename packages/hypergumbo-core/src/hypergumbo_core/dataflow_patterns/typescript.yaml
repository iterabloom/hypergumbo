# ADR-0015: Dataflow patterns for TypeScript (tree-sitter grammar)
#
# TypeScript extends JavaScript's grammar. Assignment and call node types
# are identical. This file exists so get_dataflow_config("typescript")
# resolves without falling back to javascript.yaml.
language: typescript

assignments:
  - node_type: assignment_expression
    write: left
    read: right
  - node_type: augmented_assignment_expression
    mutate: left
    read: right
  - node_type: variable_declarator
    write: name
    read: value

deletions:
  - node_type: delete_expression
    delete: argument

# Name-based heuristics for TypeScript method calls (WI-vinub).
# Same as JavaScript — TS extends JS grammar with identical method call shapes.
library_patterns:
  # Write/mutate patterns
  - match: '\.push\('
    access_mode: write
  - match: '\.unshift\('
    access_mode: write
  - match: '\.splice\('
    access_mode: write
  - match: '\.pop\('
    access_mode: write
  - match: '\.shift\('
    access_mode: write
  - match: '\.set\('
    access_mode: write
  - match: '\.add\('
    access_mode: write
  - match: '\.delete\('
    access_mode: write
  - match: '\.clear\('
    access_mode: write
  - match: '\.append\('
    access_mode: write
  - match: '\.remove\('
    access_mode: write
  - match: '\.close\('
    access_mode: write
  - match: '\.destroy\('
    access_mode: write
  - match: '\.flush\('
    access_mode: write
  - match: '\.reset\('
    access_mode: write
  - match: '\.write\('
    access_mode: write
  - match: '\.end\('
    access_mode: write
  # Read patterns
  - match: '\.get\('
    access_mode: read
  - match: '\.has\('
    access_mode: read
  - match: '\.includes\('
    access_mode: read
  - match: '\.indexOf\('
    access_mode: read
  - match: '\.find\('
    access_mode: read
  - match: '\.read\('
    access_mode: read
