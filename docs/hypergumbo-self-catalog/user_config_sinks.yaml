# SPDX-License-Identifier: AGPL-3.0-or-later
# hypergumbo's in-repo self-audit catalogue — user_config zone sinks (INV-kuroj).
#
# The catalogue home `init-catalogs` seeds: $XDG_CONFIG_HOME/hypergumbo/ (or the
# directory --home names) and its channel directories. Never written during
# analysis (ADR-0047 ruling 4).
zone: user_config
trust_level: untrusted

sinks:
  python:
    - module: hypergumbo_core.safety_zones
      functions:
        - user_config_mkdir
        - user_config_write
