# SPDX-License-Identifier: AGPL-3.0-or-later
# hypergumbo's in-repo self-audit catalogue — see docs/hypergumbo-self-catalog/README.md
# for why these rows never move into the built-in catalogues.
#
# Declares hypergumbo's runtime CLI subcommand handlers as synthetic taint
# sources with start_at: callee. Each runtime cmd_* function is the seed
# for the verify-claims per-entry-point reachability analysis: anything
# downstream of cmd_sketch (etc.) is considered reachable-from-runtime-CLI.
#
# Runtime CLI subcommands are the "analyze my code" surface — they should
# NOT shell out to subprocesses, NOT reach the network directly, and NOT
# reach dev-zone code paths (tracker sync, agent supervisor, etc.). Those
# are verified as separate claims in docs/hypergumbo.claims.yaml.
taint_label: runtime_cli_entry

sources:
  python:
    - module: hypergumbo_core.cli
      start_at: callee
      functions:
        # Code-analysis subcommands (the user runs `hypergumbo <cmd> .`)
        - cmd_sketch
        - cmd_run
        - cmd_slice
        - cmd_search
        - cmd_routes
        - cmd_explain
        - cmd_symbols
        - cmd_compact
        - cmd_io_boundaries
        - cmd_verify_claims
        - cmd_catalog
        - cmd_test_coverage
        - cmd_dead_code_maybe
        - cmd_config
        # Cache management — read-only / clear operations on hypergumbo's
        # own cache. Treated as runtime because they don't install
        # third-party software or hit the network on the user's behalf.
        - cmd_cache_status
        - cmd_cache_clear
        # INV-kuroj: runtime subcommands no *_sources.yaml named, found by
        # diffing every `def cmd_*` against the catalogued sources (the gate
        # test_user_state_config_zones.py::test_every_cmd_handler_is_catalogued_somewhere
        # keeps it closed). Three of them write per-user state or config.
        - cmd_trust_backend
        - cmd_trust_catalogues
        - cmd_init_catalogs
        - cmd_backend_agreement
        - cmd_repeat_finder
        - cmd_catalog_inventory
    # The repo-tier offer runs from main() after EVERY subcommand, outside any
    # cmd_* handler, so no claim covered its two writes (INV-kuroj).
    - module: hypergumbo_core.repo_tier_offer
      start_at: callee
      functions:
        - maybe_offer_repo_tier_examples
