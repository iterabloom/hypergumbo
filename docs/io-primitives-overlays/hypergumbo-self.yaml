  # the artifact-scoped self-proof, each audited at ITS SLOT: most hold
  # constructors and pure compute; every I/O-performing name carries a row
  # above. Exact matching means an entry vouches only for calls addressed
  # through that exact module path.
  # ---------------------------------------------------------------
  - module: yaml
    completeness: complete
    retrieved: "2026-08-16"
    notes: >-
      load/safe_load take streams or strings the caller opened; dump mirrors json. PyYAML opens nothing itself.
  - module: ruamel.yaml
