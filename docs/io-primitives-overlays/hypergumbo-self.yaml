    notes: >-
      Array compute at this slot; the fs surface (load/save/fromfile/tofile) carries rows above.
  - module: numpy.linalg
    completeness: complete
    retrieved: "2026-08-16"
    notes: >-
      Pure linear algebra.
  - module: coverage
    completeness: complete
    retrieved: "2026-08-16"
    notes: >-
      Constructor rowed (reads config); the rest at this slot is orchestration of in-process tracing.
  - module: coverage.parser
    completeness: complete
    retrieved: "2026-08-16"
    notes: >-
      WI-jabus corrected this note on 2026-09-14. It read "PythonParser parses
      source strings already in memory", which is true of the `text=` form and
      false of the `filename=` form this repository actually uses -- see the
      coverage.parser.PythonParser rows and completeness entry, which is where
      the class-qualified surface is now declared. This slot itself holds the
      module's free functions, which are parsing helpers over in-memory text.
  - module: rich.console
    completeness: complete
    retrieved: "2026-08-16"
    notes: >-
      The printing methods carry rows; the Console constructor and styling are pure.
  - module: rich.segment
    completeness: complete
    retrieved: "2026-08-16"
    notes: >-
      Render-list building; pure.
  - module: rich.style
    completeness: complete
    retrieved: "2026-08-16"
    notes: >-
      Style arithmetic; pure.
  - module: rich.table
    completeness: complete
    retrieved: "2026-08-16"
    notes: >-
      Table construction; rendering happens through rich.console's rowed methods.
  # -----------------------------------------------------------------
  # WI-jabus, retrieved 2026-09-14. THE CLASS-QUALIFIED RECEIVERS.
  #
  # Every entry below names a CLASS, not a module, and each is here because
  # MATCHING IS EXACT: `coverage` being complete says nothing about
  # `coverage.Coverage`, exactly as this file's own header says `tree_sitter`
  # says nothing about `tree_sitter.Node`. Phase 6 receiver typing made these
  # calls resolvable to their class, so each became a module the gate had no
  # opinion on -- and `qualifying_only = not unknown` meant ONE of them
  # withheld ALL EIGHTEEN of this repository's self-claims. The uvicorn note
  # above records the identical failure; this is its third instance.
  #
  # These are declarations that the surface is ENUMERATED, not that it does no
  # I/O -- the I/O these classes do is rowed above (sys.stdout is declared
  # complete in the shipped catalogue and carries logging rows, the same
  # shape).
  # -----------------------------------------------------------------
  - module: coverage.Coverage
    completeness: complete
    retrieved: "2026-09-14"
    notes: >-
      load (the .coverage DB) and analysis2 (the measured source file) are
      rowed fs_read above; get_data is an in-memory accessor over what load
      already read; start/stop/erase/switch_context drive in-process tracing.
      save() is NOT reached by this repository and is not rowed -- it writes,
      and a row would be a claim about a call that does not exist here.
  - module: coverage.parser.PythonParser
    completeness: complete
    retrieved: "2026-09-14"
    notes: >-
      parse_source is rowed fs_read above (constructed with filename=). The
      remainder -- first_line, lines, translate_lines, arcs -- is computation
      over state parse_source already built.
  - module: rich.table.Table
    completeness: complete
    retrieved: "2026-09-14"
    notes: >-
      add_column / add_row / add_section build a renderable in memory. Writing
      happens in rich.console, whose print methods are rowed above; a Table
      that is never handed to a Console produces no output at all.
  - module: ruamel.yaml.YAML
    completeness: complete
    retrieved: "2026-09-14"
    notes: >-
      dump() and load() take a STREAM the caller opened -- store.py:335 is
      `ry.dump([prepared], stream)` -- so the crossing belongs to the caller's
      open(), which this repository's own rows already carry. The same shape
      as json.dump / tomli.load, which this file treats identically. No row:
      an fs_write row here would attribute the caller's file to the serializer
      and double-count the one write.
  - module: tree_sitter.Parser
    completeness: complete
    retrieved: "2026-09-14"
    notes: >-
      parse() takes bytes already in memory and returns a tree; the grammar
      .so was loaded by the tree_sitter_* binding packages, which the
      tree_sitter entry above already addresses. Same rationale, one class
      down, spelled out because exact matching does not carry it down.
  - module: rich.text
    completeness: complete
    retrieved: "2026-08-16"
    notes: >-
      Text markup; pure.
  - module: textual.containers
