#
# EXAMPLE project-local I/O primitive overlay — Go web frameworks and gRPC.
#
# THIS FILE IS NOT LOADED AUTOMATICALLY, AND THAT IS THE POINT. It lives under
# docs/ rather than beside the shipped catalogues in
# hypergumbo_core/io_primitives/ because hypergumbo does not own these rows.
# ADR-0016 scopes the built-in catalogue to the stdlib on purpose — "a curated
# list of stdlib functions, not an unbounded set of library APIs" (§27) — and
# §35 resolves the gap with "a project-local overlay, not more built-in rows".
# You own this file; copy it into your repo and edit it.
#
# Use it:
#     hypergumbo io-boundaries . --io-primitives docs/io-primitives-overlays/go-web-frameworks.yaml
#
# or declare it in your claims file, which is the form that travels with the
# claims it supports:
#     extra_catalogs:
#       io_primitives:
#         - docs/io-primitives-overlays/go-web-frameworks.yaml
#
# THESE ROWS USED TO SHIP IN go.yaml AND MATCHED NOTHING. That is the second
# reason they moved. They were declared with a PACKAGE-IDENTIFIER module —
# `gin.Context` — while the Go analyzer emits the MODULE PATH it read from the
# import, `github.com/gin-gonic/gin`. Those never compare equal, so all twenty
# entries were unreachable from any real Go program:
#
#     lookup_with_module("JSON", "github.com/gin-gonic/gin", cc="method") -> None
#     lookup_with_module("JSON", "gin",                      cc="method") -> gin.Context.JSON
#
# The second line is what a catalogue-reach probe produces when its fixture
# writes `import ("gin")` — an import no Go program contains. The rows scored
# reachable against a hint production can never emit. Rewritten here with the
# full import path, they resolve for the first time (INV-safig).
#
# WHY THE VERSION SUFFIX IS PART OF THE MODULE STRING. Go's semantic import
# versioning makes `/v2` and `/v4` part of the import path itself, and the
# analyzer reports the path verbatim. So `github.com/labstack/echo/v4.Context`
# is correct and `github.com/labstack/echo.Context` will NOT match a v4 import.
# Pin the major version you actually depend on; if you are on echo v5, edit it.
#
# COVERAGE HERE IS BY RESPONSE VERB, NOT EXHAUSTIVE. It covers the call forms
# that dominate handler code. It does NOT cover middleware, streaming writers,
# `Context.Writer` / `ResponseWriter` used directly, router groups, or any
# framework not listed. Extend it for your codebase rather than assuming it is
# complete.

language: go
status: overlay

net_send:
  - module: github.com/gin-gonic/gin.Context
    methods: [JSON, String, HTML, XML, YAML, Data, IndentedJSON]
    notes: >-
      Gin response methods. Each serialises the handler's value onto the
      HTTP response body, so whatever reaches an argument leaves the process.
  - module: github.com/labstack/echo/v4.Context
    methods: [JSON, String, HTML, XML, Blob, Stream]
    notes: >-
      Echo response methods. Pinned to v4 because the major version is part of
      the import path and therefore part of what the analyzer reports.

net_recv:
  - module: github.com/gin-gonic/gin.Engine
    methods: [Run, RunTLS]
    notes: Gin server startup — the process begins accepting inbound requests.
  - module: github.com/labstack/echo/v4.Echo
    methods: [Start, StartTLS]
    notes: Echo server startup. Pinned to v4, as above.
  - module: github.com/gofiber/fiber/v2.App
    methods: [Listen, ListenTLS]
    notes: Fiber server startup. Pinned to v2, as above.
  - module: google.golang.org/grpc.Server
    methods: [Serve]
    notes: >-
      gRPC server startup. Note the module path has no version suffix even at
      v1.x — google.golang.org/grpc is its own path, not a /vN one.
