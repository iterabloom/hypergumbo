# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Allow-list for edge-type runtime coherence per ADR-0023 §3.
#
# Each entry permits multiple `edge_type` values within a single
# (src_kind, src_language, dst_kind, dst_language) partition.
#
# ADR-0023 §3 mandates that allow-list growth requires an ADR
# amendment. The intended deployment trajectory is:
#
#   - Phase 1 (now): warn-only. This file starts empty;
#     scripts/check-edge-type-runtime-coherence reports every
#     partition variance for human review during the §6 Phase 2/3
#     migration. The shrinking offender count is a progress meter
#     for producer-side cleanup.
#
#   - Phase 4 expectation: offender set goes empty modulo any
#     legitimate variance documented here with an ADR amendment.
#
# Schema (per entry):
#   src_kind: <string>             # required
#   src_language: <string>         # required (empty string OK)
#   dst_kind: <string>             # required
#   dst_language: <string>         # required (empty string OK)
#   permitted_edge_types: [<str>]  # required, non-empty
#   rationale: <string>            # what makes the variance legitimate
#   adr_reference: <string>        # ADR amendment that admitted this entry

#   - File-anchor containment variance (dispatch:F4, 2026-06-25).
#     file-anchor:F1 mints a kind="file" anchor per path; dispatch:F4 adds
#     function/variable to the containment linker's CONTAINABLE_KINDS so a file
#     anchor `contains` its top-level members. The file pseudo-node ALSO names
#     those same members through other, genuinely-distinct relationships —
#     module-scope `calls`, `references`, `imports`, and TS/JS `module_exports`
#     — so the (file, <lang>, function|variable, <lang>) partition legitimately
#     carries `contains` alongside them. These are distinct relationships, not a
#     leaked endpoint property, so per ADR-0023 §3 they are admitted here rather
#     than folded. See ADR-0023 §3 "Allow-list amendment — file-anchor
#     containment variance".
allowlist:
  - src_kind: file
    src_language: python
    dst_kind: function
    dst_language: python
    permitted_edge_types: [calls, contains, imports, references]
    rationale: >-
      A Python file anchor (file-anchor:F1) contains its top-level functions
      (dispatch:F4) while the file pseudo-node also calls / references / imports
      them from module scope — distinct relationships sharing one endpoint shape.
    adr_reference: "ADR-0023 §3 amendment (dispatch:F4, 2026-06-25)"
  - src_kind: file
    src_language: python
    dst_kind: variable
    dst_language: python
    permitted_edge_types: [contains, imports, references]
    rationale: >-
      A Python file anchor contains its module-level variables (dispatch:F4)
      while also referencing / importing them from module scope.
    adr_reference: "ADR-0023 §3 amendment (dispatch:F4, 2026-06-25)"
  - src_kind: file
    src_language: bash
    dst_kind: function
    dst_language: bash
    permitted_edge_types: [calls, contains]
    rationale: >-
      A bash file anchor contains its top-level functions (dispatch:F4) while
      the file pseudo-node also calls them from script scope.
    adr_reference: "ADR-0023 §3 amendment (dispatch:F4, 2026-06-25)"
  - src_kind: file
    src_language: typescript
    dst_kind: function
    dst_language: typescript
    permitted_edge_types: [calls, contains, module_exports]
    rationale: >-
      A TypeScript file anchor contains its top-level functions (dispatch:F4)
      while the file pseudo-node also calls and re-exports (module_exports) them.
    adr_reference: "ADR-0023 §3 amendment (dispatch:F4, 2026-06-25)"
  - src_kind: file
    src_language: javascript
    dst_kind: function
    dst_language: javascript
    permitted_edge_types: [contains, references]
    rationale: >-
      A JavaScript file anchor contains its top-level functions (dispatch:F4)
      while the file pseudo-node also references them from module scope.
    adr_reference: "ADR-0023 §3 amendment (dispatch:F4, 2026-06-25)"

#   - Rust trait requirement/dispatch variance (INV-fimon, 2026-07-31).
#     WI-duguk taught the Rust analyzer to emit trait members, so the
#     containment linker now roots a trait over its own required methods while
#     linkers/rust_trait_dispatch (WI-kivut) emits dispatches_to from the trait
#     to its impls' concrete methods. The two edges do not share a destination
#     — contains -> MyTrait::method, dispatches_to -> MyStruct::method — so they
#     are distinct relationships over one endpoint shape, not a leaked endpoint
#     property. This entry rules on the PARTITION only; it does not ratify the
#     trait-rather-than-requirement anchoring, which is tracked separately and
#     whose fix would SHRINK this list.
  - src_kind: trait
    src_language: rust
    dst_kind: method
    dst_language: rust
    permitted_edge_types: [contains, dispatches_to]
    rationale: >-
      A Rust trait contains its own required methods (WI-duguk) while
      rust_trait_dispatch (WI-kivut) dispatches from the trait to the concrete
      methods of its impls — distinct relationships with distinct destinations
      sharing one endpoint shape.
    adr_reference: "ADR-0023 §3 amendment (INV-fimon, 2026-07-31)"

#   - Solidity inheritance-dispatch variance (INV-lapas, 2026-08-21).
#     INV-lapas made a Solidity contract member a `method` rather than a
#     `function`, and INV-nosoz made type_hierarchy see the `inherits` edge.
#     Together they took openzeppelin-contracts from 0 to 877 Solidity
#     dispatches_to edges, so the (method/solidity -> method/solidity)
#     partition began carrying dispatches_to alongside the overrides edges
#     the analyzer already emitted there. Before the change the same two
#     relationships lived in the (function/solidity -> function/solidity)
#     partition, which carried ONLY overrides and so was never an offender —
#     the partition became visible because the dispatch fix worked, not
#     because anything degraded.
#     The variance is legitimate and the directions are opposite: `overrides`
#     runs child -> parent (Child.ping overrides Base.ping) while
#     `dispatches_to` runs parent -> child (Base.ping dispatches to
#     Child.ping). Two distinct relationships over one endpoint shape, not a
#     leaked endpoint property.
  - src_kind: method
    src_language: solidity
    dst_kind: method
    dst_language: solidity
    permitted_edge_types: [dispatches_to, overrides]
    rationale: >-
      A Solidity contract method overrides its parent's method (child ->
      parent) while type_hierarchy dispatches from the parent's method to the
      overriding child's (parent -> child) — distinct relationships running in
      opposite directions over one endpoint shape.
    adr_reference: "ADR-0023 §3 amendment (INV-lapas, 2026-08-21)"
