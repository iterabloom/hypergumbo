# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Generic taint-flow claims that apply to almost any application repository.
#
# WHY THIS FILE EXISTS. `hypergumbo verify-claims` needs a claims file, and
# until now the only one in the tree was `docs/hypergumbo.claims.yaml` — which
# is about hypergumbo's OWN safety zones and is meaningless pointed at anything
# else. A reader who wanted to ask the ordinary questions ("does user input
# reach a shell?") had to invent the vocabulary themselves. These six claims
# are that starting point, and they are also the measurement frame for the
# taint-precision adjudication (WI-sivuz): a precision number is only
# interpretable against claims someone would actually write.
#
# THE SIX ARE NOT ARBITRARY. Each pairs an auto-derived taint LABEL with an
# auto-derived sink ZONE, so every claim here is expressible without any
# project-local catalogue:
#
#   label `untrusted_input`  <- io_primitives boundaries net_recv, ipc_recv,
#                               db_read   (AUTO_SOURCE_LABEL_MAP)
#   label `host_secret`      <- io_primitives boundary   env_read
#   label `host_description` <- io_primitives boundary   host_info_read
#
# `env_read` and `host_info_read` were ONE boundary until INV-tutar. `env_read`
# is an ambient CONFIGURATION read — environment variables, system properties,
# argv — where a credential can live. `host_info_read` is a host DESCRIPTION or
# identity read — runtime.GOOS, os.uname, navigator.platform, pwd.getpwnam —
# where one cannot. They derive DIFFERENT labels, so a `host_secret` claim no
# longer matches a flow that only carries the OS name, and the two questions
# below are asked separately rather than answered by one number.
#
#   zone `subprocess` <- fs boundary subprocess       zone `network`  <- net_send
#   zone `host_fs`    <- fs boundary fs_write         zone `database` <- db_write
#   zone `logging`    <- boundary    logging
#
# WHAT A VIOLATION HERE DOES AND DOES NOT MEAN. A violated verdict says the
# analysis found an unsanitized path from a source primitive to a sink
# primitive. It does NOT say the path is exploitable: hypergumbo models no
# validation that is not in its sanitizer catalogue, so a repo that validates
# input with its own hand-written checker will violate these claims correctly
# and harmlessly. Read them as "here is where untrusted data reaches power",
# not as "here is a vulnerability".
#
# CONFIRMED IS THE VERDICT TO DISTRUST, NOT VIOLATED. A `confirmed` verdict is
# a claim about ABSENCE, and absence is only as sound as the analysis is
# complete. `verify-claims` refuses to confirm a claim for a language it could
# not analyse (WI-kajil / INV-bitig) — it returns `inconclusive` instead — but
# within an analysed language a recall gap still reads as clean. The
# `dataflow_coverage` block in `--json` output is what tells you how much the
# run could see.

claims:
  # =======================================================================
  # Untrusted input reaching power.
  # =======================================================================
  - id: untrusted-input-no-subprocess
    text: |
      Data arriving from the network, from an IPC channel, or read back out
      of a database is never passed to a subprocess without sanitization.
      This is the command-injection question.
    constraint:
      taint_flow:
        source_taint: untrusted_input
        prohibited_sink_zone: subprocess

  - id: untrusted-input-no-host-fs
    text: |
      Data arriving from the network, from an IPC channel, or read back out
      of a database is never used to write to the filesystem without
      sanitization. This is the path-traversal / arbitrary-write question.
    constraint:
      taint_flow:
        source_taint: untrusted_input
        prohibited_sink_zone: host_fs

  - id: untrusted-input-no-database
    text: |
      Data arriving from the network or from an IPC channel is never written
      into a database without sanitization. Note that `db_read` is itself an
      `untrusted_input` source, so a read-then-write round trip within one
      store also fires here; the verdict's `origins` breakdown separates
      those from genuinely external input.
    constraint:
      taint_flow:
        source_taint: untrusted_input
        prohibited_sink_zone: database

  # =======================================================================
  # Secrets leaving.
  # =======================================================================
  - id: host-secret-no-network
    text: |
      Values read out of the process environment — the conventional home for
      credentials, tokens and connection strings — are never sent over the
      network without sanitization. This is the credential-exfiltration
      question, and it is the one a reader of an unfamiliar dependency most
      wants answered.
    constraint:
      taint_flow:
        source_taint: host_secret
        prohibited_sink_zone: network

  - id: host-secret-no-logging
    text: |
      Values read out of the process environment are never written to a log
      sink without sanitization. Logs are the most common accidental
      publication channel for a credential, and the least noticed.
    constraint:
      taint_flow:
        source_taint: host_secret
        prohibited_sink_zone: logging

  - id: host-secret-no-host-fs
    text: |
      Values read out of the process environment are never written to the
      filesystem without sanitization.
    constraint:
      taint_flow:
        source_taint: host_secret
        prohibited_sink_zone: host_fs

  # =======================================================================
  # HOST DESCRIPTION — a different question from the three above, and worth
  # asking on its own terms rather than as a weaker version of them. Reading
  # the OS name or the machine's hostname is not a credential leak; SENDING it
  # somewhere is a fingerprinting and telemetry question, which a reader may
  # care about a great deal or not at all. Keeping it separate is the whole
  # point of INV-tutar's split: a claim that conflates them cannot be answered
  # truthfully in either direction.
  # =======================================================================
  - id: host-description-no-network
    text: |
      Host and platform description — OS name, architecture, hostname, user
      name, home directory, locale — is never sent over the network. This is
      the telemetry and fingerprinting question, not the credential question.
    constraint:
      taint_flow:
        source_taint: host_description
        prohibited_sink_zone: network
