# Root pyproject.toml - shared tool configuration only
# Packages are defined in packages/*/pyproject.toml
# This file provides pytest, ruff, bandit, and coverage configuration

[tool.pytest.ini_options]
# Include BRANCHES_*.py files for branch coverage tests (default is test_*.py and *_test.py)
python_files = ["test_*.py", "*_test.py", "BRANCHES_*.py"]
markers = [
    "torch: tests requiring PyTorch (deselect in CI with -m 'not torch')",
]
# Required for hypergumbo-tracker's Textual TUI tests (async pilot tests)
asyncio_mode = "auto"
# Tracker tests import a shared 'helpers' module from their tests/ directory
pythonpath = ["packages/hypergumbo-tracker/tests"]
# Filter expected warnings from tests
filterwarnings = [
    # tree-sitter unavailability in fallback tests
    "ignore:tree-sitter-.*not available:UserWarning",
    "ignore:.*analysis skipped.*requires tree-sitter:UserWarning",
    # tree-sitter deprecation warnings (older grammar packages)
    "ignore:int argument support is deprecated:DeprecationWarning",
]

[tool.coverage.run]
# Omit optional modules that require extra dependencies
omit = [
    "*/sketch_embeddings.py",  # Requires sentence-transformers
    "*/_embedding_data.py",    # Generated embedding data
    "*/__main__.py",           # Entry point
    "*/scip/_generated/scip_pb2.py",  # Auto-generated by scripts/build-scip-proto
]

[tool.coverage.report]
# Always show missing line numbers - avoids re-running pytest just to find them
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "S",      # flake8-bandit (security rules)
  "RUF",    # ruff-specific rules
]
ignore = [
  "E501",     # Line too long (existing code has long lines)
  "S101",     # Use of assert (fine for tests and internal checks)
  "S105",     # Hardcoded password (false positives on PASS_ID, etc.)
  "S106",     # Hardcoded password (false positives)
  "S110",     # Try-except-pass (sometimes valid pattern)
  "RUF059",   # Unused unpacked variable (intentional _var pattern)
  "RUF005",   # Collection literal concatenation (stylistic, low priority)
  "B028",     # No explicit stacklevel (TODO: fix in future PR)
]

[tool.ruff.lint.per-file-ignores]
# Tests can use assert, hardcoded values, subprocess, temp paths, side-effect imports,
# and class-level constant fixtures (RUF012).
"packages/*/tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607", "S108", "E741", "F401", "F841", "RUF005", "RUF012"]
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607", "S108", "E741", "F401", "F841", "RUF005", "RUF012"]
# Conditional imports for optional tree-sitter deps
"packages/*/src/**/*.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
  "B101",  # assert_used - fine for production code assertions
  "B105",  # hardcoded_password_string - false positives on PASS_ID, PASS_VERSION
  "B110",  # try_except_pass - intentional pattern for optional analyzers
]

[tool.mypy]
# mypy:F2 strict + pyright-resonant config (WI-rokup, Decision D13, INV-zogud).
# INV-zogud's target is `mypy <repo>` (a WHOLE-TREE run where cross-package
# imports resolve) under this config producing zero errors. It is measured and
# ratcheted by scripts/check-mypy-ratchet (whole-tree invocation over every
# packages/*/src/<pkg> root + a shrink-only baseline); the CI mypy job runs that
# script NON-BLOCKING until WI-rabum flips it to blocking. Do NOT run mypy
# per-package for the gate — per-package isolation cannot follow cross-package
# imports (the editable install is mypy-invisible), so it treats every
# cross-package symbol as Any, inventing phantom errors and hiding real ones.
# D13 scope split: strict on packages/*/src; tests get check_untyped_defs when
# they are brought into scope (they are not in the src-only gate invocation yet).
python_version = "3.10"
warn_unused_configs = true
no_implicit_optional = true
# Initially silence missing third-party stubs; carve out per-import as stubs land.
# types-PyYAML covers PyYAML; tree-sitter and its grammar packages ship py.typed.
ignore_missing_imports = true
# The whole-tree gate passes several packages/*/src/<pkg> roots in one run; treat
# them as namespace packages so cross-package imports resolve to real types.
namespace_packages = true
# Strict bundle + pyright-resonant extra error codes (WI-rokup / Decision D13).
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
# NOTE: `explicit-override` is deliberately NOT enabled. It requires an
# `@override` decorator on every override, which is STRICTER than pyright's
# default (reportImplicitOverride defaults to "none"), needs a typing_extensions
# dependency on 3.10, and is high-churn / low-bug-value — so omitting it keeps
# the config more pyright-resonant, not less (WI-rokup scope refinement).
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "possibly-undefined",
    "mutable-override",
    "unused-awaitable",
    "narrowed-type-not-subtype",
    "redundant-self",
    "unimported-reveal",
]
# htrac-frontend is a JS/TS package (no Python under src/) — never type-check it.
exclude = ["packages/htrac-frontend/"]

# The tracker TUI drives Textual, whose widget/action methods return
# `AwaitComplete` awaitables that are idiomatically fire-and-forget (they
# complete on the next refresh). mypy's `unused-awaitable` flags every such
# call (~48, all in this one module) as an error; that is framework noise, not
# a forgotten await. Disable the code for this module only — it stays enabled
# everywhere else so a genuinely-dropped coroutine is still caught (WI-rokup).
[[tool.mypy.overrides]]
module = "hypergumbo_tracker.tui"
disable_error_code = ["unused-awaitable"]
