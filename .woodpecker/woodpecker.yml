# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Woodpecker per-PR CI gate (port of .github/workflows/ci.yml). One of several
# workflows in the `.woodpecker/` folder (Woodpecker uses EITHER a single root
# `.woodpecker.yml` OR a `.woodpecker/` folder of workflows — not both — and the
# folder is needed so nightly can carry its own py-version matrix). The workflow
# NAME is this file's stem (`woodpecker`), so this gate keeps posting the GitHub
# status context `ci/woodpecker/pr/woodpecker` that branch protection marks
# required (VERIFY the exact context on the first real Woodpecker run at cutover).
# ACTIVE on GitHub + self-hosted Woodpecker; INERT on Codeberg/Forgejo (which
# reads `.github/workflows/**`, not `.woodpecker/`) — so it lands dormant while
# Codeberg is origin, like the rest of the dual-mode migration tooling.
# Siblings: `.woodpecker/full-suite.yml` (push-dev + cron), `.woodpecker/nightly.yml`
# (cron matrix + integration). See "SIBLING WORKFLOWS" at the bottom.
#
# ─── What changed vs the GitHub Actions original ───────────────────────────
#  • `changes` job        → DELETED. Replaced by Woodpecker-native `when: path`
#                           filters on the code-dependent steps.
#  • `pytest-retry` job   → DELETED. It existed ONLY to survive Codeberg's hard
#                           5-minute hosted-runner cap. Our self-hosted agent has
#                           no such cap, so the primary pytest run is authoritative.
#  • `ci-complete` job    → DELETED. It was a Forgejo-Actions workaround (skipped
#                           jobs hung the run). Woodpecker reports pipeline status
#                           natively; the overall pass/fail IS the gate.
#  • `stop-the-line` job  → NOT PORTED YET (see the commented block at the end).
#                           It reads the Forgejo commit-status API; on GitHub the
#                           equivalent is either a GitHub-status query or, better,
#                           GitHub branch-protection required checks. FLAG — decide
#                           in review.
#  • every `runs-on: self-hosted` + `setup-python` → a container step on
#    `python:3.11-bookworm` (Phase-0 proved gcc/headers are baked in; only `jq`
#    and grammar builds need no apt).
#  • `actions/checkout`   → Woodpecker's built-in clone (configured below).
#  • `actions/cache` (26 uses) → see "CACHING" note. This draft uses a shared
#    WORKSPACE dir for grammar wheels (built once, consumed by pytest in the same
#    run) and leaves a host-volume pip cache as a wired-in-later TODO.
#
# ─── Mapping notes (CONFIRMED empirically at the Phase-1 gate, 2026-07) ─────
#  • PR base SHA: GHA used `github.event.pull_request.base.sha`. Woodpecker gives
#    `CI_COMMIT_TARGET_BRANCH` (the PR's target branch name) but not the base SHA
#    directly, so the smart-test diff below computes it as
#    `git merge-base origin/$CI_COMMIT_TARGET_BRANCH HEAD`. CONFIRMED against a
#    real Woodpecker PR payload (`CI_COMMIT_TARGET_BRANCH=dev`).
#  • Woodpecker's GitHub driver reports status back as a legacy commit-STATUS
#    (context `ci/woodpecker/pr/woodpecker`), NOT a check-run (delta (b) resolved;
#    `/commits/{sha}/check-runs` was empty). The tracker-sync poll re-points to
#    GitHub's identically-shaped `/commits/{sha}/status`.

# Gate the whole workflow to pushes/PRs on the integration branches.
when:
  - event: [push, pull_request]
    branch: [main, dev]

# Woodpecker auto-injects a clone step. dco / verify-generated / smart-test all do
# git merge-base + recency-window reads, which a SHALLOW clone breaks (empirically:
# failed merge-base + "last 1 commits"). Full clone — cheap on the self-hosted agent,
# and it kills that whole class of shallow-history bugs. (GHA used fetch-depth:50 only
# because GitHub's hosted runners bill bandwidth; we don't.)
#
# `partial: false` IS LOAD-BEARING (WI-fodad). It is NOT a synonym for the depth
# rationale above — shallow and partial are two independent axes, and until this
# line existed the comment's "Full clone" claim was simply false. plugin-git
# defaults `partial: true`, and its own defaults.go then sets:
#     p.Config.Depth  = 1
#     p.Config.filter = "tree:0"
# so the checkout is a PROMISOR repo carrying no tree objects beyond the one
# commit it checked out. `git fetch --unshallow` (prepare-git, below) deepens the
# COMMIT history but inherits the configured filter, so the trees stay missing.
# Consequence: every command needing trees across history lazily fetches them
# from origin ONE OBJECT AT A TIME over HTTPS. Commit-only reads (dco's rev-list,
# merge-base, the recency window) never notice; a history-wide tree walk pays a
# network round trip per object. Measured on this agent, `git log --reverse -- <1
# path>` over 6,445 commits: 1,185,559 ms on first run, 19 ms on the second (the
# objects are local by then) — against 27 ms on a dev box with a complete clone.
# That 44,000x is not disk (the volume is a local ext4 SSD) and not contention;
# it is ~26,000 sequential HTTPS fetches. It is also why the reverted
# commit-graph warm-up made CI *worse*: `--changed-paths` diffs every commit, so
# it triggered the identical stampede on every pipeline.
#
# THE COST, stated so nobody has to rediscover it: a complete clone transfers the
# whole pack set (~264 MB today) instead of one commit, and it happens serially
# in the clone step rather than in prepare-git alongside lint/mypy/audit. That is
# one bulk transfer on one connection, traded against ~26,000 round trips — and
# it is the shape this file always claimed to have. The `--unshallow` in
# prepare-git becomes a no-op ("repo already complete") and is kept as the
# backstop for a server-side clone override.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false

steps:
  # ── ruff + bandit ─────────────────────────────────────────────────────────
  - name: lint
    image: python:3.11-bookworm
    depends_on: []            # no deps → starts immediately, parallel with peers
    when:
      - path: &code_paths
          include:
            - "**/*.py"
            - "**/*.json"
            - "**/*.toml"
            - "scripts/**"
            - ".github/workflows/**"
            - ".woodpecker.yml"
            - ".woodpecker/**"
            - "**/*.yml"
            - "**/*.yaml"
          exclude:
            - ".agent/tracker/**"
            - ".agent/tracker-workspace/**"
    commands:
      - pip install --upgrade pip
      - pip install "ruff~=0.15.0" "bandit~=1.9.3"
      - ruff check packages/*/src/ packages/*/tests/
      - bandit -r packages/*/src/ -c pyproject.toml

  # ── whole-tree strict mypy ratchet (BLOCKING — WI-rokup/INV-zogud) ─────────
  #
  # THIS IS THE PIPELINE THAT GATES MERGES. auto-pr polls exactly one context,
  # ci/woodpecker/pr/woodpecker, and merges on it; the GitHub Actions mypy job
  # and its ci-complete gate are not consulted by the merge path. So while
  # this step was `failure: ignore` + `--mode=warning`, the ratchet AGENTS.md
  # calls "BLOCKING" could not block anything, and dev drifted 672 -> 682
  # across sixty commits with nothing to stop it.
  #
  # THREE THINGS HAD TO CHANGE TOGETHER, and two of them are silent alone:
  #   * `failure: ignore` -> removed. With it set, --mode=strict exits 1 and
  #     Woodpecker still passes the step, so flipping the mode by itself looks
  #     like a fix and gates exactly nothing.
  #   * --mode=warning -> --mode=strict. Warning mode exits 0 on a regression.
  #   * mypy~=2.1 -> mypy~=2.1.0. The baseline's counts are only comparable
  #     against the mypy that produced them; ~=2.1 lets a fresh install
  #     resolve 2.2/2.3, at which point the ratchet refuses to compare at all
  #     — and under the old warning mode that refusal was silent too. ci.yml
  #     was already pinned this way and carries the same reasoning.
  - name: mypy
    image: python:3.11-bookworm
    depends_on: []
    when:
      - path: *code_paths
    commands:
      - pip install --upgrade pip
      - pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-mainstream -e packages/hypergumbo-lang-common -e packages/hypergumbo-lang-extended1 -e packages/hypergumbo-lang-rust-analyzer -e "packages/hypergumbo-tracker[dev,tui]"
      - pip install "mypy~=2.1.0" "types-PyYAML~=6.0.12"
      - scripts/check-mypy-ratchet --mode=strict

  # ── pip-audit (dependency CVEs) ────────────────────────────────────────────
  # The long --ignore-vuln list is a verbatim carry-over; the rationale comments
  # live in ci.yml and pyproject. Kept as-is so the audit surface is identical.
  - name: audit
    image: python:3.11-bookworm
    depends_on: []
    when:
      - path: *code_paths
    commands:
      - pip install --upgrade pip wheel setuptools
      - pip install pip-audit "requests~=2.33.0" "pygments~=2.20.0" "urllib3>=2.7.0" "idna>=3.15" "msgpack>=1.2.1" "click>=8.3.3"
      - >
        pip-audit --skip-editable
        --ignore-vuln CVE-2025-71176 --ignore-vuln CVE-2026-3219
        --ignore-vuln PYSEC-2025-211 --ignore-vuln PYSEC-2025-212
        --ignore-vuln PYSEC-2025-213 --ignore-vuln PYSEC-2025-214
        --ignore-vuln PYSEC-2025-215 --ignore-vuln PYSEC-2025-216
        --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2025-218
        --ignore-vuln PYSEC-2025-189 --ignore-vuln PYSEC-2025-190
        --ignore-vuln PYSEC-2025-191 --ignore-vuln PYSEC-2025-192
        --ignore-vuln PYSEC-2025-193 --ignore-vuln PYSEC-2025-194
        --ignore-vuln PYSEC-2025-195 --ignore-vuln PYSEC-2025-196
        --ignore-vuln PYSEC-2025-197 --ignore-vuln PYSEC-2025-210
        --ignore-vuln PYSEC-2026-139 --ignore-vuln PYSEC-2024-277
        --ignore-vuln CVE-2025-3000 --ignore-vuln CVE-2026-4372
        --ignore-vuln PYSEC-2026-2289 --ignore-vuln PYSEC-2026-2290

  # ── generated-artifact drift gates ─────────────────────────────────────────
  - name: verify-generated
    image: python:3.11-bookworm
    depends_on: [prepare-git]
    when:
      - path: *code_paths
    commands:
      - pip install --upgrade pip
      - pip install pytest pytest-cov pytest-xdist ruff bandit pip-audit jsonschema yamllint
      - pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-mainstream -e packages/hypergumbo-lang-common -e packages/hypergumbo-lang-extended1 -e packages/hypergumbo-lang-rust-analyzer -e "packages/hypergumbo-tracker[dev]"
      - ./scripts/generate-schema --check
      - ./scripts/generate-architecture --check
      - ./scripts/generate-security-md --check
      - ./scripts/check-schema-coverage --mode=warning

  # ── bash hook tests — runs on any non-tracker-only change; cheap; catches silent rot
  # Skipped for tracker-sync PRs (they touch only .agent/tracker ops → hooks unaffected).
  # Together with the prepare-git / dco skips below, this leaves a tracker-sync PR running
  # ONLY `tracker-validate`, so auto-sync's CI is one fast step and never exceeds do_sync's
  # CI-poll timeout (the old dedicated tracker-ci.yml was a single lightweight job; the
  # Woodpecker port folded validation into this gate but left 4 always-on steps for a
  # tracker PR, which blew past the poll timeout).
  - name: hook-tests
    image: python:3.11-bookworm    # needs bash+git; python image has both
    depends_on: []
    when:
      - path: &non_tracker_paths
          include:
            - "**"
          exclude:
            - ".agent/tracker/**"
            - ".agent/tracker-workspace/**"
    commands:
      - apt-get update && apt-get install -y jq   # stop.sh (exercised by test_hooks.sh) needs jq
      - bash .githooks/test_hooks.sh

  # ── forge dual-mode arm rot-guard (C13) ────────────────────────────────────
  # Runs the top-level bash-subprocess forge github-arm tests + the governance
  # rot-guards. They FORCE HYPERGUMBO_FORGE_BACKEND=github internally (via
  # tests/_forge_github_harness.py) and stub the curl/gh boundary, so they need
  # NO hypergumbo package install — just pytest + bash/git/jq. smart-test's
  # import-slice can't select bash tests (they contribute no Python coverage), so
  # this dedicated job is how the DORMANT github write-arms (auto-pr/contribute/
  # ci-debug/list-my-prs/forge lib) are guarded per-PR — the deferred C13 job.
  # (full-suite's `pytest tests/` covers the same files post-merge once ported.)
  - name: forge-arms
    image: python:3.11-bookworm    # buildpack-deps base → bash + git baked in
    depends_on: []
    when:
      - path:
          include:
            - "scripts/**"
            - "tests/**"
            - ".woodpecker.yml"
    environment:
      SMART_TEST_ACTIVE: "1"       # suppress conftest.py's smart-test re-exec
    commands:
      - apt-get update && apt-get install -y jq
      - pip install --upgrade pip && pip install pytest
      # -o addopts="" drops the repo's --cov addopts (pytest-cov is not installed
      # here); the *github* glob also catches test_hg_github_token_documented.py.
      - >
        pytest -o addopts="" -p no:cacheprovider -q
        tests/test_*github*.py
        tests/test_autopr_*.py
        tests/test_merge_pr_close.py
        tests/test_ci_verdict_default_deny.py
        tests/test_codeowners_governance.py

  # ── unshallow the SHARED workspace .git ONCE ───────────────────────────────
  # Woodpecker's PR clone lands only the synthetic merge commit (no ancestry) —
  # this breaks git merge-base + recency-window reads regardless of clone depth.
  # dco / verify-generated / pytest depend on this step so they see full history
  # and don't race each other fetching into the one shared .git.
  - name: prepare-git
    image: python:3.11-bookworm
    depends_on: []
    when:
      - path: *non_tracker_paths       # tracker-sync PRs need no history (only tracker-validate runs)
    commands:
      # WI-fodad gate. `partial: false` in the clone block is the fix; this
      # asserts it actually TOOK. Worth a gate rather than trust because the
      # failure it prevents is SILENT and expensive — not an error, just a
      # 20-minute history walk that reads as a hung runner — and the setting can
      # stop taking effect without anyone editing this file (a plugin-git bump,
      # a server-side clone override). DEFAULT-DENY per L54: refuse on the
      # PRESENCE of any filter rather than enumerating the ones known to hurt.
      - |
        _filter=$(git config --get remote.origin.partialclonefilter || true)
        _promisor=$(git config --get remote.origin.promisor || true)
        if [ -n "$_filter" ] || [ "$_promisor" = "true" ]; then
          echo "❌ PARTIAL CLONE ACTIVE — filter='$_filter' promisor='$_promisor'"
          echo "   This checkout is missing tree objects. Every history-wide git"
          echo "   walk will fetch them from origin ONE AT A TIME (measured:"
          echo "   1,185,559 ms for a single 6,445-commit pathspec walk)."
          echo "   Fix: the clone block must carry 'settings: {partial: false}'."
          exit 1
        fi
        echo "✅ clone carries no partial-clone filter (trees are local)"
      - '[ -f "$(git rev-parse --git-dir)/shallow" ] && git fetch --unshallow origin || echo "repo already complete"'
      - git fetch --no-tags origin "$CI_COMMIT_TARGET_BRANCH"

  # ── DCO sign-off check (PRs only; tracker-sync commits are already do_sync-signed) ──
  - name: dco
    image: python:3.11-bookworm
    depends_on: [prepare-git]
    when:
      - event: pull_request
        path: *non_tracker_paths       # tracker-sync commits carry Signed-off-by from do_sync (sync.py)
    commands:
      - BASE=$(git merge-base "origin/$CI_COMMIT_TARGET_BRANCH" HEAD)
      - |
        # DCO grandfather allowlist — pre-Woodpecker-DCO-gate commit(s) that
        # cannot be signed retroactively without rewriting all of dev's history.
        # These only surface on the dev→main release PR's cumulative re-check;
        # the gate stays strict for every OTHER commit (incl. any future unsigned
        # one — human or agent).
        #   54a041c171  admin-josh  ADR-0044 catalog refactor
        for sha in $(git rev-list --no-merges "$BASE"..HEAD); do
          case "$sha" in 54a041c171*) continue ;; esac
          if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by:'; then
            echo "❌ Commit $sha is missing DCO sign-off (add with: git commit --amend -s)"
            exit 1
          fi
        done
      - echo "✅ All commits have DCO sign-off (54a041c171 grandfathered)"

  # ── tracker data validation (only when tracker files changed) ──────────────
  - name: tracker-validate
    image: python:3.11-bookworm
    depends_on: []
    when:
      - path:
          include:
            - ".agent/tracker/**"
            - ".agent/tracker-workspace/**"
            - "packages/hypergumbo-tracker/**"
    commands:
      - pip install --upgrade pip
      - pip install -e packages/hypergumbo-tracker
      - scripts/tracker validate

  # ── build the 3 vendored grammars ONCE into a workspace dir ────────────────
  # Written to $CI_WORKSPACE/.grammar-wheels (shared across steps in this run),
  # so the pytest step installs from them instead of rebuilding. This is the
  # in-run equivalent of GHA's /tmp/grammar-wheels cache.
  - name: build-grammars
    image: python:3.11-bookworm
    depends_on: []
    when:
      - path: *code_paths
    commands:
      - python3 -m pip install --upgrade pip setuptools wheel
      - ./scripts/build-source-grammars --wheels-dir "$CI_WORKSPACE/.grammar-wheels"

  # ── pytest + 100%-coverage-of-changed-files (smart-test manifest) ──────────
  # Faithful port of ci.yml's pytest job. No venv (the container IS the isolation)
  # → conftest.py's smart-test re-exec doesn't fire → direct pytest is safe
  # (validated in Phase 0). SMART_TEST_ACTIVE=1 keeps it from re-computing
  # selection; the committed .ci/affected-tests.txt manifest drives it.
  - name: pytest
    image: python:3.11-bookworm
    depends_on: [build-grammars, prepare-git]
    when:
      - path: *code_paths
    environment:
      SMART_TEST_ACTIVE: "1"
    commands:
      # The smart-test manifest can select top-level agent-infra tests/ (e.g.
      # test_session_start_agent_notes.py) whose bash hooks shell out to jq;
      # install it here as the sibling hook-tests / forge-arms steps already do.
      # Without it those tests hit session_start_logic.sh's `command -v jq`
      # guard, the notes prompt never fires, and the 5 "prompt fires" asserts
      # fail (WI-bigab -- surfaced by pipeline 6's whole-suite run).
      - apt-get update && apt-get install -y jq
      - pip install --upgrade pip
      - pip install pytest pytest-cov pytest-xdist ruff bandit pip-audit jsonschema yamllint
      - pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-mainstream -e packages/hypergumbo-lang-common -e packages/hypergumbo-lang-extended1 -e packages/hypergumbo-lang-rust-analyzer -e "packages/hypergumbo-tracker[dev,tui]"
      - ./scripts/build-source-grammars --wheels-dir "$CI_WORKSPACE/.grammar-wheels"
      - |
        set -e
        MANIFEST=".ci/affected-tests.txt"

        # Release PRs carry a cumulative diff the targeted-manifest model can't
        # cover; full-suite validates them post-merge. prepare-release merges the
        # release/* branch into dev first, then opens the PR from dev→main
        # (source=dev, NOT release/*), so key the skip on the target branch; the
        # release/* source case is kept for a direct release-branch push.
        if [ "${CI_COMMIT_TARGET_BRANCH:-}" = "main" ]; then
          echo "✅ Release PR (→ main) — skipping pytest (full-suite covers it post-merge)"; exit 0
        fi
        case "${CI_COMMIT_SOURCE_BRANCH:-$CI_COMMIT_BRANCH}" in
          release/*) echo "✅ Release branch — skipping pytest (full-suite covers it)"; exit 0 ;;
        esac

        HEAD="$CI_COMMIT_SHA"
        if [ "$CI_PIPELINE_EVENT" = "pull_request" ]; then
          git fetch --no-tags origin "$CI_COMMIT_TARGET_BRANCH"
          BASE=$(git merge-base FETCH_HEAD HEAD)
        else
          # WI-vilor: CI_PREV_COMMIT_SHA is the commit of the PREVIOUS PIPELINE,
          # NOT the previous tip of this branch. auto-pr merges by REBASE, which
          # rewrites the commit, so after every rebase merge that SHA names an
          # object which does not exist in this clone (verified: 66737979de was
          # the pre-rebase copy of 6e92792a34, reachable only from the feature
          # branch auto-pr then deleted). It can also name a commit on an
          # entirely unrelated branch. Validate before trusting it.
          BASE="${CI_PREV_COMMIT_SHA:-}"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "ℹ️  CI_PREV_COMMIT_SHA='${BASE:-<unset>}' is not a commit in this"
            echo "   clone (expected after a rebase/squash merge) — using HEAD^."
            BASE="${HEAD}^"
          fi
        fi

        # No .py changed anywhere in the PR (config/docs-only) → no affected tests →
        # skip cleanly instead of running a stale committed manifest's selections.
        #
        # WI-vilor: capture the diff and its EXIT STATUS separately. A failed
        # `git diff` writes nothing to stdout, which is byte-identical to a
        # successful diff that found no Python files — so the old one-line form
        # could not tell "nothing changed" from "I could not find out", and
        # resolved that ambiguity by skipping the suite and reporting green.
        # Skip only on a SUCCESSFUL diff that genuinely reported no .py (L54:
        # enumerate the permitting case, never the blocking ones).
        if CHANGED_IN_RANGE=$(git diff --name-only "$BASE" "$HEAD" 2>&1); then
          if [ -z "$(echo "$CHANGED_IN_RANGE" | grep -E '\.py$' || true)" ]; then
            echo "✅ PR changes no .py files — skipping pytest"
            exit 0
          fi
        else
          echo "⚠️  cannot diff $BASE..$HEAD: $CHANGED_IN_RANGE"
          echo "    Running the committed manifest anyway — a failed diff is NOT"
          echo "    evidence that nothing changed."
          CHANGED_IN_RANGE=""
        fi

        if [ ! -f "$MANIFEST" ]; then
          echo "❌ No .ci/affected-tests.txt manifest committed. Run: ./scripts/smart-test --manifest && git add .ci/affected-tests.txt"
          exit 1
        fi

        # WI-modur: the ONLY question that decides whether tests run is "did the
        # manifest select any?". This used to key on CHANGED **SOURCE** files
        # instead, which silently skipped the suite for every PR that touched no
        # packages/*/src/**.py -- i.e. every test-only fix, every scripts/*.py
        # change, and every .agent/hooks/**.py change -- and reported GREEN.
        # Caught on the WI-fodad PR: its manifest carried 0 changed source files
        # and 1 selected test, and CI ran nothing. The two concerns were
        # conflated in one condition; they are separated below.
        SELECTED_TESTS=$(sed -n '/^# === SELECTED_TESTS ===/,$p' "$MANIFEST" | grep -v '^#' | grep -v '^$' | tr '\n' ' ')
        if [ -z "$SELECTED_TESTS" ]; then
          echo "✅ manifest selects no tests — skipping pytest"; exit 0
        fi

        # Changed SOURCE files drive the COVERAGE gate ONLY: a 100%-coverage
        # target needs changed source to aim at, and there is legitimately
        # nothing to enforce when none changed. They must never gate execution.
        # Reuse the range computed above rather than re-running the diff: when it
        # failed, re-running it just fails again silently and this would size the
        # coverage gate off an empty set (WI-vilor).
        ACTUAL_SOURCE_FILES=$(echo "$CHANGED_IN_RANGE" | grep -E '^packages/.*/src/.*\.py$' | sort || true)
        CHANGED_SOURCE_FILES=$(sed -n '/^# === CHANGED_SOURCE_FILES ===/,/^# === SELECTED_TESTS ===/p' "$MANIFEST" | grep -v '^#' | grep -v '^$' || true)
        # Trust the actual diff when the manifest is missing files (staged-before-run drift).
        for f in $ACTUAL_SOURCE_FILES; do
          echo "$CHANGED_SOURCE_FILES" | grep -qF "$f" || CHANGED_SOURCE_FILES="$ACTUAL_SOURCE_FILES"
        done

        # Per-affected-package coverage, no-embeddings rcfile.
        COV_PATHS=""
        for pkg in $(echo "$CHANGED_SOURCE_FILES" | sed 's|^\(packages/[^/]*/src\)/.*|\1|' | sort -u); do
          COV_PATHS="$COV_PATHS --cov=$pkg"
        done
        [ -n "$COV_PATHS" ] && COV_PATHS="$COV_PATHS --cov-report= --cov-config=.coveragerc.no-embeddings"

        # Exclude embedding + _generated files from the 100% gate (need torch / are generated).
        COVERABLE=""
        for f in $CHANGED_SOURCE_FILES; do
          case "$f" in
            */sketch_embeddings.py|*/_embedding_data.py|*/_generated/*) : ;;
            *) [ -f "$f" ] && COVERABLE="$COVERABLE $f" ;;
          esac
        done

        # Bound worker count by the cgroup CPU quota (container sees host nproc).
        if [ -f /sys/fs/cgroup/cpu.max ]; then
          read quota period < /sys/fs/cgroup/cpu.max
          [ "$quota" != "max" ] && WORKERS=$((quota / period)) || WORKERS=$(nproc)
        else
          WORKERS=$(nproc)
        fi

        echo "=== pytest ($(echo "$SELECTED_TESTS" | wc -w) selected files, -n $WORKERS) ==="
        # `|| TEST_EXIT=$?` rather than a bare call: `set -e` is active, so a
        # bare failing pytest aborts the block before the coverage gate and the
        # explicit `exit $TEST_EXIT` below. Final exit code is unchanged.
        TEST_EXIT=0
        pytest --rootdir=. -n "$WORKERS" --tb=short $COV_PATHS $SELECTED_TESTS || TEST_EXIT=$?

        # 100% coverage gate for changed source files only.
        if [ $TEST_EXIT -eq 0 ] && [ -n "$COVERABLE" ]; then
          INCLUDE=$(echo "$COVERABLE" | xargs | tr ' ' ',')
          if coverage report --rcfile=.coveragerc.no-embeddings --include="$INCLUDE" --fail-under=100 > /tmp/cov.txt 2>&1; then
            cat /tmp/cov.txt; echo "✅ changed files at 100%"
          elif grep -q "No data to report" /tmp/cov.txt; then
            echo "⚠️  changed files not exercised by affected slice (e.g. subprocess-only) — not gating; full-suite/nightly enforce whole-codebase 100%."
          else
            echo "❌ changed source files below 100% coverage:"; cat /tmp/cov.txt
            coverage report --rcfile=.coveragerc.no-embeddings --include="$INCLUDE" --show-missing
            exit 1
          fi
        fi
        exit $TEST_EXIT

