# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Woodpecker full-suite workflow — whole-codebase 100%-coverage validation.
# Port of .github/workflows/full-suite.yml. CRON-ONLY, via a Woodpecker cron
# named "full-suite" (configured in the repo's Woodpecker settings, NOT here —
# intended schedule 0 1,13 * * *). The GHA source deliberately REMOVED the
# post-merge push trigger ("with 20+ merges/day and singleton concurrency the
# queue never clears") and serialized runs via `concurrency: full-suite-singleton`.
# Woodpecker has no in-file concurrency guard — if you ever add a push trigger,
# ALSO cap agent parallelism / add a repo concurrency setting to replace it.
#
# Whole-codebase --cov-fail-under=100 across all six packages in one step is
# equivalent to the GHA per-package 100% jobs (a 100% union ⟺ every package at
# 100%) and far more compact. Plus the WI-jigup self-tree-validation ratchet and
# the top-level `pytest tests/` suite (forge/governance + agent-infra).
#
# Dropped vs the GHA original (all Codeberg/Forgejo artifacts):
#  • changes / prep jobs → Woodpecker `when` + in-run grammar build.
#  • *-retry jobs        → existed ONLY for Codeberg's 5-min hosted-runner cap;
#                          the self-hosted agent has none.
#  • aggregate job       → Woodpecker reports pipeline status natively.
#  • actions/cache       → grammars built once into $CI_WORKSPACE and reused.
#
# No venv (the container IS the isolation) → sentence-transformers/torch absent →
# always the .coveragerc.no-embeddings config, exactly as the per-PR gate.
#
# VALIDATION: NEW authoring — the individual legs were Phase-0 smoke-tested under
# `woodpecker exec` (test-core, build-grammars), but this assembled file has NOT
# had a full Woodpecker run. Lands DORMANT (INERT on Codeberg/Forgejo, which
# reads .github/workflows/**, not .woodpecker/); validated/iterated at cutover.

when:
  - event: cron
    cron: full-suite

# `partial: false` is load-bearing — see the per-PR gate's clone block for the
# full rationale (WI-fodad). plugin-git defaults to `--depth=1 --filter=tree:0`,
# which leaves the checkout without tree objects; `--unshallow` restores commits
# but NOT trees, so any history-wide tree walk fetches them from origin one at a
# time. This workflow is the most exposed of the three: it runs the whole
# `pytest tests/` suite AND self-tree-validation.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false

steps:
  # Unshallow the shared .git once (self-tree-validation + tests/ do history /
  # recency reads; see the per-PR gate's prepare-git rationale).
  - name: prepare-git
    image: python:3.11-bookworm
    depends_on: []
    commands:
      # WI-fodad gate — see the per-PR gate's prepare-git for the rationale.
      # DEFAULT-DENY (L54): refuse on the presence of any filter.
      - |
        _filter=$(git config --get remote.origin.partialclonefilter || true)
        _promisor=$(git config --get remote.origin.promisor || true)
        if [ -n "$_filter" ] || [ "$_promisor" = "true" ]; then
          echo "❌ PARTIAL CLONE ACTIVE — filter='$_filter' promisor='$_promisor'"
          echo "   Fix: the clone block must carry 'settings: {partial: false}'."
          exit 1
        fi
        echo "✅ clone carries no partial-clone filter (trees are local)"
      - '[ -f "$(git rev-parse --git-dir)/shallow" ] && git fetch --unshallow origin || echo "repo already complete"'

  - name: build-grammars
    image: python:3.11-bookworm
    depends_on: []
    commands:
      - python3 -m pip install --upgrade pip setuptools wheel
      - ./scripts/build-source-grammars --wheels-dir "$CI_WORKSPACE/.grammar-wheels"

  # ── whole-codebase 100% (WI-kalub full-suite teeth) ────────────────────────
  - name: test-all-packages
    image: python:3.11-bookworm
    depends_on: [build-grammars]
    commands:
      - pip install --upgrade pip
      - pip install pytest pytest-cov pytest-xdist jsonschema
      # INV-kazij discriminating experiment: `-e packages/hypergumbo` (the
      # meta-package — LIGHT: torch sits behind its [embeddings] extra; plain
      # install adds only the console script + a distribution record) was the
      # ONE install-set token nightly's test-matrix had and this step lacked.
      # Nightly passes test_pyproject_console_script_* on 3.10–3.13; this
      # step fails it on the same tree, and every locally reachable
      # configuration (no-meta 3.12: single test, whole core suite,
      # cross-package interleaved) passes. If the cron greens after this,
      # the delta was the install set; if it stays red, the axis is the
      # container/interpreter interaction and INV-libib's per-leg logs are
      # the next prerequisite. Independent of the experiment, the two
      # whole-suite pipelines should not silently differ in install set.
      - pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-mainstream -e packages/hypergumbo-lang-common -e packages/hypergumbo-lang-extended1 -e packages/hypergumbo-lang-rust-analyzer -e "packages/hypergumbo-tracker[dev,tui]" -e packages/hypergumbo
      - ./scripts/build-source-grammars --wheels-dir "$CI_WORKSPACE/.grammar-wheels"
      - |
        if [ -f /sys/fs/cgroup/cpu.max ]; then
          read quota period < /sys/fs/cgroup/cpu.max
          [ "$quota" != "max" ] && WORKERS=$((quota / period)) || WORKERS=$(nproc)
        else
          WORKERS=$(nproc)
        fi
        pytest -n "$WORKERS" --tb=short \
          --cov=packages/hypergumbo-core/src \
          --cov=packages/hypergumbo-lang-mainstream/src \
          --cov=packages/hypergumbo-lang-common/src \
          --cov=packages/hypergumbo-lang-extended1/src \
          --cov=packages/hypergumbo-lang-rust-analyzer/src \
          --cov=packages/hypergumbo-tracker/src \
          --cov-report=term-missing --cov-fail-under=100 \
          --cov-config=.coveragerc.no-embeddings \
          packages/*/tests/

  # ── WI-jigup self-tree-validation ratchet (full-suite-only) ────────────────
  # Runs the full analysis on hypergumbo's OWN tree and ratchets its
  # per-(validator_class, severity) violation matrix shrink-only vs the baseline.
  # Invoked via `python -m hypergumbo_core` (the bare `hypergumbo` console script
  # lives in the meta-package CI doesn't install), mirroring the GHA job.
  - name: self-tree-validation
    image: python:3.11-bookworm
    depends_on: [build-grammars]
    commands:
      - pip install --upgrade pip && pip install jsonschema
      - pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-mainstream -e packages/hypergumbo-lang-common -e packages/hypergumbo-lang-extended1 -e "packages/hypergumbo-tracker[dev]"
      - ./scripts/build-source-grammars --wheels-dir "$CI_WORKSPACE/.grammar-wheels"
      - python -m hypergumbo_core run . --out /tmp/self-tree.json
      - python scripts/check-self-tree-validation /tmp/self-tree.json .ci/self-tree-validation-baselines.json

  # ── WI-vanun / WI-ninoz self-claim drift gate — THE ONLY ARM ───────────────
  # Ported from .github/workflows/full-suite.yml, where it had been running on
  # NOTHING since cutover: the live cron is this Woodpecker file, the original
  # port dropped the step, and the gate SECURITY.md names ("gated in CI by
  # scripts/check-self-claims") silently stopped existing.
  #
  # This comment used to defer to "the per-PR arm (woodpecker.yml
  # `self-claims-gate`), which carries the path filter and the full rationale".
  # THAT ARM WAS REMOVED 2026-08-30 (owner decision) because it had become the
  # critical path of every code PR at ~14 minutes, against the 3m49s the move
  # into it was justified on. So there is no other arm to defer to, and no path
  # filter anywhere: this step runs unconditionally on every cron firing and is
  # the whole of the gate. woodpecker.yml carries the tombstone and the history;
  # tests/test_ci_self_claims_gate_scope.py pins that this arm survives, stays
  # unconditional, and actually invokes the script.
  #
  # DETECTION IS NOW BOUNDED BY THE CRON CADENCE (~12h), not by one commit.
  # This workflow publishes ONE aggregate status for all six of its steps, so
  # on GitHub a drift verdict reads as "full-suite is red" — read it with
  # `ci-debug cron-status`, which finds the verdict on whatever commit carries
  # it (INV-bozid remedy (b)) AND names each step's own verdict beneath it
  # (the MASKING half, 2026-09-03), so this gate's answer is readable even
  # while a sibling step sits red.
  - name: self-claims-gate
    image: python:3.11-bookworm
    depends_on: [build-grammars]
    commands:
      - pip install --upgrade pip && pip install jsonschema
      - pip install -e packages/hypergumbo-core -e packages/hypergumbo-lang-mainstream -e packages/hypergumbo-lang-common -e packages/hypergumbo-lang-extended1 -e "packages/hypergumbo-tracker[dev]"
      - ./scripts/build-source-grammars --wheels-dir "$CI_WORKSPACE/.grammar-wheels"
      - PYTHON=python scripts/check-self-claims

  # ── top-level forge/governance + agent-infra suite (no package coverage) ───
  - name: test-agent-infra
    image: python:3.11-bookworm
    depends_on: [prepare-git]
    commands:
      - apt-get update && apt-get install -y jq
      # The top-level tests/ are subprocess/file/git tests (NO hypergumbo package
      # install), but need pyyaml + hypothesis (a few property/parse tests do).
      # prepare-git unshallowed the history a git-SHA-walking test asserts on.
      #
      # INV-vazuh: `rich` and `mypy` join them for the same reason — a test in
      # this suite needs them — and the reason it took a filed invariant to add
      # two names is worth keeping. This gate was RED from 2026-08-11 with three
      # failures, and topping up this line was refused twice as guesswork,
      # because a container that had `hypergumbo_core` importable while `rich`
      # (a declared dependency of that very package) was absent looked like a
      # stale site-packages volume shadowing the checkout. If that were true,
      # adding names here would turn the gate green while it silently tested an
      # OLD tree — worse than the red.
      #
      # It was not true. Reproduced outside CI in a clean venv carrying exactly
      # the four packages above: `pytest tests/` fails 2, `pytest
      # tests/test_rct_public_api_pinned.py` fails 8. Nothing was stale; the
      # pinning tests were importing hypergumbo_core off a sys.path entry that a
      # SIBLING test had inserted by exec'ing a scripts/check-* helper through
      # SourceFileLoader. That module now declares its own path, so these two
      # installs cover what is genuinely missing rather than papering over it:
      #   rich  — cli.py does `from rich.console import Console` at import.
      #   mypy  — test_smart_test_mypy_gate shells out to check-mypy-ratchet,
      #           whose documented exit 2 (infra failure, mypy absent) is NOT
      #           the exit 1 the gate's positive control asserts. Verified in
      #           the same venv: with mypy present the ratchet returns 1 and
      #           reports REGRESSION, which is what that test is there to see.
      - pip install --upgrade pip
      - pip install pytest pytest-xdist pyyaml 'hypothesis~=6.100' rich 'mypy~=2.1.0'
      - |
        if [ -f /sys/fs/cgroup/cpu.max ]; then
          read quota period < /sys/fs/cgroup/cpu.max
          [ "$quota" != "max" ] && WORKERS=$((quota / period)) || WORKERS=$(nproc)
        else
          WORKERS=$(nproc)
        fi
        pytest tests/ -o addopts="" -n "$WORKERS" --tb=short
