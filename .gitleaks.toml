#
# Gitleaks configuration for hypergumbo.
#
# Release-check runs `gitleaks detect --source . --no-git`, which walks the
# working-tree filesystem and does not filter by .gitignore. Without the path
# allowlists below, hundreds of false positives surface from agent-local
# runtime state (transcripts containing quoted SHAs, tracker op-log Go
# identifiers, generated bytecode). Per-finding entries in .gitleaksignore
# can't keep up with rotating transcript filenames, so path allowlists here
# suppress the classes of files that are not source; real source findings
# still land in .gitleaksignore.

title = "hypergumbo gitleaks config"

[extend]
useDefault = true

# Agent-local runtime state. Inside .agent/, only source-like entries remain
# in scope: agent_playbooks_protocols_sops_skills/, hooks/, tracker/,
# tracker-workspace/, cooldown_prompt.md, stop_reflect.md. Everything else
# under .agent/ (transcripts, injection history, caches, training data,
# sync logs, rotation locks, loop sentinels, deprecated datasets) is runtime
# state and is allowlisted here. The dotfile pattern catches the bulk; the
# remaining entries enumerate the non-dotfile runtime artifacts.
[[allowlists]]
description = "Agent-local runtime state (not source)"
paths = [
    '''^\.agent/\..*''',
    '''^\.agent/LOOP$''',
    '''^\.agent/disabled\.LOOP$''',
    '''^\.agent/invariant-ledger\.md$''',
]

# Python bytecode caches mirror the source they were compiled from; any
# finding in a .pyc is redundant with the source scan, and the pytest-version
# component of the filename changes across environments.
[[allowlists]]
description = "Python bytecode caches"
paths = [
    '''(^|/)__pycache__/''',
]

# The gitignored .env holds local development / maintainer tokens (OpenRouter,
# Forgejo, and the HG_GITHUB_TOKEN maintainer PAT). It is never tracked or
# published, and its tokens rotate — per-finding .gitleaksignore fingerprints
# break on every rotation (as provisioning HG_GITHUB_TOKEN at the GitHub cutover
# did), so a path allowlist is the durable suppression. All tracked/publishable
# files are still scanned.
[[allowlists]]
description = "Local .env (gitignored, rotating maintainer tokens; never published)"
paths = [
    '''^\.env$''',
]

# Hypothesis's generated constants cache. Gitignored, never source, and its
# filenames are content hashes that rotate -- three .gitleaksignore fingerprints
# pinned to specific hashes are exactly the fragility this avoids. Same class as
# the __pycache__ entry above.
[[allowlists]]
description = "Hypothesis generated constants cache (not source)"
paths = [
    '''^\.hypothesis/''',
]

# Two fixed benign strings the generic-api-key rule reports as secrets. Scoped
# to the exact strings rather than to their files: tracker .ops files ARE
# committed, so path-allowlisting them would blind the scanner to a real
# credential pasted into a discussion thread.
#   apiv2.NewAPI   -- a Go identifier quoted in an INV's op-log
#   L2-normalized. -- prose in the embeddings module docstring
[[allowlists]]
description = "Benign strings misreported as generic API keys"
regexTarget = "secret"
regexes = [
    '''^apiv2\.NewAPI$''',
    '''^L2-normalized\.$''',
]
